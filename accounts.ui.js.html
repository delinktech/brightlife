<script>
  let accountsState = {
    accounts: [],
    canReconcile: false,
    summary: null,
    currentTab: "reconciliation",
    dividendOverview: null,
    dividendSimulation: null,
    statementsOverview: null,
    selectedMonthKey: "",
    previewMemberId: null,
    previewStatementData: null
  };

  function formatKsh(val) {
    const num = Number(val) || 0;
    return "KES " + num.toLocaleString("en-KE", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  function maskAccountNumber(value) {
    const raw = String(value || "").replace(/\s+/g, "");
    if (!raw) return "-";
    if (raw.length <= 5) {
      return raw.slice(0, 2) + "**" + raw.slice(-1);
    }
    return raw.slice(0, 4) + "****" + raw.slice(-3);
  }

  function copyTextToClipboard(text, btnElement) {
    if (!navigator.clipboard) {
      prompt("Copy to clipboard: Ctrl+C, Enter", text);
      return;
    }
    navigator.clipboard.writeText(text).then(function() {
      if (btnElement) {
        const originalHtml = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fas fa-check text-emerald-500"></i>';
        setTimeout(function() {
          btnElement.innerHTML = originalHtml;
        }, 1500);
      }
    }).catch(function() {
      prompt("Copy to clipboard: Ctrl+C, Enter", text);
    });
  }

  function switchAccountsTab(tabName) {
    accountsState.currentTab = tabName;
    const recPane = document.getElementById("accounts-reconciliation-pane");
    const divPane = document.getElementById("accounts-dividends-pane");
    const stmtPane = document.getElementById("accounts-statements-pane");
    const guidesPane = document.getElementById("accounts-guides-pane");
    const recTabBtn = document.getElementById("tab-btn-reconciliation");
    const divTabBtn = document.getElementById("tab-btn-dividends");
    const stmtTabBtn = document.getElementById("tab-btn-statements");
    const guidesTabBtn = document.getElementById("tab-btn-guides");

    const activeClass = "pb-3 text-xs font-semibold border-b-2 border-sky-600 text-sky-600 flex items-center gap-2 transition-colors";
    const inactiveClass = "pb-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 flex items-center gap-2 transition-colors";

    if (recPane) recPane.classList.toggle("hidden", tabName !== "reconciliation");
    if (divPane) divPane.classList.toggle("hidden", tabName !== "dividends");
    if (stmtPane) stmtPane.classList.toggle("hidden", tabName !== "statements");
    if (guidesPane) guidesPane.classList.toggle("hidden", tabName !== "guides");

    if (recTabBtn) recTabBtn.className = (tabName === "reconciliation" ? activeClass : inactiveClass);
    if (divTabBtn) divTabBtn.className = (tabName === "dividends" ? activeClass : inactiveClass);
    if (stmtTabBtn) stmtTabBtn.className = (tabName === "statements" ? activeClass : inactiveClass);
    if (guidesTabBtn) guidesTabBtn.className = (tabName === "guides" ? activeClass : inactiveClass);

    if (tabName === "dividends" && !accountsState.dividendOverview) {
      loadDividendOverview();
    }
    if (tabName === "statements") {
      loadMonthlyStatementsView();
    }
  }

  function paymentGuideHtml(account) {
    const mode = String(account.paymentMode || "").toLowerCase();
    const paybill = account.paybill || "N/A";
    const fullAcc = account.accountNumber || "N/A";
    if (mode.indexOf("mpesa") >= 0 || mode.indexOf("m-pesa") >= 0 || paybill !== "N/A") {
      return (
        '<ol class="mt-3 text-xs text-slate-600 space-y-1.5 list-decimal list-inside">' +
        "<li>Go to <strong>M-PESA</strong> on your mobile device.</li>" +
        "<li>Select <strong>Lipa na M-PESA</strong> then <strong>Paybill</strong>.</li>" +
        "<li>Enter Business No: <strong class='font-mono text-slate-900 bg-slate-100 px-1 py-0.5 rounded'>" +
        paybill +
        "</strong></li>" +
        "<li>Enter Account No: <strong class='font-mono text-slate-900 bg-slate-100 px-1 py-0.5 rounded'>" +
        fullAcc +
        "</strong></li>" +
        "<li>Enter the contribution / repayment amount and your M-Pesa PIN.</li>" +
        "</ol>"
      );
    }
    return (
      '<ol class="mt-3 text-xs text-slate-600 space-y-1.5 list-decimal list-inside">' +
      "<li>Channel method: <strong class='uppercase text-slate-900'>" +
      (account.paymentMode || "Bank Deposit") +
      "</strong></li>" +
      "<li>Reference account: <strong class='font-mono text-slate-900 bg-slate-100 px-1 py-0.5 rounded'>" +
      fullAcc +
      "</strong></li>" +
      "<li>Confirm depositor name reflects your registered Member Name.</li>" +
      "</ol>"
    );
  }

  function renderPaymentGuideCards(rows) {
    const cardList = document.getElementById("accounts-card-list");
    if (!cardList) return;

    if (!rows.length) {
      cardList.innerHTML =
        '<div class="md:col-span-2 xl:col-span-3 text-center py-6 text-slate-500 bg-white rounded-2xl border border-slate-100">No deposit account channels configured.</div>';
      return;
    }

    cardList.innerHTML = rows
      .map(function (a) {
        return (
          '<div class="bg-white rounded-xl border border-slate-200/80 shadow-sm p-4 sm:p-5 hover:border-slate-300 transition-colors flex flex-col justify-between">' +
          '<div>' +
          '  <div class="flex items-start justify-between gap-3">' +
          '    <div class="min-w-0">' +
          '      <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Deposit Channel</p>' +
          '      <h4 class="font-bold text-slate-900 text-sm truncate mt-0.5">' +
          (a.orgName || "-") +
          '      </h4>' +
          '    </div>' +
          '    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 font-semibold uppercase tracking-wider border border-slate-200/60">' +
          (a.paymentMode || "N/A") +
          '    </span>' +
          '  </div>' +
          '  <div class="mt-3.5 grid grid-cols-2 gap-2 text-xs p-3 bg-slate-50/75 rounded-lg border border-slate-100">' +
          '    <div>' +
          '      <p class="text-[9px] font-semibold text-slate-400 uppercase tracking-wider">A/C Number</p>' +
          '      <div class="flex items-center gap-1 mt-0.5">' +
          '        <span class="font-mono font-bold text-slate-800 text-xs truncate">' + a.accountNumber + '</span>' +
          '        <button type="button" onclick="copyTextToClipboard(\'' + a.accountNumber + '\', this)" class="text-slate-400 hover:text-slate-700 p-0.5 text-[11px]" title="Copy Account Number">' +
          '          <i class="far fa-copy"></i>' +
          '        </button>' +
          '      </div>' +
          '    </div>' +
          '    <div>' +
          '      <p class="text-[9px] font-semibold text-slate-400 uppercase tracking-wider">Paybill</p>' +
          '      <div class="flex items-center gap-1 mt-0.5">' +
          '        <span class="font-mono font-bold text-slate-800 text-xs">' + (a.paybill || "-") + '</span>' +
          (a.paybill ? '        <button type="button" onclick="copyTextToClipboard(\'' + a.paybill + '\', this)" class="text-slate-400 hover:text-slate-700 p-0.5 text-[11px]" title="Copy Paybill">' +
          '          <i class="far fa-copy"></i>' +
          '        </button>' : '') +
          '      </div>' +
          '    </div>' +
          '  </div>' +
          paymentGuideHtml(a) +
          '</div>' +
          '</div>'
        );
      })
      .join("");
  }

  function renderReconciliationDashboard(data) {
    const summary = data.summary || {};
    const accounts = data.accounts || [];

    // KPI Cards
    const kpiStatement = document.getElementById("kpi-statement-cash");
    const kpiSystem = document.getElementById("kpi-system-cash");
    const kpiInflowsSub = document.getElementById("kpi-inflows-sub");
    const kpiOutflowsSub = document.getElementById("kpi-outflows-sub");
    const kpiVarianceAmt = document.getElementById("kpi-variance-amount");
    const kpiVarianceStatus = document.getElementById("kpi-variance-status");
    const kpiRefundOffsets = document.getElementById("kpi-refund-offsets");
    const globalBadge = document.getElementById("reconcile-global-badge");

    if (kpiStatement) kpiStatement.textContent = formatKsh(summary.totalStatementCash);
    if (kpiSystem) kpiSystem.textContent = formatKsh(summary.totalSystemCash);
    if (kpiInflowsSub) kpiInflowsSub.textContent = "In: " + formatKsh(summary.totalInflows);
    if (kpiOutflowsSub) kpiOutflowsSub.textContent = "Out: " + formatKsh(summary.totalOutflows);
    if (kpiRefundOffsets) kpiRefundOffsets.textContent = formatKsh(summary.totalRefundOffsets);

    const netVar = summary.netVariance || 0;
    const isBalanced = Math.abs(netVar) < 0.01;

    if (kpiVarianceAmt) {
      if (isBalanced) {
        kpiVarianceAmt.textContent = "KES 0";
        kpiVarianceAmt.className = "text-lg sm:text-xl font-extrabold text-emerald-600 mt-2";
      } else if (netVar > 0) {
        kpiVarianceAmt.textContent = "+" + formatKsh(netVar);
        kpiVarianceAmt.className = "text-lg sm:text-xl font-extrabold text-sky-600 mt-2";
      } else {
        kpiVarianceAmt.textContent = "-" + formatKsh(Math.abs(netVar));
        kpiVarianceAmt.className = "text-lg sm:text-xl font-extrabold text-rose-600 mt-2";
      }
    }

    if (kpiVarianceStatus) {
      if (isBalanced) {
        kpiVarianceStatus.textContent = "100% Reconciled";
        kpiVarianceStatus.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full inline-block bg-emerald-50 text-emerald-700 border border-emerald-200";
      } else if (netVar > 0) {
        kpiVarianceStatus.textContent = "Bank Surplus (+KES " + Math.round(netVar).toLocaleString() + ")";
        kpiVarianceStatus.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full inline-block bg-sky-50 text-sky-700 border border-sky-200";
      } else {
        kpiVarianceStatus.textContent = "Bank Deficit (-KES " + Math.round(Math.abs(netVar)).toLocaleString() + ")";
        kpiVarianceStatus.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full inline-block bg-rose-50 text-rose-700 border border-rose-200";
      }
    }

    if (globalBadge) {
      globalBadge.classList.remove("hidden");
      if (isBalanced) {
        globalBadge.textContent = "Reconciled";
        globalBadge.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200";
      } else {
        globalBadge.textContent = "Variance Alert";
        globalBadge.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
      }
    }

    // Table rows
    const tbody = document.getElementById("reconciliation-table-body");
    if (!tbody) return;

    if (!accounts.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="py-6 text-center text-slate-400 font-sans">No bank accounts found in register.</td></tr>';
      return;
    }

    tbody.innerHTML = accounts.map(function(acc) {
      const v = acc.variance || 0;
      const isAccBalanced = Math.abs(v) < 0.01;
      let varDisplay = "KES 0";
      let varClass = "text-slate-500 font-normal";
      let statusBadge = '<span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-semibold">Reconciled</span>';

      if (!isAccBalanced) {
        if (v > 0) {
          varDisplay = "+" + formatKsh(v);
          varClass = "text-sky-600 font-bold";
          statusBadge = '<span class="px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200 text-[10px] font-semibold">Surplus</span>';
        } else {
          varDisplay = "-" + formatKsh(Math.abs(v));
          varClass = "text-rose-600 font-bold";
          statusBadge = '<span class="px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-[10px] font-semibold">Deficit</span>';
        }
      }

      return (
        '<tr class="hover:bg-slate-50/70 transition-colors">' +
        '  <td class="py-3 px-4 font-sans">' +
        '    <div class="font-bold text-slate-900 text-xs">' + (acc.orgName || "-") + '</div>' +
        '    <div class="text-[10px] font-mono text-slate-400">A/C: ' + acc.accountNumber + '</div>' +
        '  </td>' +
        '  <td class="py-3 px-4 font-sans">' +
        '    <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 text-[10px] font-medium">' + (acc.paymentMode || "N/A") + '</span>' +
        '    <div class="text-[10px] font-mono text-slate-500 mt-0.5">Paybill: ' + (acc.paybill || "-") + '</div>' +
        '  </td>' +
        '  <td class="py-3 px-4 text-right text-slate-700">' + formatKsh(acc.inflows) + '</td>' +
        '  <td class="py-3 px-4 text-right text-slate-700">' + formatKsh(acc.outflows) + '</td>' +
        '  <td class="py-3 px-4 text-right font-bold text-sky-800">' + formatKsh(acc.systemBalance) + '</td>' +
        '  <td class="py-3 px-4 text-right font-bold text-emerald-800">' + formatKsh(acc.statementBalance) + '</td>' +
        '  <td class="py-3 px-4 text-center font-sans text-[10px] text-slate-500">' + (acc.balanceDate || "Not Set") + '</td>' +
        '  <td class="py-3 px-4 text-right ' + varClass + '">' + varDisplay + '</td>' +
        '  <td class="py-3 px-4 text-center font-sans">' + statusBadge + '</td>' +
        '  <td class="py-3 px-4 text-center font-sans">' +
        '    <button type="button" onclick="openReconcileModal(' + JSON.stringify(acc).replace(/"/g, '&quot;') + ')" ' +
        '      class="inline-flex items-center gap-1 px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded text-[10px] font-medium transition-colors shadow-xs">' +
        '      <i class="fas fa-edit text-[9px]"></i> <span>Reconcile</span>' +
        '    </button>' +
        '  </td>' +
        '</tr>'
      );
    }).join("");
  }

  function loadAccounts() {
    startAppLoader();

    google.script.run
      .withSuccessHandler(function (response) {
        stopAppLoader();
        if (!response || !response.success) {
          showNotification((response && response.error) || "Failed to load accounts.", "error");
          return;
        }

        accountsState.accounts = response.accounts || [];
        const isPermitted = Boolean(
          response.canReconcile ||
          (window.APP_PERMS && (window.APP_PERMS.accountsWrite === true || window.APP_PERMS.isAdmin === true))
        );
        accountsState.canReconcile = isPermitted;
        accountsState.summary = response.summary || null;

        const adminTabs = document.getElementById("accounts-admin-tabs");
        const recPane = document.getElementById("accounts-reconciliation-pane");
        const divPane = document.getElementById("accounts-dividends-pane");
        const guidesPane = document.getElementById("accounts-guides-pane");
        const headerSub = document.getElementById("accounts-header-subtitle");

        if (accountsState.canReconcile) {
          if (adminTabs) adminTabs.classList.remove("hidden");
          if (headerSub) headerSub.textContent = "Live financial reconciliation, bank statement verification, and dividend distribution.";
          renderReconciliationDashboard(response);
          switchAccountsTab(accountsState.currentTab || "reconciliation");
        } else {
          if (adminTabs) adminTabs.classList.add("hidden");
          if (recPane) recPane.classList.add("hidden");
          if (divPane) divPane.classList.add("hidden");
          if (guidesPane) guidesPane.classList.remove("hidden");
          if (headerSub) headerSub.textContent = "Verified payment channels and deposit instructions for group contributions.";
        }

        renderPaymentGuideCards(accountsState.accounts);
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .getAccountsData();
  }

  function openReconcileModal(acc) {
    if (!acc) return;
    const modal = document.getElementById("reconcile-modal");
    if (!modal) return;

    document.getElementById("modal-row-number").value = acc.rowNumber || "";
    document.getElementById("modal-account-name").textContent = acc.orgName || "Bank Account";
    document.getElementById("modal-account-num").textContent = acc.accountNumber || "-";
    document.getElementById("modal-system-bal").textContent = formatKsh(acc.systemBalance);
    document.getElementById("modal-statement-bal").value = acc.statementBalance || 0;

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("modal-statement-date").value = today;

    modal.classList.remove("hidden");
  }

  function closeReconcileModal() {
    const modal = document.getElementById("reconcile-modal");
    if (modal) modal.classList.add("hidden");
  }

  function submitReconcileForm(event) {
    if (event) event.preventDefault();

    const rowNumber = document.getElementById("modal-row-number").value;
    const stmtBal = document.getElementById("modal-statement-bal").value;
    const stmtDate = document.getElementById("modal-statement-date").value;
    const btn = document.getElementById("modal-submit-btn");

    if (!rowNumber) {
      alert("Invalid account target.");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save & Reconcile</span>';
        }
        closeReconcileModal();
        if (res && res.success) {
          showNotification("Statement balance successfully updated!", "success");
          loadAccounts();
        } else {
          alert((res && res.error) || "Failed to update statement balance.");
        }
      })
      .withFailureHandler(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save & Reconcile</span>';
        }
        handleErr(err);
      })
      .updateAccountStatementBalance({
        rowNumber: rowNumber,
        statementBalance: Number(stmtBal) || 0,
        statementDate: stmtDate
      });
  }

  /* -------------------------------------------------------------
   * DIVIDEND & INTEREST DISTRIBUTION LOGIC
   * ----------------------------------------------------------- */

  function loadDividendOverview() {
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (!res || !res.success) {
          showNotification((res && res.error) || "Failed to load dividend overview.", "error");
          return;
        }

        accountsState.dividendOverview = res;
        const s = res.summary || {};

        const kpiEarnings = document.getElementById("div-kpi-total-earnings");
        const kpiLoanInt = document.getElementById("div-kpi-loan-interest");
        const kpiInvestGains = document.getElementById("div-kpi-invest-gains");
        const kpiSavings = document.getElementById("div-kpi-total-savings");
        const kpiMemberCount = document.getElementById("div-kpi-member-count");
        const simPoolInput = document.getElementById("div-sim-pool");

        if (kpiEarnings) kpiEarnings.textContent = formatKsh(s.suggestedPool);
        if (kpiLoanInt) kpiLoanInt.textContent = formatKsh(s.totalLoanInterest);
        if (kpiInvestGains) kpiInvestGains.textContent = formatKsh(s.totalInvestmentGains);
        if (kpiSavings) kpiSavings.textContent = formatKsh(s.totalGroupSavings);
        if (kpiMemberCount) kpiMemberCount.textContent = "Across " + (s.qualifyingMemberCount || 0) + " qualifying members";

        // Pre-fill pool amount if empty
        if (simPoolInput && (!simPoolInput.value || Number(simPoolInput.value) === 0)) {
          simPoolInput.value = s.suggestedPool || 0;
        }

        // Render Fund Statements table
        renderFundStatementsTable(res.fundStatements || []);
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .getDividendOverviewData();
  }

  function renderFundStatementsTable(list) {
    const tbody = document.getElementById("fund-statements-table-body");
    if (!tbody) return;

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="py-6 text-center text-slate-400 font-sans">No fund statements recorded yet.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(function(item) {
      return (
        '<tr class="hover:bg-slate-50/70 transition-colors">' +
        '  <td class="py-3 px-4 font-sans text-slate-700">' + (item.date || "—") + '</td>' +
        '  <td class="py-3 px-4 font-sans"><span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-semibold">' + item.fund + '</span></td>' +
        '  <td class="py-3 px-4 text-right text-slate-600">' + formatKsh(item.opening) + '</td>' +
        '  <td class="py-3 px-4 text-right text-slate-600">' + formatKsh(item.deposits) + '</td>' +
        '  <td class="py-3 px-4 text-right font-medium text-slate-800">' + formatKsh(item.grossInterest) + '</td>' +
        '  <td class="py-3 px-4 text-right text-rose-600 font-medium">(' + formatKsh(item.wht) + ')</td>' +
        '  <td class="py-3 px-4 text-right font-bold text-emerald-700 bg-emerald-50/40">' + formatKsh(item.netYield) + '</td>' +
        '  <td class="py-3 px-4 text-right font-bold text-slate-900">' + formatKsh(item.closing) + '</td>' +
        '  <td class="py-3 px-4 text-center font-mono text-[10px] text-slate-400">' + (item.ref || "—") + '</td>' +
        '</tr>'
      );
    }).join("");
  }

  function openFundStatementModal() {
    const modal = document.getElementById("fund-statement-modal");
    if (!modal) return;
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("fstmt-date").value = today;
    document.getElementById("fstmt-opening").value = "";
    document.getElementById("fstmt-deposits").value = "";
    document.getElementById("fstmt-gross").value = "";
    document.getElementById("fstmt-wht").value = "";
    document.getElementById("fstmt-closing").value = "";
    document.getElementById("fstmt-ref").value = "CIC-MMF-" + new Date().getFullYear();
    modal.classList.remove("hidden");
  }

  function closeFundStatementModal() {
    const modal = document.getElementById("fund-statement-modal");
    if (modal) modal.classList.add("hidden");
  }

  function autoCalculateFundWht() {
    const gross = Number(document.getElementById("fstmt-gross").value) || 0;
    const whtInput = document.getElementById("fstmt-wht");
    if (whtInput && gross > 0) {
      whtInput.value = (Math.round(gross * 0.15 * 100) / 100).toFixed(2);
    }
  }

  function submitFundStatementForm(event) {
    if (event) event.preventDefault();

    const dateVal = document.getElementById("fstmt-date").value;
    const fundVal = document.getElementById("fstmt-fund").value;
    const openingVal = document.getElementById("fstmt-opening").value;
    const depositsVal = document.getElementById("fstmt-deposits").value;
    const grossVal = document.getElementById("fstmt-gross").value;
    const whtVal = document.getElementById("fstmt-wht").value;
    const closingVal = document.getElementById("fstmt-closing").value;
    const refVal = document.getElementById("fstmt-ref").value;
    const btn = document.getElementById("btn-save-fund-stmt");

    if (!dateVal || !closingVal) {
      alert("Please fill in required fields.");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Statement Entry</span>';
        }
        closeFundStatementModal();
        if (res && res.success) {
          showNotification("Fund statement successfully logged!", "success");
          loadDividendOverview();
          loadAccounts();
        } else {
          alert((res && res.error) || "Failed to save fund statement.");
        }
      })

    const reserveVal = Number(document.getElementById("div-sim-reserve").value) || 0;
    const autoOffset = document.getElementById("div-sim-auto-offset").checked;
    const btn = document.getElementById("div-btn-simulate");

    if (poolVal <= 0) {
      alert("Please enter a dividend pool amount greater than 0.");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Calculating...';

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-calculator text-xs"></i> <span>Calculate Preview</span>';
        }
        if (!res || !res.success) {
          alert((res && res.error) || "Failed to calculate simulation.");
          return;
        }

        accountsState.dividendSimulation = res;
        renderDividendPreview(res);
      })
      .withFailureHandler(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-calculator text-xs"></i> <span>Calculate Preview</span>';
        }
        handleErr(err);

      .calculateDividendDistributionPreview({
        poolAmount: poolVal,

    const year = document.getElementById("div-sim-year").value || "2026";

  function loadMonthlyStatementsView(monthKey) {
    const tableBody = document.getElementById("stmt-members-table-body");
    if (tableBody) {
      tableBody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400"><i class="fas fa-spinner fa-spin mr-2"></i> Loading members for statement dispatch...</td></tr>';
    }

    google.script.run
      .withSuccessHandler(function (data) {
        if (!data) return;
        accountsState.statementsOverview = data;
        accountsState.selectedMonthKey = data.activeMonthKey;
        renderMonthlyStatementsView(data);
      })
      .withFailureHandler(function (err) {
        if (tableBody) {
          tableBody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-rose-500 font-medium">Failed to load statements: ' + escapeHtmlAttr(err.message) + '</td></tr>';
        }
        handleErr(err);
      })
      .getMonthlyStatementsOverviewData(monthKey || accountsState.selectedMonthKey);

  function renderMonthlyStatementsView(data) {
    if (!data) return;

    // 1. Month selector
    const monthSelect = document.getElementById("stmt-month-select");
    if (monthSelect && data.availableMonths) {
      monthSelect.innerHTML = data.availableMonths.map(function (m) {
        const isSel = m.key === data.activeMonthKey ? "selected" : "";
        return '<option value="' + m.key + '" ' + isSel + '>' + m.label + '</option>';
      }).join("");
    }

    // 2. KPIs
    const members = data.members || [];
    const withEmail = members.filter(function (m) { return m.hasEmail; }).length;
    const withPhone = members.filter(function (m) { return m.hasPhone; }).length;
    const emailPct = members.length > 0 ? Math.round((withEmail / members.length) * 100) : 0;
    const phonePct = members.length > 0 ? Math.round((withPhone / members.length) * 100) : 0;

    const elTotal = document.getElementById("stmt-kpi-total-members");
    const elEmail = document.getElementById("stmt-kpi-email-members");
    const elEmailPct = document.getElementById("stmt-kpi-email-pct");
    const elPhone = document.getElementById("stmt-kpi-phone-members");
    const elPhonePct = document.getElementById("stmt-kpi-phone-pct");
    const elBadge = document.getElementById("stmt-auto-email-badge");

    if (elTotal) elTotal.innerText = members.length;
    if (elEmail) elEmail.innerText = withEmail;
    if (elEmailPct) elEmailPct.innerText = emailPct + "% configured for email";
    if (elPhone) elPhone.innerText = withPhone;
    if (elPhonePct) elPhonePct.innerText = phonePct + "% ready for 1-click share";

    if (elBadge && data.settings) {
      if (data.settings.autoEmailReceipts) {
        elBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
        elBadge.innerHTML = '<i class="fas fa-check-circle mr-1 text-[10px]"></i> ACTIVE (ON)';
      } else {
        elBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200";
        elBadge.innerHTML = '<i class="fas fa-pause-circle mr-1 text-[10px]"></i> PAUSED (OFF)';
      }
    }

    renderStatementMembersTable(members);
  }

      if (renderedCount) renderedCount.innerText = "0";
      return;
    }

    if (renderedCount) renderedCount.innerText = members.length;

    tableBody.innerHTML = members.map(function (m) {
      const emailCell = m.hasEmail
        ? '<span class="text-slate-700 font-mono text-[11px]">' + escapeHtmlAttr(m.email) + '</span>'
        : '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] bg-rose-50 text-rose-600 font-medium border border-rose-100"><i class="fas fa-exclamation-triangle mr-1 text-[9px]"></i> No email</span>';

      const phoneCell = m.hasPhone
        ? '<span class="text-slate-700 font-mono text-[11px]">' + escapeHtmlAttr(m.phone) + '</span>'
        : '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] bg-amber-50 text-amber-700 font-medium border border-amber-100"><i class="fas fa-phone-slash mr-1 text-[9px]"></i> No phone</span>';

      const loanBalClass = m.loanBalance > 0 ? "text-amber-600 font-bold" : "text-slate-400";

      return (
        '<tr class="hover:bg-slate-50/80 transition-colors">' +
          '<td class="py-3 px-3 text-center">' +
            '<input type="checkbox" class="stmt-member-checkbox rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer" ' +
              'value="' + escapeHtmlAttr(m.id) + '" data-has-email="' + m.hasEmail + '" data-name="' + escapeHtmlAttr(m.name) + '" onchange="updateSelectedStatementCount()" />' +
          '</td>' +
          '<td class="py-3 px-3">' +
            '<div class="font-bold text-slate-900">' + escapeHtmlAttr(m.name) + '</div>' +
            '<div class="text-[10px] font-mono text-slate-400">' + escapeHtmlAttr(m.id) + '</div>' +
          '</td>' +
          '<td class="py-3 px-3">' + emailCell + '</td>' +
          '<td class="py-3 px-3">' + phoneCell + '</td>' +
          '<td class="py-3 px-3 text-right font-mono font-bold text-emerald-700">' + formatKsh(m.savings) + '</td>' +
          '<td class="py-3 px-3 text-right font-mono ' + loanBalClass + '">' + (m.loanBalance > 0 ? formatKsh(m.loanBalance) : '—') + '</td>' +
          '<td class="py-3 px-3 text-center">' +
            '<div class="flex items-center justify-center gap-1.5">' +
              '<button type="button" onclick="previewMemberStatement(\'' + escapeHtmlAttr(m.id) + '\')" title="Preview Statement" ' +
                'class="p-1 px-2 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-[10px] transition-colors flex items-center gap-1">' +
                '<i class="fas fa-eye text-slate-500"></i> Preview' +
              '</button>' +
              '<button type="button" onclick="sendSingleMemberStatement(\'' + escapeHtmlAttr(m.id) + '\')" title="Send Email Statement" ' +
                'class="p-1 px-2 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-medium text-[10px] transition-colors flex items-center gap-1 ' + (!m.hasEmail ? 'opacity-50 cursor-not-allowed' : '') + '">' +
                '<i class="fas fa-envelope text-emerald-600"></i> Email' +
              '</button>' +
              '<button type="button" onclick="sendSingleMemberWhatsApp(\'' + escapeHtmlAttr(m.id) + '\')" title="Send WhatsApp Statement" ' +
                'class="p-1 px-2 rounded bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 font-medium text-[10px] transition-colors flex items-center gap-1 ' + (!m.hasPhone ? 'opacity-50 cursor-not-allowed' : '') + '">' +
                '<i class="fab fa-whatsapp text-green-600"></i> WhatsApp' +
              '</button>' +
            '</div>' +
          '</td>' +
        '</tr>'
      );
    }).join("");

    updateSelectedStatementCount();
  }

  function filterStatementMembersTable() {
    const q = (document.getElementById("stmt-member-search")?.value || "").toLowerCase().trim();
    if (!accountsState.statementsOverview || !accountsState.statementsOverview.members) return;
    const filtered = accountsState.statementsOverview.members.filter(function (m) {
      if (!q) return true;
      return (m.name && m.name.toLowerCase().indexOf(q) !== -1) ||
             (m.id && m.id.toLowerCase().indexOf(q) !== -1) ||
             (m.email && m.email.toLowerCase().indexOf(q) !== -1);
    });
    renderStatementMembersTable(filtered);
  }

    cbs.forEach(function (cb) {

  function previewMemberStatement(memberId) {
    accountsState.previewMemberId = memberId;
    const modal = document.getElementById("stmt-preview-modal");
    const container = document.getElementById("stmt-preview-container");
    const title = document.getElementById("stmt-preview-title");
    const emailVal = document.getElementById("stmt-preview-email-val");
    const waBtn = document.getElementById("stmt-preview-wa-btn");
    const emailBtn = document.getElementById("stmt-preview-email-btn");

    if (modal) modal.classList.remove("hidden");
    if (container) {
      container.innerHTML = '<div class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin text-xl mb-2"></i><br>Generating official statement...</div>';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          if (container) container.innerHTML = '<div class="p-6 text-center text-rose-600 font-semibold">' + ((res && res.error) || 'Failed to generate statement.') + '</div>';
          return;
        }

        accountsState.previewStatementData = res.statementData;
        const stmt = res.statementData;

        if (title) title.innerText = stmt.memberName + " — " + stmt.monthLabel;
        if (emailVal) emailVal.innerText = stmt.email || "No email";

        // Render HTML inside iframe or container
        if (container) {
          const iframe = document.createElement("iframe");
          iframe.style.width = "100%";
          iframe.style.height = "520px";
          iframe.style.border = "none";
          iframe.style.borderRadius = "8px";
          container.innerHTML = "";
          container.appendChild(iframe);
          const doc = iframe.contentWindow.document;
          doc.open();
          doc.write(res.htmlBody || buildClientSideStatementHtml_(stmt));
          doc.close();
        }

        if (waBtn) {
          waBtn.onclick = function () {
            if (res.whatsAppUrl) {
              window.open(res.whatsAppUrl, "_blank");
            } else {
              alert("Member does not have a valid phone number for WhatsApp.");
            }
          };
        }

        if (emailBtn) {
          emailBtn.disabled = !stmt.email;
          emailBtn.onclick = function () {
            sendSingleMemberStatement(memberId);
          };
        }
      })
      .withFailureHandler(function (err) {
        if (container) container.innerHTML = '<div class="p-6 text-center text-rose-600 font-semibold">' + escapeHtmlAttr(err.message) + '</div>';
        handleErr(err);
      })
      .sendMemberMonthlyStatement({
        memberId: memberId,
        monthKey: accountsState.selectedMonthKey,
        sendEmail: false
      });
  }

  function confirmBulkEmailStatements() {
    const cbs = Array.from(document.querySelectorAll(".stmt-member-checkbox:checked"));
    if (cbs.length === 0) {
      alert("Please select at least one member to send statements to.");
      return;
    }

    const total = cbs.length;
    const withEmail = cbs.filter(function (cb) { return cb.getAttribute("data-has-email") === "true"; }).length;
    const noEmail = total - withEmail;

    const modal = document.getElementById("stmt-bulk-modal");
    const elPeriod = document.getElementById("stmt-bulk-period-label");
    const elSel = document.getElementById("bulk-selected-count");
    const elWithEmail = document.getElementById("bulk-with-email-count");
    const elNoEmail = document.getElementById("bulk-no-email-count");
    const prog = document.getElementById("bulk-progress-container");
    const btn = document.getElementById("btn-execute-bulk-email");

    const selMonth = document.getElementById("stmt-month-select");
    const monthText = selMonth ? selMonth.options[selMonth.selectedIndex]?.text : accountsState.selectedMonthKey;

    if (elPeriod) elPeriod.innerText = "Period: " + (monthText || "Current");
    if (elSel) elSel.innerText = total;
    if (elWithEmail) elWithEmail.innerText = withEmail;
    if (elNoEmail) elNoEmail.innerText = noEmail;
    if (prog) prog.classList.add("hidden");
    if (btn) {
      btn.disabled = withEmail === 0;
      btn.innerHTML = '<i class="fas fa-paper-plane text-xs"></i> <span>Send ' + withEmail + ' Email(s)</span>';
    }

    if (modal) modal.classList.remove("hidden");

  function executeBulkEmailDispatch() {
    const cbs = Array.from(document.querySelectorAll(".stmt-member-checkbox:checked"));
    const memberIds = cbs.map(function (cb) { return cb.value; });
    const prog = document.getElementById("bulk-progress-container");
    const bar = document.getElementById("bulk-progress-bar");
    const status = document.getElementById("bulk-progress-status");
    const btn = document.getElementById("btn-execute-bulk-email");

    if (prog) prog.classList.remove("hidden");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> <span>Dispatching...</span>';
    }
    if (bar) bar.style.width = "40%";
    if (status) status.innerText = "Processing batch...";

    google.script.run
      .withSuccessHandler(function (res) {
        if (bar) bar.style.width = "100%";
        if (status) status.innerText = "Complete!";
        setTimeout(function () {
          closeBulkEmailModal();
          if (res && res.success && res.results) {
            showNotification(
              "Bulk Statements Dispatched! Sent: " + res.results.sent + ", Skipped: " + res.results.skippedNoEmail + ", Failed: " + res.results.failed,
              "success"
            );
          } else {
            alert((res && res.error) || "Bulk dispatch failed.");
          }
        }, 800);
      })
      .withFailureHandler(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-paper-plane text-xs"></i> <span>Retry</span>';
        }
        if (prog) prog.classList.add("hidden");
        handleErr(err);
      })
      .sendBulkMonthlyStatements({
        monthKey: accountsState.selectedMonthKey,
        memberIds: memberIds
      });
  }

        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Settings</span>';
        }
        handleErr(err);
      })
      .saveNotificationSettings({
        autoEmailReceipts: chkAuto ? chkAuto.checked : true,
        notificationBcc: inpBcc ? inpBcc.value.trim() : ""
      });
  }
