<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bright Life SHG — Executive & Member Portal</title>
  
  <!-- SEO & Brand Metadata -->
  <meta name="description" content="Bright Life Self Help Group Executive Treasury, Savings, Credit & Member Financial Portal">
  <meta name="theme-color" content="#0F2A44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bright Life SHG">
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Bright Life SHG — Executive & Member Portal">
  <meta property="og:description" content="Institutional Treasury Performance, Member Savings, Credit Books, and Actuarial Financial Reports.">
  <meta property="og:type" content="website">

  <!-- Favicon (Inline SVG Brand Shield) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230F2A44'%3E%3Cpath d='M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm0 4a3 3 0 110 6 3 3 0 010-6zm-5 11c0-2.33 3.33-3.5 5-3.5s5 1.17 5 3.5v.5H7V17z' fill='%23ffffff'/%3E%3C/svg%3E">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-navy: #0F2A44;
      --accent-blue: #2563eb;
      --bg-slate: #0b1320;
      --banner-crop-height: 38px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--primary-navy);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Full-Screen Cropping Wrapper */
    .portal-container {
      position: absolute;
      top: calc(-1 * var(--banner-crop-height));
      left: 0;
      width: 100%;
      height: calc(100% + var(--banner-crop-height));
      overflow: hidden;
      background-color: #f8fafc;
      transition: opacity 0.3s ease-in-out;
    }

    iframe#app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: transparent;
    }

    /* Branded Loading Splash Screen */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #17375a 0%, #0a1b2d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #ffffff;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
      max-width: 380px;
    }

    .brand-logo-shield {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #1e40af, #0284c7);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4), 0 8px 10px -6px rgba(2, 132, 199, 0.2);
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand-logo-shield svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 28px;
      letter-spacing: 0.01em;
    }

    /* Loading Spinner */
    .spinner-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-status-text {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    /* Fade-out utility */
    .fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Loading Splash Overlay -->
  <div id="splash-screen">
    <div class="splash-card">
      <div class="brand-logo-shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
      </div>
      <h1 class="brand-title">Bright Life SHG</h1>
      <p class="brand-subtitle">Executive & Member Financial Portal</p>
      <div class="spinner-ring"></div>
      <span class="loading-status-text">Securing encrypted connection...</span>
    </div>
  </div>

  <!-- Main Application Wrapper (Cropping out Google's 38px warning bar) -->
  <div class="portal-container">
    <iframe
      id="app-frame"
      title="Brightlife SHG Portal"
      allow="clipboard-read; clipboard-write"
      loading="eager"
    ></iframe>
  </div>

  <script>
    (function() {
      // Production Google Apps Script Web App Endpoint
      const GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbx4NBY3rdhsCAJljxlTw3dQRGpxXTHOXUWLnaJzoscRLJWWo-uPoX4J-S75HtLFB0wRCA/exec";

      // Forward any query parameters from GitHub Pages URL (e.g. ?tab=loans, ?report=agm)
      const currentQuery = window.location.search || "";
      const targetUrl = GAS_BASE_URL + currentQuery;

      const iframe = document.getElementById("app-frame");
      const splash = document.getElementById("splash-screen");

      // Set iframe source with forwarded parameters
      iframe.src = targetUrl;

      // When the iframe finishes loading, dismiss splash overlay smoothly
      iframe.onload = function() {
        setTimeout(function() {
          if (splash) splash.classList.add("fade-out");
        }, 350);
      };

      // Fallback: If network is slow, hide splash after 6 seconds max
      setTimeout(function() {
        if (splash && !splash.classList.contains("fade-out")) {
          splash.classList.add("fade-out");
        }
      }, 6000);
    })();
  </script>
</body>
</html>
