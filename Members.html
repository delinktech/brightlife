<section id="members">
  <div class="flex justify-between items-end mb-8">
    <div>
      <h2 class="text-3xl font-bold text-slate-900">Members Directory</h2>
      <p class="text-slate-500">Manage contributions and guarantee eligibility.</p>
    </div>
    <div class="flex items-center space-x-3">
      <button type="button" onclick="openPrintContributionsReport()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-lg font-semibold text-sm transition-all shadow-sm">
        <i class="fas fa-print mr-2 text-slate-500"></i> Print Summary
      </button>
      <button type="button" onclick="openMemberModal()" data-require-perm="membersWrite"
        class="hidden bg-sky-600 hover:bg-sky-700 text-white px-6 py-2.5 rounded-lg font-semibold transition-all shadow-lg shadow-sky-200">
        <i class="fas fa-plus mr-2"></i> Register Member
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-50 border-b border-slate-100">
        <tr>
          <th class="px-6 py-4 text-xs font-bold text-slate-500">Member</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500 text-center">Gender</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500 text-center">DOB</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500">Member Since</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500 text-right">Savings</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500 text-right">Loan Bal</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500 text-right">Guaranteed</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500 text-center">Status</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-500 text-center">Actions</th>
        </tr>
      </thead>
      <tbody id="member-table-body" class="divide-y divide-slate-50">
      </tbody>
    </table>
  </div>
</section>

<div id="memberModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="relative bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">

      <div class="bg-slate-900 px-6 py-4 flex justify-between items-center">
        <h3 id="modalTitle" class="text-xl font-bold text-white">Member Profile</h3>
        <button onclick="closeMemberModal()" class="text-slate-400 hover:text-white"><i
            class="fas fa-times"></i></button>
      </div>

      <form id="memberForm" class="p-6 space-y-6">
        <input type="hidden" id="m-id">

        <div>
          <h4 class="text-xs font-bold text-sky-600 uppercase tracking-widest mb-3">Personal Details</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">First Name</label>
              <input type="text" id="m-first" required
                class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Middle Name</label>
              <input type="text" id="m-middle"
                class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Last Name</label>
              <input type="text" id="m-last" required
                class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <h4 class="text-xs font-bold text-sky-600 uppercase tracking-widest mb-3">Identification</h4>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">National ID / Passport</label>
            <input type="text" id="m-nid"
              class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
          </div>
          <div>
            <h4 class="text-xs font-bold text-sky-600 uppercase tracking-widest mb-3">Birth Date</h4>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Date of Birth</label>
            <input type="date" id="m-dob"
              class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
          </div>
        </div>

        <div>
          <h4 class="text-xs font-bold text-sky-600 uppercase tracking-widest mb-3">Account Configuration</h4>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Gender</label>
              <select id="m-gender"
                class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
                <option value="">Select</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Joining Date</label>
              <input type="date" id="m-joined"
                class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <div id="m-status-wrap" class="hidden">
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Membership Status</label>
              <select id="m-status"
                class="w-full px-3 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
                <option value="Pending">Pending</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Suspended">Suspended</option>
                <option value="Dormant">Dormant</option>
                <option value="Exited">Exited</option>
                <option value="Deceased">Deceased</option>

              </select>
            </div>
          </div>
        </div>

        <div class="pt-4 flex space-x-3">
          <button type="button" onclick="closeMemberModal()"
            class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all">Cancel</button>
          <button type="submit"
            class="flex-[2] bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-sky-100 transition-all">Save
            Member Profile</button>
        </div>
      </form>
    </div>
  </div>
</div>
