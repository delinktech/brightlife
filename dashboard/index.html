<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bright Life SHG — Executive Treasury & Member Portal</title>
  
  <!-- SEO & Brand Metadata -->
  <meta name="description" content="Bright Life Self Help Group Executive Treasury, Savings, Credit & Member Financial Portal">
  <meta name="theme-color" content="#0F2A44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bright Life SHG">

  <!-- Favicon (Inline SVG Brand Shield) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230F2A44'%3E%3Cpath d='M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm0 4a3 3 0 110 6 3 3 0 010-6zm-5 11c0-2.33 3.33-3.5 5-3.5s5 1.17 5 3.5v.5H7V17z' fill='%23ffffff'/%3E%3C/svg%3E">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-navy: #0F2A44;
      --accent-blue: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.4);
      --bg-dark: #070e17;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 25%, #132e4d 0%, #070e17 80%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .gateway-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-logo-shield {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1d4ed8, #0284c7);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px -6px var(--accent-glow), 0 0 0 1px rgba(255, 255, 255, 0.18) inset;
      margin-bottom: 24px;
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .brand-logo-shield svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(2, 132, 199, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 28px;
    }

    .loader-card {
      width: 100%;
      background: rgba(15, 30, 48, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Progress bar indicator */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 18px;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 9999px;
      box-shadow: 0 0 12px #38bdf8;
      animation: fillProgress 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      60% { width: 85%; }
      100% { width: 100%; }
    }

    .status-text {
      font-size: 13.5px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .substatus-text {
      font-size: 11.5px;
      color: #64748b;
      margin-bottom: 18px;
    }

    .fallback-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      transition: all 0.2s ease;
    }

    .fallback-link:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .footer {
      font-size: 11px;
      color: #64748b;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="gateway-container">
    <!-- Brand Logo Shield -->
    <div class="brand-logo-shield">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
    </div>

    <!-- Live Status Pill -->
    <div class="badge-status">
      <div class="badge-dot"></div>
      Release v1.0.0 • Operational
    </div>

    <h1>Bright Life SHG</h1>
    <p class="subtitle">Executive Treasury & Member Financial Portal</p>

    <!-- Automatic Handoff Card -->
    <div class="loader-card">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="status-text" id="status-title">Authenticating Secure Session...</div>
      <div class="substatus-text" id="status-subtitle">Verifying Google account & role authorization</div>

      <a
        href="https://script.google.com/macros/s/AKfycbx4NBY3rdhsCAJljxlTw3dQRGpxXTHOXUWLnaJzoscRLJWWo-uPoX4J-S75HtLFB0wRCA/exec"
        class="fallback-link"
        id="manual-launch-link"
      >
        <span>Open Portal Manually &rarr;</span>
      </a>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Bright Life Self Help Group &bull; Financial OS</span>
      <span>Secured via Google Workspace & Apps Script</span>
    </div>
  </div>

  <script>
    (function() {
      // Production Google Apps Script Web App Endpoint
      const GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbx4NBY3rdhsCAJljxlTw3dQRGpxXTHOXUWLnaJzoscRLJWWo-uPoX4J-S75HtLFB0wRCA/exec";

      // Forward any parameters from URL (e.g. ?tab=loans, ?view=reports)
      const currentQuery = window.location.search || "";
      const targetUrl = GAS_BASE_URL + currentQuery;

      // Update manual link in case popups are blocked
      const manualLink = document.getElementById("manual-launch-link");
      if (manualLink) {
        manualLink.href = targetUrl;
      }

      // Smooth automated handoff after 350ms
      setTimeout(function() {
        window.location.replace(targetUrl);
      }, 350);
    })();
  </script>
</body>
</html>
