<section id="loans">
  <div class="flex justify-between items-end mb-8">
    <div>
      <h2 class="text-3xl font-bold text-slate-900">Loan Portfolio</h2>
      <p class="text-slate-500">View and manage member loan applications and balances.</p>
    </div>
    <div class="flex items-center space-x-3">
      <button type="button" onclick="openPrintLoansReport()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-lg font-semibold text-sm transition-all shadow-sm">
        <i class="fas fa-print mr-2 text-slate-500"></i> Print Report
      </button>
      <button type="button" onclick="openPayLoanModal()" data-require-perm="loanPayment" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-semibold transition-all">
        <i class="fas fa-hand-holding-dollar mr-2"></i> Pay Loan
      </button>
      <button type="button" onclick="openRequestLoanModal()" data-require-perm="loanRequest" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg font-semibold transition-all shadow-lg shadow-emerald-100">
        <i class="fas fa-plus mr-2"></i> Request Loan
      </button>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-50 border-b border-slate-100">
          <tr>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase">ID</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase">Borrower</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase">Requested Date</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase">Approved Date</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase text-right">Requested</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase text-right">Repayment</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase text-right">Paid</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase text-right">Balance</th>
            <th class="px-4 py-4 text-[10px] text-slate-400 uppercase text-center">Status</th>
          </tr>
        </thead>
        <tbody id="loan-table-body" class="divide-y divide-slate-50 text-sm">
        </tbody>
      </table>
    </div>
    
    <div class="flex items-center justify-between px-6 py-4 bg-slate-50/50">
      <span class="text-xs text-slate-500">Page <span id="loan-page-num">1</span></span>
      <div class="flex space-x-2">
        <button onclick="changeLoanPage(-1)" id="l-prev" class="p-2 text-slate-400 hover:text-slate-600 disabled:opacity-30"><i class="fas fa-chevron-left"></i></button>
        <button onclick="changeLoanPage(1)" id="l-next" class="p-2 text-slate-400 hover:text-slate-600 disabled:opacity-30"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
</section>

<div id="payLoanModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6">
    <h3 class="text-xl font-bold mb-4">Record Loan Payment</h3>
    <form id="payLoanForm" class="space-y-4">
      <select id="pl-member" required class="w-full p-2 border rounded-lg"></select>
      <input type="number" id="pl-amount" placeholder="Amount" required class="w-full p-2 border rounded-lg">
      <select id="pl-mode" class="w-full p-2 border rounded-lg">
        <option value="M-Pesa">M-Pesa</option>
        <option value="Cash">Cash</option>
        <option value="Bank Payment">Bank Payment</option>
        <option value="Refund">Refund</option>
      </select>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Post Payment</button>
      <button type="button" onclick="closePayLoanModal()" class="w-full text-slate-400 text-sm">Cancel</button>
    </form>
  </div>
</div>
