<script>
  let currentMembers = [];

  function getMemberInitialAvatar(name) {
    const clean = String(name || "U").trim();
    const parts = clean.split(/\s+/);
    let initials = parts[0] ? parts[0].charAt(0).toUpperCase() : "U";
    if (parts.length > 1) {
      initials += parts[parts.length - 1].charAt(0).toUpperCase();
    }
    const colorClasses = [
      "bg-blue-100 text-blue-700 border-blue-200",
      "bg-indigo-100 text-indigo-700 border-indigo-200",
      "bg-emerald-100 text-emerald-700 border-emerald-200",
      "bg-purple-100 text-purple-700 border-purple-200",
      "bg-slate-100 text-slate-700 border-slate-200"
    ];
    const charCode = clean.charCodeAt(0) || 0;
    const colorClass = colorClasses[charCode % colorClasses.length];
    
    return '<div class="w-8 h-8 rounded-full border flex items-center justify-center font-bold text-xs shrink-0 ' + colorClass + '">' +
      initials +
    '</div>';
  }

  function updateLoanStatusFilterOptions(list) {
    let countAll = list.length;
    let countActive = 0;
    let countCleared = 0;
    let countNone = 0;
    let countPending = 0;

    list.forEach((m) => {
      const bal = Number(m.loanBalance) || 0;
      const taken = Number(m.totalLoanTaken) || 0;
      const sysStatus = String(m.status || "").toLowerCase();

      if (sysStatus === "pending") countPending++;
      else if (bal > 0) countActive++;
      else if (taken > 0 && bal === 0) countCleared++;
      else countNone++;
    });

    const elAll = document.getElementById("count-all");
    const elActive = document.getElementById("count-active");
    const elCleared = document.getElementById("count-cleared");
    const elNone = document.getElementById("count-none");
    const elPending = document.getElementById("count-pending");

    if (elAll) elAll.innerText = countAll;
    if (elActive) elActive.innerText = countActive;
    if (elCleared) elCleared.innerText = countCleared;
    if (elNone) elNone.innerText = countNone;
    if (elPending) elPending.innerText = countPending;

    const filterInput = document.getElementById("member-loan-status-filter");
    const label = document.getElementById("member-loan-status-filter-label");
    const currentVal = filterInput ? filterInput.value : "all";

    if (label) {
      if (currentVal === "active") label.innerText = "Active Loans (" + countActive + ")";
      else if (currentVal === "cleared") label.innerText = "Cleared Loans (" + countCleared + ")";
      else if (currentVal === "none") label.innerText = "No Loans Taken (" + countNone + ")";
      else if (currentVal === "pending") label.innerText = "Pending Requests (" + countPending + ")";
      else label.innerText = "All Members (" + countAll + ")";
    }
  }

  let membersPage = 1;
  let membersPerPage = 10;
  let membersTotalPages = 1;

  function filterMembersTable(targetPage) {
    const searchVal = (document.getElementById("member-search-input") ? document.getElementById("member-search-input").value : "").toLowerCase().trim();
    const statusVal = document.getElementById("member-loan-status-filter") ? document.getElementById("member-loan-status-filter").value : "all";

    const filtered = currentMembers.filter((m) => {
      const nameMatch = (m.name || "").toLowerCase().indexOf(searchVal) !== -1 ||
        (m.id || "").toLowerCase().indexOf(searchVal) !== -1 ||
        (m.nationalId || "").toLowerCase().indexOf(searchVal) !== -1;

      if (!nameMatch) return false;
      if (statusVal === "all") return true;

      const bal = Number(m.loanBalance) || 0;
      const taken = Number(m.totalLoanTaken) || 0;
      const sysStatus = String(m.status || "").toLowerCase();

      if (statusVal === "active") return bal > 0;
      if (statusVal === "cleared") return taken > 0 && bal === 0;
      if (statusVal === "none") return taken === 0 && bal === 0;
      if (statusVal === "pending") return sysStatus === "pending";

      return true;
    });

    const totalRows = filtered.length;
    membersTotalPages = Math.max(1, Math.ceil(totalRows / membersPerPage));
    const reqPage = Number(targetPage);
    membersPage = reqPage > 0 ? Math.min(membersTotalPages, reqPage) : 1;

    const startIdx = (membersPage - 1) * membersPerPage;
    const pageRows = filtered.slice(startIdx, startIdx + membersPerPage);

    renderMembersTable(pageRows);
    if (typeof renderTablePagination === "function") {
      renderTablePagination("members-pagination", {
        currentPage: membersPage,
        totalPages: membersTotalPages,
        totalRows: totalRows,
        rowsPerPage: membersPerPage,
        onPageChangeName: "setMembersPage",
        onRowsPerPageChangeName: "setMembersRowsPerPage",
        entityLabel: "members",
      });
    }
  }
  window.filterMembersTable = filterMembersTable;

  function setMembersPage(page) {
    const p = Number(page) || 1;
    if (p < 1 || p > membersTotalPages) return;
    filterMembersTable(p);
  }
  window.setMembersPage = setMembersPage;

  function setMembersRowsPerPage(limit) {
    const n = Number(limit);
    membersPerPage = n > 0 ? n : 10;
    filterMembersTable(1);
  }
  window.setMembersRowsPerPage = setMembersRowsPerPage;

  function getGenderChip(gender) {
    const g = String(gender || "").trim().toUpperCase();
    if (g === "F" || g === "FEMALE") {
      return '<span class="inline-flex items-center justify-center w-4 h-4 rounded text-[9px] font-black bg-pink-100 text-pink-700 border border-pink-200 shrink-0 ml-1.5 shadow-2xs" title="Female">F</span>';
    }
    if (g === "M" || g === "MALE") {
      return '<span class="inline-flex items-center justify-center w-4 h-4 rounded text-[9px] font-black bg-blue-100 text-blue-700 border border-blue-200 shrink-0 ml-1.5 shadow-2xs" title="Male">M</span>';
    }
    return '';
  }

  function getMemberLoanStatusBadge(m) {
    const bal = Number(m.loanBalance) || 0;
    const taken = Number(m.totalLoanTaken) || 0;
    const sysStatus = String(m.status || "").toLowerCase();

    if (sysStatus === "pending") {
      return '<span class="badge-warning">Pending</span>';
    }
    if (bal > 0) {
      return '<span class="badge-danger">Active Loan</span>';
    }
    if (taken > 0 && bal === 0) {
      return '<span class="badge-success">Cleared</span>';
    }
    return '<span class="badge-secondary">None</span>';
  }

  function getUserAccountStatusBadge(status) {
    if (typeof renderStatusPill === "function") {
      return renderStatusPill(status || "Active");
    }
    const s = String(status || "Active").toLowerCase().trim();
    if (s === "active") {
      return '<span class="badge-success">Active</span>';
    }
    if (s === "inactive" || s === "suspended" || s === "dormant" || s === "exited") {
      return '<span class="badge-danger">' + (status || "Inactive") + '</span>';
    }
    return '<span class="badge-secondary">' + (status || "Pending") + '</span>';
  }

  function renderMembersTable(list) {
    const container = document.getElementById("member-table-body");
    if (!container) return;

    if (!list || !list.length) {
      container.innerHTML =
        '<tr><td colspan="11" class="text-center py-8 text-slate-500 dark:text-slate-400">No members found matching your search or filter criteria.</td></tr>';
      return;
    }

    let html = "";
    list.forEach((m) => {
      const bal = Number(m.loanBalance) || 0;
      const taken = Number(m.totalLoanTaken) || 0;
      const guaranteed = Number(m.guaranteed) || 0;
      const availGuar = Number(m.availableToGuarantee) || 0;
      const maxLoan = Number(m.maxLoanEligibility) || 0;
      const balClass = bal > 0 ? "text-amber-700 dark:text-amber-400 font-bold" : "text-slate-500 dark:text-slate-400 font-normal";
      const takenClass = taken > 0 ? "text-slate-800 dark:text-slate-200 font-bold" : "text-slate-500 dark:text-slate-400 font-normal";
      const gtrClass = guaranteed > 0 ? "text-purple-700 dark:text-purple-400 font-bold" : "text-slate-500 dark:text-slate-400 font-normal";
      const availClass = availGuar > 0 ? "text-emerald-700 dark:text-emerald-400 font-bold" : "text-slate-500 dark:text-slate-400 font-normal";
      const maxLoanClass = maxLoan > 0 ? "text-sky-700 dark:text-sky-400 font-bold" : "text-slate-500 dark:text-slate-400 font-normal";

      const contactLine = [
        m.phone ? '<span class="inline-flex items-center gap-1 text-slate-500 dark:text-slate-400"><i class="fas fa-phone text-[9px] text-slate-400"></i>' + m.phone + '</span>' : '',
        m.email ? '<span class="inline-flex items-center gap-1 text-slate-500 dark:text-slate-400"><i class="fas fa-envelope text-[9px] text-slate-400"></i>' + m.email + '</span>' : ''
      ].filter(Boolean).join(' • ');

      html +=
        '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
        '<td class="col-m-name px-4 py-3">' +
        '<div class="flex items-center gap-3">' +
        getMemberInitialAvatar(m.name) +
        '<div>' +
        '<div class="flex items-center">' +
        '<span class="font-semibold text-slate-900 dark:text-white text-xs">' + (m.name || "Member") + '</span>' +
        getGenderChip(m.gender) +
        '</div>' +
        '<div class="text-[10px] text-slate-500 dark:text-slate-400 font-mono mt-0.5">' + m.id + ' • NID: ' + (m.nationalId || "-") + '</div>' +
        (contactLine ? '<div class="text-[10px] font-mono mt-0.5 text-slate-500 dark:text-slate-400">' + contactLine + '</div>' : '') +
        '</div>' +
        '</div>' +
        '</td>' +
        '<td class="col-m-savings px-4 py-3 text-right font-mono tabular-nums font-semibold text-slate-900 dark:text-white">' + formatMoney(m.savings) + '</td>' +
        '<td class="col-m-shares px-3 py-3 text-center">' +
        '<span class="badge-info font-mono tabular-nums">' + (m.sharesPercent || "0.00") + '%</span>' +
        '</td>' +
        '<td class="col-m-taken px-4 py-3 text-right font-mono tabular-nums ' + takenClass + '">' + (taken > 0 ? formatMoney(taken) : '—') + '</td>' +
        '<td class="col-m-balance px-4 py-3 text-right font-mono tabular-nums ' + balClass + '">' + (bal > 0 ? formatMoney(bal) : '—') + '</td>' +
        '<td class="col-m-guaranteed px-4 py-3 text-right font-mono tabular-nums ' + gtrClass + '">' + (guaranteed > 0 ? formatMoney(guaranteed) : '—') + '</td>' +
        '<td class="col-m-availguar px-4 py-3 text-right font-mono tabular-nums ' + availClass + '">' + formatMoney(availGuar) + '</td>' +
        '<td class="col-m-maxloan px-4 py-3 text-right font-mono tabular-nums ' + maxLoanClass + '">' + formatMoney(maxLoan) + '</td>' +
        '<td class="col-m-loanstatus px-3 py-3 text-center">' + getMemberLoanStatusBadge(m) + '</td>' +
        '<td class="col-m-accountstatus px-3 py-3 text-center">' + getUserAccountStatusBadge(m.status) + '</td>' +
        '<td class="col-m-actions px-3 py-3 text-center">' +
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button type="button" onclick="openPrintMemberStatement(\'' + m.id + '\')" title="Print Member Statement" class="text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-1"><i class="fas fa-print"></i></button>' +
        '<button type="button" onclick="openMemberEmailStatement(\'' + m.id + '\')" title="Email Monthly Statement" class="text-slate-400 hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors p-1"><i class="fas fa-envelope"></i></button>' +
        '<button type="button" onclick="openMemberWhatsAppStatement(\'' + m.id + '\')" title="Send WhatsApp Statement" class="text-slate-400 hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors p-1"><i class="fab fa-whatsapp"></i></button>' +
        '<button type="button" data-require-perm="membersWrite" onclick="openMemberModal(\'' + m.id + '\')" title="Edit Member Profile" class="text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors p-1 hidden"><i class="fas fa-pen"></i></button>' +
        '</div>' +
        '</td>' +
        '</tr>';
    });

    container.innerHTML = html;

    // Reapply saved hidden column preferences if any
    if (typeof applySavedColumnPreferences === "function") {
      applySavedColumnPreferences("member-table");
    }

    if (typeof applyRolePermissions === "function" && window.APP_PERMS) {
      applyRolePermissions(window.APP_PERMS);
    }
  }

  function renderMembersErrorRow(msg) {
    return (
      '<tr><td colspan="11" class="px-4 py-8">' +
        '<div class="max-w-md mx-auto p-5 rounded-xl bg-rose-50/70 border border-rose-200 text-center space-y-3">' +
          '<div class="w-10 h-10 mx-auto rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-sm">' +
            '<i class="fas fa-triangle-exclamation"></i>' +
          '</div>' +
          '<div>' +
            '<h4 class="text-xs font-bold text-rose-900">Unable to Load Members Registry</h4>' +
            '<p class="text-[11px] text-rose-700 mt-1">' + escapeMemberErrHtml(msg || "Failed to load members.") + '</p>' +
          '</div>' +
          '<button type="button" onclick="loadMembers(true)" class="min-h-[40px] inline-flex items-center gap-1.5 px-4 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors">' +
            '<i class="fas fa-arrows-rotate text-[11px]"></i> <span>Try Again</span>' +
          '</button>' +
        '</div>' +
      '</td></tr>'
    );
  }

  function escapeMemberErrHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function loadMembers(forceRefresh) {
    const container = document.getElementById("member-table-body");
    const cached = (!forceRefresh && typeof cacheGet === "function") ? cacheGet("members_list") : null;
    const hasCached = Array.isArray(cached) && cached.length > 0;

    if (hasCached) {
      currentMembers = cached;
      updateLoanStatusFilterOptions(currentMembers);
      filterMembersTable();
      if (typeof setHeaderSyncState === "function") {
        setHeaderSyncState("revalidating", "Syncing...");
      }
    } else {
      startAppLoader();
      if (container) {
        container.innerHTML =
          typeof renderTableSkeleton === "function"
            ? renderTableSkeleton(11, 6)
            : '<tr><td colspan="11" class="px-6 py-6 text-center text-slate-400">Loading members...</td></tr>';
      }
    }

    google.script.run
      .withSuccessHandler((response) => {
        if (!hasCached) stopAppLoader();
        if (!response || !response.success) {
          if (!hasCached && container) {
            container.innerHTML = renderMembersErrorRow((response && response.error) || "Failed to load members.");
          } else if (hasCached && typeof setHeaderSyncState === "function") {
            setHeaderSyncState("cached", "Cached");
          }
          return;
        }

        currentMembers = response.members || [];
        if (typeof cacheSet === "function") {
          cacheSet("members_list", currentMembers, 10 * 60 * 1000);
        }
        if (typeof setHeaderSyncState === "function") {
          setHeaderSyncState("synced");
        }
        updateLoanStatusFilterOptions(currentMembers);
        filterMembersTable();
      })
      .withFailureHandler((err) => {
        if (!hasCached) {
          stopAppLoader();
          const errMsg = err && err.message ? String(err.message) : "Unable to load members.";
          if (container) {
            container.innerHTML = renderMembersErrorRow(errMsg);
          }
          handleErr(err);
        } else {
          if (typeof setHeaderSyncState === "function") {
            setHeaderSyncState("cached", "Offline cache");
          }
          if (typeof showNotification === "function") {
            showNotification("Background sync failed — displaying cached members.", "warning", 3000);
          }
        }
      })
      .getMembersData(1, 1000);
  }

  function openMemberModal(memberId) {
    if (!window.APP_PERMS || !window.APP_PERMS.membersWrite) {
      showNotification("You do not have permission to add or edit members.", "warning");
      return;
    }
    const modal = document.getElementById("memberModal");
    const form = document.getElementById("memberForm");
    const title = document.getElementById("modalTitle");
    const statusWrap = document.getElementById("m-status-wrap");
    form.reset();
    document.getElementById("m-id").value = memberId || "";
    
    const joinedPicker = document.getElementById("m-joined") ? document.getElementById("m-joined")._flatpickr : null;
    if (joinedPicker) joinedPicker.setDate(new Date());
    else document.getElementById("m-joined").value = todayInputValue_();

    const dobPicker = document.getElementById("m-dob") ? document.getElementById("m-dob")._flatpickr : null;
    if (dobPicker) dobPicker.clear();

    const phoneInput = document.getElementById("m-phone");
    if (phoneInput) phoneInput.value = "";
    const emailInput = document.getElementById("m-email");
    if (emailInput) emailInput.value = "";

    setShadcnSelectValue("select-gender-wrapper", "");
    setShadcnSelectValue("select-status-wrapper", "Pending");
    if (statusWrap) statusWrap.classList.add("hidden");

    if (memberId) {
      title.innerText = "Edit Member Profile";
      if (statusWrap) statusWrap.classList.remove("hidden");
      const member = currentMembers.find((m) => m.id === memberId);
      if (member) {
        const fullName = (member.fullName || "").trim().split(/\s+/);
        document.getElementById("m-first").value = fullName[0] || "";
        document.getElementById("m-middle").value = fullName.length > 2 ? fullName.slice(1, -1).join(" ") : "";
        document.getElementById("m-last").value = fullName.length > 1 ? fullName[fullName.length - 1] : "";
        document.getElementById("m-nid").value = member.nationalId || "";
        if (phoneInput) phoneInput.value = member.phone || "";
        if (emailInput) emailInput.value = member.email || "";
        setShadcnSelectValue("select-gender-wrapper", member.gender || "");
        
        if (dobPicker && member.dobIso) dobPicker.setDate(member.dobIso);
        else document.getElementById("m-dob").value = member.dobIso || "";

        if (joinedPicker && member.registrationDateIso) joinedPicker.setDate(member.registrationDateIso);
        else document.getElementById("m-joined").value = member.registrationDateIso || todayInputValue_();

        setShadcnSelectValue("select-status-wrapper", member.status || "Active");
      }
    } else {
      title.innerText = "New Member Registration";
    }

    modal.classList.remove("hidden");
  }

  function closeMemberModal() {
    document.getElementById("memberModal").classList.add("hidden");
  }

  function todayInputValue_() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    return yyyy + "-" + mm + "-" + dd;
  }

  document.getElementById("memberForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const btn = e.submitter;
    btn.disabled = true;
    btn.innerText = "Processing...";

    const payload = {
      memberId: document.getElementById("m-id").value,
      id: document.getElementById("m-id").value,
      firstName: document.getElementById("m-first").value,
      middleName: document.getElementById("m-middle").value,
      lastName: document.getElementById("m-last").value,
      nationalId: document.getElementById("m-nid").value,
      phone: document.getElementById("m-phone") ? document.getElementById("m-phone").value : "",
      email: document.getElementById("m-email") ? document.getElementById("m-email").value : "",
      gender: document.getElementById("m-gender").value,
      dob: document.getElementById("m-dob").value,
      registrationDate: document.getElementById("m-joined").value,
      status: document.getElementById("m-status").value,
    };

    google.script.run
      .withSuccessHandler(function () {
        btn.disabled = false;
        btn.innerText = "Save Member Profile";
        if (typeof cacheClear === "function") {
          cacheClear("members_list");
          cacheClear("home_analytics");
          cacheClear("personal_financials");
        }
        closeMemberModal();
        loadMembers(true);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.innerText = "Try Again";
        handleErr(err);
      })
      .saveMember(payload);
  });

  async function openMemberEmailStatement(memberId) {
    const confirmed = await showConfirmDialog({
      title: "Email Certified Statement",
      message: "Send the certified monthly statement to member " + memberId + " via email?",
      confirmText: "Send Email",
      confirmClass: "bg-emerald-600 hover:bg-emerald-700 text-white",
      iconType: "info"
    });
    if (!confirmed) return;
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (res && res.success && res.emailSent) {
          showNotification("Statement successfully emailed to " + (res.recipientEmail || memberId), "success");
        } else if (res && res.emailError) {
          showNotification("Email could not be delivered: " + res.emailError, "error", 6000);
        } else {
          showNotification((res && res.error) || "Failed to send email statement.", "error", 5000);
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .sendMemberMonthlyStatement({ memberId: memberId, sendEmail: true });
  }

  function openMemberWhatsAppStatement(memberId) {
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (res && res.whatsAppUrl) {
          window.open(res.whatsAppUrl, "_blank");
        } else {
          showNotification("Member does not have a valid phone number. Please update their phone in profile.", "warning", 5000);
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .sendMemberMonthlyStatement({ memberId: memberId, sendEmail: false });
  }
</script>
