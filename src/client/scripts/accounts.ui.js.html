<script>
/**
 * Bank Accounts & Financial Auto-Reconciliation UI Controller
 * Brightlife Dashboard
 */

const accountsState = {
  accounts: [],
  reconciliation: null,
  activeTab: "reconciliation"
};

function formatKsh(val) {
  const num = Number(val) || 0;
  return "KES " + Math.round(num).toLocaleString();
}

function maskAccountNumber(value) {
  const clean = String(value || "").trim();
  if (!clean) return "—";
  if (clean.length <= 4) return clean;
  const tail = clean.slice(-4);
  return "•••• " + tail;
}

function copyTextToClipboard(text, btnElement) {
  if (!text) return;
  if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      if (btnElement) {
        const orig = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fas fa-check text-emerald-600"></i> Copied';
        setTimeout(function () {
          btnElement.innerHTML = orig;
        }, 1500);
      }
    });
  } else {
    prompt("Copy account number:", text);
  }
}

function switchAccountsTab(tabName) {
  accountsState.activeTab = tabName;

  const btnRecon = document.getElementById("tab-btn-reconciliation");
  const btnGuides = document.getElementById("tab-btn-guides");

  const paneRecon = document.getElementById("accounts-reconciliation-pane");
  const paneGuides = document.getElementById("accounts-guides-pane");

  [btnRecon, btnGuides].forEach(function (btn) {
    if (btn) {
      btn.className = "pb-3 text-xs font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 flex items-center gap-2 transition-colors";
    }
  });

  if (paneRecon) paneRecon.classList.add("hidden");
  if (paneGuides) paneGuides.classList.add("hidden");

  if (tabName === "reconciliation") {
    if (btnRecon) btnRecon.className = "pb-3 text-xs font-semibold border-b-2 border-sky-600 text-sky-600 flex items-center gap-2 transition-colors";
    if (paneRecon) paneRecon.classList.remove("hidden");
  } else if (tabName === "guides") {
    if (btnGuides) btnGuides.className = "pb-3 text-xs font-semibold border-b-2 border-sky-600 text-sky-600 flex items-center gap-2 transition-colors";
    if (paneGuides) paneGuides.classList.remove("hidden");
  }
}

function paymentGuideHtml(account) {
  const channel = (account.channel || account.type || "").toLowerCase();
  const accNum = account.accountNumber || "—";
  const accName = account.accountName || "Brightlife Group";
  const instructions = account.instructions || "";

  let badge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-700">Bank</span>';
  let icon = '<i class="fas fa-building-columns text-sky-600"></i>';

  if (channel.indexOf("mpesa") !== -1 || channel.indexOf("paybill") !== -1 || channel.indexOf("till") !== -1) {
    badge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-100">M-Pesa</span>';
    icon = '<i class="fas fa-mobile-screen text-emerald-600"></i>';
  } else if (channel.indexOf("cash") !== -1 || channel.indexOf("petty") !== -1) {
    badge = '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-50 text-amber-700 border border-amber-100">Cash</span>';
    icon = '<i class="fas fa-coins text-amber-600"></i>';
  }

  return (
    '<div class="bg-white rounded-xl border border-slate-200/80 p-4 shadow-sm hover:shadow-md transition-shadow space-y-3">' +
      '<div class="flex items-center justify-between">' +
        '<div class="flex items-center gap-2.5">' +
          '<div class="w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center text-sm">' + icon + '</div>' +
          '<div>' +
            '<h4 class="font-bold text-slate-900 text-xs">' + (account.name || "Account") + '</h4>' +
            '<p class="text-[10px] text-slate-400">' + accName + '</p>' +
          '</div>' +
        '</div>' +
        badge +
      '</div>' +
      '<div class="p-2.5 bg-slate-50/70 rounded-lg border border-slate-100 space-y-1">' +
        '<div class="flex items-center justify-between text-xs">' +
          '<span class="text-slate-500 text-[11px]">Account / Till / Paybill:</span>' +
          '<div class="flex items-center gap-1.5 font-mono font-bold text-slate-800">' +
            '<span>' + accNum + '</span>' +
            '<button type="button" onclick="copyTextToClipboard(\'' + accNum + '\', this)" class="text-[10px] text-sky-600 hover:text-sky-700 p-0.5" title="Copy">' +
              '<i class="fas fa-copy"></i>' +
            '</button>' +
          '</div>' +
        '</div>' +
        (instructions ? '<p class="text-[10px] text-slate-500 pt-1 border-t border-slate-200/50">' + instructions + '</p>' : '') +
      '</div>' +
    '</div>'
  );
}

function renderPaymentGuideCards(rows) {
  const container = document.getElementById("accounts-card-list");
  if (!container) return;
  if (!rows || !rows.length) {
    container.innerHTML = '<div class="col-span-full p-6 text-center text-slate-400 text-xs">No active payment accounts listed.</div>';
    return;
  }
  container.innerHTML = rows.map(paymentGuideHtml).join("");
}

function renderReconciliationDashboard(data) {
  if (!data) return;

  const s = data.summary || {};
  const rows = data.rows || [];

  const elPhys = document.getElementById("kpi-physical-bank-total");
  const elBook = document.getElementById("kpi-system-book-total");
  const elVar = document.getElementById("kpi-global-variance");
  const elVarStat = document.getElementById("kpi-variance-status");
  const elVarIcon = document.getElementById("kpi-variance-icon");
  const elAssets = document.getElementById("kpi-total-assets");
  const badge = document.getElementById("reconcile-global-badge");

  if (elPhys) elPhys.textContent = formatKsh(s.totalPhysicalBankCash);
  if (elBook) elBook.textContent = formatKsh(s.totalSystemBookCash);
  if (elAssets) elAssets.textContent = formatKsh(s.totalGroupAssets);

  if (elVar) {
    elVar.textContent = formatKsh(Math.abs(s.netVariance));
    if (s.isBalanced) {
      elVar.className = "text-lg sm:text-xl font-extrabold text-emerald-600 mt-2";
      if (elVarStat) {
        elVarStat.textContent = "✓ Reconciled & Balanced (0 Variance)";
        elVarStat.className = "text-[11px] mt-1 font-semibold text-emerald-600";
      }
      if (elVarIcon) elVarIcon.className = "w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs";
      if (badge) {
        badge.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200";
        badge.textContent = "Accounts Balanced";
        badge.classList.remove("hidden");
      }
    } else {
      const isPositive = s.netVariance > 0;
      elVar.className = "text-lg sm:text-xl font-extrabold text-rose-600 mt-2";
      if (elVarStat) {
        elVarStat.textContent = isPositive ? "Physical Bank exceeds System Ledger" : "System Ledger exceeds Physical Bank";
        elVarStat.className = "text-[11px] mt-1 font-semibold text-rose-600";
      }
      if (elVarIcon) elVarIcon.className = "w-7 h-7 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xs";
      if (badge) {
        badge.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200";
        badge.textContent = "Variance Detected";
        badge.classList.remove("hidden");
      }
    }
  }

  const tbody = document.getElementById("reconciliation-table-body");
  if (!tbody) return;

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="py-6 text-center text-slate-400 font-sans">No accounts configured for reconciliation.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(function (row) {
    const isBalanced = row.isBalanced;
    const varClass = isBalanced ? "text-slate-400 font-normal" : (row.variance > 0 ? "text-emerald-600 font-bold" : "text-rose-600 font-bold");
    const statusPill = isBalanced
      ? '<span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-semibold">Matched</span>'
      : '<span class="px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-[10px] font-semibold">Variance</span>';

    const accRowJson = escapeHtmlAttr(JSON.stringify(row));

    return (
      '<tr class="hover:bg-slate-50/70 transition-colors">' +
      '  <td class="py-3 px-4 font-sans">' +
      '    <div class="font-bold text-slate-900 text-xs">' + row.name + '</div>' +
      '    <div class="text-[10px] text-slate-400">' + (row.institution || "—") + '</div>' +
      '  </td>' +
      '  <td class="py-3 px-4 font-sans"><span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-medium">' + row.type + '</span></td>' +
      '  <td class="py-3 px-4 text-slate-600">' + (row.accountNumber || "—") + '</td>' +
      '  <td class="py-3 px-4 text-right font-medium text-slate-900">' + formatKsh(row.physicalBalance) + '</td>' +
      '  <td class="py-3 px-4 text-right text-slate-700">' + formatKsh(row.systemBalance) + '</td>' +
      '  <td class="py-3 px-4 text-right ' + varClass + '">' + (row.variance !== 0 ? formatKsh(row.variance) : "0.00") + '</td>' +
      '  <td class="py-3 px-4 text-center font-sans">' + statusPill + '</td>' +
      '  <td class="py-3 px-4 text-center font-sans text-[10px] text-slate-500">' + (row.statementDate || "—") + '</td>' +
      '  <td class="py-3 px-4 text-center font-sans">' +
      '    <button type="button" onclick="openReconcileModal(' + accRowJson + ')"' +
      '      class="inline-flex items-center gap-1 px-2.5 py-1 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-md text-[11px] font-medium transition-colors">' +
      '      <i class="fas fa-file-pen text-[10px]"></i> <span>Reconcile</span>' +
      '    </button>' +
      '  </td>' +
      '</tr>'
    );
  }).join("");
}

function loadAccounts() {
  startAppLoader();
  google.script.run
    .withSuccessHandler(function (response) {
      stopAppLoader();
      if (!response) {
        showNotification("No account data received.", "error");
        return;
      }

      const rows = response.rows || response.accounts || [];
      accountsState.accounts = rows;
      renderPaymentGuideCards(rows);

      const perms = window.APP_PERMS || (window.currentUser && window.currentUser.permissions) || {};
      const roleKey = (window.currentUser && (window.currentUser.roleKey || window.currentUser.role)) || (typeof session !== "undefined" && (session.roleKey || session.role)) || "";
      const isAdminOrTreasurer =
        response.canReconcile === true ||
        perms.accountsWrite === true ||
        perms.isAdmin === true ||
        roleKey === "admin" ||
        roleKey === "treasurer";
      const tabs = document.getElementById("accounts-admin-tabs");

      if (isAdminOrTreasurer) {
        if (tabs) tabs.classList.remove("hidden");
        switchAccountsTab(accountsState.activeTab || "reconciliation");

        // Fetch auto-reconciliation data
        google.script.run
          .withSuccessHandler(function (recData) {
            accountsState.reconciliation = recData;
            renderReconciliationDashboard(recData);
          })
          .withFailureHandler(function (err) {
            console.error("Auto-reconciliation error:", err);
          })
          .getAccountsReconciliationData();
      } else {
        if (tabs) tabs.classList.add("hidden");
        switchAccountsTab("guides");
      }
    })
    .withFailureHandler(function (err) {
      stopAppLoader();
      handleErr(err);
    })
    .getAccountsData();
}

function openReconcileModal(acc) {
  if (!acc) return;
  const modal = document.getElementById("reconcile-modal");
  if (!modal) return;

  document.getElementById("modal-account-name").textContent = acc.name + " (" + (acc.institution || acc.type) + ")";
  document.getElementById("modal-account-num").textContent = acc.accountNumber || "—";
  document.getElementById("modal-system-bal").textContent = formatKsh(acc.systemBalance);
  document.getElementById("modal-statement-bal").value = acc.physicalBalance || "";
  document.getElementById("modal-row-number").value = acc.rowNumber || "";
  document.getElementById("modal-statement-date").value = acc.statementDate || new Date().toISOString().split("T")[0];
  document.getElementById("modal-notes").value = acc.reconciledNotes || "";

  modal.classList.remove("hidden");
}

function closeReconcileModal() {
  const modal = document.getElementById("reconcile-modal");
  if (modal) modal.classList.add("hidden");
}

function submitReconcileForm(event) {
  if (event) event.preventDefault();

  const rowNumber = document.getElementById("modal-row-number").value;
  const statementBal = document.getElementById("modal-statement-bal").value;
  const statementDate = document.getElementById("modal-statement-date").value;
  const notes = document.getElementById("modal-notes").value;

  if (!statementBal || !statementDate) {
    alert("Please provide both statement balance and statement date.");
    return;
  }

  const btn = document.getElementById("btn-save-reconcile");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Reconciliation</span>';
      }
      closeReconcileModal();

      if (res && res.success) {
        showNotification("Account statement balance updated successfully!", "success");
        loadAccounts();
      } else {
        alert((res && res.error) || "Failed to save reconciliation.");
      }
    })
    .withFailureHandler(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Reconciliation</span>';
      }
      handleErr(err);
    })
    .updateAccountStatementBalance({
      rowNumber: rowNumber,
      statementBalance: statementBal,
      statementDate: statementDate,
      notes: notes
    });
}
</script>
