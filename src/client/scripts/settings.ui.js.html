<script>
/**
 * Group Administration & Loan Policy Settings UI Controller
 * Brightlife SHG Dashboard
 */

const DEFAULT_LOAN_POLICY = {
  savingsMultiplier: 3,
  interestRatePct: 10,
  minGuarantors: 2,
  tenorTiers: [
    { maxAmount: 20000, maxMonths: 6 },
    { maxAmount: 100000, maxMonths: 12 },
    { maxAmount: 500000, maxMonths: 24 }
  ]
};

const loanPolicyState = {
  policy: JSON.parse(JSON.stringify(DEFAULT_LOAN_POLICY)),
  isSaving: false
};

const DEFAULT_COMM_SETTINGS = {
  autoEmailReceipts: true,
  autoMonthlyStatements: false,
  autoStatementDay: 1,
  notificationBcc: "",
  lastAutoDispatchMonth: "",
  lastAutoDispatchTimestamp: "",
  lastAutoDispatchCount: 0
};

const commSettingsState = {
  settings: JSON.parse(JSON.stringify(DEFAULT_COMM_SETTINGS)),
  isLoading: false,
  isSaving: false
};

const DEFAULT_AUDIT_SETTINGS = {
  retentionDays: 365,
  isInfinite: false
};

const auditIntegrityState = {
  status: null,
  retentionDays: 365,
  lastVerifiedHash: "",
  isLoading: false,
  isVerifying: false,
  isSaving: false
};

function normalizeAuditRetentionSettings_(raw) {
  const src = raw && typeof raw === "object" ? raw : {};
  const days = parseInt(src.retentionDays !== undefined ? src.retentionDays : src, 10);
  const resolvedDays = !isNaN(days) && days >= 0 ? days : 365;
  return {
    retentionDays: resolvedDays,
    isInfinite: resolvedDays === 0
  };
}

function normalizeNotificationSettings_(raw) {
  const src = raw && typeof raw === "object" ? raw : {};
  const day = parseInt(src.autoStatementDay, 10);
  const count = parseInt(src.lastAutoDispatchCount, 10);
  return {
    autoEmailReceipts: src.autoEmailReceipts === undefined ? true : Boolean(src.autoEmailReceipts),
    autoMonthlyStatements: Boolean(src.autoMonthlyStatements),
    autoStatementDay: !isNaN(day) && day >= 1 && day <= 28 ? day : 1,
    notificationBcc: String(src.notificationBcc || "").trim(),
    lastAutoDispatchMonth: String(src.lastAutoDispatchMonth || "").trim(),
    lastAutoDispatchTimestamp: String(src.lastAutoDispatchTimestamp || "").trim(),
    lastAutoDispatchCount: !isNaN(count) && count >= 0 ? count : 0
  };
}

function normalizeLoanPolicy_(raw) {
  const src = raw && typeof raw === "object" ? raw : {};
  const rawMult = src.borrowerMultiplier !== undefined ? src.borrowerMultiplier : src.savingsMultiplier;
  const mult = Number(rawMult);
  const resolvedMult = Number.isFinite(mult) && mult > 0 ? mult : DEFAULT_LOAN_POLICY.savingsMultiplier;
  const rate = Number(src.interestRatePct);
  const guar = Number(src.minGuarantors);
  const tiers = Array.isArray(src.tenorTiers) && src.tenorTiers.length > 0
    ? src.tenorTiers.map(function (t) {
        return {
          maxAmount: Math.max(1, Number(t && t.maxAmount) || 0),
          maxMonths: Math.max(1, Math.round(Number(t && t.maxMonths) || 1))
        };
      })
    : JSON.parse(JSON.stringify(DEFAULT_LOAN_POLICY.tenorTiers));

  return {
    borrowerMultiplier: resolvedMult,
    savingsMultiplier: resolvedMult,
    interestRatePct: Number.isFinite(rate) && rate >= 0 ? rate : DEFAULT_LOAN_POLICY.interestRatePct,
    minGuarantors: Number.isFinite(guar) && guar >= 0 ? Math.round(guar) : DEFAULT_LOAN_POLICY.minGuarantors,
    tenorTiers: tiers
  };
}

function loadLoanPolicySettings(forceRefresh) {
  loadCommunicationSettings(forceRefresh);
  loadAuditIntegrityStatus(forceRefresh);
  const cacheKey = "loan_policy_settings";
  const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
  const cached = entry ? entry.data : null;
  const hasCached = Boolean(cached);
  const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

  if (hasCached) {
    populateLoanPolicyForm_(cached);
    if (isFresh) {
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Cached");
      return;
    }
    if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Syncing...");
  } else {
    populateLoanPolicyForm_(DEFAULT_LOAN_POLICY);
    if (typeof startAppLoader === "function") startAppLoader();
    if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Loading...");
  }

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    if (!hasCached && typeof stopAppLoader === "function") stopAppLoader();
    return;
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!hasCached && typeof stopAppLoader === "function") stopAppLoader();
      if (!res || res.ok === false || res.success === false) {
        if (typeof setHeaderSyncState === "function") {
          setHeaderSyncState("cached", hasCached ? "Offline cache" : "Sync error");
        }
        if (!hasCached && typeof showNotification === "function") {
          showNotification("Failed to load loan policy: " + ((res && res.error) || "Unknown error"), "error", 5000);
        }
        return;
      }
      const settings = res.settings || res.policy || {};
      const normalized = normalizeLoanPolicy_(settings);
      if (typeof cacheSet === "function") {
        cacheSet(cacheKey, normalized, 5 * 60 * 1000);
      }
      populateLoanPolicyForm_(normalized);
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("synced");
    })
    .withFailureHandler(function (err) {
      if (!hasCached && typeof stopAppLoader === "function") stopAppLoader();
      if (typeof setHeaderSyncState === "function") {
        setHeaderSyncState("cached", hasCached ? "Offline cache" : "Default policy");
      }
      if (!hasCached && typeof handleErr === "function") {
        handleErr(err);
      }
    })
    .getLoanPolicySettings();
}

function populateLoanPolicyForm_(rawPolicy) {
  const p = normalizeLoanPolicy_(rawPolicy);
  loanPolicyState.policy = p;

  const multEl = document.getElementById("policy-savings-multiplier");
  const rateEl = document.getElementById("policy-interest-rate");
  const guarEl = document.getElementById("policy-min-guarantors");

  if (multEl) multEl.value = String(p.savingsMultiplier);
  if (rateEl) rateEl.value = String(p.interestRatePct);
  if (guarEl) guarEl.value = String(p.minGuarantors);

  renderLoanTenorTiers_();
  updateLoanPolicyPreviews();
}

function loadCommunicationSettings(forceRefresh) {
  const cacheKey = "notification_settings";
  const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
  const cached = entry ? entry.data : null;
  const hasCached = Boolean(cached);
  const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

  if (hasCached) {
    populateCommunicationSettingsForm_(cached);
    if (isFresh) return;
  } else {
    populateCommunicationSettingsForm_(DEFAULT_COMM_SETTINGS);
  }

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    return;
  }

  commSettingsState.isLoading = true;
  google.script.run
    .withSuccessHandler(function (res) {
      commSettingsState.isLoading = false;
      const rawSettings = (res && res.settings) ? res.settings : res;
      if (rawSettings && typeof rawSettings === "object") {
        const normalized = normalizeNotificationSettings_(rawSettings);
        if (typeof cacheSet === "function") {
          cacheSet(cacheKey, normalized, 5 * 60 * 1000);
        }
        populateCommunicationSettingsForm_(normalized);
      }
    })
    .withFailureHandler(function (err) {
      commSettingsState.isLoading = false;
      console.warn("Could not load communication settings:", err);
    })
    .getNotificationSettings();
}

function populateCommunicationSettingsForm_(rawSettings) {
  const s = normalizeNotificationSettings_(rawSettings);
  commSettingsState.settings = s;

  const chkMonthly = document.getElementById("comm-auto-monthly-statements");
  const inpDay = document.getElementById("comm-auto-statement-day");
  const chkReceipts = document.getElementById("comm-auto-email-receipts");
  const inpBcc = document.getElementById("comm-notification-bcc");

  if (chkMonthly) chkMonthly.checked = Boolean(s.autoMonthlyStatements);
  if (inpDay) inpDay.value = String(s.autoStatementDay || 1);
  if (chkReceipts) chkReceipts.checked = Boolean(s.autoEmailReceipts);
  if (inpBcc) inpBcc.value = s.notificationBcc || "";

  const pillEl = document.getElementById("comm-policy-status-pill");
  const activeTextEl = document.getElementById("comm-active-state-text");
  const monthEl = document.getElementById("comm-last-month-text");
  const tsEl = document.getElementById("comm-last-timestamp-text");
  const countEl = document.getElementById("comm-last-count-text");

  if (pillEl) {
    if (s.autoMonthlyStatements) {
      pillEl.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30";
      pillEl.innerHTML = '<i class="fas fa-check-circle mr-1 text-[9px]"></i> ACTIVE (DAY ' + (s.autoStatementDay || 1) + ')';
    } else {
      pillEl.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700";
      pillEl.innerHTML = '<i class="fas fa-pause-circle mr-1 text-[9px]"></i> DISABLED';
    }
  }

  if (activeTextEl) {
    if (s.autoMonthlyStatements) {
      activeTextEl.className = "font-bold text-emerald-700 dark:text-emerald-400";
      activeTextEl.textContent = "Active (Day " + (s.autoStatementDay || 1) + " at 08:00 EAT)";
    } else {
      activeTextEl.className = "font-semibold text-slate-500 dark:text-slate-400";
      activeTextEl.textContent = "Disabled (Off)";
    }
  }

  if (monthEl) {
    monthEl.textContent = s.lastAutoDispatchMonth ? s.lastAutoDispatchMonth : "None";
  }

  if (tsEl) {
    tsEl.textContent = s.lastAutoDispatchTimestamp ? s.lastAutoDispatchTimestamp : "Never";
  }

  if (countEl) {
    countEl.textContent = (s.lastAutoDispatchCount || 0) + " sent";
  }
}

function syncCommActiveBadge_() {
  const chkMonthly = document.getElementById("comm-auto-monthly-statements");
  const inpDay = document.getElementById("comm-auto-statement-day");
  const pillEl = document.getElementById("comm-policy-status-pill");
  const activeTextEl = document.getElementById("comm-active-state-text");
  const isChecked = Boolean(chkMonthly && chkMonthly.checked);
  const day = (inpDay && parseInt(inpDay.value, 10)) || 1;

  if (pillEl) {
    if (isChecked) {
      pillEl.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-blue-50 dark:bg-blue-500/15 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-500/30";
      pillEl.innerHTML = '<i class="fas fa-circle-dot mr-1 text-[9px]"></i> ENABLED (UNSAVED)';
    } else {
      pillEl.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700";
      pillEl.innerHTML = '<i class="fas fa-pause-circle mr-1 text-[9px]"></i> DISABLED';
    }
  }

  if (activeTextEl) {
    if (isChecked) {
      activeTextEl.className = "font-bold text-blue-700 dark:text-blue-400";
      activeTextEl.textContent = "Scheduled (Day " + day + " at 08:00 EAT)";
    } else {
      activeTextEl.className = "font-semibold text-slate-500 dark:text-slate-400";
      activeTextEl.textContent = "Disabled (Off)";
    }
  }
}

async function triggerSettingsAutoDispatchNow() {
  let confirmed = false;
  if (typeof showConfirmDialog === "function") {
    confirmed = await showConfirmDialog({
      title: "Dispatch Automated Monthly Statements",
      message: "Are you sure you want to trigger automated statement dispatch now for all active members with email?",
      confirmText: "Dispatch Now",
      iconType: "info"
    });
  } else {
    confirmed = confirm("Are you sure you want to trigger automated statement dispatch now for all active members?");
  }

  if (!confirmed) return;

  const btn = document.getElementById("btn-dispatch-test-statements");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> <span>Dispatching...</span>';
  }

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane text-blue-600 dark:text-blue-400 text-xs"></i> <span>Dispatch Test / Run Now</span>';
    }
    if (typeof showNotification === "function") {
      showNotification("Google Apps Script environment not detected.", "warning");
    }
    return;
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane text-blue-600 dark:text-blue-400 text-xs"></i> <span>Dispatch Test / Run Now</span>';
      }

      if (res && res.success) {
        if (typeof showNotification === "function") {
          showNotification("Dispatched statements to " + (res.sent || 0) + " members (" + (res.skippedNoEmail || 0) + " skipped, no email).", "success", 7000);
        }
        if (typeof cacheClear === "function") {
          cacheClear("statements_overview_");
          cacheClear("notification_settings");
        }
        loadCommunicationSettings(true);
      } else if (res && res.skipped) {
        if (typeof showNotification === "function") {
          showNotification("Dispatch skipped: " + (res.reason || "Already sent for this month"), "info", 6000);
        }
      } else {
        const err = (res && res.error) || "Failed to dispatch automated statements.";
        if (typeof showNotification === "function") {
          showNotification(err, "error", 7000);
        }
      }
    })
    .withFailureHandler(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane text-blue-600 dark:text-blue-400 text-xs"></i> <span>Dispatch Test / Run Now</span>';
      }
      if (typeof handleErr === "function") {
        handleErr(err);
      } else if (typeof showNotification === "function") {
        showNotification("Dispatch failed: " + ((err && err.message) || err), "error", 7000);
      }
    })
    .dispatchAutomatedMonthlyStatementsNow(true);
}

function loadAuditIntegrityStatus(forceRefresh) {
  const cacheKey = "audit_integrity_status";
  const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
  const cached = entry ? entry.data : null;
  const hasCached = Boolean(cached);
  const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

  if (hasCached) {
    updateAuditIntegrityUI_(cached);
    if (isFresh) return;
  }

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    return;
  }

  auditIntegrityState.isLoading = true;

  // 1. Fetch Audit Integrity Status
  google.script.run
    .withSuccessHandler(function (res) {
      auditIntegrityState.isLoading = false;
      if (res && res.success) {
        if (typeof cacheSet === "function") {
          cacheSet(cacheKey, res, 60 * 1000);
        }
        updateAuditIntegrityUI_(res);
      }
    })
    .withFailureHandler(function (err) {
      auditIntegrityState.isLoading = false;
      console.warn("Could not load audit integrity status:", err);
    })
    .getAuditIntegrityStatus(Boolean(forceRefresh));

  // 2. Fetch Audit Retention Settings
  google.script.run
    .withSuccessHandler(function (res) {
      const norm = normalizeAuditRetentionSettings_(res);
      auditIntegrityState.retentionDays = norm.retentionDays;
      const daysEl = document.getElementById("audit-retention-days");
      if (daysEl) daysEl.value = String(norm.retentionDays);
    })
    .withFailureHandler(function (err) {
      console.warn("Could not load audit retention settings:", err);
    })
    .getAuditRetentionSettings();
}

function updateAuditIntegrityUI_(status) {
  if (!status || typeof status !== "object") return;
  auditIntegrityState.status = status;

  const isValid = Boolean(status.isValid && (!status.tamperedCount || status.tamperedCount === 0));
  const totalEntries = Number(status.totalEntries) || 0;
  const tamperedCount = Number(status.tamperedCount) || (Array.isArray(status.tamperedRows) ? status.tamperedRows.length : 0);
  const lastHash = String(status.lastVerifiedHash || status.genesisHash || "").trim();
  const checkedAt = status.checkedAt ? String(status.checkedAt) : new Date().toLocaleString();

  auditIntegrityState.lastVerifiedHash = lastHash;

  const pillEl = document.getElementById("audit-integrity-status-pill");
  const liveBadgeEl = document.getElementById("audit-live-status-badge");
  const totalEl = document.getElementById("audit-total-sealed-rows");
  const hashEl = document.getElementById("audit-last-hash");
  const timeEl = document.getElementById("audit-last-verified-at");
  const alertBox = document.getElementById("audit-tamper-alert-box");
  const anomaliesList = document.getElementById("audit-tamper-anomalies-list");

  if (pillEl) {
    if (isValid) {
      pillEl.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30";
      pillEl.innerHTML = '<i class="fas fa-shield-halved mr-1 text-[9px]"></i> IMMUTABLE &amp; VERIFIED';
    } else {
      pillEl.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full bg-rose-50 dark:bg-rose-500/15 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-500/30 animate-pulse";
      pillEl.innerHTML = '<i class="fas fa-triangle-exclamation mr-1 text-[9px]"></i> TAMPER DETECTED';
    }
  }

  if (liveBadgeEl) {
    if (isValid) {
      liveBadgeEl.className = "font-bold text-emerald-700 dark:text-emerald-400";
      liveBadgeEl.textContent = "IMMUTABLE & VERIFIED";
    } else {
      liveBadgeEl.className = "font-bold text-rose-600 dark:text-rose-400";
      liveBadgeEl.textContent = "TAMPER DETECTED (" + tamperedCount + " anomalies)";
    }
  }

  if (totalEl) {
    totalEl.textContent = totalEntries.toLocaleString();
  }

  if (hashEl) {
    if (lastHash) {
      hashEl.title = "SHA-256 Seal Hash: " + lastHash;
      if (lastHash.length > 16) {
        hashEl.textContent = lastHash.substring(0, 6) + "..." + lastHash.substring(lastHash.length - 6);
      } else {
        hashEl.textContent = lastHash;
      }
    } else {
      hashEl.textContent = "None";
      hashEl.title = "No audit seal records found";
    }
  }

  if (timeEl) {
    timeEl.textContent = checkedAt;
  }

  if (alertBox) {
    if (!isValid && tamperedCount > 0) {
      alertBox.classList.remove("hidden");
      if (anomaliesList) {
        const rows = Array.isArray(status.tamperedRows) ? status.tamperedRows : [];
        if (rows.length === 0) {
          anomaliesList.innerHTML = '<div class="py-1">Tampered records detected but individual row indices could not be resolved.</div>';
        } else {
          anomaliesList.innerHTML = rows.map(function (row) {
            const rowNum = typeof row === "object" && row !== null ? (row.row || row.rowNumber || JSON.stringify(row)) : String(row);
            const reason = typeof row === "object" && row !== null && row.reason ? (": " + String(row.reason)) : "";
            const safeRow = String(rowNum).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            const safeReason = String(reason).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            return '<div class="flex items-center gap-2"><i class="fas fa-xmark text-rose-500"></i><span>Row ' + safeRow + safeReason + '</span></div>';
          }).join("");
        }
      }
    } else {
      alertBox.classList.add("hidden");
      if (anomaliesList) anomaliesList.innerHTML = "";
    }
  }
}

function copyAuditLastHash_() {
  const hash = auditIntegrityState.lastVerifiedHash;
  if (!hash) {
    if (typeof showNotification === "function") {
      showNotification("No seal hash available to copy.", "info");
    }
    return;
  }
  if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(hash).then(function () {
      if (typeof showNotification === "function") {
        showNotification("SHA-256 seal hash copied to clipboard.", "success");
      }
    }).catch(function () {
      fallbackCopyText_(hash);
    });
  } else {
    fallbackCopyText_(hash);
  }
}

function fallbackCopyText_(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    if (typeof showNotification === "function") {
      showNotification("SHA-256 seal hash copied to clipboard.", "success");
    }
  } catch (e) {
    if (typeof showNotification === "function") {
      showNotification("Unable to copy hash automatically: " + text, "warning");
    }
  }
}

function runManualAuditIntegrityVerification() {
  if (auditIntegrityState.isVerifying) return;

  const btn = document.getElementById("btn-verify-audit-integrity");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> <span>Verifying Ledger...</span>';
  }

  auditIntegrityState.isVerifying = true;

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    auditIntegrityState.isVerifying = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-shield-halved text-emerald-600 dark:text-emerald-400 text-xs"></i> <span>Verify Ledger Integrity Now</span>';
    }
    if (typeof showNotification === "function") {
      showNotification("Google Apps Script environment not detected.", "warning");
    }
    return;
  }

  google.script.run
    .withSuccessHandler(function (res) {
      auditIntegrityState.isVerifying = false;
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-shield-halved text-emerald-600 dark:text-emerald-400 text-xs"></i> <span>Verify Ledger Integrity Now</span>';
      }

      if (res && res.success) {
        if (typeof cacheSet === "function") {
          cacheSet("audit_integrity_status", res, 60 * 1000);
        }
        updateAuditIntegrityUI_(res);

        if (res.isValid) {
          const verified = res.verifiedEntries !== undefined ? res.verifiedEntries : (res.totalEntries || 0);
          if (typeof showNotification === "function") {
            showNotification("Ledger verification complete: " + verified + " entries cryptographically verified with 0 anomalies.", "success", 6000);
          }
        } else {
          const count = res.tamperedCount || (res.tamperedRows ? res.tamperedRows.length : 1);
          if (typeof showNotification === "function") {
            showNotification("Audit ledger integrity check failed: " + count + " tampered row(s) detected!", "error", 8000);
          }
        }
      } else {
        const err = (res && res.error) || "Integrity verification failed.";
        if (typeof showNotification === "function") {
          showNotification(err, "error", 7000);
        }
      }
    })
    .withFailureHandler(function (err) {
      auditIntegrityState.isVerifying = false;
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-shield-halved text-emerald-600 dark:text-emerald-400 text-xs"></i> <span>Verify Ledger Integrity Now</span>';
      }
      if (typeof handleErr === "function") {
        handleErr(err);
      } else if (typeof showNotification === "function") {
        showNotification("Verification scan error: " + ((err && err.message) || err), "error", 7000);
      }
    })
    .verifyLedgerIntegrity();
}

function syncMultiplierPresetButtons_(val) {
  const baseCls = "min-h-[38px] px-3 py-1.5 rounded-lg text-xs font-mono tabular-nums border transition-colors ";
  const activeCls = "font-semibold bg-slate-900 hover:bg-slate-800 text-white border-slate-900 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-950 dark:border-slate-100";
  const inactiveCls = "font-medium bg-white hover:bg-slate-50 text-slate-700 border-slate-200 dark:bg-slate-900 dark:hover:bg-slate-800 dark:text-slate-200 dark:border-slate-700";

  document.querySelectorAll("[data-multiplier-preset]").forEach(function (btn) {
    const presetVal = Number(btn.getAttribute("data-multiplier-preset"));
    const isActive = Math.abs(presetVal - Number(val)) < 0.001;
    btn.className = baseCls + (isActive ? activeCls : inactiveCls);
  });
}

function setSavingsMultiplierPreset(mult) {
  const multEl = document.getElementById("policy-savings-multiplier");
  if (multEl) multEl.value = String(mult);
  updateLoanPolicyPreviews();
}

function updateLoanPolicyPreviews() {
  const multEl = document.getElementById("policy-savings-multiplier");
  const rateEl = document.getElementById("policy-interest-rate");
  const maxLoanEl = document.getElementById("policy-preview-max-loan");
  const interestEl = document.getElementById("policy-preview-interest");

  const mult = Math.max(0, Number(multEl && multEl.value) || 0);
  const rate = Math.max(0, Number(rateEl && rateEl.value) || 0);

  syncMultiplierPresetButtons_(mult);

  if (maxLoanEl) {
    const sampleMax = Math.round(50000 * mult);
    maxLoanEl.textContent = "KES " + sampleMax.toLocaleString();
  }
  if (interestEl) {
    const sampleInterest = Math.round(100000 * (rate / 100));
    interestEl.textContent = "KES " + sampleInterest.toLocaleString();
  }
}

function renderLoanTenorTiers_() {
  const tbody = document.getElementById("policy-tenor-table-body");
  if (!tbody) return;
  const tiers = loanPolicyState.policy.tenorTiers || [];

  if (tiers.length === 0) {
    tbody.innerHTML =
      '<tr><td colspan="3" class="py-6 text-center text-slate-500 dark:text-slate-400">No tenor tiers configured. Click "Add Tier" to create one.</td></tr>';
    return;
  }

  tbody.innerHTML = tiers.map(function (tier, idx) {
    const isOnly = tiers.length <= 1;
    return (
      '<tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors">' +
        '<td class="py-2 px-3">' +
          '<input type="number" min="1" step="1000" value="' + Number(tier.maxAmount || 0) + '" ' +
            'onchange="updateLoanTenorTier(' + idx + ', \'maxAmount\', this.value)" ' +
            'aria-label="Loan ceiling amount in KES" ' +
            'class="min-h-[38px] w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg text-xs font-mono tabular-nums font-semibold outline-none focus:ring-2 focus:ring-slate-900/15 dark:focus:ring-slate-100/20" />' +
        '</td>' +
        '<td class="py-2 px-3">' +
          '<input type="number" min="1" max="120" step="1" value="' + Number(tier.maxMonths || 1) + '" ' +
            'onchange="updateLoanTenorTier(' + idx + ', \'maxMonths\', this.value)" ' +
            'aria-label="Maximum tenor in months" ' +
            'class="min-h-[38px] w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg text-xs font-mono tabular-nums font-semibold outline-none focus:ring-2 focus:ring-slate-900/15 dark:focus:ring-slate-100/20" />' +
        '</td>' +
        '<td class="py-2 px-3 text-center">' +
          '<button type="button" ' + (isOnly ? 'disabled ' : '') + 'onclick="removeLoanTenorTier(' + idx + ')" ' +
            'title="' + (isOnly ? 'At least one tier is required' : 'Remove Tier') + '" aria-label="Remove Tier" ' +
            'class="min-w-[38px] min-h-[38px] inline-flex items-center justify-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:text-slate-400 dark:hover:text-rose-400 dark:hover:bg-rose-950/50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">' +
            '<i class="fas fa-trash-can text-xs"></i>' +
          '</button>' +
        '</td>' +
      '</tr>'
    );
  }).join("");
}

function updateLoanTenorTier(idx, field, value) {
  const tiers = loanPolicyState.policy.tenorTiers;
  if (!tiers || !tiers[idx]) return;
  const num = Number(value);
  if (field === "maxAmount") {
    tiers[idx].maxAmount = Number.isFinite(num) && num > 0 ? num : 0;
  } else if (field === "maxMonths") {
    tiers[idx].maxMonths = Number.isFinite(num) && num >= 1 ? Math.round(num) : 1;
  }
}

function addLoanTenorTier() {
  const tiers = loanPolicyState.policy.tenorTiers;
  const last = tiers.length > 0 ? tiers[tiers.length - 1] : { maxAmount: 20000, maxMonths: 6 };
  tiers.push({
    maxAmount: Number(last.maxAmount || 50000) + 50000,
    maxMonths: Number(last.maxMonths || 12) + 6
  });
  renderLoanTenorTiers_();
}

function removeLoanTenorTier(idx) {
  const tiers = loanPolicyState.policy.tenorTiers;
  if (!tiers || tiers.length <= 1) return;
  tiers.splice(idx, 1);
  renderLoanTenorTiers_();
}

function saveLoanPolicySettings() {
  if (loanPolicyState.isSaving || commSettingsState.isSaving || auditIntegrityState.isSaving) return;

  const mult = Number(document.getElementById("policy-savings-multiplier")?.value);
  const rate = Number(document.getElementById("policy-interest-rate")?.value);
  const guar = Number(document.getElementById("policy-min-guarantors")?.value);
  const tiers = (loanPolicyState.policy.tenorTiers || []).slice();

  // Validate loan policy
  if (!Number.isFinite(mult) || mult <= 0) {
    if (typeof showNotification === "function") showNotification("Savings multiplier must be greater than 0.", "warning");
    return;
  }
  if (!Number.isFinite(rate) || rate < 0 || rate > 100) {
    if (typeof showNotification === "function") showNotification("Loan interest rate must be between 0% and 100%.", "warning");
    return;
  }
  if (!Number.isFinite(guar) || guar < 0) {
    if (typeof showNotification === "function") showNotification("Minimum guarantors must be 0 or greater.", "warning");
    return;
  }
  if (tiers.length === 0 || tiers.some(function (t) { return !(Number(t.maxAmount) > 0) || !(Number(t.maxMonths) >= 1); })) {
    if (typeof showNotification === "function") showNotification("All loan tenor tiers must have a positive ceiling amount and at least 1 month.", "warning");
    return;
  }

  // Validate comm policy
  const chkAutoMonthly = document.getElementById("comm-auto-monthly-statements");
  const inpAutoDay = document.getElementById("comm-auto-statement-day");
  const chkAutoReceipts = document.getElementById("comm-auto-email-receipts");
  const inpBcc = document.getElementById("comm-notification-bcc");

  const autoMonthly = chkAutoMonthly ? chkAutoMonthly.checked : commSettingsState.settings.autoMonthlyStatements;
  const autoDayVal = inpAutoDay ? parseInt(inpAutoDay.value, 10) : commSettingsState.settings.autoStatementDay;
  const autoReceipts = chkAutoReceipts ? chkAutoReceipts.checked : commSettingsState.settings.autoEmailReceipts;
  const bccVal = inpBcc ? inpBcc.value.trim() : (commSettingsState.settings.notificationBcc || "");

  if (isNaN(autoDayVal) || autoDayVal < 1 || autoDayVal > 28) {
    if (typeof showNotification === "function") showNotification("Automated statement dispatch day must be between 1 and 28.", "warning");
    return;
  }
  if (bccVal && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(bccVal)) {
    if (typeof showNotification === "function") showNotification("Please enter a valid email address for Treasury Archival BCC.", "warning");
    return;
  }

  // Validate audit retention policy
  const inpRetention = document.getElementById("audit-retention-days");
  const rawRetention = inpRetention ? parseInt(inpRetention.value, 10) : auditIntegrityState.retentionDays;
  const auditRetentionDays = !isNaN(rawRetention) && rawRetention >= 0 ? rawRetention : 365;

  tiers.sort(function (a, b) { return Number(a.maxAmount) - Number(b.maxAmount); });

  const loanPayload = {
    borrowerMultiplier: mult,
    savingsMultiplier: mult,
    interestRatePct: rate,
    minGuarantors: Math.round(guar),
    tenorTiers: tiers.map(function (t) {
      return { maxAmount: Number(t.maxAmount), maxMonths: Math.round(Number(t.maxMonths)) };
    })
  };

  const commPayload = {
    autoEmailReceipts: Boolean(autoReceipts),
    autoMonthlyStatements: Boolean(autoMonthly),
    autoStatementDay: autoDayVal,
    notificationBcc: bccVal
  };

  loanPolicyState.isSaving = true;
  commSettingsState.isSaving = true;
  auditIntegrityState.isSaving = true;

  const saveBtns = [
    document.getElementById("btn-save-loan-policy"),
    document.getElementById("btn-save-settings-top")
  ].filter(Boolean);

  saveBtns.forEach(function (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> <span>Saving...</span>';
  });

  if (typeof startAppLoader === "function") startAppLoader();

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    loanPolicyState.isSaving = false;
    commSettingsState.isSaving = false;
    auditIntegrityState.isSaving = false;
    if (typeof stopAppLoader === "function") stopAppLoader();
    saveBtns.forEach(function (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-floppy-disk text-xs"></i> <span>Save Policy Settings</span>';
    });
    if (typeof showNotification === "function") showNotification("Google Apps Script environment not detected.", "warning");
    return;
  }

  let loanResult = null;
  let commResult = null;
  let auditResult = null;
  let loanError = null;
  let commError = null;
  let auditError = null;
  let completedCount = 0;
  const totalCalls = 3;

  function finalizeSave_() {
    loanPolicyState.isSaving = false;
    commSettingsState.isSaving = false;
    auditIntegrityState.isSaving = false;
    if (typeof stopAppLoader === "function") stopAppLoader();

    saveBtns.forEach(function (btn) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-floppy-disk text-xs"></i> <span>Save Policy Settings</span>';
    });

    const isLoanOk = loanResult && loanResult.ok !== false && loanResult.success !== false;
    const isCommOk = commResult && commResult.ok !== false && commResult.success !== false;
    const isAuditOk = auditResult && auditResult.ok !== false && auditResult.success !== false;

    if (isLoanOk && isCommOk && isAuditOk) {
      const savedLoan = normalizeLoanPolicy_((loanResult && (loanResult.settings || loanResult.policy)) || loanPayload);
      const savedComm = normalizeNotificationSettings_((commResult && commResult.settings) || commPayload);
      const savedAudit = normalizeAuditRetentionSettings_((auditResult && auditResult.retentionDays !== undefined) ? auditResult : auditRetentionDays);

      if (typeof cacheSet === "function") {
        cacheSet("loan_policy_settings", savedLoan, 5 * 60 * 1000);
        cacheSet("notification_settings", savedComm, 5 * 60 * 1000);
      }
      if (typeof cacheClear === "function") {
        cacheClear("statements_overview_");
      }

      populateLoanPolicyForm_(savedLoan);
      populateCommunicationSettingsForm_(savedComm);
      auditIntegrityState.retentionDays = savedAudit.retentionDays;
      const daysEl = document.getElementById("audit-retention-days");
      if (daysEl) daysEl.value = String(savedAudit.retentionDays);

      if (typeof showNotification === "function") {
        showNotification("Policy settings saved successfully! Loan policy, communications, and audit retention policies are updated.", "success");
      }
    } else {
      const errors = [
        (!isLoanOk ? (loanError || (loanResult && loanResult.error) || "Loan policy failed") : null),
        (!isCommOk ? (commError || (commResult && commResult.error) || "Communication policy failed") : null),
        (!isAuditOk ? (auditError || (auditResult && auditResult.error) || "Audit retention policy failed") : null)
      ].filter(Boolean);

      if (isLoanOk) {
        const savedLoan = normalizeLoanPolicy_((loanResult && (loanResult.settings || loanResult.policy)) || loanPayload);
        if (typeof cacheSet === "function") cacheSet("loan_policy_settings", savedLoan, 5 * 60 * 1000);
        populateLoanPolicyForm_(savedLoan);
      }
      if (isCommOk) {
        const savedComm = normalizeNotificationSettings_((commResult && commResult.settings) || commPayload);
        if (typeof cacheSet === "function") cacheSet("notification_settings", savedComm, 5 * 60 * 1000);
        populateCommunicationSettingsForm_(savedComm);
      }
      if (isAuditOk) {
        const savedAudit = normalizeAuditRetentionSettings_((auditResult && auditResult.retentionDays !== undefined) ? auditResult : auditRetentionDays);
        auditIntegrityState.retentionDays = savedAudit.retentionDays;
        const daysEl = document.getElementById("audit-retention-days");
        if (daysEl) daysEl.value = String(savedAudit.retentionDays);
      }

      if (typeof showNotification === "function") {
        showNotification("Partial save warning: " + errors.join(" | "), "warning", 8000);
      }
    }
  }

  // 1. Save Loan Policy
  google.script.run
    .withSuccessHandler(function (res) {
      loanResult = res || { ok: false, error: "Empty response" };
      completedCount++;
      if (completedCount === totalCalls) finalizeSave_();
    })
    .withFailureHandler(function (err) {
      loanError = (err && err.message) || String(err) || "Loan policy request failed";
      completedCount++;
      if (completedCount === totalCalls) finalizeSave_();
    })
    .saveLoanPolicySettings(loanPayload);

  // 2. Save Notification Settings
  google.script.run
    .withSuccessHandler(function (res) {
      commResult = res || { ok: false, error: "Empty response" };
      completedCount++;
      if (completedCount === totalCalls) finalizeSave_();
    })
    .withFailureHandler(function (err) {
      commError = (err && err.message) || String(err) || "Notification settings request failed";
      completedCount++;
      if (completedCount === totalCalls) finalizeSave_();
    })
    .saveNotificationSettings(commPayload);

  // 3. Save Audit Retention Settings
  google.script.run
    .withSuccessHandler(function (res) {
      auditResult = res || { ok: false, error: "Empty response" };
      completedCount++;
      if (completedCount === totalCalls) finalizeSave_();
    })
    .withFailureHandler(function (err) {
      auditError = (err && err.message) || String(err) || "Audit retention policy request failed";
      completedCount++;
      if (completedCount === totalCalls) finalizeSave_();
    })
    .saveAuditRetentionSettings(auditRetentionDays);
}

// Global aliases and exports
window.loadCommunicationSettings = loadCommunicationSettings;
window.populateCommunicationSettingsForm_ = populateCommunicationSettingsForm_;
window.syncCommActiveBadge_ = syncCommActiveBadge_;
window.triggerSettingsAutoDispatchNow = triggerSettingsAutoDispatchNow;
window.loadAuditIntegrityStatus = loadAuditIntegrityStatus;
window.runManualAuditIntegrityVerification = runManualAuditIntegrityVerification;
window.updateAuditIntegrityUI_ = updateAuditIntegrityUI_;
window.copyAuditLastHash_ = copyAuditLastHash_;
window.normalizeAuditRetentionSettings_ = normalizeAuditRetentionSettings_;
window.saveAllSettings = saveLoanPolicySettings;
</script>
