<script>
  function escapePrintHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDateForLetterhead(d) {
    const dateObj = d instanceof Date ? d : new Date();
    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    const day = dateObj.getDate();
    const month = months[dateObj.getMonth()];
    const year = dateObj.getFullYear();
    return day + " " + month + " " + year;
  }

  function triggerBrowserPrint() {
    window.print();
  }

  function showPrintModal_() {
    const refEl = document.getElementById("print-ref-display");
    if (refEl) refEl.textContent = "Ref: BLG-RPT-" + Date.now().toString(36).toUpperCase();
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.remove("hidden");
    document.body.classList.add("print-modal-open");
  }

  function closePrintModal() {
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.add("hidden");
    document.body.classList.remove("print-modal-open");
  }

  function openPrintMemberStatement(memberId) {
    const member = (typeof currentMembers !== "undefined" ? currentMembers : []).find((m) => m.id === memberId);
    if (!member) {
      if (typeof showNotification === "function") {
        showNotification("Member details not found.", "warning");
      }
      return;
    }

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "MEMBER FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = member.status || "Active";
    document.getElementById("print-report-subtitle").textContent =
      "Official financial statement for " + member.name + " (" + member.id + " • NID: " + (member.nationalId || "-") + ")";

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Savings</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + formatMoney(member.savings) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Current Loan Balance</div>' +
      '<div class="text-sm font-bold text-rose-600 font-mono tabular-nums mt-0.5">' + formatMoney(member.loanBalance) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Guaranteed Amount</div>' +
      '<div class="text-sm font-bold text-purple-600 font-mono tabular-nums mt-0.5">' + formatMoney(member.guaranteed) + '</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Financial Item</th>' +
      '<th class="px-4 py-3">Reference / Code</th>' +
      '<th class="px-4 py-3">Details</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      '</tr>';

    document.getElementById("print-table-body").innerHTML =

      '<td class="px-4 py-3 font-semibold text-slate-800"><i class="fas fa-piggy-bank text-emerald-600 mr-2"></i> Accumulated Member Savings</td>' +
      '<td class="px-4 py-3 font-mono tabular-nums text-slate-500">' + escapePrintHtml(member.id) + '-SAV</td>' +

      '<td class="px-4 py-3 text-right font-mono tabular-nums font-bold text-slate-800">' + formatMoney(member.savings) + '</td>' +

  function openPrintPersonalStatement() {
    const data = window.latestPersonalFinancials;
    if (!data) {
      window.print();
      return;
    }

    const user = data.user || {};
    const summary = data.personalSummary || {};
    const contribs = data.contributions || [];

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "PERSONAL FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = user.status || "Active";
    document.getElementById("print-report-subtitle").textContent =
      "Official personal statement for " + (user.name || "Member") + " (" + (user.memberId || "—") + ")";

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +

      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.savingsFormatted || formatMoney(summary.savings || 0)) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Group Shares %</div>' +
      '<div class="text-sm font-bold text-sky-600 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.sharesPercentage || "0.00%") + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loan Balance</div>' +
      '<div class="text-sm font-bold text-amber-600 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.activeLoanBalanceFormatted || formatMoney(summary.activeLoanBalance || 0)) + '</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Date</th>' +
      '<th class="px-4 py-3">Type</th>' +
      '<th class="px-4 py-3">Payment Channel</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +

    let bodyHtml = "";
    contribs.forEach((c) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(c.date || "—") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(c.type || "Monthly Contribution") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.mode || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + escapePrintHtml(c.amountFormatted || formatMoney(c.amount || 0)) + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="4" class="text-center py-6 text-slate-400">No personal contribution entries recorded.</td></tr>';

    showPrintModal_();
  }

  function renderContributionsPrintModal_(list) {
    const rows = Array.isArray(list) ? list : [];
    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "GROUP CONTRIBUTIONS STATEMENT";
    document.getElementById("print-report-badge").textContent = "Financial Report";
    document.getElementById("print-report-subtitle").textContent =
      "Official statement of member contributions and monthly deposits (" + rows.length + " entries listed).";

    let totalSum = 0;
    rows.forEach((c) => {
      const rawAmt = c.amountRaw !== undefined ? c.amountRaw : c.amount;
      totalSum += parseFloat(String(rawAmt || "0").replace(/[^0-9.-]+/g, "")) || 0;
    });

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Contribution Volume</div>' +
      '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + formatMoney(totalSum) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Recorded Transactions</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + rows.length + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Group Status</div>' +
      '<div class="text-sm font-bold text-sky-600 font-mono mt-0.5">Active & Verified</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Date</th>' +
      '<th class="px-4 py-3">Member Name</th>' +
      '<th class="px-4 py-3">Payment Mode</th>' +
      '<th class="px-4 py-3">Type</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      '</tr>';

    let bodyHtml = "";
    rows.forEach((c) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(c.date || "-") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(c.name || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.mode || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.type || "Contribution") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + escapePrintHtml(c.amount || "-") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="5" class="text-center py-6 text-slate-400">No contributions records found.</td></tr>';

    showPrintModal_();
  }

  function openPrintContributionsReport() {
    const existing = typeof loadedContributions !== "undefined" ? loadedContributions : [];
    if (existing.length > 0 || typeof google === "undefined" || !google.script || !google.script.run) {
      renderContributionsPrintModal_(existing);
      return;
    }

    if (typeof startAppLoader === "function") startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        if (typeof stopAppLoader === "function") stopAppLoader();
        const rows = (res && res.success && Array.isArray(res.contributions)) ? res.contributions : [];
        if (typeof loadedContributions !== "undefined" && rows.length) {
          loadedContributions = rows;
        }
        renderContributionsPrintModal_(rows);
      })
      .withFailureHandler(function () {
        if (typeof stopAppLoader === "function") stopAppLoader();
        renderContributionsPrintModal_([]);
      })
      .getContributionsData(1, 100);
  }

  function renderLoansPrintModal_(list) {
    const rows = Array.isArray(list) ? list : [];

      "Official statement of member loan applications, repayments, and outstanding balances (" + rows.length + " loans listed).";

    let activeCount = 0;
    let totalOutstanding = 0;
    rows.forEach((l) => {
      if ((l.status || "").toLowerCase() === "active") activeCount++;
      totalOutstanding += Number(l.balance) || 0;
    });

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loans</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + activeCount + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Portfolio Balance</div>' +
      '<div class="text-sm font-bold text-rose-600 font-mono tabular-nums mt-0.5">' + formatMoney(totalOutstanding) + '</div>' +
      '</div>' +

      '<th class="px-4 py-3 text-right">Repayment</th>' +

      '<th class="px-4 py-3 text-right">Balance</th>' +
      '<th class="px-4 py-3 text-center">Status</th>' +
      '</tr>';

    let bodyHtml = "";
    rows.forEach((l) => {
      const repAmt = Number(l.repayment) || ((Number(l.requested) || 0) + (Number(l.interest) || 0) + (Number(l.trsfee) || 0));
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">#' + escapePrintHtml(l.id) + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(l.borrower || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-700">' + formatMoney(l.requested) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-700">' + formatMoney(repAmt) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-emerald-600 font-semibold">' + formatMoney(l.paid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-rose-600 font-bold">' + formatMoney(l.balance) + '</td>' +
        '<td class="px-4 py-2.5 text-center font-bold text-xs">' + escapePrintHtml(l.status || "-") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="7" class="text-center py-6 text-slate-400">No loan records found.</td></tr>';

    showPrintModal_();
  }

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="6" class="text-center py-6 text-slate-400">No account records found.</td></tr>';

    showPrintModal_();
  }
</script>
