<script>
  function escapePrintHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDateForLetterhead(d) {
    const dateObj = d instanceof Date ? d : new Date();
    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    const day = dateObj.getDate();
    const month = months[dateObj.getMonth()];
    const year = dateObj.getFullYear();
    return day + " " + month + " " + year;
  }

  function triggerBrowserPrint() {
    window.print();
  }

  function showPrintModal_(options) {
    const opts = options || {};
    const refEl = document.getElementById("print-ref-display");
    if (refEl) refEl.textContent = "Ref: BLG-RPT-" + Date.now().toString(36).toUpperCase();
    const kpiEl = document.getElementById("print-kpi-row");
    if (kpiEl) {
      kpiEl.className = opts.kpiGridClass || "grid grid-cols-3 gap-4 mb-6";
    }
    const signoffEl = document.getElementById("print-signoff-block");
    if (signoffEl) {
      signoffEl.classList.toggle("hidden", !opts.showSignoff);
    }
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.remove("hidden");
    document.body.classList.add("print-modal-open");
  }

  function closePrintModal() {
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.add("hidden");
    document.body.classList.remove("print-modal-open");
  }

  function openPrintMemberStatement(memberId) {
    const member = (typeof currentMembers !== "undefined" ? currentMembers : []).find((m) => m.id === memberId);
    if (!member) {
      if (typeof showNotification === "function") {
        showNotification("Member details not found.", "warning");
      }
      return;
    }

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "MEMBER FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = member.status || "Active";
    document.getElementById("print-report-subtitle").textContent =
      "Official financial statement for " + member.name + " (" + member.id + " • NID: " + (member.nationalId || "-") + ")";

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Savings</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + formatMoney(member.savings) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Current Loan Balance</div>' +
      '<div class="text-sm font-bold text-rose-600 font-mono tabular-nums mt-0.5">' + formatMoney(member.loanBalance) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Guaranteed Amount</div>' +
      '<div class="text-sm font-bold text-purple-600 font-mono tabular-nums mt-0.5">' + formatMoney(member.guaranteed) + '</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Financial Item</th>' +
      '<th class="px-4 py-3">Reference / Code</th>' +
      '<th class="px-4 py-3">Details</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +

    document.getElementById("print-table-body").innerHTML =

      '<td class="px-4 py-3 font-mono tabular-nums text-slate-500">' + escapePrintHtml(member.id) + '-SAV</td>' +
      '<td class="px-4 py-3 text-slate-600">Total monthly contributions & deposits</td>' +
      '<td class="px-4 py-3 text-right font-mono tabular-nums font-bold text-slate-800">' + formatMoney(member.savings) + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="px-4 py-3 font-semibold text-slate-800"><i class="fas fa-hand-holding-dollar text-rose-600 mr-2"></i> Active Loan Outstanding Balance</td>' +
      '<td class="px-4 py-3 font-mono tabular-nums text-slate-500">' + escapePrintHtml(member.id) + '-LN</td>' +
      '<td class="px-4 py-3 text-slate-600">Principal + interest balance remaining</td>' +
      '<td class="px-4 py-3 text-right font-mono tabular-nums font-bold text-rose-600">' + formatMoney(member.loanBalance) + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="px-4 py-3 font-semibold text-slate-800"><i class="fas fa-shield-cat text-purple-600 mr-2"></i> Guarantor Liability Commitment</td>' +
      '<td class="px-4 py-3 font-mono tabular-nums text-slate-500">' + escapePrintHtml(member.id) + '-GTR</td>' +
      '<td class="px-4 py-3 text-slate-600">Savings pledged to guarantee loans</td>' +
      '<td class="px-4 py-3 text-right font-mono tabular-nums font-bold text-purple-600">' + formatMoney(member.guaranteed) + '</td>' +

    showPrintModal_();

  function openPrintPersonalStatement() {
    const data = window.latestPersonalFinancials;
    if (!data) {
      window.print();
      return;
    }

    const user = data.user || {};
    const summary = data.personalSummary || {};
    const contribs = data.contributions || [];

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "PERSONAL FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = user.status || "Active";
    document.getElementById("print-report-subtitle").textContent =
      "Official personal statement for " + (user.name || "Member") + " (" + (user.memberId || "—") + ")";

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">My Total Savings</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.savingsFormatted || formatMoney(summary.savings || 0)) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Group Shares %</div>' +
      '<div class="text-sm font-bold text-sky-600 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.sharesPercentage || "0.00%") + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loan Balance</div>' +
      '<div class="text-sm font-bold text-amber-600 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.activeLoanBalanceFormatted || formatMoney(summary.activeLoanBalance || 0)) + '</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Date</th>' +
      '<th class="px-4 py-3">Type</th>' +
      '<th class="px-4 py-3">Payment Channel</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      '</tr>';

    let bodyHtml = "";
    contribs.forEach((c) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(c.date || "—") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(c.type || "Monthly Contribution") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.mode || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + escapePrintHtml(c.amountFormatted || formatMoney(c.amount || 0)) + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="4" class="text-center py-6 text-slate-400">No personal contribution entries recorded.</td></tr>';

    showPrintModal_();
  }

      '<th class="px-4 py-3 text-center">Status</th>' +

    let bodyHtml = "";
    list.forEach((m) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(m.id || "-") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(m.name || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-900">' + formatMoney(m.savings) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-sky-700">' + escapePrintHtml(m.sharesPercent || "0.00") + '%</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-amber-700">' + formatMoney(m.loanBalance) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-600">' + formatMoney(m.guaranteed) + '</td>' +
        '<td class="px-4 py-2.5 text-center font-semibold text-xs">' + escapePrintHtml(m.status || "Active") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="7" class="text-center py-6 text-slate-400">No member records loaded.</td></tr>';

    showPrintModal_();
  }

  function renderContributionsPrintModal_(list) {
    const rows = Array.isArray(list) ? list : [];
    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "GROUP CONTRIBUTIONS STATEMENT";
    document.getElementById("print-report-badge").textContent = "Financial Report";
    document.getElementById("print-report-subtitle").textContent =
      "Official statement of member contributions and monthly deposits (" + rows.length + " entries listed).";

    let totalSum = 0;
    rows.forEach((c) => {
      const rawAmt = c.amountRaw !== undefined ? c.amountRaw : c.amount;
      totalSum += parseFloat(String(rawAmt || "0").replace(/[^0-9.-]+/g, "")) || 0;
    });

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Contribution Volume</div>' +
      '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + formatMoney(totalSum) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Recorded Transactions</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + rows.length + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Group Status</div>' +
      '<div class="text-sm font-bold text-sky-600 font-mono mt-0.5">Active & Verified</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Date</th>' +
      '<th class="px-4 py-3">Member Name</th>' +
      '<th class="px-4 py-3">Payment Mode</th>' +
      '<th class="px-4 py-3">Type</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      '</tr>';

    let bodyHtml = "";
    rows.forEach((c) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(c.date || "-") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(c.name || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.mode || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.type || "Contribution") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + escapePrintHtml(c.amount || "-") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="5" class="text-center py-6 text-slate-400">No contributions records found.</td></tr>';

    showPrintModal_();
  }

  function openPrintContributionsReport() {
    const existing = typeof loadedContributions !== "undefined" ? loadedContributions : [];
    if (existing.length > 0 || typeof google === "undefined" || !google.script || !google.script.run) {
      renderContributionsPrintModal_(existing);
      return;
    }

    if (typeof startAppLoader === "function") startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        if (typeof stopAppLoader === "function") stopAppLoader();
        const rows = (res && res.success && Array.isArray(res.contributions)) ? res.contributions : [];
        if (typeof loadedContributions !== "undefined" && rows.length) {
          loadedContributions = rows;
        }
        renderContributionsPrintModal_(rows);
      })
      .withFailureHandler(function () {
        if (typeof stopAppLoader === "function") stopAppLoader();
        renderContributionsPrintModal_([]);
      })
      .getContributionsData(1, 100);
  }

  function renderLoansPrintModal_(list) {
    const rows = Array.isArray(list) ? list : [];
    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "LOANS PORTFOLIO REPORT";
    document.getElementById("print-report-badge").textContent = "Portfolio Statement";
    document.getElementById("print-report-subtitle").textContent =
      "Official statement of member loan applications, repayments, and outstanding balances (" + rows.length + " loans listed).";

    let activeCount = 0;
    let totalOutstanding = 0;
    rows.forEach((l) => {
      if ((l.status || "").toLowerCase() === "active") activeCount++;
      totalOutstanding += Number(l.balance) || 0;
    });

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loans</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + activeCount + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Portfolio Balance</div>' +
      '<div class="text-sm font-bold text-rose-600 font-mono tabular-nums mt-0.5">' + formatMoney(totalOutstanding) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Portfolio Status</div>' +
      '<div class="text-sm font-bold text-emerald-600 font-mono mt-0.5">Healthy</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Loan ID</th>' +
      '<th class="px-4 py-3">Borrower Name</th>' +
      '<th class="px-4 py-3 text-right">Requested</th>' +
      '<th class="px-4 py-3 text-right">Repayment</th>' +
      '<th class="px-4 py-3 text-right">Paid</th>' +
      '<th class="px-4 py-3 text-right">Balance</th>' +
      '<th class="px-4 py-3 text-center">Status</th>' +
      '</tr>';

    let bodyHtml = "";
    rows.forEach((l) => {
      const repAmt = Number(l.repayment) || ((Number(l.requested) || 0) + (Number(l.interest) || 0) + (Number(l.trsfee) || 0));
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">#' + escapePrintHtml(l.id) + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(l.borrower || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-700">' + formatMoney(l.requested) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-700">' + formatMoney(repAmt) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-emerald-600 font-semibold">' + formatMoney(l.paid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-rose-600 font-bold">' + formatMoney(l.balance) + '</td>' +
        '<td class="px-4 py-2.5 text-center font-bold text-xs">' + escapePrintHtml(l.status || "-") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="7" class="text-center py-6 text-slate-400">No loan records found.</td></tr>';

    showPrintModal_();
  }

  function openPrintLoansReport() {
    const existing = typeof loadedLoans !== "undefined" ? loadedLoans : [];

      renderLoansPrintModal_(existing);

        if (typeof stopAppLoader === "function") stopAppLoader();

        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(a.paymentMode || "-") + '</td>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-600">' + escapePrintHtml(a.paybill || "-") + '</td>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500 text-xs">' + escapePrintHtml(a.balanceDate || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + formatMoney(bal) + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="6" class="text-center py-6 text-slate-400">No account records found.</td></tr>';

    showPrintModal_();
  }

  function formatPrintBsMoney_(val) {
    const num = Number(val) || 0;
    const fmt = new Intl.NumberFormat("en-KE", {
      style: "currency",
      currency: "KES",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
    return num < 0 ? ("-" + fmt.format(Math.abs(num))) : fmt.format(num);
  }

  function openPrintBalanceSheetReport() {
    const m = window.latestBalanceSheetModel;
    if (!m) {
      if (typeof showNotification === "function") {
        showNotification("Balance Sheet data is still loading.", "warning");
      }
      return;
    }

    const asOfEl = document.getElementById("bs-as-of-date");
    const asOfLabel = asOfEl ? asOfEl.textContent : formatDateForLetterhead(new Date());

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "STATEMENT OF FINANCIAL POSITION (BALANCE SHEET)";
    document.getElementById("print-report-badge").textContent = "IFRS / IAS 1";
    document.getElementById("print-report-subtitle").textContent =
      "Official Statement of Financial Position • IFRS for SACCOs & Chamas • As of " + asOfLabel;

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Group Assets</div>' +
      '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + formatPrintBsMoney_(m.assets.totalAssets) + "</div>" +
      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Members\' Equity</div>' +

      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Solvency Ratio</div>' +
      '<div class="text-sm font-bold text-emerald-700 font-mono tabular-nums mt-0.5">' + (m.solvencyDenominator > 0 ? m.solvencyRatio.toFixed(1) + "%" : "N/A") + "</div>" +
      "</div>";

    document.getElementById("print-table-head").innerHTML =
      "<tr>" +
      '<th class="px-4 py-3">Account / Classification (IFRS / SASRA)</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      "</tr>";

    const sectionHdr = function (title) {
      return (
        '<tr class="bg-slate-100/80">' +
        '<td colspan="2" class="px-4 py-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-700">' + escapePrintHtml(title) + "</td>" +
        "</tr>"
      );
    };
    const itemRow = function (label, amountHtml, isMutedItalic) {
      return (
        "<tr>" +
        '<td class="px-4 py-2 pl-8 ' + (isMutedItalic ? "italic text-slate-500" : "text-slate-700") + '">' + escapePrintHtml(label) + "</td>" +
        '<td class="px-4 py-2 text-right font-mono tabular-nums ' + (isMutedItalic ? "text-amber-700" : "text-slate-800 font-medium") + '">' + amountHtml + "</td>" +
        "</tr>"
      );
    };
    const subtotalRow = function (label, val) {
      return (
        '<tr class="bg-slate-50/80 border-t border-slate-200">' +
        '<td class="px-4 py-2.5 pl-6 font-bold text-slate-900">' + escapePrintHtml(label) + "</td>" +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-900">' + formatPrintBsMoney_(val) + "</td>" +
        "</tr>"
      );

    const grandTotalRow = function (label, val) {
      return (
        '<tr class="bg-slate-100 border-t-2 border-slate-300 border-b-4 border-double border-b-slate-900">' +
        '<td class="px-4 py-3 font-extrabold uppercase tracking-wider text-slate-900">' + escapePrintHtml(label) + "</td>" +
        '<td class="px-4 py-3 text-right font-mono tabular-nums text-sm font-extrabold text-slate-900">' + formatPrintBsMoney_(val) + "</td>" +
        "</tr>"
      );
    };

    const statusText = m.isBalanced
      ? "Balanced (+/- 0.00)"
      : ("Variance: " + formatPrintBsMoney_(m.variance));

    document.getElementById("print-table-body").innerHTML =
      sectionHdr("A. Assets — Current Assets") +
      itemRow("Physical Bank Balances", formatPrintBsMoney_(m.assets.current.bankBalances)) +
      itemRow("Mobile Till / Paybill", formatPrintBsMoney_(m.assets.current.mobileMoney)) +
      itemRow("CIC Money Market Fund", formatPrintBsMoney_(m.assets.current.cicMmf)) +
      subtotalRow("Subtotal Cash & Cash Equivalents", m.assets.current.subtotal) +
      sectionHdr("A. Assets — Financial Assets (Loan Portfolio)") +
      itemRow("Gross Loans Receivable", formatPrintBsMoney_(m.assets.loans.grossLoans)) +
      itemRow("Less: Allowance for Credit Losses (SASRA Reserve)", "(" + formatPrintBsMoney_(m.assets.loans.lossAllowance) + ")", true) +
      subtotalRow("Net Loan Portfolio", m.assets.loans.netLoans) +
      sectionHdr("A. Assets — External Financial Investments") +
      itemRow("Mansa X", formatPrintBsMoney_(m.assets.investments.mansaX)) +
      itemRow("M-Akiba", formatPrintBsMoney_(m.assets.investments.makiba)) +
      itemRow("Fixed Investments", formatPrintBsMoney_(m.assets.investments.fixedInvestments)) +
      subtotalRow("Subtotal External Investments", m.assets.investments.subtotal) +
      grandTotalRow("TOTAL ASSETS", m.assets.totalAssets) +
      sectionHdr("B. Liabilities") +
      itemRow("Accounts Payable", formatPrintBsMoney_(m.liabilities.accountsPayable)) +
      itemRow("Accrued Expenses", formatPrintBsMoney_(m.liabilities.accruedExpenses)) +
      itemRow("Unallocated Deposits", formatPrintBsMoney_(m.liabilities.unallocatedDeposits)) +
      subtotalRow("Subtotal Liabilities", m.liabilities.subtotal) +
      sectionHdr("C. Members' Funds & Equity") +
      itemRow("Accumulated Member Savings", formatPrintBsMoney_(m.equity.memberSavings)) +
      itemRow("Statutory Reserve Fund (20%)", formatPrintBsMoney_(m.equity.statutoryReserve)) +
      itemRow("Retained Distributable Surplus", formatPrintBsMoney_(m.equity.retainedSurplus)) +
      subtotalRow("Subtotal Equity & Members' Funds", m.equity.subtotal) +
      grandTotalRow("TOTAL LIABILITIES & MEMBERS' FUNDS", m.totalLiabilitiesAndEquity) +
      '<tr class="bg-slate-50 border-t border-slate-200">' +
      '<td class="px-4 py-2.5 text-[11px] font-semibold text-slate-600">Audit Reconciliation Check</td>' +
      '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-[11px] font-bold ' + (m.isBalanced ? "text-emerald-700" : "text-amber-700") + '">' + escapePrintHtml(statusText) + "</td>" +
      "</tr>";

    showPrintModal_({ showSignoff: true });
  }

  function openPrintIncomeStatementReport() {
    const m = window.latestIncomeStatementModel;
    if (!m) {
      if (typeof showNotification === "function") {
        showNotification("Income Statement data is still loading.", "warning");
      }
      return;
    }

    const periodEl = document.getElementById("pnl-period-label");
    const periodLabel = periodEl ? periodEl.textContent : (m.periodStart && m.periodEnd ? (m.periodStart + " - " + m.periodEnd) : "Current Fiscal Period");

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "STATEMENT OF COMPREHENSIVE INCOME (PROFIT & LOSS)";
    document.getElementById("print-report-badge").textContent = "IFRS / SASRA Schedule";
    document.getElementById("print-report-subtitle").textContent =
      "Official Statement of Comprehensive Income • IFRS & SASRA Prudential Performance • Period: " + periodLabel;

    const cirText = (m.totalRevenue <= 0 && m.totalExpenses > 0) ? ">100%" : (m.costToIncomeRatio.toFixed(1) + "%");
    const netText = m.netOperatingSurplus < 0
      ? ("(" + formatPrintBsMoney_(Math.abs(m.netOperatingSurplus)) + ")")
      : formatPrintBsMoney_(m.netOperatingSurplus);

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Revenue</div>' +
      '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + formatPrintBsMoney_(m.totalRevenue) + "</div>" +
      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Operating Expenses</div>' +
      '<div class="text-sm font-bold text-rose-700 font-mono tabular-nums mt-0.5">' + formatPrintBsMoney_(m.totalExpenses) + "</div>" +
      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Cost-to-Income (CIR)</div>' +
      '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + escapePrintHtml(cirText) + "</div>" +
      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Net Surplus</div>' +
      '<div class="text-sm font-bold ' + (m.netOperatingSurplus >= 0 ? "text-emerald-700" : "text-rose-700") + ' font-mono tabular-nums mt-0.5">' + netText + "</div>" +
      "</div>";

    document.getElementById("print-table-head").innerHTML =
      "<tr>" +
      '<th class="px-4 py-3">Section / Account Classification (IFRS)</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      "</tr>";

    const sectionHdr = function (title) {
      return (
        '<tr class="bg-slate-100/80">' +
        '<td colspan="2" class="px-4 py-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-700">' + escapePrintHtml(title) + "</td>" +
        "</tr>"
      );
    };
    const itemRow = function (label, amountHtml, isDeduction) {
      return (
        "<tr>" +
        '<td class="px-4 py-2 pl-8 ' + (isDeduction ? "text-slate-600" : "text-slate-700") + '">' + escapePrintHtml(label) + "</td>" +
        '<td class="px-4 py-2 text-right font-mono tabular-nums ' + (isDeduction ? "text-rose-700" : "text-slate-800 font-medium") + '">' + amountHtml + "</td>" +
        "</tr>"
      );
    };
    const subtotalRow = function (label, amountHtml) {
      return (
        '<tr class="bg-slate-50/80 border-t border-slate-200">' +
        '<td class="px-4 py-2.5 pl-6 font-bold text-slate-900">' + escapePrintHtml(label) + "</td>" +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-900">' + amountHtml + "</td>" +
        "</tr>"
      );
    };

    document.getElementById("print-table-body").innerHTML =
      sectionHdr("Section I: Operating Revenue") +
      itemRow("Loan Interest Income", formatPrintBsMoney_(m.operatingRevenue.loanInterest)) +
      itemRow("Processing & Application Fees", formatPrintBsMoney_(m.operatingRevenue.processingFees)) +
      itemRow("Fines & Penalties", formatPrintBsMoney_(m.operatingRevenue.finesAndPenalties)) +
      itemRow("Other Operating Revenue", formatPrintBsMoney_(m.operatingRevenue.otherOperatingRevenue)) +
      subtotalRow("Subtotal Operating Revenue", formatPrintBsMoney_(m.operatingRevenue.operatingSubtotal)) +
      sectionHdr("Section II: Investment Yields") +
      itemRow("CIC MMF Net Yield", formatPrintBsMoney_(m.investmentYields.cicMmfNetYield)) +
      itemRow("Other External Investments", formatPrintBsMoney_(m.investmentYields.externalInvestments)) +
      subtotalRow("Subtotal Investment Yields", formatPrintBsMoney_(m.investmentYields.investmentSubtotal)) +
      '<tr class="bg-slate-100 border-t-2 border-b-2 border-slate-300">' +
      '<td class="px-4 py-2.5 font-extrabold uppercase tracking-wider text-slate-900">Total Comprehensive Revenue (Gross Operating Income)</td>' +
      '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-sm font-extrabold text-slate-900">' + formatPrintBsMoney_(m.totalRevenue) + "</td>" +
      "</tr>" +
      sectionHdr("Section III: Operating & Administrative Expenses") +
      itemRow("Bank & Transaction Fees", "(" + formatPrintBsMoney_(m.operatingExpenses.bankAndTransactionFees) + ")", true) +
      itemRow("Technology & Infrastructure", "(" + formatPrintBsMoney_(m.operatingExpenses.techAndInfrastructure) + ")", true) +
      itemRow("AGM & Governance", "(" + formatPrintBsMoney_(m.operatingExpenses.agmAndAdmin) + ")", true) +
      itemRow("Other Administrative Expenses", "(" + formatPrintBsMoney_(m.operatingExpenses.otherExpenses) + ")", true) +
      subtotalRow("Subtotal Operating Expenses", "(" + formatPrintBsMoney_(m.totalExpenses) + ")") +
      subtotalRow("Section IV: Net Operating Surplus Before Impairment", m.operatingSurplusBeforeImpairment < 0 ? ("(" + formatPrintBsMoney_(Math.abs(m.operatingSurplusBeforeImpairment)) + ")") : formatPrintBsMoney_(m.operatingSurplusBeforeImpairment)) +
      itemRow("Section V: Credit Impairment Loss (SASRA Sec 51 Provision Charge)", "(" + formatPrintBsMoney_(m.loanLossProvisionCharge) + ")", true) +
      '<tr class="' + (m.netOperatingSurplus >= 0 ? "bg-emerald-50/70 border-b-double border-b-emerald-800" : "bg-rose-50/70 border-b-double border-b-rose-800") + ' border-t-2 border-slate-300 border-b-4">' +
      '<td class="px-4 py-3 font-extrabold uppercase tracking-wider text-slate-900">Section VI: Net Operating Surplus / (Deficit) for the Period</td>' +
      '<td class="px-4 py-3 text-right font-mono tabular-nums text-sm font-extrabold ' + (m.netOperatingSurplus >= 0 ? "text-emerald-700" : "text-rose-700") + '">' + netText + "</td>" +
      "</tr>" +
      sectionHdr("Section VII: Statutory & Policy Appropriations (SASRA Section 51(1))") +
      itemRow("20% Statutory Reserve Fund Transfer (Indivisible Capital)", formatPrintBsMoney_(m.appropriations.statutoryReserveTransfer)) +
      subtotalRow("80% Distributable Member Surplus Base (Dividend / Rebate Pool)", formatPrintBsMoney_(m.appropriations.distributableMemberPool));

    showPrintModal_({
      showSignoff: true,
      kpiGridClass: "grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"
    });
  }
</script>
