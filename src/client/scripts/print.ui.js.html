<script>
  function escapePrintHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDateForLetterhead(d) {
    const dateObj = d instanceof Date ? d : new Date();
    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    const day = dateObj.getDate();
    const month = months[dateObj.getMonth()];
    const year = dateObj.getFullYear();
    return day + " " + month + " " + year;
  }

  function triggerBrowserPrint() {
    window.print();
  }

  function showPrintModal_(options) {
    const opts = options || {};
    const refEl = document.getElementById("print-ref-display");
    if (refEl) refEl.textContent = opts.refText || ("Ref: BLG-RPT-" + Date.now().toString(36).toUpperCase());
    const kpiEl = document.getElementById("print-kpi-row");
    if (kpiEl) {
      kpiEl.className = opts.kpiGridClass || "grid grid-cols-3 gap-4 mb-6";
    }
    const signoffEl = document.getElementById("print-signoff-block");
    if (signoffEl) {
      signoffEl.classList.toggle("hidden", !opts.showSignoff);
    }
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.remove("hidden");
    document.body.classList.add("print-modal-open");
  }

  function closePrintModal() {
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.add("hidden");
    document.body.classList.remove("print-modal-open");
  }

  function openPrintMemberStatement(memberId) {
    const member = (typeof currentMembers !== "undefined" ? currentMembers : []).find((m) => m.id === memberId);
    if (!member) {
      if (typeof showNotification === "function") {
        showNotification("Member details not found.", "warning");
      }
      return;
    }

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "MEMBER FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = member.status || "Active";
    document.getElementById("print-report-subtitle").textContent =
      "Official financial statement for " + member.name + " (" + member.id + " • NID: " + (member.nationalId || "-") + ")";

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Savings</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + formatMoney(member.savings) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Current Loan Balance</div>' +
      '<div class="text-sm font-bold text-rose-600 font-mono tabular-nums mt-0.5">' + formatMoney(member.loanBalance) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Guaranteed Amount</div>' +
      '<div class="text-sm font-bold text-purple-600 font-mono tabular-nums mt-0.5">' + formatMoney(member.guaranteed) + '</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Financial Item</th>' +
      '<th class="px-4 py-3">Reference / Code</th>' +
      '<th class="px-4 py-3">Details</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      '</tr>';

    document.getElementById("print-table-body").innerHTML =

      '<td class="px-4 py-3 font-semibold text-slate-800"><i class="fas fa-piggy-bank text-emerald-600 mr-2"></i> Accumulated Member Savings</td>' +
      '<td class="px-4 py-3 font-mono tabular-nums text-slate-500">' + escapePrintHtml(member.id) + '-SAV</td>' +
      '<td class="px-4 py-3 text-slate-600">Total monthly contributions & deposits</td>' +
      '<td class="px-4 py-3 text-right font-mono tabular-nums font-bold text-slate-800">' + formatMoney(member.savings) + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="px-4 py-3 font-semibold text-slate-800"><i class="fas fa-hand-holding-dollar text-rose-600 mr-2"></i> Active Loan Outstanding Balance</td>' +
      '<td class="px-4 py-3 font-mono tabular-nums text-slate-500">' + escapePrintHtml(member.id) + '-LN</td>' +
      '<td class="px-4 py-3 text-slate-600">Principal + interest balance remaining</td>' +
      '<td class="px-4 py-3 text-right font-mono tabular-nums font-bold text-rose-600">' + formatMoney(member.loanBalance) + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="px-4 py-3 font-semibold text-slate-800"><i class="fas fa-shield-cat text-purple-600 mr-2"></i> Guarantor Liability Commitment</td>' +
      '<td class="px-4 py-3 font-mono tabular-nums text-slate-500">' + escapePrintHtml(member.id) + '-GTR</td>' +
      '<td class="px-4 py-3 text-slate-600">Savings pledged to guarantee loans</td>' +
      '<td class="px-4 py-3 text-right font-mono tabular-nums font-bold text-purple-600">' + formatMoney(member.guaranteed) + '</td>' +
      '</tr>';

    showPrintModal_();

  function openPrintPersonalStatement() {
    const data = window.latestPersonalFinancials;
    if (!data) {
      window.print();
      return;
    }

    const user = data.user || {};
    const summary = data.personalSummary || {};
    const contribs = data.contributions || [];

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "PERSONAL FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = user.status || "Active";
    document.getElementById("print-report-subtitle").textContent =
      "Official personal statement for " + (user.name || "Member") + " (" + (user.memberId || "—") + ")";

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">My Total Savings</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.savingsFormatted || formatMoney(summary.savings || 0)) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Group Shares %</div>' +
      '<div class="text-sm font-bold text-sky-600 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.sharesPercentage || "0.00%") + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loan Balance</div>' +
      '<div class="text-sm font-bold text-amber-600 font-mono tabular-nums mt-0.5">' + escapePrintHtml(summary.activeLoanBalanceFormatted || formatMoney(summary.activeLoanBalance || 0)) + '</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Date</th>' +
      '<th class="px-4 py-3">Type</th>' +
      '<th class="px-4 py-3">Payment Channel</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      '</tr>';

    let bodyHtml = "";
    contribs.forEach((c) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(c.date || "—") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(c.type || "Monthly Contribution") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.mode || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + escapePrintHtml(c.amountFormatted || formatMoney(c.amount || 0)) + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="4" class="text-center py-6 text-slate-400">No personal contribution entries recorded.</td></tr>';

    showPrintModal_();
  }

      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +

      '<th class="px-4 py-3 text-right">Guaranteed</th>' +
      '<th class="px-4 py-3 text-center">Status</th>' +
      '</tr>';

    let bodyHtml = "";
    list.forEach((m) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(m.id || "-") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(m.name || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-900">' + formatMoney(m.savings) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-sky-700">' + escapePrintHtml(m.sharesPercent || "0.00") + '%</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-amber-700">' + formatMoney(m.loanBalance) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-600">' + formatMoney(m.guaranteed) + '</td>' +
        '<td class="px-4 py-2.5 text-center font-semibold text-xs">' + escapePrintHtml(m.status || "Active") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="7" class="text-center py-6 text-slate-400">No member records loaded.</td></tr>';

    showPrintModal_();
  }

  function renderContributionsPrintModal_(list) {
    const rows = Array.isArray(list) ? list : [];
    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "GROUP CONTRIBUTIONS STATEMENT";
    document.getElementById("print-report-badge").textContent = "Financial Report";
    document.getElementById("print-report-subtitle").textContent =
      "Official statement of member contributions and monthly deposits (" + rows.length + " entries listed).";

    let totalSum = 0;
    rows.forEach((c) => {
      const rawAmt = c.amountRaw !== undefined ? c.amountRaw : c.amount;
      totalSum += parseFloat(String(rawAmt || "0").replace(/[^0-9.-]+/g, "")) || 0;
    });

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Contribution Volume</div>' +
      '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + formatMoney(totalSum) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Recorded Transactions</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + rows.length + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Group Status</div>' +
      '<div class="text-sm font-bold text-sky-600 font-mono mt-0.5">Active & Verified</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Date</th>' +
      '<th class="px-4 py-3">Member Name</th>' +
      '<th class="px-4 py-3">Payment Mode</th>' +
      '<th class="px-4 py-3">Type</th>' +
      '<th class="px-4 py-3 text-right">Amount (KES)</th>' +
      '</tr>';

    let bodyHtml = "";
    rows.forEach((c) => {
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(c.date || "-") + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(c.name || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.mode || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-slate-600">' + escapePrintHtml(c.type || "Contribution") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + escapePrintHtml(c.amount || "-") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="5" class="text-center py-6 text-slate-400">No contributions records found.</td></tr>';

    showPrintModal_();
  }

  function openPrintContributionsReport() {
    const existing = typeof loadedContributions !== "undefined" ? loadedContributions : [];
    if (existing.length > 0 || typeof google === "undefined" || !google.script || !google.script.run) {
      renderContributionsPrintModal_(existing);
      return;
    }

    if (typeof startAppLoader === "function") startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        if (typeof stopAppLoader === "function") stopAppLoader();
        const rows = (res && res.success && Array.isArray(res.contributions)) ? res.contributions : [];
        if (typeof loadedContributions !== "undefined" && rows.length) {
          loadedContributions = rows;
        }
        renderContributionsPrintModal_(rows);
      })
      .withFailureHandler(function () {
        if (typeof stopAppLoader === "function") stopAppLoader();
        renderContributionsPrintModal_([]);
      })
      .getContributionsData(1, 100);
  }

  function renderLoansPrintModal_(list) {
    const rows = Array.isArray(list) ? list : [];
    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "LOANS PORTFOLIO REPORT";
    document.getElementById("print-report-badge").textContent = "Portfolio Statement";
    document.getElementById("print-report-subtitle").textContent =
      "Official statement of member loan applications, repayments, and outstanding balances (" + rows.length + " loans listed).";

    let activeCount = 0;
    let totalOutstanding = 0;
    rows.forEach((l) => {
      if ((l.status || "").toLowerCase() === "active") activeCount++;
      totalOutstanding += Number(l.balance) || 0;
    });

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loans</div>' +
      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + activeCount + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Portfolio Balance</div>' +
      '<div class="text-sm font-bold text-rose-600 font-mono tabular-nums mt-0.5">' + formatMoney(totalOutstanding) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Portfolio Status</div>' +
      '<div class="text-sm font-bold text-emerald-600 font-mono mt-0.5">Healthy</div>' +
      '</div>';

    document.getElementById("print-table-head").innerHTML =
      '<tr>' +
      '<th class="px-4 py-3">Loan ID</th>' +
      '<th class="px-4 py-3">Borrower Name</th>' +
      '<th class="px-4 py-3 text-right">Requested</th>' +
      '<th class="px-4 py-3 text-right">Repayment</th>' +
      '<th class="px-4 py-3 text-right">Paid</th>' +
      '<th class="px-4 py-3 text-right">Balance</th>' +
      '<th class="px-4 py-3 text-center">Status</th>' +
      '</tr>';

    let bodyHtml = "";
    rows.forEach((l) => {
      const repAmt = Number(l.repayment) || ((Number(l.requested) || 0) + (Number(l.interest) || 0) + (Number(l.trsfee) || 0));
      bodyHtml +=
        '<tr>' +
        '<td class="px-4 py-2.5 font-mono tabular-nums text-slate-500">#' + escapePrintHtml(l.id) + '</td>' +
        '<td class="px-4 py-2.5 font-semibold text-slate-800">' + escapePrintHtml(l.borrower || "-") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-700">' + formatMoney(l.requested) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-slate-700">' + formatMoney(repAmt) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-emerald-600 font-semibold">' + formatMoney(l.paid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-rose-600 font-bold">' + formatMoney(l.balance) + '</td>' +
        '<td class="px-4 py-2.5 text-center font-bold text-xs">' + escapePrintHtml(l.status || "-") + '</td>' +
        '</tr>';
    });

    document.getElementById("print-table-body").innerHTML =
      bodyHtml || '<tr><td colspan="7" class="text-center py-6 text-slate-400">No loan records found.</td></tr>';

    showPrintModal_();
  }

  function openPrintLoansReport() {
    const existing = typeof loadedLoans !== "undefined" ? loadedLoans : [];

      renderLoansPrintModal_(existing);

      .withFailureHandler(function () {
        if (typeof stopAppLoader === "function") stopAppLoader();
        renderLoansPrintModal_([]);

      '<div class="text-sm font-bold text-slate-800 font-mono tabular-nums mt-0.5">' + list.length + '</div>' +

  function safeCellText_(val) {
    let s = String(val === undefined || val === null ? "" : val);
    if (/^[=+\-@\t\r]/.test(s)) {

    return '"' + s.replace(/"/g, '""') + '"';

  function gatherAgmAuditContext_() {
    const bs = window.latestBalanceSheetModel || null;
    const is = window.latestIncomeStatementModel || null;
    const analytics = window.latestHomeAnalyticsData || {};
    if (!bs || !is) {
      return null;
    }

    const rawProjects = Array.isArray(analytics.projects) ? analytics.projects : [];
    const projectsSchedule = rawProjects.length > 0
      ? rawProjects.map(function (p) {
          return {
            name: p.name || p.title || "Capital Project",
            category: p.category || p.type || "Tangible Capital Asset",
            status: p.status || "Active",
            value: Number(p.currentValue !== undefined ? p.currentValue : (p.amount || p.budget || 0))
          };
        })
      : [
          { name: "CIC Money Market Fund", category: "Liquid Treasury Reserve", status: "Active", value: Number(bs.assets.current.cicMmf || 0) },
          { name: "Mansa X Managed Fund", category: "External Financial Holding", status: "Active", value: Number(bs.assets.investments.mansaX || 0) },
          { name: "M-Akiba Treasury Bond", category: "Government Security", status: "Active", value: Number(bs.assets.investments.makiba || 0) },
          { name: "Fixed / Capital Projects", category: "Tangible & Fixed Holdings", status: "Active", value: Number(bs.assets.investments.fixedInvestments || 0) }
        ];

    const totalCapitalProjects = projectsSchedule.reduce(function (acc, item) {
      return acc + (Number(item.value) || 0);
    }, 0);

    const institutionalReserveRatio = bs.assets.totalAssets > 0
      ? (bs.equity.statutoryReserve / bs.assets.totalAssets) * 100
      : 0;
    const loanToSavingsRatio = bs.equity.memberSavings > 0
      ? (bs.assets.loans.grossLoans / bs.equity.memberSavings) * 100
      : 0;
    const netMarginPct = is.totalRevenue > 0
      ? (is.netOperatingSurplus / is.totalRevenue) * 100
      : 0;
    const cirRatioText = (is.totalRevenue <= 0 && is.totalExpenses > 0)
      ? ">100%"
      : (is.costToIncomeRatio.toFixed(1) + "%");
    const rawPar = analytics.parRatio !== undefined
      ? analytics.parRatio
      : (analytics.creditRisk && analytics.creditRisk.parRatio !== undefined ? analytics.creditRisk.parRatio : null);
    const parText = rawPar !== null && rawPar !== undefined ? (Number(rawPar).toFixed(1) + "%") : "N/A";

    return {
      bs: bs,
      is: is,
      year: new Date().getFullYear(),
      refId: "BLG-AGM-AUDIT-" + new Date().getFullYear() + "-VERIFIED",
      projectsSchedule: projectsSchedule,
      totalCapitalProjects: totalCapitalProjects,
      ratios: [
        { label: "Solvency Ratio (Assets / Obligations)", benchmark: ">= 100.0%", value: bs.solvencyDenominator > 0 ? (bs.solvencyRatio.toFixed(1) + "%") : "N/A" },
        { label: "Statutory Reserve / Total Assets", benchmark: ">= 10.0% (SASRA)", value: institutionalReserveRatio.toFixed(1) + "%" },
        { label: "Cost-to-Income Ratio (CIR)", benchmark: "<= 45.0%", value: cirRatioText },
        { label: "Net Operating Surplus Margin", benchmark: ">= 20.0%", value: netMarginPct.toFixed(1) + "%" },
        { label: "Loan-to-Savings Deployment Ratio", benchmark: "70.0% - 95.0%", value: loanToSavingsRatio.toFixed(1) + "%" },
        { label: "Portfolio at Risk (PAR > 30 Days)", benchmark: "<= 5.0%", value: parText }
      ]
    };
  }

      row("Accumulated Member Savings", "Member Share Capital", formatPrintBsMoney_(bs.equity.memberSavings), false) +
      row("Statutory Reserve Fund (20%)", "SASRA Sec 51(1) Indivisible Capital", formatPrintBsMoney_(bs.equity.statutoryReserve), false) +
      row("Retained Distributable Surplus", "Undistributed Member Earnings", formatPrintBsMoney_(bs.equity.retainedSurplus), false) +
      row("TOTAL LIABILITIES & MEMBERS' EQUITY", "Total Claims & Equity", formatPrintBsMoney_(bs.totalLiabilitiesAndEquity), true) +

      secHdr("Section II: Statement of Comprehensive Income (P&L)") +
      row("Operating Revenue", "Interest, Processing Fees & Fines", formatPrintBsMoney_(is.operatingRevenue.operatingSubtotal), false) +
      row("Investment Yields", "CIC MMF & External Yield", formatPrintBsMoney_(is.investmentYields.investmentSubtotal), false) +
      row("Total Comprehensive Revenue", "Gross Operating Income", formatPrintBsMoney_(is.totalRevenue), true) +
      row("Operating & Administrative Expenses", "Bank, Tech, AGM & Admin", "(" + formatPrintBsMoney_(is.totalExpenses) + ")", false) +
      row("Credit Impairment Loss Charge", "SASRA Sec 51 Provisioning", "(" + formatPrintBsMoney_(is.loanLossProvisionCharge) + ")", false) +
      row("Net Operating Surplus / (Deficit)", "Bottom-Line Period Performance", netText, true) +
      row("20% Statutory Reserve Appropriation", "Indivisible Institutional Capital", formatPrintBsMoney_(is.appropriations.statutoryReserveTransfer), false) +
      row("80% Distributable Member Surplus Pool", "Dividend / Rebate Allocation Base", formatPrintBsMoney_(is.appropriations.distributableMemberPool), true) +

      secHdr("Section III: Tangible Capital Projects & External Holdings Schedule") +
      projectsHtml +
      row("Total Capital Projects & Holdings", "Consolidated Schedule Total", formatPrintBsMoney_(ctx.totalCapitalProjects), true) +

      secHdr("Section IV: SASRA Prudential & Key Financial Ratios") +
      ratiosHtml;

    showPrintModal_({
      showSignoff: true,
      kpiGridClass: "grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6",
      refText: "Ref: " + ctx.refId
    });
  }

  function exportAgmAuditPackCSV() {
    const ctx = gatherAgmAuditContext_();
    if (!ctx) {
      if (typeof showNotification === "function") {
        showNotification("AGM Audit Pack data is still loading. Please open Group Overview first.", "warning");
      }
      return;
    }

    const bs = ctx.bs;
    const is = ctx.is;
    const generatedDate = new Date().toISOString().slice(0, 10);
    const rows = [
      ["BRIGHTLIFE SHG - CONSOLIDATED ANNUAL AGM & BANK AUDIT PACK", "", "", ""],
      ["Reference ID", ctx.refId, "Generated Date", generatedDate],
      [],
      ["=== SECTION I: STATEMENT OF FINANCIAL POSITION (BALANCE SHEET) ===", "", "", ""],
      ["Line Item", "Classification", "Amount (KES)", "Notes"],
      ["Cash & Cash Equivalents", "Current Assets", bs.assets.current.subtotal.toFixed(2), "Bank, Mobile Till & CIC MMF"],
      ["Gross Loans Receivable", "Financial Assets", bs.assets.loans.grossLoans.toFixed(2), "Active Member Credit Book"],
      ["Less: SASRA Credit Loss Allowance", "Impairment Reserve", (-Math.abs(bs.assets.loans.lossAllowance)).toFixed(2), "Statutory Provision"],
      ["Net Loan Portfolio", "Financial Assets", bs.assets.loans.netLoans.toFixed(2), "Loans Net of Provisions"],
      ["External Financial Investments", "Investments", bs.assets.investments.subtotal.toFixed(2), "Mansa X, M-Akiba & Fixed Holdings"],
      ["TOTAL GROUP ASSETS", "Summary", bs.assets.totalAssets.toFixed(2), bs.isBalanced ? "Balanced" : "Variance Detected"],
      ["Total Liabilities", "Liabilities", bs.liabilities.subtotal.toFixed(2), "Payables, Accrued & Unallocated"],
      ["Accumulated Member Savings", "Members' Equity", bs.equity.memberSavings.toFixed(2), "Member Share Capital"],
      ["Statutory Reserve Fund (20%)", "Members' Equity", bs.equity.statutoryReserve.toFixed(2), "SASRA Sec 51(1) Indivisible Capital"],
      ["Retained Distributable Surplus", "Members' Equity", bs.equity.retainedSurplus.toFixed(2), "Undistributed Member Earnings"],
      ["TOTAL LIABILITIES & MEMBERS' EQUITY", "Summary", bs.totalLiabilitiesAndEquity.toFixed(2), "Variance: " + bs.variance.toFixed(2)],
      [],
      ["=== SECTION II: STATEMENT OF COMPREHENSIVE INCOME (P&L) ===", "", "", ""],
      ["Line Item", "Classification", "Amount (KES)", "Notes"],
      ["Operating Revenue", "Revenue", is.operatingRevenue.operatingSubtotal.toFixed(2), "Interest, Processing Fees & Fines"],
      ["Investment Yields", "Revenue", is.investmentYields.investmentSubtotal.toFixed(2), "CIC MMF & External Yield"],
      ["Total Comprehensive Revenue", "Summary", is.totalRevenue.toFixed(2), "Gross Operating Income"],
      ["Operating & Administrative Expenses", "Expenses", (-Math.abs(is.totalExpenses)).toFixed(2), "Bank, Tech, AGM & Admin"],
      ["Credit Impairment Loss Charge", "Provisions", (-Math.abs(is.loanLossProvisionCharge)).toFixed(2), "SASRA Sec 51 Provisioning"],
      ["Net Operating Surplus / (Deficit)", "Bottom Line", is.netOperatingSurplus.toFixed(2), "Period Net Surplus"],
      ["20% Statutory Reserve Appropriation", "Appropriation", is.appropriations.statutoryReserveTransfer.toFixed(2), "SASRA Sec 51(1) Reserve"],
      ["80% Distributable Member Surplus Pool", "Appropriation", is.appropriations.distributableMemberPool.toFixed(2), "Dividend Allocation Base"],
      [],
      ["=== SECTION III: TANGIBLE CAPITAL PROJECTS & EXTERNAL HOLDINGS SCHEDULE ===", "", "", ""],
      ["Project / Holding", "Category", "Carrying Value (KES)", "Status"]
    ];

    ctx.projectsSchedule.forEach(function (p) {
      rows.push([p.name, p.category, Number(p.value || 0).toFixed(2), p.status]);
    });
    rows.push(["Total Capital Projects & Holdings", "Summary", ctx.totalCapitalProjects.toFixed(2), "Verified"]);
    rows.push([]);
    rows.push(["=== SECTION IV: SASRA PRUDENTIAL & KEY FINANCIAL RATIOS ===", "", "", ""]);
    rows.push(["Ratio / Metric", "SASRA Benchmark", "Observed Value", "Status"]);
    ctx.ratios.forEach(function (r) {
      rows.push([r.label, r.benchmark, r.value, "Audited"]);
    });
    rows.push([]);
    rows.push(["=== SECTION V: 3-OFFICER STATUTORY SIGN-OFF ATTESTATIONS ===", "", "", ""]);
    rows.push(["Office", "Attestation Role", "Signature", "Date"]);
    rows.push(["Chairperson", "Approved By (Chairperson)", "____________________", "__________"]);
    rows.push(["Treasurer", "Prepared By (Treasurer)", "____________________", "__________"]);
    rows.push(["Secretary", "Attested By (Secretary)", "____________________", "__________"]);

    const csvContent = rows.map(function (r) {
      return r.map(safeCellText_).join(",");
    }).join("\r\n");

    if (typeof Blob !== "undefined" && typeof URL !== "undefined" && typeof URL.createObjectURL === "function") {
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "brightlife_agm_audit_pack_" + ctx.year + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (_) {} }, 500);
    }

    if (typeof showNotification === "function") {
      showNotification("AGM & Bank Audit Pack exported to CSV.", "success");
    }
    return csvContent;
  }
</script>
