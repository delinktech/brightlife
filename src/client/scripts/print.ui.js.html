<script>
  function escapePrintHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDateForLetterhead(d) {
    const dateObj = d instanceof Date ? d : new Date();
    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    const day = dateObj.getDate();
    const month = months[dateObj.getMonth()];
    const year = dateObj.getFullYear();
    return day + " " + month + " " + year;
  }

  function triggerBrowserPrint() {
    window.print();
  }

  function showPrintModal_(options) {
    const opts = options || {};
    const refEl = document.getElementById("print-ref-display");
    if (refEl) refEl.textContent = opts.refText || ("Ref: BLG-RPT-" + Date.now().toString(36).toUpperCase());
    const kpiEl = document.getElementById("print-kpi-row");
    if (kpiEl) {
      const baseGrid = opts.kpiGridClass || "grid grid-cols-3 gap-4 mb-6";
      kpiEl.className = baseGrid.indexOf("blg-avoid-break") !== -1 ? baseGrid : (baseGrid + " blg-avoid-break");
    }
    const signoffEl = document.getElementById("print-signoff-block");
    if (signoffEl) {
      signoffEl.classList.toggle("hidden", !opts.showSignoff || opts.signoffType === "treasurer");
    }
    const tSignoffEl = document.getElementById("print-treasurer-signoff-block");
    if (tSignoffEl) {
      tSignoffEl.classList.toggle("hidden", opts.signoffType !== "treasurer");
    }
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.remove("hidden");
    document.body.classList.add("print-modal-open");
  }

  function closePrintModal() {
    const modal = document.getElementById("printReportModal");
    if (modal) modal.classList.add("hidden");
    document.body.classList.remove("print-modal-open");

    const printArea = document.getElementById("blg-printable-area");
    if (printArea) {
      printArea.classList.remove("blg-receipt-slip");
    }

    // Clean up dynamic statement schedules and footers
    const footEl = document.getElementById("print-table-foot");
    if (footEl) footEl.innerHTML = "";
    const extraEl = document.getElementById("print-extra-schedules");
    if (extraEl) {
      extraEl.innerHTML = "";
      extraEl.classList.add("hidden");
    }
    const tSignoffEl = document.getElementById("print-treasurer-signoff-block");
    if (tSignoffEl) {
      tSignoffEl.innerHTML = "";
      tSignoffEl.classList.add("hidden");
    }
    const signoffEl = document.getElementById("print-signoff-block");
    if (signoffEl) signoffEl.classList.add("hidden");

    const badgeEl = document.getElementById("print-report-badge");
    if (badgeEl) {
      badgeEl.className = "px-3 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-slate-700 uppercase tracking-wider";
    }
  }

  function formatPrintStatementMoney_(val) {
    const num = Number(val) || 0;
    return "KES " + num.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderPrintStatementLoading_(message) {
    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "MEMBER FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = "Loading Record";
    document.getElementById("print-report-subtitle").textContent = message || "Fetching certified financial ledger from system...";

    const kpiContainer = document.getElementById("print-kpi-row");
    if (kpiContainer) {
      kpiContainer.className = "grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 blg-avoid-break";
      kpiContainer.innerHTML =
        '<div class="col-span-2 sm:col-span-4 p-4 bg-slate-50 rounded-xl border border-slate-200 animate-pulse flex items-center justify-center gap-3 text-slate-500 text-xs">' +
        '<i class="fas fa-circle-notch fa-spin text-sky-600 text-base"></i> ' + escapePrintHtml(message || "Loading official ledger entries...") +
        '</div>';
    }

    const thead = document.getElementById("print-table-head");
    if (thead) thead.innerHTML = "";
    const tbody = document.getElementById("print-table-body");
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-slate-400 text-xs"><i class="fas fa-spinner fa-spin mr-2"></i> Loading transactions...</td></tr>';
    const tfoot = document.getElementById("print-table-foot");
    if (tfoot) tfoot.innerHTML = "";
    const extra = document.getElementById("print-extra-schedules");
    if (extra) {
      extra.innerHTML = "";
      extra.classList.add("hidden");
    }
    const tSignoff = document.getElementById("print-treasurer-signoff-block");
    if (tSignoff) {
      tSignoff.innerHTML = "";
      tSignoff.classList.add("hidden");
    }
  }

  function renderPrintMemberStatementFromData_(stmt) {
    const s = stmt || {};
    const memberName = s.memberName || "Member";
    const memberId = s.memberId || "BLM";
    const nationalId = s.nationalId || "—";
    const status = s.status || "Active";
    const periodLabel = s.monthLabel || "All Time (Full Member History)";
    const dateFormatted = formatDateForLetterhead(new Date());

    const cleanId = String(memberId).replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
    const yyyymmdd = new Date().toISOString().slice(0, 10).replace(/-/g, "");
    const serial = Math.random().toString(36).substring(2, 6).toUpperCase();
    const refText = s.verificationRef || ("BLG-STMT-" + cleanId + "-" + yyyymmdd + "-" + serial);

    document.getElementById("print-date-display").textContent = dateFormatted;
    document.getElementById("print-report-title").textContent = "MEMBER FINANCIAL STATEMENT";
    document.getElementById("print-report-badge").textContent = status;
    document.getElementById("print-report-subtitle").textContent =
      "Official certified financial statement for " + memberName + " (" + memberId + " • NID: " + nationalId + ") | Period: " + periodLabel;

    // 4-Up KPI Cards:
    // 1. Total Accumulated Savings
    // 2. Net Free Savings (Unencumbered)
    // 3. Active Loan Balance
    // 4. Guarantor Liability
    const kpiContainer = document.getElementById("print-kpi-row");
    if (kpiContainer) {
      kpiContainer.className = "grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 blg-avoid-break";
      kpiContainer.innerHTML =
        '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
        '<div class="text-[10px] uppercase font-bold text-slate-400">Total Accumulated Savings</div>' +
        '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + formatPrintStatementMoney_(s.closingSavings) + '</div>' +
        '</div>' +
        '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
        '<div class="text-[10px] uppercase font-bold text-slate-400">Net Free Savings (Unencumbered)</div>' +
        '<div class="text-sm font-bold text-sky-700 font-mono tabular-nums mt-0.5">' + formatPrintStatementMoney_(s.netFreeSavings) + '</div>' +
        '</div>' +
        '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
        '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loan Balance</div>' +
        '<div class="text-sm font-bold text-rose-600 font-mono tabular-nums mt-0.5">' + formatPrintStatementMoney_(s.loanBalance) + '</div>' +
        '</div>' +
        '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
        '<div class="text-[10px] uppercase font-bold text-slate-400">Guarantor Liability</div>' +
        '<div class="text-sm font-bold text-purple-600 font-mono tabular-nums mt-0.5">' + formatPrintStatementMoney_(s.totalGuaranteed || 0) + '</div>' +
        '</div>';
    }

    // Chronological Transaction Ledger Table:
    // Header: Date | Ref / TID | Particulars | Channel | Money In (KES) | Money Out (KES) | Balance (KES)
    const thead = document.getElementById("print-table-head");
    if (thead) {
      thead.innerHTML =
        '<tr>' +
        '<th class="px-3 py-2.5">Date</th>' +
        '<th class="px-3 py-2.5">Ref / TID</th>' +
        '<th class="px-3 py-2.5">Particulars</th>' +
        '<th class="px-3 py-2.5">Channel</th>' +
        '<th class="px-3 py-2.5 text-right">Money In (KES)</th>' +
        '<th class="px-3 py-2.5 text-right">Money Out (KES)</th>' +
        '<th class="px-3 py-2.5 text-right">Balance (KES)</th>' +
        '</tr>';
    }

    // Body:
    // First row: Opening Balance Brought Forward
    // Itemized transactions with positive amounts in Money In, disbursements in Money Out, and running balance
    const openingSavings = Number(s.openingSavings) || 0;
    const openingLabel = s.startDate ? s.startDate : "B/F";

    let bodyHtml =
      '<tr class="bg-slate-50/70 font-semibold text-slate-800 border-b border-slate-200">' +
      '<td class="px-3 py-2.5 font-mono tabular-nums text-slate-500">' + escapePrintHtml(openingLabel) + '</td>' +
      '<td class="px-3 py-2.5 font-mono tabular-nums text-slate-400">' + escapePrintHtml(memberId) + '-OPN</td>' +
      '<td class="px-3 py-2.5 text-slate-800"><i class="fas fa-wallet text-slate-400 mr-1.5"></i> Opening Balance Brought Forward</td>' +
      '<td class="px-3 py-2.5 text-slate-400">—</td>' +
      '<td class="px-3 py-2.5 text-right font-mono tabular-nums text-slate-400">—</td>' +
      '<td class="px-3 py-2.5 text-right font-mono tabular-nums text-slate-400">—</td>' +
      '<td class="px-3 py-2.5 text-right font-mono tabular-nums font-bold text-slate-800">' + formatPrintStatementMoney_(openingSavings) + '</td>' +
      '</tr>';

    const txList = Array.isArray(s.transactions) ? s.transactions : [];
    if (txList.length > 0) {
      txList.forEach(function (tx) {
        const mIn = Number(tx.moneyIn) || 0;
        const mOut = Number(tx.moneyOut) || 0;
        bodyHtml +=
          '<tr>' +
          '<td class="px-3 py-2 font-mono tabular-nums text-slate-500">' + escapePrintHtml(tx.date || "—") + '</td>' +
          '<td class="px-3 py-2 font-mono tabular-nums text-slate-600">' + escapePrintHtml(tx.ref || tx.tid || "—") + '</td>' +
          '<td class="px-3 py-2 font-medium text-slate-800">' + escapePrintHtml(tx.particulars || tx.type || "Contribution") + '</td>' +
          '<td class="px-3 py-2 text-slate-600">' + escapePrintHtml(tx.channel || "—") + '</td>' +
          '<td class="px-3 py-2 text-right font-mono tabular-nums ' + (mIn > 0 ? "text-emerald-700 font-semibold" : "text-slate-400") + '">' + (mIn > 0 ? formatPrintStatementMoney_(mIn) : "—") + '</td>' +
          '<td class="px-3 py-2 text-right font-mono tabular-nums ' + (mOut > 0 ? "text-rose-700 font-semibold" : "text-slate-400") + '">' + (mOut > 0 ? formatPrintStatementMoney_(mOut) : "—") + '</td>' +
          '<td class="px-3 py-2 text-right font-mono tabular-nums font-bold text-slate-800">' + formatPrintStatementMoney_(tx.balance) + '</td>' +
          '</tr>';
      });
    } else {
      bodyHtml += '<tr><td colspan="7" class="text-center py-4 text-slate-400 italic">No additional transaction entries recorded in this period.</td></tr>';
    }

    const tbody = document.getElementById("print-table-body");
    if (tbody) tbody.innerHTML = bodyHtml;

    // Footer (<tfoot>): Total Inflows, Total Outflows, Certified Closing Balance with double underline.
    const tfoot = document.getElementById("print-table-foot");
    if (tfoot) {
      tfoot.innerHTML =
        '<tr class="border-t-2 border-slate-300 font-bold bg-slate-50/80 text-slate-900 border-b-4 border-double border-b-slate-900">' +
        '<td colspan="4" class="px-3 py-3 font-extrabold uppercase tracking-wider text-slate-900">' +
        'Total Inflows, Outflows &amp; Certified Closing Balance' +
        '</td>' +
        '<td class="px-3 py-3 text-right font-mono tabular-nums font-extrabold text-emerald-800">' +
        formatPrintStatementMoney_(s.totalMoneyIn || 0) +
        '</td>' +
        '<td class="px-3 py-3 text-right font-mono tabular-nums font-extrabold text-rose-800">' +
        ((Number(s.totalMoneyOut) || 0) > 0 ? formatPrintStatementMoney_(s.totalMoneyOut) : "—") +
        '</td>' +
        '<td class="px-3 py-3 text-right font-mono tabular-nums font-extrabold text-slate-950 text-sm">' +
        '<span class="border-b-2 border-double border-slate-900 pb-0.5">' + formatPrintStatementMoney_(s.closingSavings) + '</span>' +
        '</td>' +
        '</tr>';
    }

    // Active Loans Sub-schedule (if active loans exist)
    const extraContainer = document.getElementById("print-extra-schedules");
    const activeLoans = Array.isArray(s.activeLoans) ? s.activeLoans : [];
    if (extraContainer) {
      if (activeLoans.length > 0) {
        let loansHtml =
          '<div class="mt-6 mb-6 blg-avoid-break">' +
          '<div class="flex items-center gap-2 mb-2">' +
          '<i class="fas fa-file-invoice-dollar text-rose-600 text-sm"></i>' +
          '<h3 class="text-xs font-bold uppercase tracking-wider text-slate-800">Active Loans Sub-Schedule</h3>' +
          '</div>' +
          '<div class="border border-slate-200 rounded-xl overflow-hidden">' +
          '<table class="w-full text-left border-collapse text-xs">' +
          '<thead class="bg-slate-50 border-b border-slate-200 font-bold text-slate-700">' +
          '<tr>' +
          '<th class="px-3 py-2">Loan ID</th>' +
          '<th class="px-3 py-2 text-right">Requested</th>' +
          '<th class="px-3 py-2 text-right">Total Due</th>' +
          '<th class="px-3 py-2 text-right">Paid to Date</th>' +
          '<th class="px-3 py-2 text-right">Outstanding Balance</th>' +
          '<th class="px-3 py-2 text-center">Status</th>' +
          '</tr>' +
          '</thead>' +
          '<tbody class="divide-y divide-slate-100 text-slate-700">';

        activeLoans.forEach(function (ln) {
          loansHtml +=
            '<tr>' +
            '<td class="px-3 py-2 font-mono tabular-nums font-semibold text-slate-800">#' + escapePrintHtml(ln.loanId || "—") + '</td>' +
            '<td class="px-3 py-2 text-right font-mono tabular-nums text-slate-600">' + formatPrintStatementMoney_(ln.requestedAmount) + '</td>' +
            '<td class="px-3 py-2 text-right font-mono tabular-nums text-slate-700">' + formatPrintStatementMoney_(ln.repaymentAmount) + '</td>' +
            '<td class="px-3 py-2 text-right font-mono tabular-nums text-emerald-600 font-semibold">' + formatPrintStatementMoney_(ln.totalPaid) + '</td>' +
            '<td class="px-3 py-2 text-right font-mono tabular-nums text-rose-600 font-bold">' + formatPrintStatementMoney_(ln.balance) + '</td>' +
            '<td class="px-3 py-2 text-center font-bold text-xs">' +
            '<span class="inline-block px-2 py-0.5 rounded-full text-[10px] ' + (String(ln.status).toLowerCase() === "settled" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800") + '">' + escapePrintHtml(ln.status || "Active") + '</span>' +
            '</td>' +
            '</tr>';
        });

        loansHtml += '</tbody></table></div></div>';
        extraContainer.innerHTML = loansHtml;
        extraContainer.classList.remove("hidden");
      } else {
        extraContainer.innerHTML = "";
        extraContainer.classList.add("hidden");
      }
    }

    // Single-Officer "Certified by Treasurer" Verification Block:
    // Show official sign-off: "Certified as a true and complete record from the Bright Life Self Help Group Financial Ledger" with Treasurer Signature/Stamp line, Date, and Verification Ref.
    const tSignoff = document.getElementById("print-treasurer-signoff-block");
    if (tSignoff) {
      tSignoff.innerHTML =
        '<div class="mt-6 mb-5 pt-4 border-t-2 border-slate-300 text-xs text-slate-700 blg-avoid-break">' +
        '<div class="flex items-center justify-between pb-3 border-b border-slate-200">' +
        '<div class="flex items-center gap-2">' +
        '<i class="fas fa-certificate text-emerald-600 text-base"></i>' +
        '<span class="font-bold uppercase tracking-wider text-slate-800 text-[11px]">Certified Official Record</span>' +
        '</div>' +
        '<div class="text-[10px] font-mono text-slate-500">Verification Ref: <span class="font-bold text-slate-700">' + escapePrintHtml(refText) + '</span></div>' +
        '</div>' +
        '<p class="italic text-[11px] text-slate-600 mt-2.5">Certified as a true and complete record from the Bright Life Self Help Group Financial Ledger.</p>' +
        '<div class="mt-4 grid grid-cols-2 gap-8 text-[11px]">' +
        '<div>' +
        '<div class="text-[10px] uppercase tracking-wider font-bold text-slate-500">Certified By (Treasurer / Official Stamp)</div>' +
        '<div class="h-10 border-b border-slate-400 mt-1 flex items-end pb-1 font-mono text-slate-400 text-[10px]">Treasurer Signature &amp; Stamp</div>' +
        '<div class="text-[10px] text-slate-500 mt-1">Brightlife SHG Treasury Office</div>' +
        '</div>' +
        '<div>' +
        '<div class="text-[10px] uppercase tracking-wider font-bold text-slate-500">Certification Date</div>' +
        '<div class="h-10 border-b border-slate-400 mt-1 flex items-end pb-1 font-mono font-bold text-slate-800">' + escapePrintHtml(dateFormatted) + '</div>' +
        '<div class="text-[10px] text-slate-500 mt-1">System Verification Verified</div>' +
        '</div>' +
        '</div>' +
        '</div>';
      tSignoff.classList.remove("hidden");
    }

    showPrintModal_({
      showSignoff: false,
      signoffType: "treasurer",
      kpiGridClass: "grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6",
      refText: "Ref: " + refText
    });
  }

  function openPrintMemberStatement(memberId, options) {
    if (!memberId) {
      if (typeof showNotification === "function") {
        showNotification("Please select a valid member.", "warning");
      }
      return;
    }

    renderPrintStatementLoading_("Loading certified member financial ledger...");
    showPrintModal_({ refText: "Loading..." });

    const monthKey = (options && options.monthKey) || "all";
    const startDate = options && options.startDate;
    const endDate = options && options.endDate;

    if (typeof google === "undefined" || !google.script || !google.script.run) {
      const fallbackMember = (typeof currentMembers !== "undefined" ? currentMembers : []).find((m) => m.id === memberId);
      if (fallbackMember) {
        renderPrintMemberStatementFromData_({
          memberId: fallbackMember.id,
          memberName: fallbackMember.name,
          nationalId: fallbackMember.nationalId || "",
          status: fallbackMember.status || "Active",
          closingSavings: fallbackMember.savings || 0,
          openingSavings: fallbackMember.savings || 0,
          totalMoneyIn: 0,
          totalMoneyOut: 0,
          loanBalance: fallbackMember.loanBalance || 0,
          totalGuaranteed: fallbackMember.guaranteed || 0,
          netFreeSavings: Math.max(0, (fallbackMember.savings || 0) - (fallbackMember.guaranteed || 0)),
          monthLabel: "All Time (Full Member History)",
          transactions: [],
          activeLoans: []
        });
      }
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.success === false) {
          if (typeof showNotification === "function") {
            showNotification(res && res.error ? res.error : "Failed to load member statement data.", "error");
          }
          closePrintModal();
          return;
        }
        renderPrintMemberStatementFromData_(res);
      })
      .withFailureHandler(function (err) {
        if (typeof showNotification === "function") {
          showNotification("Statement load error: " + (err ? err.message : "Network error"), "error");
        }
        closePrintModal();
      })
      .getMemberMonthlyStatementData(memberId, monthKey, startDate, endDate);
  }

  function openPrintPersonalStatement() {
    const pData = window.latestPersonalFinancials || {};
    const user = pData.user || (typeof currentUser !== "undefined" ? currentUser : {}) || {};
    const memberId = user.memberId || user.id;

    // Show clean modal loading indicator - NO unsafe window.print() fallback!
    renderPrintStatementLoading_("Loading certified personal financial statement...");
    showPrintModal_({ refText: "Loading..." });

    if (!memberId) {
      if (typeof showNotification === "function") {
        showNotification("Personal member record not found. Please refresh your session.", "warning");
      }
      closePrintModal();
      return;
    }

    if (typeof google === "undefined" || !google.script || !google.script.run) {
      const summary = pData.personalSummary || {};
      renderPrintMemberStatementFromData_({
        memberId: memberId,
        memberName: user.name || "Member",
        nationalId: user.nationalId || "",
        status: user.status || "Active",
        closingSavings: summary.savings || 0,
        openingSavings: summary.savings || 0,
        totalMoneyIn: 0,
        totalMoneyOut: 0,
        loanBalance: summary.activeLoanBalance || 0,
        totalGuaranteed: pData.totalGuaranteedLiability || 0,
        netFreeSavings: Math.max(0, (summary.savings || 0) - (pData.totalGuaranteedLiability || 0)),
        monthLabel: "All Time (Full Member History)",
        transactions: (pData.contributions || []).map(function (c) {
          return {
            date: c.date,
            ref: c.tid || "—",
            particulars: c.type || "Contribution",
            channel: c.mode || "Bank",
            moneyIn: c.amount || 0,
            moneyOut: 0,
            balance: c.amount || 0
          };
        }),
        activeLoans: pData.loans || []
      });
      return;
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.success === false) {
          if (typeof showNotification === "function") {
            showNotification(res && res.error ? res.error : "Failed to load personal statement.", "error");
          }
          closePrintModal();
          return;
        }
        renderPrintMemberStatementFromData_(res);
      })
      .withFailureHandler(function (err) {
        if (typeof showNotification === "function") {
          showNotification("Statement load error: " + (err ? err.message : "Network error"), "error");
        }
        closePrintModal();
      })
      .getMemberMonthlyStatementData(memberId, "all");
  }

  function openPrintMembersReport() {
    const list = typeof currentMembers !== "undefined" ? currentMembers : [];
    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "MEMBERS FINANCIAL SUMMARY";
    document.getElementById("print-report-badge").textContent = "Members Directory";
    document.getElementById("print-report-subtitle").textContent =
      "Official summary of member savings, shareholding, active loans, and guarantor commitments (" + list.length + " members listed).";

    let totalSavings = 0;
    let totalLoanBalances = 0;
    list.forEach((m) => {
      totalSavings += Number(m.savings) || 0;
      totalLoanBalances += Number(m.loanBalance) || 0;
    });

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Group Savings</div>' +
      '<div class="text-sm font-bold text-emerald-600 font-mono tabular-nums mt-0.5">' + formatMoney(totalSavings) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Active Loan Balances</div>' +
      '<div class="text-sm font-bold text-amber-600 font-mono tabular-nums mt-0.5">' + formatMoney(totalLoanBalances) + '</div>' +
      '</div>' +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Registered Members</div>' +

  function numberToWordsKES(amount) {
    const num = Math.round(Number(amount) * 100) / 100;
    if (isNaN(num) || num <= 0) return "Kenya Shillings Zero Only";

    const ones = [
      "", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
      "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen",
      "Seventeen", "Eighteen", "Nineteen"
    ];
    const tens = [
      "", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"
    ];

    function convertGroup(n) {
      let out = "";
      if (n >= 100) {
        out += ones[Math.floor(n / 100)] + " Hundred ";
        n %= 100;
        if (n > 0) out += "and ";
      }
      if (n >= 20) {
        out += tens[Math.floor(n / 10)];
        n %= 10;
        if (n > 0) out += "-" + ones[n];
        out += " ";
      } else if (n > 0) {
        out += ones[n] + " ";
      }
      return out.trim();
    }

    const intPart = Math.floor(num);
    const cents = Math.round((num - intPart) * 100);

    if (intPart === 0 && cents > 0) {
      return "Kenya Shillings " + convertGroup(cents) + " Cents Only";
    }

    const billions = Math.floor(intPart / 1000000000);
    const millions = Math.floor((intPart % 1000000000) / 1000000);
    const thousands = Math.floor((intPart % 1000000) / 1000);
    const remainder = intPart % 1000;

    let words = "";
    if (billions > 0) words += convertGroup(billions) + " Billion ";
    if (millions > 0) words += convertGroup(millions) + " Million ";
    if (thousands > 0) words += convertGroup(thousands) + " Thousand ";
    if (remainder > 0) words += convertGroup(remainder) + " ";

    words = words.trim();
    let result = "Kenya Shillings " + words;
    if (cents > 0) {
      result += " and " + convertGroup(cents) + " Cents";
    }
    result += " Only";
    return result;
  }

    return '"' + s.replace(/"/g, '""') + '"';

  function gatherAgmAuditContext_() {
    const bs = window.latestBalanceSheetModel || null;
    const is = window.latestIncomeStatementModel || null;
    const analytics = window.latestHomeAnalyticsData || {};
    if (!bs || !is) {
      return null;
    }

    const rawProjects = Array.isArray(analytics.projects) ? analytics.projects : [];
    const projectsSchedule = rawProjects.length > 0
      ? rawProjects.map(function (p) {
          return {
            name: p.name || p.title || "Capital Project",
            category: p.category || p.type || "Tangible Capital Asset",
            status: p.status || "Active",
            value: Number(p.currentValue !== undefined ? p.currentValue : (p.amount || p.budget || 0))
          };
        })
      : [
          { name: "CIC Money Market Fund", category: "Liquid Treasury Reserve", status: "Active", value: Number(bs.assets.current.cicMmf || 0) },
          { name: "Mansa X Managed Fund", category: "External Financial Holding", status: "Active", value: Number(bs.assets.investments.mansaX || 0) },
          { name: "M-Akiba Treasury Bond", category: "Government Security", status: "Active", value: Number(bs.assets.investments.makiba || 0) },
          { name: "Fixed / Capital Projects", category: "Tangible & Fixed Holdings", status: "Active", value: Number(bs.assets.investments.fixedInvestments || 0) }
        ];

    const totalCapitalProjects = projectsSchedule.reduce(function (acc, item) {
      return acc + (Number(item.value) || 0);
    }, 0);

    const institutionalReserveRatio = bs.assets.totalAssets > 0
      ? (bs.equity.statutoryReserve / bs.assets.totalAssets) * 100
      : 0;
    const loanToSavingsRatio = bs.equity.memberSavings > 0
      ? (bs.assets.loans.grossLoans / bs.equity.memberSavings) * 100
      : 0;
    const netMarginPct = is.totalRevenue > 0
      ? (is.netOperatingSurplus / is.totalRevenue) * 100
      : 0;
    const cirRatioText = (is.totalRevenue <= 0 && is.totalExpenses > 0)
      ? ">100%"
      : (is.costToIncomeRatio.toFixed(1) + "%");
    const rawPar = analytics.parRatio !== undefined
      ? analytics.parRatio
      : (analytics.creditRisk && analytics.creditRisk.parRatio !== undefined ? analytics.creditRisk.parRatio : null);
    const parText = rawPar !== null && rawPar !== undefined ? (Number(rawPar).toFixed(1) + "%") : "N/A";

    return {
      bs: bs,
      is: is,
      year: new Date().getFullYear(),
      refId: "BLG-AGM-AUDIT-" + new Date().getFullYear() + "-VERIFIED",
      projectsSchedule: projectsSchedule,
      totalCapitalProjects: totalCapitalProjects,
      ratios: [
        { label: "Solvency Ratio (Assets / Obligations)", benchmark: ">= 100.0%", value: bs.solvencyDenominator > 0 ? (bs.solvencyRatio.toFixed(1) + "%") : "N/A" },
        { label: "Statutory Reserve / Total Assets", benchmark: ">= 10.0% (SASRA)", value: institutionalReserveRatio.toFixed(1) + "%" },
        { label: "Cost-to-Income Ratio (CIR)", benchmark: "<= 45.0%", value: cirRatioText },
        { label: "Net Operating Surplus Margin", benchmark: ">= 20.0%", value: netMarginPct.toFixed(1) + "%" },
        { label: "Loan-to-Savings Deployment Ratio", benchmark: "70.0% - 95.0%", value: loanToSavingsRatio.toFixed(1) + "%" },
        { label: "Portfolio at Risk (PAR > 30 Days)", benchmark: "<= 5.0%", value: parText }
      ]
    };
  }

    document.getElementById("print-date-display").textContent = formatDateForLetterhead(new Date());
    document.getElementById("print-report-title").textContent = "ANNUAL FINANCIAL STATEMENTS & AGM AUDIT PACK";
    document.getElementById("print-report-badge").textContent = "SASRA / IFRS AUDIT";
    document.getElementById("print-report-subtitle").textContent =
      "Consolidated Multi-Statement Report • Balance Sheet, P&L, Capital Projects & SASRA Prudential Ratios";

    const kpiContainer = document.getElementById("print-kpi-row");
    kpiContainer.innerHTML =
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Total Assets</div>' +
      '<div class="text-sm font-bold text-slate-900 font-mono tabular-nums mt-0.5">' + formatPrintBsMoney_(bs.assets.totalAssets) + "</div>" +
      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Members\' Equity</div>' +
      '<div class="text-sm font-bold text-indigo-700 font-mono tabular-nums mt-0.5">' + formatPrintBsMoney_(bs.equity.subtotal) + "</div>" +
      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Net Operating Surplus</div>' +
      '<div class="text-sm font-bold ' + (is.netOperatingSurplus >= 0 ? "text-emerald-700" : "text-rose-700") + ' font-mono tabular-nums mt-0.5">' + netText + "</div>" +
      "</div>" +
      '<div class="p-3 bg-slate-50 rounded-xl border border-slate-200">' +
      '<div class="text-[10px] uppercase font-bold text-slate-400">Solvency Ratio</div>' +
      '<div class="text-sm font-bold text-emerald-700 font-mono tabular-nums mt-0.5">' + (bs.solvencyDenominator > 0 ? bs.solvencyRatio.toFixed(1) + "%" : "N/A") + "</div>" +
      "</div>";

    document.getElementById("print-table-head").innerHTML =
      "<tr>" +
      '<th class="px-4 py-3">Audit Schedule / Line Item</th>' +
      '<th class="px-4 py-3">Classification / Benchmark</th>' +
      '<th class="px-4 py-3 text-right">Amount / Ratio</th>' +
      "</tr>";

    const secHdr = function (title) {
      return (
        '<tr class="bg-slate-100/90 border-t border-slate-200">' +
        '<td colspan="3" class="px-4 py-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-800">' + escapePrintHtml(title) + "</td>" +
        "</tr>"
      );
    };
    const row = function (label, note, valHtml, isSub) {
      return (
        '<tr class="' + (isSub ? "bg-slate-50/80 font-bold text-slate-900" : "text-slate-700") + '">' +
        '<td class="px-4 py-2 ' + (isSub ? "pl-6" : "pl-8") + '">' + escapePrintHtml(label) + "</td>" +
        '<td class="px-4 py-2 text-[11px] text-slate-500">' + escapePrintHtml(note) + "</td>" +
        '<td class="px-4 py-2 text-right font-mono tabular-nums ' + (isSub ? "font-bold text-slate-900" : "font-medium text-slate-800") + '">' + valHtml + "</td>" +
        "</tr>"
      );
    };

    const projectsHtml = ctx.projectsSchedule.map(function (p) {
      return row(p.name, p.category + " (" + p.status + ")", formatPrintBsMoney_(p.value), false);
    }).join("");

    const ratiosHtml = ctx.ratios.map(function (r) {
      return row(r.label, "Benchmark: " + r.benchmark, escapePrintHtml(r.value), false);
    }).join("");

    document.getElementById("print-table-body").innerHTML =
      secHdr("Section I: Statement of Financial Position (Balance Sheet)") +
      row("Cash & Cash Equivalents", "Bank, Mobile Till & CIC MMF", formatPrintBsMoney_(bs.assets.current.subtotal), false) +
      row("Gross Loans Receivable", "Active Member Credit Book", formatPrintBsMoney_(bs.assets.loans.grossLoans), false) +
      row("Less: SASRA Credit Loss Allowance", "Statutory Impairment Reserve", "(" + formatPrintBsMoney_(bs.assets.loans.lossAllowance) + ")", false) +
      row("Net Loan Portfolio", "Loans Net of Provisions", formatPrintBsMoney_(bs.assets.loans.netLoans), false) +
      row("External Financial Investments", "Mansa X, M-Akiba & Fixed Holdings", formatPrintBsMoney_(bs.assets.investments.subtotal), false) +
      row("TOTAL GROUP ASSETS", bs.isBalanced ? "Audit Equation Balanced" : "Variance Detected", formatPrintBsMoney_(bs.assets.totalAssets), true) +
      row("Total Liabilities", "Payables, Accrued & Unallocated", formatPrintBsMoney_(bs.liabilities.subtotal), false) +
      row("Accumulated Member Savings", "Member Share Capital", formatPrintBsMoney_(bs.equity.memberSavings), false) +
      row("Statutory Reserve Fund (20%)", "SASRA Sec 51(1) Indivisible Capital", formatPrintBsMoney_(bs.equity.statutoryReserve), false) +
      row("Retained Distributable Surplus", "Undistributed Member Earnings", formatPrintBsMoney_(bs.equity.retainedSurplus), false) +
      row("TOTAL LIABILITIES & MEMBERS' EQUITY", "Total Claims & Equity", formatPrintBsMoney_(bs.totalLiabilitiesAndEquity), true) +

      secHdr("Section II: Statement of Comprehensive Income (P&L)") +
      row("Operating Revenue", "Interest, Processing Fees & Fines", formatPrintBsMoney_(is.operatingRevenue.operatingSubtotal), false) +
      row("Investment Yields", "CIC MMF & External Yield", formatPrintBsMoney_(is.investmentYields.investmentSubtotal), false) +
      row("Total Comprehensive Revenue", "Gross Operating Income", formatPrintBsMoney_(is.totalRevenue), true) +
      row("Operating & Administrative Expenses", "Bank, Tech, AGM & Admin", "(" + formatPrintBsMoney_(is.totalExpenses) + ")", false) +
      row("Credit Impairment Loss Charge", "SASRA Sec 51 Provisioning", "(" + formatPrintBsMoney_(is.loanLossProvisionCharge) + ")", false) +
      row("Net Operating Surplus / (Deficit)", "Bottom-Line Period Performance", netText, true) +
      row("20% Statutory Reserve Appropriation", "Indivisible Institutional Capital", formatPrintBsMoney_(is.appropriations.statutoryReserveTransfer), false) +
      row("80% Distributable Member Surplus Pool", "Dividend / Rebate Allocation Base", formatPrintBsMoney_(is.appropriations.distributableMemberPool), true) +

      secHdr("Section III: Tangible Capital Projects & External Holdings Schedule") +
      projectsHtml +
      row("Total Capital Projects & Holdings", "Consolidated Schedule Total", formatPrintBsMoney_(ctx.totalCapitalProjects), true) +

      secHdr("Section IV: SASRA Prudential & Key Financial Ratios") +
      ratiosHtml;

    showPrintModal_({
      showSignoff: true,
      kpiGridClass: "grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6",
      refText: "Ref: " + ctx.refId
    });
  }

  function exportAgmAuditPackCSV() {
    const ctx = gatherAgmAuditContext_();
    if (!ctx) {
      if (typeof showNotification === "function") {
        showNotification("AGM Audit Pack data is still loading. Please open Group Overview first.", "warning");
      }
      return;
    }

    const bs = ctx.bs;
    const is = ctx.is;
    const generatedDate = new Date().toISOString().slice(0, 10);
    const rows = [
      ["BRIGHTLIFE SHG - CONSOLIDATED ANNUAL AGM & BANK AUDIT PACK", "", "", ""],
      ["Reference ID", ctx.refId, "Generated Date", generatedDate],
      [],
      ["=== SECTION I: STATEMENT OF FINANCIAL POSITION (BALANCE SHEET) ===", "", "", ""],
      ["Line Item", "Classification", "Amount (KES)", "Notes"],
      ["Cash & Cash Equivalents", "Current Assets", bs.assets.current.subtotal.toFixed(2), "Bank, Mobile Till & CIC MMF"],
      ["Gross Loans Receivable", "Financial Assets", bs.assets.loans.grossLoans.toFixed(2), "Active Member Credit Book"],
      ["Less: SASRA Credit Loss Allowance", "Impairment Reserve", (-Math.abs(bs.assets.loans.lossAllowance)).toFixed(2), "Statutory Provision"],
      ["Net Loan Portfolio", "Financial Assets", bs.assets.loans.netLoans.toFixed(2), "Loans Net of Provisions"],
      ["External Financial Investments", "Investments", bs.assets.investments.subtotal.toFixed(2), "Mansa X, M-Akiba & Fixed Holdings"],
      ["TOTAL GROUP ASSETS", "Summary", bs.assets.totalAssets.toFixed(2), bs.isBalanced ? "Balanced" : "Variance Detected"],
      ["Total Liabilities", "Liabilities", bs.liabilities.subtotal.toFixed(2), "Payables, Accrued & Unallocated"],
      ["Accumulated Member Savings", "Members' Equity", bs.equity.memberSavings.toFixed(2), "Member Share Capital"],
      ["Statutory Reserve Fund (20%)", "Members' Equity", bs.equity.statutoryReserve.toFixed(2), "SASRA Sec 51(1) Indivisible Capital"],
      ["Retained Distributable Surplus", "Members' Equity", bs.equity.retainedSurplus.toFixed(2), "Undistributed Member Earnings"],
      ["TOTAL LIABILITIES & MEMBERS' EQUITY", "Summary", bs.totalLiabilitiesAndEquity.toFixed(2), "Variance: " + bs.variance.toFixed(2)],
      [],
      ["=== SECTION II: STATEMENT OF COMPREHENSIVE INCOME (P&L) ===", "", "", ""],
      ["Line Item", "Classification", "Amount (KES)", "Notes"],
      ["Operating Revenue", "Revenue", is.operatingRevenue.operatingSubtotal.toFixed(2), "Interest, Processing Fees & Fines"],
      ["Investment Yields", "Revenue", is.investmentYields.investmentSubtotal.toFixed(2), "CIC MMF & External Yield"],
      ["Total Comprehensive Revenue", "Summary", is.totalRevenue.toFixed(2), "Gross Operating Income"],
      ["Operating & Administrative Expenses", "Expenses", (-Math.abs(is.totalExpenses)).toFixed(2), "Bank, Tech, AGM & Admin"],
      ["Credit Impairment Loss Charge", "Provisions", (-Math.abs(is.loanLossProvisionCharge)).toFixed(2), "SASRA Sec 51 Provisioning"],
      ["Net Operating Surplus / (Deficit)", "Bottom Line", is.netOperatingSurplus.toFixed(2), "Period Net Surplus"],
      ["20% Statutory Reserve Appropriation", "Appropriation", is.appropriations.statutoryReserveTransfer.toFixed(2), "SASRA Sec 51(1) Reserve"],
      ["80% Distributable Member Surplus Pool", "Appropriation", is.appropriations.distributableMemberPool.toFixed(2), "Dividend Allocation Base"],
      [],
      ["=== SECTION III: TANGIBLE CAPITAL PROJECTS & EXTERNAL HOLDINGS SCHEDULE ===", "", "", ""],
      ["Project / Holding", "Category", "Carrying Value (KES)", "Status"]
    ];

    ctx.projectsSchedule.forEach(function (p) {
      rows.push([p.name, p.category, Number(p.value || 0).toFixed(2), p.status]);
    });
    rows.push(["Total Capital Projects & Holdings", "Summary", ctx.totalCapitalProjects.toFixed(2), "Verified"]);
    rows.push([]);
    rows.push(["=== SECTION IV: SASRA PRUDENTIAL & KEY FINANCIAL RATIOS ===", "", "", ""]);
    rows.push(["Ratio / Metric", "SASRA Benchmark", "Observed Value", "Status"]);
    ctx.ratios.forEach(function (r) {
      rows.push([r.label, r.benchmark, r.value, "Audited"]);
    });
    rows.push([]);
    rows.push(["=== SECTION V: 3-OFFICER STATUTORY SIGN-OFF ATTESTATIONS ===", "", "", ""]);
    rows.push(["Office", "Attestation Role", "Signature", "Date"]);
    rows.push(["Chairperson", "Approved By (Chairperson)", "____________________", "__________"]);
    rows.push(["Treasurer", "Prepared By (Treasurer)", "____________________", "__________"]);
    rows.push(["Secretary", "Attested By (Secretary)", "____________________", "__________"]);

    const csvContent = rows.map(function (r) {
      return r.map(safeCellText_).join(",");
    }).join("\r\n");

    if (typeof Blob !== "undefined" && typeof URL !== "undefined" && typeof URL.createObjectURL === "function") {
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "brightlife_agm_audit_pack_" + ctx.year + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { try { URL.revokeObjectURL(url); } catch (_) {} }, 500);
    }

    if (typeof showNotification === "function") {
      showNotification("AGM & Bank Audit Pack exported to CSV.", "success");
    }
    return csvContent;
  }
</script>
