<script>
  let currentPage = 1;
  let rowsPerPage = 10;
  let totalPages = 1;
  let loadedContributions = [];
  let filteredContributions = [];
  let currentReceiptData = null;

  function renderStatusBadge(status) {
    if (typeof renderStatusPill === "function") {
      return renderStatusPill(status);
    }
    const s = String(status || "").toLowerCase().trim();
    if (s === "approved") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60">Approved</span>';
    }
    if (s === "pending") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60">Pending</span>';
    }
    if (s === "rejected") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60">Rejected</span>';
    }
    return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">' + (status || "—") + '</span>';
  }

  function renderTreasurerActions(c) {
    const isPrivileged = window.APP_PERMS && (window.APP_PERMS.role === "admin" || window.APP_PERMS.role === "treasurer" || window.APP_PERMS.contributionsWrite);
    const s = String(c.status || "").toLowerCase().trim();
    if (!isPrivileged) {
      return '<span class="text-slate-400 dark:text-slate-500 text-[10px]">—</span>';
    }
    if (s === "pending") {
      return (
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button type="button" onclick="verifyContributionStatus(\'' + escapeHtmlAttr(c.tid) + '\', ' + c.rowNumber + ', \'Approved\')" title="Approve & Verify Funds" class="min-w-[38px] min-h-[38px] inline-flex items-center justify-center rounded-lg bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 text-xs transition-colors">' +
        '<i class="fas fa-check text-xs"></i>' +
        '</button>' +
        '<button type="button" onclick="verifyContributionStatus(\'' + escapeHtmlAttr(c.tid) + '\', ' + c.rowNumber + ', \'Rejected\')" title="Reject Transaction" class="min-w-[38px] min-h-[38px] inline-flex items-center justify-center rounded-lg bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60 text-xs transition-colors">' +
        '<i class="fas fa-times text-xs"></i>' +
        '</button>' +
        '</div>'
      );
    }
    if (s === "approved") {
      return (
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button type="button" onclick="shareContributionWhatsApp(' + c.rowNumber + ')" title="Open WhatsApp Receipt" class="min-h-[38px] px-2.5 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 text-[11px] font-medium transition-colors inline-flex items-center gap-1.5">' +
        '<i class="fab fa-whatsapp text-emerald-700 dark:text-emerald-400"></i> Receipt' +
        '</button>' +
        '</div>'
      );
    }
    return '<span class="text-slate-500 dark:text-slate-400 text-[10px] font-mono"><i class="fas fa-shield-alt text-emerald-700 dark:text-emerald-400 text-[9px]"></i> Verified</span>';
  }

  async function verifyContributionStatus(tid, rowNumber, status) {
    const isApprove = String(status || "").toLowerCase() === "approved";
    const confirmed = await showConfirmDialog({
      title: "Confirm Transaction " + status,
      message: "Are you sure you want to mark transaction #" + (tid || rowNumber) + " as " + status + "?",
      confirmText: status,
      confirmClass: isApprove
        ? "bg-emerald-600 hover:bg-emerald-700 text-white"
        : "bg-rose-600 hover:bg-rose-700 text-white",
      iconType: isApprove ? "success" : "danger"
    });
    if (!confirmed) return;
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (!res || !res.success) {
          handleErr(res && res.error ? { message: res.error } : { message: "Failed to update status." });
          return;
        }
        if (typeof cacheClear === "function") {
          cacheClear("home_analytics");
          cacheClear("personal_financials");
          cacheClear("members_list");
        }
        loadContributions(currentPage);
        if (typeof refreshDashboard === "function") refreshDashboard(true);

        if (res.receipt) {
          if (res.receipt.emailSent) {
            showNotification("Transaction Approved! Receipt emailed to " + (res.receipt.recipientEmail || "member") + ".", "success");
          } else {
            showNotification("Transaction marked as " + status + ".", "success");
          }
          if (res.receipt.whatsAppUrl) {
            openReceiptWhatsAppModal(res.receipt);
          }
        } else {
          showNotification("Transaction marked as " + status + ".", "success");
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .updateContributionStatus({ tid: tid, rowNumber: rowNumber, status: status });
  }

  function shareContributionWhatsApp(rowNumber) {
    const c = (loadedContributions || []).find(function (item) { return item.rowNumber === rowNumber; });
    if (!c) return;

    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (res && res.success) {
          openReceiptWhatsAppModal(res);
        } else {
          showNotification("Could not generate receipt: " + ((res && res.error) || "Check member phone number."), "warning", 5000);
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .triggerTransactionReceipt({
        receiptNo: "BL-RCP-" + (c.tid || c.rowNumber),
        date: c.date,
        memberId: c.memberId,
        memberName: c.name,
        amount: c.amountRaw || c.amount,
        type: c.type,
        channel: c.mode,
        tid: c.tid,
        isLoanRepayment: c.type === "Loan Repayment" || c.type === "Loan Payment"
      });
  }

  function openReceiptWhatsAppModal(receiptData) {
    currentReceiptData = receiptData;
    const modal = document.getElementById("receiptShareModal");
    const preview = document.getElementById("receipt-text-preview");
    const phoneVal = document.getElementById("receipt-phone-val");
    const emailBanner = document.getElementById("receipt-email-status-banner");
    const emailText = document.getElementById("receipt-email-status-text");
    const openWaBtn = document.getElementById("btn-open-wa");

    if (preview) preview.innerText = receiptData.whatsAppText || "";
    if (phoneVal) phoneVal.innerText = receiptData.recipientPhone || "No phone recorded";

    if (emailBanner && emailText) {
      if (receiptData.emailSent) {
        emailBanner.className = "p-3 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-800 text-xs flex items-center gap-2";
        emailText.innerText = "Receipt emailed to " + receiptData.recipientEmail;
        emailBanner.classList.remove("hidden");
      } else if (receiptData.emailError) {
        emailBanner.className = "p-3 rounded-xl bg-amber-50 border border-amber-100 text-amber-800 text-xs flex items-center gap-2";
        emailText.innerText = "Email delivery note: " + receiptData.emailError;
        emailBanner.classList.remove("hidden");
      } else {
        emailBanner.classList.add("hidden");
      }
    }

    if (openWaBtn) {
      if (receiptData.whatsAppUrl) {
        openWaBtn.href = receiptData.whatsAppUrl;
        openWaBtn.classList.remove("opacity-50", "pointer-events-none");
      } else {
        openWaBtn.href = "#";
        openWaBtn.classList.add("opacity-50", "pointer-events-none");
      }
    }

    if (modal) modal.classList.remove("hidden");
  }

  function closeReceiptShareModal() {
    const modal = document.getElementById("receiptShareModal");
    if (modal) modal.classList.add("hidden");
  }

  function copyReceiptText() {
    if (!currentReceiptData || !currentReceiptData.whatsAppText) return;
    copyTextToClipboard(currentReceiptData.whatsAppText, document.getElementById("btn-copy-receipt"));
  }

  function getPaymentModeStyle(mode) {
    const m = (mode || "").toLowerCase().trim();
    if (m.indexOf("equity") !== -1) return "badge-info";
    if (m.indexOf("cic") !== -1) return "badge-success";
    if (m.indexOf("mansa") !== -1) return "badge-purple";
    if (m.indexOf("cash") !== -1) return "badge-warning";
    if (m.indexOf("refund") !== -1 || m.indexOf("offset") !== -1) return "badge-danger";
    if (m === "m-pesa" || m === "mpesa") return "badge-success";
    return "badge-secondary";
  }

  function renderContributionTable(data) {
    const container = document.getElementById("contribution-table-body");
    let html = "";
    (data || []).forEach((c) => {
      html +=
        '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
        '<td class="col-c-date px-4 py-3 font-mono text-xs text-slate-500 dark:text-slate-400">' +
        c.date +
        "</td>" +
        '<td class="col-c-member px-4 py-3 font-semibold text-xs text-slate-900 dark:text-white">' +
        c.name +
        "</td>" +
        '<td class="col-c-type px-4 py-3 text-xs text-slate-600 dark:text-slate-300">' +
        c.type +
        "</td>" +
        '<td class="col-c-amount px-4 py-3 text-right font-mono tabular-nums font-semibold text-xs text-slate-900 dark:text-slate-100">' +
        c.amount +
        "</td>" +
        '<td class="col-c-mode px-4 py-3 text-center"><span class="' +
        getPaymentModeStyle(c.mode) +
        '">' +
        c.mode +
        "</span></td>" +
        '<td class="col-c-status px-4 py-3 text-center">' +
        renderStatusBadge(c.status) +
        "</td>" +
        '<td class="col-c-actions px-4 py-3 text-center">' +
        renderTreasurerActions(c) +
        "</td></tr>";
    });
    container.innerHTML =
      html ||
      '<tr><td colspan="7" class="p-8 text-center text-slate-500 dark:text-slate-400">' +
      (loadedContributions.length > 0
        ? "No contributions match your search or filter criteria."
        : "No transactions found.") +
      "</td></tr>";

    if (typeof applySavedColumnPreferences === "function") {
      applySavedColumnPreferences("contributions-table");
    }
  }

  function filterContributionsTable(targetPage) {
    const searchEl = document.getElementById("c-search-input");
    const statusEl = document.getElementById("c-status-filter");
    const channelEl = document.getElementById("c-channel-filter");
    const q = (searchEl ? searchEl.value : "").toLowerCase().trim();
    const statusFilter = (statusEl ? statusEl.value : "all").toLowerCase().trim();
    const channelFilter = (channelEl ? channelEl.value : "all").toLowerCase().trim();

    filteredContributions = (loadedContributions || []).filter(function (c) {
      if (q) {
        const hay = [c.name, c.memberId, c.tid, c.type, c.mode, c.date].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (statusFilter && statusFilter !== "all") {
        const st = String(c.status || "Approved").toLowerCase().trim();
        if (st !== statusFilter) return false;
      }
      if (channelFilter && channelFilter !== "all") {
        const ch = String(c.mode || "").toLowerCase().trim();
        if (ch !== channelFilter) return false;
      }
      return true;
    });

    const totalRows = filteredContributions.length;
    totalPages = Math.max(1, Math.ceil(totalRows / rowsPerPage));
    const reqPage = Number(targetPage);
    currentPage = reqPage > 0 ? Math.min(totalPages, reqPage) : 1;

    const startIdx = (currentPage - 1) * rowsPerPage;
    const pageRows = filteredContributions.slice(startIdx, startIdx + rowsPerPage);

    renderContributionTable(pageRows);
    if (typeof renderTablePagination === "function") {
      renderTablePagination("contributions-pagination", {
        currentPage: currentPage,
        totalPages: totalPages,
        totalRows: totalRows,
        rowsPerPage: rowsPerPage,
        onPageChangeName: "setContributionsPage",
        onRowsPerPageChangeName: "setContributionsRowsPerPage",
        entityLabel: "contributions",
      });
    }
  }
  window.filterContributionsTable = filterContributionsTable;

  function setContributionsPage(page) {
    const p = Number(page) || 1;
    if (p < 1 || p > totalPages) return;
    filterContributionsTable(p);
  }
  window.setContributionsPage = setContributionsPage;

  function setContributionsRowsPerPage(limit) {
    const n = Number(limit);
    rowsPerPage = n > 0 ? n : 10;
    filterContributionsTable(1);
  }
  window.setContributionsRowsPerPage = setContributionsRowsPerPage;

  function loadContributions(page) {
    currentPage = Number(page) > 0 ? Number(page) : 1;
    startAppLoader();
    document.getElementById("contribution-table-body").innerHTML =
      typeof renderTableSkeleton === "function"
        ? renderTableSkeleton(7, 5)
        : '<tr><td colspan="7" class="px-6 py-6 text-center text-slate-400">Loading...</td></tr>';

    google.script.run
      .withSuccessHandler(function (response) {
        if (!response || !response.success) {
          stopAppLoader();
          loadedContributions = [];
          filteredContributions = [];
          renderContributionTable([]);
          if (typeof renderTablePagination === "function") {
            renderTablePagination("contributions-pagination", {
              currentPage: 1,
              totalPages: 1,
              totalRows: 0,
              rowsPerPage: rowsPerPage,
              onPageChangeName: "setContributionsPage",
              onRowsPerPageChangeName: "setContributionsRowsPerPage",
              entityLabel: "contributions",
            });
          }
          handleErr(response || { message: "Failed to load contributions" });
          return;
        }
        loadedContributions = response.contributions || [];
        filterContributionsTable(currentPage);
        stopAppLoader();
      })
      .withFailureHandler((err) => {
        stopAppLoader();
        handleErr(err);
      })
      .getContributionsData(1, 2000);
  }

  function changePage(direction) {
    setContributionsPage(currentPage + (Number(direction) || 0));
  }

  function setupContributionMemberCombobox() {
    const searchInput = document.getElementById("c-member-search");
    const hiddenInput = document.getElementById("c-member");
    const combobox = document.getElementById("c-member-combobox");
    if (!searchInput || !hiddenInput || !combobox) return;
    if (searchInput.dataset.comboBound === "true") return;
    searchInput.dataset.comboBound = "true";

    function renderList(filterText) {
      const q = (filterText || "").toLowerCase().trim();
      const list = (typeof currentMembers !== "undefined" && currentMembers) ? currentMembers : [];
      const matches = list.filter((m) => {
        if (!q) return true;
        const nameMatch = (m.name || "").toLowerCase().indexOf(q) !== -1;
        const idMatch = (m.id || "").toLowerCase().indexOf(q) !== -1;
        return nameMatch || idMatch;
      });

      if (!matches.length) {
        combobox.innerHTML = '<div class="px-3 py-2 text-xs text-slate-400 text-center">No matching members found</div>';
        combobox.classList.remove("hidden");
        return;
      }

      combobox.innerHTML = matches.map((m) => {
        const fullVal = m.fullName || (m.id + " — " + m.name);
        return (
          '<div class="custom-combobox-item" onclick="selectContributionMember(\'' +
          escapeHtmlAttr(fullVal) +
          '\', \'' +
          escapeHtmlAttr(m.name) +
          '\', \'' +
          escapeHtmlAttr(m.id) +
          '\')">' +
          '<span>' + m.name + '</span>' +
          '<span class="item-id">' + m.id + '</span>' +
          '</div>'
        );
      }).join("");
      combobox.classList.remove("hidden");
    }

    searchInput.addEventListener("focus", function() {
      renderList(this.value);
    });

    searchInput.addEventListener("input", function() {
      hiddenInput.value = this.value;
      renderList(this.value);
    });

    document.addEventListener("click", function(e) {
      if (!searchInput.contains(e.target) && !combobox.contains(e.target)) {
        combobox.classList.add("hidden");
      }
    });
  }

  let activeContributionBorrowerLoans = [];

  function fetchActiveLoansForContributionMember(name, id) {
    const loanWrapper = document.getElementById("c-loan-select-wrapper");
    const loanSelect = document.getElementById("c-loan-id");
    const badge = document.getElementById("c-loan-count-badge");
    const card = document.getElementById("c-loan-details-card");
    const cType = document.getElementById("c-type") ? document.getElementById("c-type").value : "Monthly Contribution";

    if (!loanWrapper || !loanSelect) return;
    if (cType !== "Loan Payment") {
      loanWrapper.classList.add("hidden");
      return;
    }

    loanSelect.innerHTML = '<option value="">Loading active loans...</option>';
    loanSelect.disabled = true;
    loanWrapper.classList.remove("hidden");
    if (badge) badge.innerText = "fetching...";
    if (card) card.classList.add("hidden");

    google.script.run
      .withSuccessHandler(function (res) {
        loanSelect.disabled = false;
        if (!res || !res.success || !res.loans || !res.loans.length) {
          loanSelect.innerHTML = '<option value="">No active loans found for this member</option>';
          if (badge) badge.innerText = "0 loans";
          activeContributionBorrowerLoans = [];
          return;
        }

        activeContributionBorrowerLoans = res.loans;
        if (badge) badge.innerText = res.loans.length + (res.loans.length === 1 ? " loan" : " loans");

        if (res.loans.length === 1) {
          const single = res.loans[0];
          loanSelect.innerHTML = '<option value="' + single.loanId + '" selected>#' + single.loanId + ' (Bal: ' + formatMoney(single.balance) + ')</option>';
          updateContributionLoanDetailsCard(single.loanId);
        } else {
          loanSelect.innerHTML = '<option value="">-- Select from ' + res.loans.length + ' active loans --</option>' +
            res.loans.map(function(l) {
              return '<option value="' + l.loanId + '">#' + l.loanId + ' — Outstanding: ' + formatMoney(l.balance) + ' (' + l.status + ')</option>';
            }).join("");
          if (card) card.classList.add("hidden");
        }
      })
      .withFailureHandler(function (err) {
        loanSelect.disabled = false;
        loanSelect.innerHTML = '<option value="">Failed to load loans</option>';
        if (badge) badge.innerText = "error";
      })
      .getMemberActiveLoans(id, name);
  }

  function updateContributionLoanDetailsCard(selectedLoanId) {
    const card = document.getElementById("c-loan-details-card");
    if (!card) return;
    if (!selectedLoanId) {
      card.classList.add("hidden");
      return;
    }
    const loan = activeContributionBorrowerLoans.find(function(l) { return l.loanId === selectedLoanId; });
    if (!loan) {
      card.classList.add("hidden");
      return;
    }

    const cRep = document.getElementById("c-card-repayment");
    const cPaid = document.getElementById("c-card-paid");
    const cBal = document.getElementById("c-card-balance");
    if (cRep) cRep.innerText = formatMoney(loan.repayment);
    if (cPaid) cPaid.innerText = formatMoney(loan.paid);
    if (cBal) cBal.innerText = formatMoney(loan.balance);
    card.classList.remove("hidden");
  }

  function onContributionTypeChanged(newType) {
    const loanWrapper = document.getElementById("c-loan-select-wrapper");
    const submitBtn = document.getElementById("c-submit-btn");
    const mName = document.getElementById("c-member") ? document.getElementById("c-member").value : "";
    const mId = document.getElementById("c-member-id") ? document.getElementById("c-member-id").value : "";

    if (newType === "Loan Payment") {
      if (submitBtn) submitBtn.innerText = "Submit Loan Payment";
      if (mName || mId) {
        fetchActiveLoansForContributionMember(mName, mId);
      } else if (loanWrapper) {
        loanWrapper.classList.remove("hidden");
        document.getElementById("c-loan-id").innerHTML = '<option value="">-- Please select member first --</option>';
      }
    } else {
      if (submitBtn) submitBtn.innerText = "Submit Transaction";
      if (loanWrapper) loanWrapper.classList.add("hidden");
      const card = document.getElementById("c-loan-details-card");
      if (card) card.classList.add("hidden");
    }
  }

  function selectContributionMember(fullVal, name, id) {
    const searchInput = document.getElementById("c-member-search");
    const hiddenInput = document.getElementById("c-member");
    const hiddenMid = document.getElementById("c-member-id");
    const combobox = document.getElementById("c-member-combobox");
    if (searchInput) searchInput.value = name + " (" + id + ")";
    if (hiddenInput) hiddenInput.value = fullVal;
    if (hiddenMid) hiddenMid.value = id;
    if (combobox) combobox.classList.add("hidden");

    const cType = document.getElementById("c-type") ? document.getElementById("c-type").value : "Monthly Contribution";
    if (cType === "Loan Payment") {
      fetchActiveLoansForContributionMember(name, id);
    }
  }

  function escapeHtmlAttr(str) {
    return String(str || "").replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function openContributionModal() {
    if (!window.APP_PERMS || !window.APP_PERMS.contributionsWrite) {
      showNotification("You do not have permission to post transactions.", "warning");
      return;
    }
    const modal = document.getElementById("contributionModal");
    document.getElementById("contributionForm").reset();
    
    const datePicker = document.getElementById("c-date") ? document.getElementById("c-date")._flatpickr : null;
    if (datePicker) datePicker.setDate(new Date());
    else document.getElementById("c-date").value = new Date().toISOString().split("T")[0];

    document.getElementById("c-member").value = "";
    document.getElementById("c-member-id").value = "";
    document.getElementById("c-member-search").value = "";
    setShadcnSelectValue("select-cmode-wrapper", "Equity Bank");
    setShadcnSelectValue("select-ctype-wrapper", "Monthly Contribution");

    const loanWrapper = document.getElementById("c-loan-select-wrapper");
    if (loanWrapper) loanWrapper.classList.add("hidden");
    const card = document.getElementById("c-loan-details-card");
    if (card) card.classList.add("hidden");
    const loanSelect = document.getElementById("c-loan-id");
    if (loanSelect) {
      loanSelect.onchange = function() {
        updateContributionLoanDetailsCard(this.value);
      };
    }
    const submitBtn = document.getElementById("c-submit-btn");
    if (submitBtn) submitBtn.innerText = "Submit Transaction";

    // Setup listener on shadcn select for transaction type (once)
    const cTypeWrapper = document.getElementById("select-ctype-wrapper");
    if (cTypeWrapper && cTypeWrapper.dataset.ctypeBound !== "true") {
      cTypeWrapper.dataset.ctypeBound = "true";
      const items = cTypeWrapper.querySelectorAll(".shadcn-dropdown-item");
      items.forEach(function(item) {
        item.addEventListener("click", function() {
          const val = this.getAttribute("data-value");
          onContributionTypeChanged(val);
        });
      });
    }

    if (typeof ensureMembersLoaded === "function") {
      ensureMembersLoaded().catch(function () {});
    }
    setupContributionMemberCombobox();
    modal.classList.remove("hidden");
  }

  function closeContributionModal() {
    document.getElementById("contributionModal").classList.add("hidden");
  }

  document.getElementById("contributionForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const btn = e.submitter || document.getElementById("c-submit-btn");
    btn.disabled = true;
    btn.innerText = "Submitting...";

    const tType = document.getElementById("c-type").value;
    const isLoanPayment = tType === "Loan Payment";

    if (isLoanPayment) {
      // Route through dedicated Loan Payment flow
      const payload = {
        borrower: document.getElementById("c-member").value,
        memberId: document.getElementById("c-member-id") ? document.getElementById("c-member-id").value : "",
        loanId: document.getElementById("c-loan-id") ? document.getElementById("c-loan-id").value : "",
        date: document.getElementById("c-date") ? document.getElementById("c-date").value : "",
        amount: document.getElementById("c-amount").value,
        mode: document.getElementById("c-mode").value,
        tid: document.getElementById("c-tid").value,
      };

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerText = "Submit Loan Payment";
          if (!res || !res.success) {
            handleErr(res && res.error ? { message: res.error } : { message: "Loan payment failed." });
            return;
          }
          if (typeof cacheClear === "function") {
            cacheClear("home_analytics");
            cacheClear("personal_financials");
            cacheClear("members_list");
          }
          closeContributionModal();
          loadContributions();
          if (typeof loadLoans === "function") loadLoans(1);
          if (typeof loadLoanRepayments === "function") loadLoanRepayments(1);
          if (typeof refreshDashboard === "function") refreshDashboard(true);
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerText = "Try Again";
          handleErr(err);
        })
        .processLoanPayment(payload);
    } else {
      // Route through standard Contribution flow
      const payload = {
        date: document.getElementById("c-date").value,
        amount: document.getElementById("c-amount").value,
        memberName: document.getElementById("c-member").value,
        memberId: document.getElementById("c-member-id") ? document.getElementById("c-member-id").value : "",
        mode: document.getElementById("c-mode").value,
        tid: document.getElementById("c-tid").value,
        type: tType,
      };

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerText = "Submit Transaction";
          if (!res || !res.success) {
            handleErr(res && res.error ? { message: res.error } : { message: "Transaction failed." });
            return;
          }
          if (typeof cacheClear === "function") {
            cacheClear("home_analytics");
            cacheClear("personal_financials");
            cacheClear("members_list");
          }
          closeContributionModal();
          loadContributions();
          if (typeof refreshDashboard === "function") refreshDashboard(true);
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerText = "Try Again";
          handleErr(err);
        })
        .saveContribution(payload);
    }
  });
</script>
