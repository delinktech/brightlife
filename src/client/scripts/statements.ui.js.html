<script>
/**
 * Member Statements & Receipts UI Controller
 * Brightlife Dashboard
 */

const statementsState = {
  overview: null,
  selectedMonthKey: null,
  previewMemberId: null,
  previewStatementData: null,
  currentPage: 1,
  pageSize: 20,
  filteredMembers: null
};

function formatKshStmt(val) {
  const num = Number(val) || 0;
  return "KES " + Math.round(num).toLocaleString();
}

function applyMonthlyStatementsData(data) {
  statementsState.overview = data;
  statementsState.selectedMonthKey = data.activeMonthKey;
  statementsState.currentPage = 1;
  statementsState.filteredMembers = null;
  renderMonthlyStatementsView(data);
}

function loadMonthlyStatementsView(monthKey, forceRefresh) {
  const tableBody = document.getElementById("stmt-members-table-body");
  const requestedMonth = monthKey || statementsState.selectedMonthKey || "";
  const cacheKey = "statements_overview_" + (requestedMonth || "latest");
  const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
  const cached = entry ? entry.data : null;
  const hasCached = Boolean(cached);
  const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

  if (hasCached) {
    applyMonthlyStatementsData(cached);
    if (isFresh) {
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Cached");
      return;
    }
    if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Syncing...");
  } else {
    if (tableBody) {
      tableBody.innerHTML =
        typeof renderTableSkeleton === "function"
          ? renderTableSkeleton(7, 5)
          : '<tr><td colspan="7" class="py-8 text-center text-slate-400">Loading members for statement dispatch...</td></tr>';
    }
    startAppLoader();
    if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Loading...");
  }

  google.script.run
    .withSuccessHandler(function (data) {
      if (!hasCached) stopAppLoader();
      if (!data) {
        if (hasCached && typeof setHeaderSyncState === "function") {
          setHeaderSyncState("cached", "Offline cache");
        }
        return;
      }
      if (typeof cacheSet === "function") {
        cacheSet(cacheKey, data, 5 * 60 * 1000);
        if (data.activeMonthKey && ("statements_overview_" + data.activeMonthKey) !== cacheKey) {
          cacheSet("statements_overview_" + data.activeMonthKey, data, 5 * 60 * 1000);
        }
      }
      applyMonthlyStatementsData(data);
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("synced");
    })
    .withFailureHandler(function (err) {
      if (!hasCached) {
        stopAppLoader();
        if (tableBody) {
          tableBody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-rose-700 dark:text-rose-400 font-medium">Failed to load statements: ' + escapeHtmlAttr(err.message) + '</td></tr>';
        }
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Sync error");
        handleErr(err);
      } else {
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Offline cache");
      }
    })
    .getMonthlyStatementsOverviewData(requestedMonth || undefined);
}

function renderMonthlyStatementsView(data) {
  if (!data) return;

  // 1. Month selector (hidden <select> + custom Tailwind dropdown)
  const monthSelect = document.getElementById("stmt-month-select");
  const monthLabelEl = document.getElementById("stmt-month-dropdown-label");
  const monthMenuEl = document.getElementById("stmt-month-dropdown-menu");
  if (monthSelect && data.availableMonths) {
    monthSelect.innerHTML = data.availableMonths.map(function (m) {
      const isSel = m.key === data.activeMonthKey ? "selected" : "";
      return '<option value="' + escapeHtmlAttr(m.key) + '" ' + isSel + '>' + escapeHtmlAttr(m.label) + '</option>';
    }).join("");

    const activeMonth = data.availableMonths.find(function (m) { return m.key === data.activeMonthKey; }) || data.availableMonths[0];
    if (monthLabelEl) {
      monthLabelEl.textContent = activeMonth ? activeMonth.label : "Select Period";
    }
    if (monthMenuEl) {
      monthMenuEl.innerHTML = data.availableMonths.map(function (m) {
        const isActive = m.key === data.activeMonthKey;
        return (
          '<button type="button" role="option" aria-selected="' + (isActive ? "true" : "false") + '" ' +
            'onclick="selectStatementMonth(\'' + escapeHtmlAttr(m.key) + '\')" ' +
            'class="w-full min-h-[36px] px-3 py-1.5 rounded-lg text-left text-xs flex items-center justify-between gap-2 transition-colors ' +
            (isActive
              ? 'bg-slate-100 dark:bg-slate-800 font-bold text-slate-900 dark:text-white'
              : 'text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 font-medium') + '">' +
            '<span>' + escapeHtmlAttr(m.label) + '</span>' +
            (isActive ? '<i class="fas fa-check text-[10px] text-emerald-700 dark:text-emerald-400"></i>' : '') +
          '</button>'
        );
      }).join("");
    }
  }

  // 2. KPIs
  const members = data.members || [];
  const withEmail = members.filter(function (m) { return m.hasEmail; }).length;
  const withPhone = members.filter(function (m) { return m.hasPhone; }).length;
  const emailPct = members.length > 0 ? Math.round((withEmail / members.length) * 100) : 0;
  const phonePct = members.length > 0 ? Math.round((withPhone / members.length) * 100) : 0;

  const elTotal = document.getElementById("stmt-kpi-total-members");
  const elEmail = document.getElementById("stmt-kpi-email-members");
  const elEmailPct = document.getElementById("stmt-kpi-email-pct");
  const elPhone = document.getElementById("stmt-kpi-phone-members");
  const elPhonePct = document.getElementById("stmt-kpi-phone-pct");
  const elBadge = document.getElementById("stmt-auto-email-badge");

  if (elTotal) elTotal.innerText = members.length;
  if (elEmail) elEmail.innerText = withEmail;
  if (elEmailPct) elEmailPct.innerText = emailPct + "% configured for email";
  if (elPhone) elPhone.innerText = withPhone;
  if (elPhonePct) elPhonePct.innerText = phonePct + "% ready for 1-click share";

  if (elBadge && data.settings) {
    if (typeof renderStatusPill === "function") {
      const isOn = Boolean(data.settings.autoEmailReceipts);
      elBadge.className = "inline-flex items-center";
      elBadge.innerHTML = renderStatusPill(isOn ? "Active" : "Paused", isOn ? "ACTIVE (ON)" : "PAUSED (OFF)");
    } else if (data.settings.autoEmailReceipts) {
      elBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-50 dark:bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30";
      elBadge.innerHTML = '<i class="fas fa-check-circle mr-1 text-[10px]"></i> ACTIVE (ON)';
    } else {
      elBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700";
      elBadge.innerHTML = '<i class="fas fa-pause-circle mr-1 text-[10px]"></i> PAUSED (OFF)';
    }
  }

  renderStatementMembersTable(members);
}

function renderStatementMembersTable(members) {
  const tableBody = document.getElementById("stmt-members-table-body");
  const renderedCount = document.getElementById("stmt-rendered-count");
  if (!tableBody) return;

  const fullList = Array.isArray(members) ? members : [];
  const total = fullList.length;
  const pageSize = statementsState.pageSize || 20;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (statementsState.currentPage > totalPages) statementsState.currentPage = totalPages;
  if (statementsState.currentPage < 1) statementsState.currentPage = 1;

  const startIdx = (statementsState.currentPage - 1) * pageSize;
  const endIdx = Math.min(startIdx + pageSize, total);
  const pageRows = fullList.slice(startIdx, endIdx);

  const infoEl = document.getElementById("stmt-pagination-info");
  const indEl = document.getElementById("stmt-page-indicator");
  const prevBtn = document.getElementById("btn-stmt-prev");
  const nextBtn = document.getElementById("btn-stmt-next");

  if (infoEl) {
    infoEl.textContent = total > 0
      ? "Showing " + (startIdx + 1) + "\u2013" + endIdx + " of " + total + " members"
      : "Showing 0\u20130 of 0 members";
  }
  if (indEl) indEl.textContent = "Page " + statementsState.currentPage + " of " + totalPages;
  if (prevBtn) prevBtn.disabled = statementsState.currentPage <= 1;
  if (nextBtn) nextBtn.disabled = statementsState.currentPage >= totalPages;

  if (!total) {
    tableBody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-500 dark:text-slate-400">No members found matching filter.</td></tr>';
    if (renderedCount) renderedCount.innerText = "0";
    return;
  }

  if (renderedCount) renderedCount.innerText = total;

  tableBody.innerHTML = pageRows.map(function (m) {
    const emailCell = m.hasEmail
      ? '<span class="text-slate-700 dark:text-slate-300 font-mono text-[11px]">' + escapeHtmlAttr(m.email) + '</span>'
      : '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] bg-rose-50 dark:bg-rose-500/15 text-rose-700 dark:text-rose-300 font-medium border border-rose-200 dark:border-rose-500/30"><i class="fas fa-exclamation-triangle mr-1 text-[9px]"></i> No email</span>';

    const phoneCell = m.hasPhone
      ? '<span class="text-slate-700 dark:text-slate-300 font-mono tabular-nums text-[11px]">' + escapeHtmlAttr(m.phone) + '</span>'
      : '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] bg-amber-50 dark:bg-amber-500/15 text-amber-700 dark:text-amber-300 font-medium border border-amber-200 dark:border-amber-500/30"><i class="fas fa-phone-slash mr-1 text-[9px]"></i> No phone</span>';

    const loanBalClass = m.loanBalance > 0 ? "text-amber-700 dark:text-amber-400 font-bold" : "text-slate-500 dark:text-slate-400";

    return (
      '<tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors">' +
        '<td class="py-3 px-3 text-center">' +
          '<input type="checkbox" class="stmt-member-checkbox rounded border-slate-300 dark:border-slate-600 text-emerald-600 focus:ring-emerald-500 cursor-pointer" ' +
            'value="' + escapeHtmlAttr(m.id) + '" data-has-email="' + m.hasEmail + '" data-name="' + escapeHtmlAttr(m.name) + '" onchange="updateSelectedStatementCount()" />' +
        '</td>' +
        '<td class="py-3 px-3">' +
          '<div class="font-bold text-slate-900 dark:text-white">' + escapeHtmlAttr(m.name) + '</div>' +
          '<div class="text-[10px] font-mono text-slate-500 dark:text-slate-400">' + escapeHtmlAttr(m.id) + '</div>' +
        '</td>' +
        '<td class="py-3 px-3">' + emailCell + '</td>' +
        '<td class="py-3 px-3">' + phoneCell + '</td>' +
        '<td class="py-3 px-3 text-right font-mono tabular-nums font-bold text-emerald-700 dark:text-emerald-400">' + formatKshStmt(m.savings) + '</td>' +
        '<td class="py-3 px-3 text-right font-mono tabular-nums ' + loanBalClass + '">' + (m.loanBalance > 0 ? formatKshStmt(m.loanBalance) : '—') + '</td>' +
        '<td class="py-3 px-3 text-center">' +
          '<div class="flex items-center justify-center gap-1.5">' +
            '<button type="button" onclick="previewMemberStatement(\'' + escapeHtmlAttr(m.id) + '\')" title="Preview Statement" ' +
              'class="min-h-[38px] px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium text-[11px] transition-colors inline-flex items-center gap-1.5">' +
              '<i class="fas fa-eye text-slate-500 dark:text-slate-400"></i> Preview' +
            '</button>' +
            '<button type="button" ' + (!m.hasEmail ? 'disabled ' : '') + 'onclick="sendSingleMemberStatement(\'' + escapeHtmlAttr(m.id) + '\')" title="' + (!m.hasEmail ? 'No email configured' : 'Send Email Statement') + '" ' +
              'class="min-h-[38px] px-2.5 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/70 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30 font-medium text-[11px] transition-colors inline-flex items-center gap-1.5 disabled:opacity-45 disabled:cursor-not-allowed">' +
              '<i class="fas fa-envelope text-emerald-700 dark:text-emerald-400"></i> Email' +
            '</button>' +
            '<button type="button" ' + (!m.hasPhone ? 'disabled ' : '') + 'onclick="sendSingleMemberWhatsApp(\'' + escapeHtmlAttr(m.id) + '\')" title="' + (!m.hasPhone ? 'No phone configured' : 'Send WhatsApp Statement') + '" ' +
              'class="min-h-[38px] px-2.5 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/70 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30 font-medium text-[11px] transition-colors inline-flex items-center gap-1.5 disabled:opacity-45 disabled:cursor-not-allowed">' +
              '<i class="fab fa-whatsapp text-emerald-700 dark:text-emerald-400"></i> WhatsApp' +
            '</button>' +
          '</div>' +
        '</td>' +
      '</tr>'
    );
  }).join("");

  updateSelectedStatementCount();
}

function toggleStatementMonthDropdown(forceOpen) {
  const menu = document.getElementById("stmt-month-dropdown-menu");
  const btn = document.getElementById("stmt-month-dropdown-btn");
  const chevron = document.getElementById("stmt-month-dropdown-chevron");
  if (!menu || !btn) return;
  const shouldOpen = typeof forceOpen === "boolean" ? forceOpen : menu.classList.contains("hidden");
  menu.classList.toggle("hidden", !shouldOpen);
  btn.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
  if (chevron) chevron.classList.toggle("rotate-180", shouldOpen);
}

function selectStatementMonth(monthKey) {
  const sel = document.getElementById("stmt-month-select");
  if (sel) sel.value = monthKey;
  toggleStatementMonthDropdown(false);
  changeStatementMonth();
}

if (typeof document !== "undefined" && !window.__stmtMonthDropdownListenersBound) {
  window.__stmtMonthDropdownListenersBound = true;
  document.addEventListener("click", function (e) {
    const wrapper = document.getElementById("stmt-month-dropdown");
    const menu = document.getElementById("stmt-month-dropdown-menu");
    if (!wrapper || !menu || menu.classList.contains("hidden")) return;
    if (!wrapper.contains(e.target)) {
      toggleStatementMonthDropdown(false);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      toggleStatementMonthDropdown(false);
    }
  });
}

function changeStatementMonth() {
  const sel = document.getElementById("stmt-month-select");
  if (!sel) return;
  statementsState.selectedMonthKey = sel.value;
  statementsState.currentPage = 1;
  statementsState.filteredMembers = null;
  loadMonthlyStatementsView(sel.value);
}

function filterStatementMembersTable() {
  const q = (document.getElementById("stmt-member-search")?.value || "").toLowerCase().trim();
  if (!statementsState.overview || !statementsState.overview.members) return;
  const filtered = statementsState.overview.members.filter(function (m) {
    if (!q) return true;
    return (m.name && m.name.toLowerCase().indexOf(q) !== -1) ||
           (m.id && m.id.toLowerCase().indexOf(q) !== -1) ||
           (m.email && m.email.toLowerCase().indexOf(q) !== -1);
  });
  statementsState.currentPage = 1;
  statementsState.filteredMembers = filtered;
  renderStatementMembersTable(filtered);
}

function prevStatementsPage() {
  if (statementsState.currentPage > 1) {
    statementsState.currentPage--;
    const list = statementsState.filteredMembers || (statementsState.overview && statementsState.overview.members) || [];
    renderStatementMembersTable(list);
  }
}

function nextStatementsPage() {
  const list = statementsState.filteredMembers || (statementsState.overview && statementsState.overview.members) || [];
  const totalPages = Math.max(1, Math.ceil(list.length / (statementsState.pageSize || 20)));
  if (statementsState.currentPage < totalPages) {
    statementsState.currentPage++;
    renderStatementMembersTable(list);
  }
}

function toggleSelectAllStatementMembers() {
  const master = document.getElementById("stmt-select-all");
  const cbs = document.querySelectorAll(".stmt-member-checkbox");
  cbs.forEach(function (cb) {
    cb.checked = master.checked;
  });
  updateSelectedStatementCount();
}

function updateSelectedStatementCount() {
  const cbs = document.querySelectorAll(".stmt-member-checkbox:checked");
  const countSpan = document.getElementById("stmt-selected-count");
  if (countSpan) countSpan.innerText = cbs.length;
}

function previewMemberStatement(memberId) {
  statementsState.previewMemberId = memberId;
  const modal = document.getElementById("stmt-preview-modal");
  const container = document.getElementById("stmt-preview-container");
  const title = document.getElementById("stmt-preview-title");
  const emailVal = document.getElementById("stmt-preview-email-val");
  const waBtn = document.getElementById("stmt-preview-wa-btn");
  const emailBtn = document.getElementById("stmt-preview-email-btn");

  if (modal) modal.classList.remove("hidden");
  if (container) {
    container.innerHTML = '<div class="p-8 text-center text-slate-500 dark:text-slate-400"><i class="fas fa-spinner fa-spin text-xl mb-2"></i><br>Generating official statement...</div>';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        if (container) container.innerHTML = '<div class="p-6 text-center text-rose-700 dark:text-rose-400 font-semibold">' + ((res && res.error) || 'Failed to generate statement.') + '</div>';
        return;
      }

      statementsState.previewStatementData = res.statementData;
      const stmt = res.statementData;

      if (title) title.innerText = stmt.memberName + " — " + stmt.monthLabel;
      if (emailVal) emailVal.innerText = stmt.email || "No email";

      if (container) {
        const iframe = document.createElement("iframe");
        iframe.style.width = "100%";
        iframe.style.height = "520px";
        iframe.style.border = "none";
        iframe.style.borderRadius = "8px";
        container.innerHTML = "";
        container.appendChild(iframe);
        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(res.htmlBody || buildClientSideStatementHtml_(stmt));
        doc.close();
      }

      if (waBtn) {
        waBtn.disabled = !isValidWhatsAppUrl_(res.whatsAppUrl);
        waBtn.title = res.whatsAppUrl ? "Send via WhatsApp" : "No phone configured";
        waBtn.onclick = function () {
          if (isValidWhatsAppUrl_(res.whatsAppUrl)) {
            openWhatsAppUrlFromClick_(res.whatsAppUrl, stmt.memberName);
          } else {
            showNotification("Member does not have a valid phone number for WhatsApp.", "warning", 5000);
          }
        };
      }

      if (emailBtn) {
        emailBtn.disabled = !stmt.email;
        emailBtn.onclick = function () {
          sendSingleMemberStatement(memberId);
        };
      }
    })
    .withFailureHandler(function (err) {
      if (container) container.innerHTML = '<div class="p-6 text-center text-rose-700 dark:text-rose-400 font-semibold">' + escapeHtmlAttr(err.message) + '</div>';
      handleErr(err);
    })
    .sendMemberMonthlyStatement({
      memberId: memberId,
      monthKey: statementsState.selectedMonthKey,
      sendEmail: false
    });
}

function closeStatementPreviewModal() {
  const modal = document.getElementById("stmt-preview-modal");
  if (modal) modal.classList.add("hidden");
}

async function sendSingleMemberStatement(memberId) {
  const confirmed = await showConfirmDialog({
    title: "Send Monthly Statement",
    message: "Send certified monthly statement to member " + memberId + " via email?",
    confirmText: "Send Email",
    confirmClass: "bg-emerald-700 hover:bg-emerald-800 dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-semibold",
    iconType: "info"
  });
  if (!confirmed) return;
  startAppLoader();
  google.script.run
    .withSuccessHandler(function (res) {
      stopAppLoader();
      if (res && res.success && res.emailSent) {
        if (typeof cacheClear === "function") cacheClear("statements_overview_");
        showNotification("Statement successfully emailed to " + (res.recipientEmail || memberId), "success");
      } else if (res && res.emailError) {
        if (res.emailError.indexOf("auth/script.send_mail") !== -1) {
          showNotification("Authorization Required: Google requires you to approve email sending permissions for this dashboard. Please refresh your browser or re-open the web app link to complete Google's 1-time authorization prompt.", "warning", 8000);
        } else {
          showNotification("Email could not be delivered: " + res.emailError, "error", 6000);
        }
      } else {
        showNotification((res && res.error) || "Failed to send email statement.", "error", 6000);
      }
    })
    .withFailureHandler(function (err) {
      stopAppLoader();
      handleErr(err);
    })
    .sendMemberMonthlyStatement({
      memberId: memberId,
      monthKey: statementsState.selectedMonthKey,
      sendEmail: true
    });
}

function isValidWhatsAppUrl_(url) {
  return typeof url === "string" && /^https:\/\/(wa\.me|api\.whatsapp\.com)\//i.test(url.trim());
}

function showWhatsAppFallbackLink_(url, memberName) {
  if (!isValidWhatsAppUrl_(url)) {
    showNotification("Invalid WhatsApp URL returned for " + (memberName || "member") + ".", "error", 5000);
    return;
  }
  const safeUrl = url.trim();
  const safeName = memberName ? String(memberName) : "member";
  showNotification("Popup blocked for " + safeName + ". Click below to launch WhatsApp.", "warning", 10000, {
    actionLabel: "Open WhatsApp",
    actionIcon: "fab fa-whatsapp",
    actionUrl: safeUrl
  });
}

function openWhatsAppUrlFromClick_(url, memberName) {
  if (!isValidWhatsAppUrl_(url)) {
    showNotification("Invalid WhatsApp URL returned for " + (memberName || "member") + ".", "error", 5000);
    return;
  }
  const safeUrl = url.trim();
  let opened = null;
  try {
    opened = window.open(safeUrl, "_blank", "noopener,noreferrer");
  } catch (e) {
    opened = null;
  }
  if (!opened) {
    showWhatsAppFallbackLink_(safeUrl, memberName);
  }
}

function sendSingleMemberWhatsApp(memberId) {
  const members = statementsState.overview && Array.isArray(statementsState.overview.members)
    ? statementsState.overview.members
    : [];
  const memberObj = members.find(function (m) { return String(m.id) === String(memberId); });
  if (memberObj && !memberObj.hasPhone) {
    showNotification("Member does not have a valid phone number. Please update their phone in Members tab.", "warning", 5000);
    return;
  }
  const memberName = (memberObj && memberObj.name) || memberId;

  startAppLoader();
  google.script.run
    .withSuccessHandler(function (res) {
      stopAppLoader();
      if (res && res.whatsAppUrl) {
        const resolvedName = (res.statementData && res.statementData.memberName) || memberName;
        openWhatsAppUrlFromClick_(res.whatsAppUrl, resolvedName);
      } else {
        showNotification("Member does not have a valid phone number. Please update their phone in Members tab.", "warning", 5000);
      }
    })
    .withFailureHandler(function (err) {
      stopAppLoader();
      handleErr(err);
    })
    .sendMemberMonthlyStatement({
      memberId: memberId,
      monthKey: statementsState.selectedMonthKey,
      sendEmail: false
    });
}

function confirmBulkEmailStatements() {
  const cbs = Array.from(document.querySelectorAll(".stmt-member-checkbox:checked"));
  if (cbs.length === 0) {
    showNotification("Please select at least one member to send statements to.", "warning", 4000);
    return;
  }

  const total = cbs.length;
  const withEmail = cbs.filter(function (cb) { return cb.getAttribute("data-has-email") === "true"; }).length;
  const noEmail = total - withEmail;

  const modal = document.getElementById("stmt-bulk-modal");
  const elPeriod = document.getElementById("stmt-bulk-period-label");
  const elSel = document.getElementById("bulk-selected-count");
  const elWithEmail = document.getElementById("bulk-with-email-count");
  const elNoEmail = document.getElementById("bulk-no-email-count");
  const prog = document.getElementById("bulk-progress-container");
  const btn = document.getElementById("btn-execute-bulk-email");

  const selMonth = document.getElementById("stmt-month-select");
  const monthText = selMonth ? selMonth.options[selMonth.selectedIndex]?.text : statementsState.selectedMonthKey;

  if (elPeriod) elPeriod.innerText = "Period: " + (monthText || "Current");
  if (elSel) elSel.innerText = total;
  if (elWithEmail) elWithEmail.innerText = withEmail;
  if (elNoEmail) elNoEmail.innerText = noEmail;
  if (prog) prog.classList.add("hidden");
  if (btn) {
    btn.disabled = withEmail === 0;
    btn.innerHTML = '<i class="fas fa-paper-plane text-xs"></i> <span>Send ' + withEmail + ' Email(s)</span>';
  }

  if (modal) modal.classList.remove("hidden");
}

function closeBulkEmailModal() {
  const modal = document.getElementById("stmt-bulk-modal");
  if (modal) modal.classList.add("hidden");
}

async function sendBulkStatements() {
  const cbs = Array.from(document.querySelectorAll(".stmt-member-checkbox:checked"));
  if (cbs.length === 0) {
    showNotification("Please select at least one member to send statements to.", "warning", 4000);
    return;
  }
  const withEmail = cbs.filter(function (cb) { return cb.getAttribute("data-has-email") === "true"; }).length;
  if (withEmail === 0) {
    showNotification("None of the selected members have an email address on file.", "warning", 4500);
    return;
  }
  const confirmed = await showConfirmDialog({
    title: "Confirm Bulk Dispatch",
    message: "Dispatch monthly financial statements by email to " + withEmail + " selected member(s)?",
    confirmText: "Send Statements",
    confirmClass: "bg-emerald-700 hover:bg-emerald-800 dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-semibold",
    iconType: "info"
  });
  if (confirmed) {
    executeBulkEmailDispatch();
  }
}

function executeBulkEmailDispatch() {
  const cbs = Array.from(document.querySelectorAll(".stmt-member-checkbox:checked"));
  const memberIds = cbs.map(function (cb) { return cb.value; });
  const prog = document.getElementById("bulk-progress-container");
  const bar = document.getElementById("bulk-progress-bar");
  const status = document.getElementById("bulk-progress-status");
  const btn = document.getElementById("btn-execute-bulk-email");

  if (prog) prog.classList.remove("hidden");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> <span>Dispatching...</span>';
  }
  if (bar) bar.style.width = "40%";
  if (status) status.innerText = "Processing batch...";

  google.script.run
    .withSuccessHandler(function (res) {
      if (bar) bar.style.width = "100%";
      if (status) status.innerText = "Complete!";
      setTimeout(function () {
        closeBulkEmailModal();
        if (res && res.success && res.results) {
          if (typeof cacheClear === "function") cacheClear("statements_overview_");
          showNotification(
            "Bulk Statements Dispatched! Sent: " + res.results.sent + ", Skipped: " + res.results.skippedNoEmail + ", Failed: " + res.results.failed,
            "success"
          );
        } else {
          showNotification((res && res.error) || "Bulk dispatch failed.", "error", 6000);
        }
      }, 800);
    })
    .withFailureHandler(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane text-xs"></i> <span>Retry</span>';
      }
      if (prog) prog.classList.add("hidden");
      handleErr(err);
    })
    .sendBulkMonthlyStatements({
      monthKey: statementsState.selectedMonthKey,
      memberIds: memberIds
    });
}

function openNotificationSettingsModal() {
  const modal = document.getElementById("stmt-settings-modal");
  const chkAuto = document.getElementById("setting-auto-email");
  const inpBcc = document.getElementById("setting-bcc-email");

  if (statementsState.overview && statementsState.overview.settings) {
    const s = statementsState.overview.settings;
    if (chkAuto) chkAuto.checked = Boolean(s.autoEmailReceipts);
    if (inpBcc) inpBcc.value = s.notificationBcc || "";
  }

  if (modal) modal.classList.remove("hidden");
}

function closeNotificationSettingsModal() {
  const modal = document.getElementById("stmt-settings-modal");
  if (modal) modal.classList.add("hidden");
}

function handleSaveNotificationSettings(e) {
  if (e && e.preventDefault) e.preventDefault();
  const chkAuto = document.getElementById("setting-auto-email");
  const inpBcc = document.getElementById("setting-bcc-email");
  const btn = document.getElementById("btn-save-settings");

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> <span>Saving...</span>';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Settings</span>';
      }
      closeNotificationSettingsModal();
      if (res && res.success) {
        if (typeof cacheClear === "function") cacheClear("statements_overview_");
        showNotification("Notification settings saved successfully!", "success");
        loadMonthlyStatementsView(statementsState.selectedMonthKey, true);
      } else {
        showNotification((res && res.error) || "Failed to save notification settings.", "error", 6000);
      }
    })
    .withFailureHandler(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Settings</span>';
      }
      handleErr(err);
    })
    .saveNotificationSettings({
      autoEmailReceipts: chkAuto ? chkAuto.checked : true,
      notificationBcc: inpBcc ? inpBcc.value.trim() : ""
    });
}

  return '<div style="font-family:sans-serif;padding:20px;color:#1e293b;">' +

    '<p style="color:#64748b;margin:4px 0 16px 0;">Monthly Financial Statement • ' + (stmt.monthLabel || "") + '</p>' +
    '<div style="background:#f8fafc;padding:12px;border-radius:8px;margin-bottom:16px;">' +
      '<strong>Member:</strong> ' + mNameUpper + ' (' + stmt.memberId + ')<br>' +
      '<strong>Email:</strong> ' + (stmt.email || "—") + '<br>' +
      '<strong>Phone:</strong> ' + (stmt.phone || "—") +
    '</div>' +
    '<div style="display:flex;gap:12px;margin-bottom:16px;">' +
      '<div style="flex:1;background:#f0fdf4;padding:12px;border-radius:8px;border:1px solid #bbf7d0;">' +
        '<div style="font-size:11px;color:#166534;font-weight:bold;">TOTAL SAVINGS</div>' +
        '<div style="font-size:20px;font-weight:bold;color:#047857;">' + formatKshStmt(stmt.closingSavings) + '</div>' +
      '</div>' +
      '<div style="flex:1;background:#fef2f2;padding:12px;border-radius:8px;border:1px solid #fecaca;">' +
        '<div style="font-size:11px;color:#991b1b;font-weight:bold;">LOAN BALANCE</div>' +
        '<div style="font-size:20px;font-weight:bold;color:#dc2626;">' + formatKshStmt(stmt.loanBalance) + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}
</script>
