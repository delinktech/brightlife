<script>
/**
 * Dividends & Yields UI Controller
 * Brightlife Dashboard
 */

const dividendsState = {
  overview: null,
  simulation: null,
  fundStatementsPage: 1,
  fundStatementsPageSize: 20
};

function formatKshDiv(val) {
  const num = Number(val) || 0;
  return "KES " + Math.round(num).toLocaleString();
}

function populateDividendYearOptions() {
  const select = document.getElementById("div-sim-year");
  if (!select) return;
  const currentYear = new Date().getFullYear();
  const minYear = 2021;
  const previousValue = select.value;
  const optionsHtml = [];
  for (let y = currentYear; y >= minYear; y--) {
    const val = String(y);
    const isSelected = previousValue ? previousValue === val : y === currentYear;
    optionsHtml.push(
      '<option value="' + val + '"' + (isSelected ? " selected" : "") + ">Financial Year " + val + "</option>"
    );
  }
  select.innerHTML = optionsHtml.join("");
}

populateDividendYearOptions();

function applyDividendOverviewData(res) {
  dividendsState.overview = res;
  const s = res.summary || {};

  const kpiEarnings = document.getElementById("div-kpi-total-earnings");
  const kpiLoanInt = document.getElementById("div-kpi-loan-interest");
  const kpiInvestGains = document.getElementById("div-kpi-invest-gains");
  const kpiSavings = document.getElementById("div-kpi-total-savings");
  const kpiMemberCount = document.getElementById("div-kpi-member-count");
  const simPoolInput = document.getElementById("div-sim-pool");

  if (kpiEarnings) kpiEarnings.textContent = formatKshDiv(s.suggestedPool);
  if (kpiLoanInt) kpiLoanInt.textContent = formatKshDiv(s.totalLoanInterest);
  if (kpiInvestGains) kpiInvestGains.textContent = formatKshDiv(s.totalInvestmentGains);
  if (kpiSavings) kpiSavings.textContent = formatKshDiv(s.totalGroupSavings);
  if (kpiMemberCount) kpiMemberCount.textContent = "Across " + (s.qualifyingMemberCount || 0) + " qualifying members";

  // Pre-fill pool amount if empty
  if (simPoolInput && (!simPoolInput.value || Number(simPoolInput.value) === 0)) {
    simPoolInput.value = s.suggestedPool || 0;
  }

  // Render Fund Statements table (reset to page 1 on fresh overview load)
  dividendsState.fundStatementsPage = 1;
  renderFundStatementsTable(res.fundStatements || []);
}

function loadDividendOverview(forceRefresh) {
  populateDividendYearOptions();
  const cacheKey = "dividends_overview";
  const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
  const cached = entry ? entry.data : null;
  const hasCached = Boolean(cached);
  const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

  if (hasCached) {
    applyDividendOverviewData(cached);
    if (isFresh) {
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Cached");
      return;
    }
    if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Syncing...");
  } else {
    const stmtTbody = document.getElementById("fund-statements-table-body");
    if (stmtTbody) {
      stmtTbody.innerHTML =
        typeof renderTableSkeleton === "function"
          ? renderTableSkeleton(9, 4)
          : '<tr><td colspan="9" class="py-6 text-center text-slate-400">Loading fund statements...</td></tr>';
    }
    startAppLoader();
    if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Loading...");
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!hasCached) stopAppLoader();
      if (!res || !res.success) {
        if (!hasCached) {
          if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Sync error");
          showNotification((res && res.error) || "Failed to load dividend overview.", "error");
        } else {
          if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Offline cache");
        }
        return;
      }

      if (typeof cacheSet === "function") cacheSet(cacheKey, res, 5 * 60 * 1000);
      applyDividendOverviewData(res);
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("synced");
    })
    .withFailureHandler(function (err) {
      if (!hasCached) {
        stopAppLoader();
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Sync error");
        handleErr(err);
      } else {
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Offline cache");
      }
    })
    .getDividendOverviewData();
}

function renderFundStatementsTable(list) {
  const tbody = document.getElementById("fund-statements-table-body");
  if (!tbody) return;

  const fullList = Array.isArray(list) ? list : [];
  const total = fullList.length;
  const pageSize = dividendsState.fundStatementsPageSize || 20;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (dividendsState.fundStatementsPage > totalPages) dividendsState.fundStatementsPage = totalPages;
  if (dividendsState.fundStatementsPage < 1) dividendsState.fundStatementsPage = 1;

  const startIdx = (dividendsState.fundStatementsPage - 1) * pageSize;
  const endIdx = Math.min(startIdx + pageSize, total);
  const pageRows = fullList.slice(startIdx, endIdx);

  const infoEl = document.getElementById("div-fund-pagination-info");
  const indEl = document.getElementById("div-fund-page-indicator");
  const prevBtn = document.getElementById("btn-fund-prev");
  const nextBtn = document.getElementById("btn-fund-next");

  if (infoEl) {
    infoEl.textContent = total > 0
      ? "Showing " + (startIdx + 1) + "\u2013" + endIdx + " of " + total + " statements"
      : "Showing 0\u20130 of 0 statements";
  }
  if (indEl) indEl.textContent = "Page " + dividendsState.fundStatementsPage + " of " + totalPages;
  if (prevBtn) prevBtn.disabled = dividendsState.fundStatementsPage <= 1;
  if (nextBtn) nextBtn.disabled = dividendsState.fundStatementsPage >= totalPages;

  if (!total) {
    tbody.innerHTML = '<tr><td colspan="9" class="py-6 text-center text-slate-500 dark:text-slate-400 font-sans">No fund statements recorded yet.</td></tr>';
    return;
  }

  tbody.innerHTML = pageRows.map(function(item) {
    return (
      '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
      '  <td class="py-3 px-4 font-sans text-slate-700 dark:text-slate-300">' + (item.date || "—") + '</td>' +
      '  <td class="py-3 px-4 font-sans"><span class="px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-500/30 text-[10px] font-semibold">' + item.fund + '</span></td>' +
      '  <td class="py-3 px-4 text-right tabular-nums text-slate-600 dark:text-slate-300">' + formatKshDiv(item.opening) + '</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums text-slate-600 dark:text-slate-300">' + formatKshDiv(item.deposits) + '</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums font-medium text-slate-800 dark:text-slate-200">' + formatKshDiv(item.grossInterest) + '</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums text-rose-700 dark:text-rose-400 font-medium">(' + formatKshDiv(item.wht) + ')</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums font-bold text-emerald-700 dark:text-emerald-400 bg-emerald-50/40 dark:bg-emerald-950/30">' + formatKshDiv(item.netYield) + '</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums font-bold text-slate-900 dark:text-white">' + formatKshDiv(item.closing) + '</td>' +
      '  <td class="py-3 px-4 text-center font-mono text-[10px] text-slate-500 dark:text-slate-400">' + (item.ref || "—") + '</td>' +
      '</tr>'
    );
  }).join("");
}

function prevFundStatementsPage() {
  if (dividendsState.fundStatementsPage > 1) {
    dividendsState.fundStatementsPage--;
    renderFundStatementsTable((dividendsState.overview && dividendsState.overview.fundStatements) || []);
  }
}

function nextFundStatementsPage() {
  const list = (dividendsState.overview && dividendsState.overview.fundStatements) || [];
  const totalPages = Math.max(1, Math.ceil(list.length / (dividendsState.fundStatementsPageSize || 20)));
  if (dividendsState.fundStatementsPage < totalPages) {
    dividendsState.fundStatementsPage++;
    renderFundStatementsTable(list);
  }
}

function openFundStatementModal() {
  const modal = document.getElementById("fund-statement-modal");
  if (!modal) return;
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("fstmt-date").value = today;
  document.getElementById("fstmt-opening").value = "";
  document.getElementById("fstmt-deposits").value = "";
  document.getElementById("fstmt-gross").value = "";
  document.getElementById("fstmt-wht").value = "";
  document.getElementById("fstmt-closing").value = "";
  document.getElementById("fstmt-ref").value = "CIC-MMF-" + new Date().getFullYear();
  modal.classList.remove("hidden");
}

function closeFundStatementModal() {
  const modal = document.getElementById("fund-statement-modal");
  if (modal) modal.classList.add("hidden");
}

function autoCalculateFundWht() {
  const gross = Number(document.getElementById("fstmt-gross").value) || 0;
  const whtInput = document.getElementById("fstmt-wht");
  if (whtInput && gross > 0) {
    whtInput.value = (Math.round(gross * 0.15 * 100) / 100).toFixed(2);
  }
}

function submitFundStatementForm(event) {
  if (event) event.preventDefault();

  const dateVal = document.getElementById("fstmt-date").value;
  const fundVal = document.getElementById("fstmt-fund").value;
  const openingVal = document.getElementById("fstmt-opening").value;
  const depositsVal = document.getElementById("fstmt-deposits").value;
  const grossVal = document.getElementById("fstmt-gross").value;
  const whtVal = document.getElementById("fstmt-wht").value;
  const closingVal = document.getElementById("fstmt-closing").value;
  const refVal = document.getElementById("fstmt-ref").value;

  if (!dateVal || !grossVal || !closingVal) {
    showNotification("Please provide the statement date, gross interest, and closing balance.", "warning", 4500);
    return;
  }

  const btn = document.getElementById("btn-save-fund-stmt");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Statement Entry</span>';
      }
      closeFundStatementModal();

      if (res && res.success) {
        if (typeof cacheClear === "function") {
          cacheClear("dividends_overview");
          cacheClear("home_analytics");
          cacheClear("accounts_");
        }
        showNotification("Fund statement recorded successfully! Net yield: " + formatKshDiv(res.entry ? res.entry.netYield : 0), "success");
        loadDividendOverview(true);
      } else {
        showNotification((res && res.error) || "Failed to record fund statement.", "error", 6000);
      }
    })
    .withFailureHandler(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Save Statement Entry</span>';
      }
      handleErr(err);
    })
    .saveFundStatementEntry({
      date: dateVal,
      fund: fundVal,
      opening: openingVal,
      deposits: depositsVal,
      grossInterest: grossVal,
      wht: whtVal,
      closing: closingVal,
      ref: refVal
    });
}

function runDividendSimulation(event) {
  if (event) event.preventDefault();

  const year = document.getElementById("div-sim-year").value || String(new Date().getFullYear());
  const pool = Number(document.getElementById("div-sim-pool").value) || 0;
  const reservePct = Number(document.getElementById("div-sim-reserve-pct").value) || 0;

  if (pool <= 0) {
    showNotification("Please enter a valid dividend pool amount greater than zero.", "warning", 4500);
    return;
  }

  const btn = document.getElementById("btn-run-sim");
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Calculating...';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-calculator text-xs"></i> <span>Calculate Allocation</span>';
      }

      if (!res || !res.success) {
        showNotification((res && res.error) || "Failed to calculate dividend simulation.", "error", 6000);
        return;
      }

      dividendsState.simulation = res;
      renderDividendPreview(res);
    })
    .withFailureHandler(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-calculator text-xs"></i> <span>Calculate Allocation</span>';
      }
      handleErr(err);
    })
    .simulateDividendDistribution({
      year: year,
      poolAmount: pool,
      reservePercent: reservePct
    });
}

function renderDividendPreview(res) {
  const s = res.summary || {};
  const items = res.preview || [];
  const card = document.getElementById("dividend-preview-card");
  const tbody = document.getElementById("dividend-preview-table-body");
  if (!card || !tbody) return;

  document.getElementById("div-sum-pool").textContent = formatKshDiv(s.poolAmount);
  document.getElementById("div-sum-reserve").textContent = formatKshDiv(s.reserveAmount) + " (" + s.reservePercent + "%)";
  document.getElementById("div-sum-loans").textContent = formatKshDiv(s.totalLoanOffset);
  document.getElementById("div-sum-savings").textContent = formatKshDiv(s.totalSavingsCredited);

  tbody.innerHTML = items.map(function(item) {
    const hasOffset = item.loanOffset > 0;
    return (
      '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
      '  <td class="py-3 px-4 font-sans">' +
      '    <div class="font-bold text-slate-900 dark:text-white text-xs">' + item.fullName + '</div>' +
      '    <div class="text-[10px] font-mono text-slate-500 dark:text-slate-400">' + item.memberId + '</div>' +
      '  </td>' +
      '  <td class="py-3 px-4 text-right tabular-nums text-slate-700 dark:text-slate-300">' + formatKshDiv(item.savings) + '</td>' +
      '  <td class="py-3 px-4 text-center font-sans font-semibold tabular-nums text-slate-600 dark:text-slate-300">' + item.sharePercent.toFixed(2) + '%</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums font-bold text-slate-900 dark:text-white">' + formatKshDiv(item.grossDividend) + '</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums text-slate-600 dark:text-slate-300">' + (item.loanBalance > 0 ? formatKshDiv(item.loanBalance) : "—") + '</td>' +
      '  <td class="py-3 px-4 text-right tabular-nums font-bold ' + (hasOffset ? "text-amber-700 dark:text-amber-400 bg-amber-50/50 dark:bg-amber-950/30" : "text-slate-500 dark:text-slate-400") + '">' +
      (hasOffset ? formatKshDiv(item.loanOffset) : "—") +
      '  </td>' +
      '  <td class="py-3 px-4 text-right tabular-nums font-bold text-emerald-700 dark:text-emerald-400 bg-emerald-50/50 dark:bg-emerald-950/30">' + formatKshDiv(item.savingsCredit) + '</td>' +
      '</tr>'
    );
  }).join("");

  card.classList.remove("hidden");
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function openConfirmDividendModal() {
  const sim = dividendsState.simulation;
  if (!sim || !sim.summary || !sim.preview || !sim.preview.length) {
    showNotification("Please calculate a dividend preview first.", "warning", 4000);
    return;
  }

  const modal = document.getElementById("dividend-confirm-modal");
  const year = document.getElementById("div-sim-year").value || String(new Date().getFullYear());
  const s = sim.summary;

  document.getElementById("confirm-modal-year").textContent = "Financial Year " + year;
  document.getElementById("conf-pool-val").textContent = formatKshDiv(s.poolAmount);
  document.getElementById("conf-reserve-val").textContent = formatKshDiv(s.reserveAmount) + " (" + s.reservePercent + "%)";
  document.getElementById("conf-loans-val").textContent = formatKshDiv(s.totalLoanOffset);
  document.getElementById("conf-savings-val").textContent = formatKshDiv(s.totalSavingsCredited);
  document.getElementById("conf-count-val").textContent = sim.preview.length + " members";

  modal.classList.remove("hidden");
}

function closeConfirmDividendModal() {
  const modal = document.getElementById("dividend-confirm-modal");
  if (modal) modal.classList.add("hidden");
}

async function submitDividendAllocation() {
  const sim = dividendsState.simulation;
  if (!sim || !sim.summary || !sim.preview || !sim.preview.length) {
    showNotification("Please calculate a dividend preview first.", "warning", 4000);
    return;
  }
  const s = sim.summary;
  const year = document.getElementById("div-sim-year").value || String(new Date().getFullYear());
  const details =
    '<div class="flex justify-between"><span>Gross Pool:</span><strong class="font-mono">' + formatKshDiv(s.poolAmount) + '</strong></div>' +
    '<div class="flex justify-between"><span>Loan Offset:</span><strong class="font-mono text-amber-700 dark:text-amber-400">' + formatKshDiv(s.totalLoanOffset) + '</strong></div>' +
    '<div class="flex justify-between"><span>Credited to Savings:</span><strong class="font-mono text-emerald-700 dark:text-emerald-400">' + formatKshDiv(s.totalSavingsCredited) + '</strong></div>';

  const confirmed = await showConfirmDialog({
    title: "Confirm Dividend Distribution",
    message: "Post FY " + year + " dividend allocations across " + sim.preview.length + " qualifying members? This updates loan balances and member savings.",
    detailsHtml: details,
    confirmText: "Post to Member Savings",
    confirmClass: "bg-emerald-700 hover:bg-emerald-800 dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-semibold",
    iconType: "success"
  });
  if (confirmed) {
    executeDividendPost();
  }
}

function executeDividendPost() {
  const sim = dividendsState.simulation;
  if (!sim || !sim.preview) return;

  const btn = document.getElementById("btn-execute-dividend-confirm");
  const year = document.getElementById("div-sim-year").value || String(new Date().getFullYear());

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing Ledger...';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Confirm & Post to Ledger</span>';
      }
      closeConfirmDividendModal();

      if (res && res.success) {
        if (typeof cacheClear === "function") {
          cacheClear("dividends_overview");
          cacheClear("home_analytics");
          cacheClear("personal_financials");
          cacheClear("members_list");
        }
        showNotification(
          "Dividends successfully posted! Settled KES " +
          Math.round(res.totalOffsetAmount).toLocaleString() + " loans & credited KES " +
          Math.round(res.totalSavingsAmount).toLocaleString() + " to savings.",
          "success"
        );
        dividendsState.overview = null;
        dividendsState.simulation = null;
        const card = document.getElementById("dividend-preview-card");
        if (card) card.classList.add("hidden");
        loadDividendOverview(true);
      } else {
        showNotification((res && res.error) || "Failed to execute dividend distribution.", "error", 6000);
      }
    })
    .withFailureHandler(function (err) {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check text-xs"></i> <span>Confirm & Post to Ledger</span>';
      }
      handleErr(err);
    })
    .executeDividendDistribution({
      year: year,
      allocations: sim.preview
    });
}
</script>
