<script>
  let loanPage = 1;
  let loansPerPage = 10;
  let loanTotalPages = 1;
  let repPage = 1;
  let repaymentsPerPage = 10;
  let repTotalPages = 1;
  let loadedLoans = [];
  let filteredLoans = [];
  let loadedRepayments = [];
  let filteredRepayments = [];

  function renderRepaymentStatusBadge(status) {
    if (typeof renderStatusPill === "function") {
      return renderStatusPill(status);
    }
    const s = String(status || "").toLowerCase().trim();
    if (s === "approved") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60">Approved</span>';
    }
    if (s === "pending") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60">Pending</span>';
    }
    if (s === "rejected") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60">Rejected</span>';
    }
    return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">' + (status || "—") + '</span>';
  }

  function renderTreasurerRepaymentActions(r) {
    const isPrivileged = window.APP_PERMS && (window.APP_PERMS.role === "admin" || window.APP_PERMS.role === "treasurer" || window.APP_PERMS.loanPayment);
    const s = String(r.status || "").toLowerCase().trim();
    if (!isPrivileged) {
      return '<span class="text-slate-400 dark:text-slate-500 text-[10px]">—</span>';
    }
    if (s === "pending") {
      return (
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button type="button" onclick="verifyLoanRepaymentStatus(\'' + escapeHtmlAttr(r.paymentId) + '\', \'Approved\')" title="Approve Repayment & Credit Loan" class="p-1.5 rounded bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 text-xs transition-colors">' +
        '<i class="fas fa-check text-[10px]"></i>' +
        '</button>' +
        '<button type="button" onclick="verifyLoanRepaymentStatus(\'' + escapeHtmlAttr(r.paymentId) + '\', \'Rejected\')" title="Reject Repayment" class="p-1.5 rounded bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60 text-xs transition-colors">' +
        '<i class="fas fa-times text-[10px]"></i>' +
        '</button>' +
        '</div>'
      );
    }
    if (s === "approved") {
      return (
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button type="button" onclick="shareLoanPaymentWhatsApp(\'' + escapeHtmlAttr(r.paymentId) + '\')" title="Send WhatsApp Receipt" class="p-1 px-2 rounded bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 text-[10px] font-medium transition-colors inline-flex items-center gap-1">' +
        '<i class="fab fa-whatsapp text-emerald-700 dark:text-emerald-400"></i> Receipt' +
        '</button>' +
        '</div>'
      );
    }
    return '<span class="text-slate-500 dark:text-slate-400 text-[10px] font-mono"><i class="fas fa-shield-alt text-emerald-700 dark:text-emerald-400 text-[9px]"></i> Verified</span>';
  }

  async function verifyLoanRepaymentStatus(paymentId, status) {
    const isApprove = String(status || "").toLowerCase() === "approved";
    const confirmed = await showConfirmDialog({
      title: "Confirm Repayment " + status,
      message: "Are you sure you want to mark repayment #" + paymentId + " as " + status + "?",
      confirmText: status,
      confirmClass: isApprove
        ? "bg-emerald-600 hover:bg-emerald-700 text-white"
        : "bg-rose-600 hover:bg-rose-700 text-white",
      iconType: isApprove ? "success" : "danger"
    });
    if (!confirmed) return;
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (!res || !res.success) {
          handleErr(res && res.error ? { message: res.error } : { message: "Failed to update repayment status." });
          return;
        }
        if (typeof cacheClear === "function") {
          cacheClear("home_analytics");
          cacheClear("personal_financials");
          cacheClear("members_list");
        }
        loadLoans(loanPage);
        loadLoanRepayments(repPage);
        if (typeof refreshDashboard === "function") refreshDashboard(true);

        if (res.receipt) {
          if (res.receipt.emailSent) {
            showNotification("Loan Repayment Approved! Receipt emailed to " + (res.receipt.recipientEmail || "member") + ".", "success");
          } else {
            showNotification("Repayment marked as " + status + ".", "success");
          }
          if (res.receipt.whatsAppUrl) {
            window.open(res.receipt.whatsAppUrl, "_blank");
          }
        } else {
          showNotification("Repayment marked as " + status + ".", "success");
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .updateLoanRepaymentStatus({ paymentId: paymentId, status: status });
  }

  function shareLoanPaymentWhatsApp(paymentId) {
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (res && res.whatsAppUrl) {
          window.open(res.whatsAppUrl, "_blank");
        } else {
          showNotification("Could not generate WhatsApp receipt: " + ((res && res.error) || "Check member phone number."), "warning", 5000);
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .triggerTransactionReceipt({
        receiptNo: paymentId,
        tid: paymentId,
        isLoanRepayment: true
      });
  }

  function renderLoanRepaymentsTable(repayments) {
    const body = document.getElementById("loan-repayments-body");
    if (!body) return;
    if (!repayments || !repayments.length) {
      body.innerHTML =
        '<tr><td colspan="12" class="px-4 py-6 text-center text-xs text-slate-400">' +
        (loadedRepayments.length > 0
          ? "No loan repayments match your search or filter criteria."
          : "No loan repayments recorded yet.") +
        "</td></tr>";
      return;
    }

    body.innerHTML = repayments.map(function(r) {
      const remBal = Number(r.balanceRemaining) || 0;
      const remClass = remBal > 0 ? "text-slate-700 dark:text-slate-300" : "text-slate-500 dark:text-slate-400";
      return (
        '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
        '<td class="px-4 py-2.5 text-xs text-slate-500 dark:text-slate-400 font-mono tabular-nums">' + (r.date || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-xs text-slate-500 dark:text-slate-400 font-mono">' + (r.paymentId || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-xs font-mono font-semibold text-slate-700 dark:text-slate-300">#' + (r.loanId || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-xs font-medium text-slate-900 dark:text-white">' + (r.borrower || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs font-bold text-slate-900 dark:text-white">' + formatMoney(r.totalPaid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs text-emerald-700 dark:text-emerald-400 font-medium">' + formatMoney(r.principalPaid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs text-sky-700 dark:text-sky-400 font-medium">' + formatMoney(r.interestPaid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs text-amber-700 dark:text-amber-400 font-medium">' + formatMoney(r.feePaid) + '</td>' +
        '<td class="px-4 py-2.5 text-center text-xs text-slate-600 dark:text-slate-300">' + (r.mode || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs ' + remClass + '">' + formatMoney(remBal) + '</td>' +
        '<td class="px-4 py-2.5 text-center">' + renderRepaymentStatusBadge(r.status) + '</td>' +
        '<td class="px-4 py-2.5 text-center">' + renderTreasurerRepaymentActions(r) + '</td>' +
        '</tr>'
      );
    }).join("");
  }

  function filterRepaymentsTable(targetPage) {
    const searchEl = document.getElementById("rep-search-input");
    const statusEl = document.getElementById("rep-status-filter");
    const channelEl = document.getElementById("rep-channel-filter");
    const q = (searchEl ? searchEl.value : "").toLowerCase().trim();
    const statusFilter = (statusEl ? statusEl.value : "all").toLowerCase().trim();
    const channelFilter = (channelEl ? channelEl.value : "all").toLowerCase().trim();

    filteredRepayments = (loadedRepayments || []).filter(function (r) {
      if (q) {
        const hay = [r.paymentId, r.loanId, r.borrower, r.memberId, r.tid, r.mode, r.date].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (statusFilter && statusFilter !== "all") {
        const st = String(r.status || "Approved").toLowerCase().trim();
        if (st !== statusFilter) return false;
      }
      if (channelFilter && channelFilter !== "all") {
        const ch = String(r.mode || "").toLowerCase().trim();
        if (ch !== channelFilter) return false;
      }
      return true;
    });

    const totalRows = filteredRepayments.length;
    repTotalPages = Math.max(1, Math.ceil(totalRows / repaymentsPerPage));
    const reqPage = Number(targetPage);
    repPage = reqPage > 0 ? Math.min(repTotalPages, reqPage) : 1;

    const startIdx = (repPage - 1) * repaymentsPerPage;
    const pageRows = filteredRepayments.slice(startIdx, startIdx + repaymentsPerPage);

    renderLoanRepaymentsTable(pageRows);
    if (typeof renderTablePagination === "function") {
      renderTablePagination("repayments-pagination", {
        currentPage: repPage,
        totalPages: repTotalPages,
        totalRows: totalRows,
        rowsPerPage: repaymentsPerPage,
        onPageChangeName: "setRepaymentsPage",
        onRowsPerPageChangeName: "setRepaymentsRowsPerPage",
        entityLabel: "repayments",
      });
    }
  }
  window.filterRepaymentsTable = filterRepaymentsTable;

  function setRepaymentsPage(page) {
    const p = Number(page) || 1;
    if (p < 1 || p > repTotalPages) return;
    filterRepaymentsTable(p);
  }
  window.setRepaymentsPage = setRepaymentsPage;

  function setRepaymentsRowsPerPage(limit) {
    const n = Number(limit);
    repaymentsPerPage = n > 0 ? n : 10;
    filterRepaymentsTable(1);
  }
  window.setRepaymentsRowsPerPage = setRepaymentsRowsPerPage;

  function loadLoanRepayments(page) {
    repPage = Number(page) > 0 ? Number(page) : 1;
    const body = document.getElementById("loan-repayments-body");
    if (body) {
      body.innerHTML =
        typeof renderTableSkeleton === "function"
          ? renderTableSkeleton(12, 5)
          : '<tr><td colspan="12" class="px-4 py-6 text-center text-xs text-slate-400">Loading repayments...</td></tr>';
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          loadedRepayments = [];
          filteredRepayments = [];
          if (body) body.innerHTML = '<tr><td colspan="12" class="px-4 py-4 text-center text-xs text-amber-600">Failed to load sub-ledger: ' + (res && res.error ? res.error : "") + '</td></tr>';
          if (typeof renderTablePagination === "function") {
            renderTablePagination("repayments-pagination", {
              currentPage: 1,
              totalPages: 1,
              totalRows: 0,
              rowsPerPage: repaymentsPerPage,
              onPageChangeName: "setRepaymentsPage",
              onRowsPerPageChangeName: "setRepaymentsRowsPerPage",
              entityLabel: "repayments",
            });
          }
          return;
        }
        loadedRepayments = res.repayments || [];
        filterRepaymentsTable(repPage);
      })
      .withFailureHandler(function (err) {
        if (body) body.innerHTML = '<tr><td colspan="12" class="px-4 py-4 text-center text-xs text-rose-600">Error loading sub-ledger: ' + (err && err.message ? err.message : err) + '</td></tr>';
      })
      .getLoanRepaymentsData("", 1, 2000);
  }

  function changeRepPage(direction) {
    setRepaymentsPage(repPage + (Number(direction) || 0));
  }

  function getStatusStyle(status) {
    const s = String(status || "").toLowerCase().trim();
    if (s === "active") return "badge-success";
    if (s === "approved") return "badge-info";
    if (s === "pending") return "badge-warning";
    if (s === "settled" || s === "cleared") return "badge-secondary";
    if (s === "rejected") return "badge-danger";
    return "badge-secondary";
  }

  function renderLoanTable(loans) {
    const body = document.getElementById("loan-table-body");
    if (!body) return;
    if (!loans || !loans.length) {
      body.innerHTML =
        '<tr><td colspan="10" class="px-4 py-8 text-center text-xs text-slate-400">' +
        (loadedLoans.length > 0
          ? "No loans match your search or status filter."
          : "No loan records found.") +
        "</td></tr>";
      return;
    }
    body.innerHTML = loans
      .map(function (loan) {
        const requested = Number(loan.requested) || 0;
        const interest = Number(loan.interest) || 0;
        const trsfee = Number(loan.trsfee) || 0;
        const calculatedRepayment = requested + interest + trsfee;
        const repaymentAmount = Number(loan.repayment) || calculatedRepayment;
        const repaymentTooltip =
          "Repayment = Requested + Interest + Transaction Fee (" +
          formatMoney(requested) +
          " + " +
          formatMoney(interest) +
          " + " +
          formatMoney(trsfee) +
          ")";

        const bal = Number(loan.balance) || 0;
        const loanStatusLower = String(loan.status || "").toLowerCase().trim();
        const isArrears = loanStatusLower.indexOf("arrears") !== -1 || loanStatusLower === "defaulted" || loanStatusLower === "overdue";
        const balClass = bal > 0
          ? (isArrears ? "text-rose-700 dark:text-rose-400 font-semibold" : "text-amber-700 dark:text-amber-400 font-semibold")
          : "text-slate-500 dark:text-slate-400";

        const pPaid = Number(loan.principalPaid) || 0;
        const iPaid = Number(loan.interestPaid) || 0;
        const fPaid = Number(loan.feePaid) || 0;
        const breakdownTooltip = "Principal: " + formatMoney(pPaid) + " | Interest: " + formatMoney(iPaid) + (fPaid > 0 ? " | Fee: " + formatMoney(fPaid) : "");
        const breakdownHtml = '<span class="text-emerald-700 dark:text-emerald-400 font-mono tabular-nums font-medium">' + formatMoney(pPaid) + '</span> <span class="text-slate-400 dark:text-slate-500 text-[10px]">/</span> <span class="text-sky-700 dark:text-sky-400 font-mono tabular-nums font-medium">' + formatMoney(iPaid) + '</span>';
        const loanStatusHtml = typeof renderStatusPill === "function"
          ? renderStatusPill(loan.status)
          : '<span class="' + getStatusStyle(loan.status) + '">' + loan.status + '</span>';

        return (
          '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
          '<td class="col-l-id px-4 py-3 text-xs font-mono text-slate-500 dark:text-slate-400">#' +
          loan.id +
          "</td>" +
          '<td class="col-l-borrower px-4 py-3 font-semibold text-xs text-slate-900 dark:text-white">' +
          loan.borrower +
          "</td>" +
          '<td class="col-l-reqdate px-4 py-3 text-xs text-slate-500 dark:text-slate-400 font-mono tabular-nums">' +
          (loan.date || "—") +
          "</td>" +
          '<td class="col-l-appdate px-4 py-3 text-xs text-slate-500 dark:text-slate-400 font-mono tabular-nums">' +
          (loan.approveddate || "—") +
          "</td>" +
          '<td class="col-l-requested px-4 py-3 text-right font-mono tabular-nums text-xs text-slate-600 dark:text-slate-300">' +
          formatMoney(loan.requested) +
          "</td>" +
          '<td class="col-l-repayment px-4 py-3 text-right font-mono tabular-nums text-xs text-slate-700 dark:text-slate-200" title="' +
          repaymentTooltip +
          '">' +
          formatMoney(repaymentAmount) +
          "</td>" +
          '<td class="col-l-paid px-4 py-3 text-right font-mono tabular-nums text-xs text-slate-900 dark:text-white">' +
          formatMoney(loan.paid) +
          "</td>" +
          '<td class="col-l-breakdown px-4 py-3 text-right text-xs" title="' + breakdownTooltip + '">' +
          breakdownHtml +
          "</td>" +
          '<td class="col-l-balance px-4 py-3 text-right font-mono tabular-nums text-xs ' + balClass + '">' +
          formatMoney(loan.balance) +
          '</td><td class="col-l-status px-4 py-3 text-center">' +
          loanStatusHtml +
          "</td></tr>"
        );
      })
      .join("");

    if (typeof applySavedColumnPreferences === "function") {
      applySavedColumnPreferences("loans-table");
    }
  }

  function filterLoansTable(targetPage) {
    const searchEl = document.getElementById("loan-search-input");
    const statusEl = document.getElementById("loan-status-filter");
    const q = (searchEl ? searchEl.value : "").toLowerCase().trim();
    const statusFilter = (statusEl ? statusEl.value : "all").toLowerCase().trim();

    filteredLoans = (loadedLoans || []).filter(function (loan) {
      if (q) {
        const hay = [loan.id, loan.borrower, loan.memberId, loan.date].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (statusFilter && statusFilter !== "all") {
        const st = String(loan.status || "").toLowerCase().trim();
        if (statusFilter === "settled") {
          if (st !== "settled" && st !== "cleared") return false;
        } else if (st !== statusFilter) {
          return false;
        }
      }
      return true;
    });

    const totalRows = filteredLoans.length;
    loanTotalPages = Math.max(1, Math.ceil(totalRows / loansPerPage));
    const reqPage = Number(targetPage);
    loanPage = reqPage > 0 ? Math.min(loanTotalPages, reqPage) : 1;

    const startIdx = (loanPage - 1) * loansPerPage;
    const pageRows = filteredLoans.slice(startIdx, startIdx + loansPerPage);

    renderLoanTable(pageRows);
    if (typeof renderTablePagination === "function") {
      renderTablePagination("loans-pagination", {
        currentPage: loanPage,
        totalPages: loanTotalPages,
        totalRows: totalRows,
        rowsPerPage: loansPerPage,
        onPageChangeName: "setLoansPage",
        onRowsPerPageChangeName: "setLoansRowsPerPage",
        entityLabel: "loans",
      });
    }
  }
  window.filterLoansTable = filterLoansTable;

  function setLoansPage(page) {
    const p = Number(page) || 1;
    if (p < 1 || p > loanTotalPages) return;
    filterLoansTable(p);
  }
  window.setLoansPage = setLoansPage;

  function setLoansRowsPerPage(limit) {
    const n = Number(limit);
    loansPerPage = n > 0 ? n : 10;
    filterLoansTable(1);
  }
  window.setLoansRowsPerPage = setLoansRowsPerPage;

  function loadLoans(page) {
    loanPage = Number(page) > 0 ? Number(page) : 1;
    startAppLoader();
    document.getElementById("loan-table-body").innerHTML =
      typeof renderTableSkeleton === "function"
        ? renderTableSkeleton(10, 5)
        : '<tr><td colspan="10" class="px-4 py-6 text-center text-slate-400">Loading loans...</td></tr>';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          stopAppLoader();
          loadedLoans = [];
          filteredLoans = [];
          renderLoanTable([]);
          if (typeof renderTablePagination === "function") {
            renderTablePagination("loans-pagination", {
              currentPage: 1,
              totalPages: 1,
              totalRows: 0,
              rowsPerPage: loansPerPage,
              onPageChangeName: "setLoansPage",
              onRowsPerPageChangeName: "setLoansRowsPerPage",
              entityLabel: "loans",
            });
          }
          handleErr(res || { message: "Failed to load loans." });
          return;
        }

        loadedLoans = res.loans || [];
        filterLoansTable(loanPage);
        stopAppLoader();
        loadLoanRepayments(1);
      })
      .withFailureHandler((err) => {
        stopAppLoader();
        handleErr(err);
      })
      .getLoansData(1, 2000);
  }

  function changeLoanPage(direction) {
    setLoansPage(loanPage + (Number(direction) || 0));
  }

  function openRequestLoanModal() {
    showNotification("Loan requests are not available in the app yet. Contact an administrator.", "info", 5000);
  }

  function setupLoanBorrowerCombobox() {
    const searchInput = document.getElementById("pl-member-search");
    const hiddenInput = document.getElementById("pl-member");
    const combobox = document.getElementById("pl-member-combobox");
    if (!searchInput || !hiddenInput || !combobox) return;
    if (searchInput.dataset.comboBound === "true") return;
    searchInput.dataset.comboBound = "true";

    function renderList(filterText) {
      const q = (filterText || "").toLowerCase().trim();
      const list = (typeof currentMembers !== "undefined" && currentMembers) ? currentMembers : [];
      const matches = list.filter((m) => {
        if (!q) return true;
        const nameMatch = (m.name || "").toLowerCase().indexOf(q) !== -1;
        const idMatch = (m.id || "").toLowerCase().indexOf(q) !== -1;
        return nameMatch || idMatch;
      });

      if (!matches.length) {
        combobox.innerHTML = '<div class="px-3 py-2 text-xs text-slate-400 text-center">No matching members found</div>';
        combobox.classList.remove("hidden");
        return;
      }

      combobox.innerHTML = matches.map((m) => {
        return (
          '<div class="custom-combobox-item" onclick="selectLoanBorrower(\'' +
          escapeHtmlAttr(m.name) +
          '\', \'' +
          escapeHtmlAttr(m.id) +
          '\')">' +
          '<span>' + m.name + '</span>' +
          '<span class="item-id">' + m.id + '</span>' +
          '</div>'
        );
      }).join("");
      combobox.classList.remove("hidden");
    }

    searchInput.addEventListener("focus", function() {
      renderList(this.value);
    });

    searchInput.addEventListener("input", function() {
      hiddenInput.value = this.value;
      renderList(this.value);
    });

    document.addEventListener("click", function(e) {
      if (!searchInput.contains(e.target) && !combobox.contains(e.target)) {
        combobox.classList.add("hidden");
      }
    });
  }

  let activeBorrowerLoans = [];

  function fetchActiveLoansForBorrower(name, id) {
    const loanWrapper = document.getElementById("pl-loan-select-wrapper");
    const loanSelect = document.getElementById("pl-loan-id");
    const badge = document.getElementById("pl-loan-count-badge");
    const card = document.getElementById("pl-loan-details-card");
    if (!loanWrapper || !loanSelect) return;

    loanSelect.innerHTML = '<option value="">Loading active loans...</option>';
    loanSelect.disabled = true;
    loanWrapper.classList.remove("hidden");
    if (badge) badge.innerText = "fetching...";
    if (card) card.classList.add("hidden");

    google.script.run
      .withSuccessHandler(function (res) {
        loanSelect.disabled = false;
        if (!res || !res.success || !res.loans || !res.loans.length) {
          loanSelect.innerHTML = '<option value="">No active loans found for this member</option>';
          if (badge) badge.innerText = "0 loans";
          activeBorrowerLoans = [];
          return;
        }

        activeBorrowerLoans = res.loans;
        if (badge) badge.innerText = res.loans.length + (res.loans.length === 1 ? " loan" : " loans");

        if (res.loans.length === 1) {
          // Exactly 1 loan: Auto-select by default
          const single = res.loans[0];
          loanSelect.innerHTML = '<option value="' + single.loanId + '" selected>#' + single.loanId + ' (Bal: ' + formatMoney(single.balance) + ')</option>';
          updateLoanDetailsCard(single.loanId);
        } else {
          // More than 1 loan: Let the user select
          loanSelect.innerHTML = '<option value="">-- Select from ' + res.loans.length + ' active loans --</option>' +
            res.loans.map(function(l) {
              return '<option value="' + l.loanId + '">#' + l.loanId + ' — Outstanding: ' + formatMoney(l.balance) + ' (' + l.status + ')</option>';
            }).join("");
          if (card) card.classList.add("hidden");
        }
      })
      .withFailureHandler(function (err) {
        loanSelect.disabled = false;
        loanSelect.innerHTML = '<option value="">Failed to load loans</option>';
        if (badge) badge.innerText = "error";
      })
      .getMemberActiveLoans(id, name);
  }

  function updateLoanDetailsCard(selectedLoanId) {
    const card = document.getElementById("pl-loan-details-card");
    if (!card) return;
    if (!selectedLoanId) {
      card.classList.add("hidden");
      return;
    }
    const loan = activeBorrowerLoans.find(function(l) { return l.loanId === selectedLoanId; });
    if (!loan) {
      card.classList.add("hidden");
      return;
    }

    const cRep = document.getElementById("pl-card-repayment");
    const cPaid = document.getElementById("pl-card-paid");
    const cBal = document.getElementById("pl-card-balance");
    if (cRep) cRep.innerText = formatMoney(loan.repayment);
    if (cPaid) cPaid.innerText = formatMoney(loan.paid);
    if (cBal) cBal.innerText = formatMoney(loan.balance);
    card.classList.remove("hidden");
  }

  function selectLoanBorrower(name, id) {
    const searchInput = document.getElementById("pl-member-search");
    const hiddenInput = document.getElementById("pl-member");
    const hiddenMid = document.getElementById("pl-member-id");
    const combobox = document.getElementById("pl-member-combobox");
    if (searchInput) searchInput.value = name + " (" + id + ")";
    if (hiddenInput) hiddenInput.value = name;
    if (hiddenMid) hiddenMid.value = id;
    if (combobox) combobox.classList.add("hidden");

    // Fetch and display active loans for this borrower
    fetchActiveLoansForBorrower(name, id);
  }

  function escapeHtmlAttr(str) {
    return String(str || "").replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function openPayLoanModal() {
    if (!window.APP_PERMS || !window.APP_PERMS.loanPayment) {
      showNotification("You do not have permission to record loan payments.", "warning");
      return;
    }
    const input = document.getElementById("pl-member-search");
    const hidden = document.getElementById("pl-member");
    const hiddenMid = document.getElementById("pl-member-id");
    const loanWrapper = document.getElementById("pl-loan-select-wrapper");
    const loanSelect = document.getElementById("pl-loan-id");
    const card = document.getElementById("pl-loan-details-card");

    if (input) input.value = "";
    if (hidden) hidden.value = "";
    if (hiddenMid) hiddenMid.value = "";
    if (loanWrapper) loanWrapper.classList.add("hidden");
    if (card) card.classList.add("hidden");
    if (loanSelect) {
      loanSelect.innerHTML = '<option value="">-- Choose Loan --</option>';
      loanSelect.onchange = function() {
        updateLoanDetailsCard(this.value);
      };
    }
    activeBorrowerLoans = [];
    document.getElementById("payLoanForm").reset();

    const plDatePicker = document.getElementById("pl-date") ? document.getElementById("pl-date")._flatpickr : null;
    if (plDatePicker) plDatePicker.setDate(new Date());
    else if (document.getElementById("pl-date")) document.getElementById("pl-date").value = new Date().toISOString().split("T")[0];
    const plTidInput = document.getElementById("pl-tid");
    if (plTidInput) plTidInput.value = "";
    setShadcnSelectValue("select-plmode-wrapper", "Equity Bank");

    if (typeof ensureMembersLoaded === "function") {
      ensureMembersLoaded().catch(function () {});
    }
    setupLoanBorrowerCombobox();
    document.getElementById("payLoanModal").classList.remove("hidden");
  }

  function closePayLoanModal() {
    document.getElementById("payLoanModal").classList.add("hidden");
  }

  document.getElementById("payLoanForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!window.APP_PERMS || !window.APP_PERMS.loanPayment) {
      showNotification("You do not have permission to record loan payments.", "warning");
      return;
    }
    const btn = e.submitter || document.getElementById("pl-submit-btn");
    if (btn) {
      btn.disabled = true;
      btn.textContent = "Submitting...";
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Submit Loan Payment";
        }
        if (!res || !res.success) {
          handleErr(res && res.error ? { message: res.error } : { message: "Payment failed." });
          return;
        }
        if (typeof cacheClear === "function") {
          cacheClear("home_analytics");
          cacheClear("personal_financials");
          cacheClear("members_list");
        }
        closePayLoanModal();
        document.getElementById("payLoanForm").reset();
        loadLoans(loanPage);
        loadLoanRepayments(1);
        if (typeof refreshDashboard === "function") refreshDashboard(true);
      })
      .withFailureHandler(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Submit Loan Payment";
        }
        handleErr(err);
      })
      .processLoanPayment({
        borrower: document.getElementById("pl-member") ? document.getElementById("pl-member").value : "",
        memberId: document.getElementById("pl-member-id") ? document.getElementById("pl-member-id").value : "",
        loanId: document.getElementById("pl-loan-id") ? document.getElementById("pl-loan-id").value : "",
        date: document.getElementById("pl-date") ? document.getElementById("pl-date").value : "",
        amount: document.getElementById("pl-amount").value,
        mode: document.getElementById("pl-mode").value,
        tid: document.getElementById("pl-tid") ? document.getElementById("pl-tid").value.trim() : "",
      });
  });
</script>
