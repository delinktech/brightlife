<script>
  let loanPage = 1;
  let loansPerPage = 10;
  let loanTotalPages = 1;
  let repPage = 1;
  let repaymentsPerPage = 10;
  let repTotalPages = 1;
  let loadedLoans = [];
  let filteredLoans = [];
  let loadedRepayments = [];
  let filteredRepayments = [];

  function renderRepaymentStatusBadge(status) {
    if (typeof renderStatusPill === "function") {
      return renderStatusPill(status);
    }
    const s = String(status || "").toLowerCase().trim();
    if (s === "approved") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60">Approved</span>';
    }
    if (s === "pending") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60">Pending</span>';
    }
    if (s === "rejected") {
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60">Rejected</span>';
    }
    return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">' + (status || "—") + '</span>';
  }

  function renderTreasurerRepaymentActions(r) {
    const isPrivileged = window.APP_PERMS && (window.APP_PERMS.role === "admin" || window.APP_PERMS.role === "treasurer" || window.APP_PERMS.loanPayment);
    const s = String(r.status || "").toLowerCase().trim();
    if (!isPrivileged) {
      return '<span class="text-slate-400 dark:text-slate-500 text-[10px]">—</span>';
    }
    if (s === "pending") {
      return (
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button type="button" onclick="verifyLoanRepaymentStatus(\'' + escapeHtmlAttr(r.paymentId) + '\', \'Approved\')" title="Approve Repayment & Credit Loan" class="min-w-[38px] min-h-[38px] inline-flex items-center justify-center rounded-lg bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 text-xs transition-colors">' +
        '<i class="fas fa-check text-xs"></i>' +
        '</button>' +
        '<button type="button" onclick="verifyLoanRepaymentStatus(\'' + escapeHtmlAttr(r.paymentId) + '\', \'Rejected\')" title="Reject Repayment" class="min-w-[38px] min-h-[38px] inline-flex items-center justify-center rounded-lg bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60 text-xs transition-colors">' +
        '<i class="fas fa-times text-xs"></i>' +
        '</button>' +
        '</div>'
      );
    }
    if (s === "approved") {
      return (
        '<div class="flex items-center justify-center gap-1.5">' +
        '<button type="button" onclick="shareLoanPaymentWhatsApp(\'' + escapeHtmlAttr(r.paymentId) + '\')" title="Send WhatsApp Receipt" class="min-h-[38px] px-2.5 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 text-[11px] font-medium transition-colors inline-flex items-center gap-1.5">' +
        '<i class="fab fa-whatsapp text-emerald-700 dark:text-emerald-400"></i> Receipt' +
        '</button>' +
        '</div>'
      );
    }
    return '<span class="text-slate-500 dark:text-slate-400 text-[10px] font-mono"><i class="fas fa-shield-alt text-emerald-700 dark:text-emerald-400 text-[9px]"></i> Verified</span>';
  }

  async function verifyLoanRepaymentStatus(paymentId, status) {
    const isApprove = String(status || "").toLowerCase() === "approved";
    const confirmed = await showConfirmDialog({
      title: "Confirm Repayment " + status,
      message: "Are you sure you want to mark repayment #" + paymentId + " as " + status + "?",
      confirmText: status,
      confirmClass: isApprove
        ? "bg-emerald-600 hover:bg-emerald-700 text-white"
        : "bg-rose-600 hover:bg-rose-700 text-white",
      iconType: isApprove ? "success" : "danger"
    });
    if (!confirmed) return;
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (!res || !res.success) {
          handleErr(res && res.error ? { message: res.error } : { message: "Failed to update repayment status." });
          return;
        }
        if (typeof cacheClear === "function") {
          cacheClear("loans_");
          cacheClear("loan_repayments_");
          cacheClear("contributions_");
          cacheClear("home_analytics");
          cacheClear("personal_financials");
          cacheClear("members_list");
        }
        loadLoans(loanPage, true);
        loadLoanRepayments(repPage, true);
        if (typeof refreshDashboard === "function") refreshDashboard(true);

        if (res.receipt) {
          if (res.receipt.emailSent) {
            showNotification("Loan Repayment Approved! Receipt emailed to " + (res.receipt.recipientEmail || "member") + ".", "success");
          } else {
            showNotification("Repayment marked as " + status + ".", "success");
          }
          if (res.receipt.whatsAppUrl) {
            window.open(res.receipt.whatsAppUrl, "_blank");
          }
        } else {
          showNotification("Repayment marked as " + status + ".", "success");
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .updateLoanRepaymentStatus({ paymentId: paymentId, status: status });
  }

  function shareLoanPaymentWhatsApp(paymentId) {
    startAppLoader();
    google.script.run
      .withSuccessHandler(function (res) {
        stopAppLoader();
        if (res && res.whatsAppUrl) {
          window.open(res.whatsAppUrl, "_blank");
        } else {
          showNotification("Could not generate WhatsApp receipt: " + ((res && res.error) || "Check member phone number."), "warning", 5000);
        }
      })
      .withFailureHandler(function (err) {
        stopAppLoader();
        handleErr(err);
      })
      .triggerTransactionReceipt({
        receiptNo: paymentId,
        tid: paymentId,
        isLoanRepayment: true
      });
  }

  function renderLoanRepaymentsTable(repayments) {
    const body = document.getElementById("loan-repayments-body");
    if (!body) return;
    if (!repayments || !repayments.length) {
      body.innerHTML =
        '<tr><td colspan="12" class="px-4 py-6 text-center text-xs text-slate-400">' +
        (loadedRepayments.length > 0
          ? "No loan repayments match your search or filter criteria."
          : "No loan repayments recorded yet.") +
        "</td></tr>";
      return;
    }

    body.innerHTML = repayments.map(function(r) {
      const remBal = Number(r.balanceRemaining) || 0;
      const remClass = remBal > 0 ? "text-slate-700 dark:text-slate-300" : "text-slate-500 dark:text-slate-400";
      return (
        '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
        '<td class="px-4 py-2.5 text-xs text-slate-500 dark:text-slate-400 font-mono tabular-nums">' + (r.date || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-xs text-slate-500 dark:text-slate-400 font-mono">' + (r.paymentId || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-xs font-mono font-semibold text-slate-700 dark:text-slate-300">#' + (r.loanId || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-xs font-medium text-slate-900 dark:text-white">' + (r.borrower || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs font-bold text-slate-900 dark:text-white">' + formatMoney(r.totalPaid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs text-emerald-700 dark:text-emerald-400 font-medium">' + formatMoney(r.principalPaid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs text-sky-700 dark:text-sky-400 font-medium">' + formatMoney(r.interestPaid) + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs text-amber-700 dark:text-amber-400 font-medium">' + formatMoney(r.feePaid) + '</td>' +
        '<td class="px-4 py-2.5 text-center text-xs text-slate-600 dark:text-slate-300">' + (r.mode || "—") + '</td>' +
        '<td class="px-4 py-2.5 text-right font-mono tabular-nums text-xs ' + remClass + '">' + formatMoney(remBal) + '</td>' +
        '<td class="px-4 py-2.5 text-center">' + renderRepaymentStatusBadge(r.status) + '</td>' +
        '<td class="px-4 py-2.5 text-center">' + renderTreasurerRepaymentActions(r) + '</td>' +
        '</tr>'
      );
    }).join("");
  }

  function filterRepaymentsTable(targetPage) {
    const searchEl = document.getElementById("rep-search-input");
    const statusEl = document.getElementById("rep-status-filter");
    const channelEl = document.getElementById("rep-channel-filter");
    const q = (searchEl ? searchEl.value : "").toLowerCase().trim();
    const statusFilter = (statusEl ? statusEl.value : "all").toLowerCase().trim();
    const channelFilter = (channelEl ? channelEl.value : "all").toLowerCase().trim();

    filteredRepayments = (loadedRepayments || []).filter(function (r) {
      if (q) {
        const hay = [r.paymentId, r.loanId, r.borrower, r.memberId, r.tid, r.mode, r.date].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (statusFilter && statusFilter !== "all") {
        const st = String(r.status || "Approved").toLowerCase().trim();
        if (st !== statusFilter) return false;
      }
      if (channelFilter && channelFilter !== "all") {
        const ch = String(r.mode || "").toLowerCase().trim();
        if (ch !== channelFilter) return false;
      }
      return true;
    });

    const totalRows = filteredRepayments.length;
    repTotalPages = Math.max(1, Math.ceil(totalRows / repaymentsPerPage));
    const reqPage = Number(targetPage);
    repPage = reqPage > 0 ? Math.min(repTotalPages, reqPage) : 1;

    const startIdx = (repPage - 1) * repaymentsPerPage;
    const pageRows = filteredRepayments.slice(startIdx, startIdx + repaymentsPerPage);

    renderLoanRepaymentsTable(pageRows);
    if (typeof renderTablePagination === "function") {
      renderTablePagination("repayments-pagination", {
        currentPage: repPage,
        totalPages: repTotalPages,
        totalRows: totalRows,
        rowsPerPage: repaymentsPerPage,
        onPageChangeName: "setRepaymentsPage",
        onRowsPerPageChangeName: "setRepaymentsRowsPerPage",
        entityLabel: "repayments",
      });
    }
  }
  window.filterRepaymentsTable = filterRepaymentsTable;

  function setRepaymentsPage(page) {
    const p = Number(page) || 1;
    if (p < 1 || p > repTotalPages) return;
    filterRepaymentsTable(p);
  }
  window.setRepaymentsPage = setRepaymentsPage;

  function setRepaymentsRowsPerPage(limit) {
    const n = Number(limit);
    repaymentsPerPage = n > 0 ? n : 10;
    filterRepaymentsTable(1);
  }
  window.setRepaymentsRowsPerPage = setRepaymentsRowsPerPage;

  function applyLoanRepaymentsData(res) {
    loadedRepayments = res.repayments || [];
    filterRepaymentsTable(repPage);
  }

  function loadLoanRepayments(page, forceRefresh) {
    repPage = Number(page) > 0 ? Number(page) : 1;
    const body = document.getElementById("loan-repayments-body");
    const cacheKey = "loan_repayments_p" + repPage + "_l2000";
    const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
    const cached = entry ? entry.data : null;
    const hasCached = Boolean(cached);
    const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

    if (hasCached) {
      applyLoanRepaymentsData(cached);
      if (isFresh) return;
    } else if (body) {
      body.innerHTML =
        typeof renderTableSkeleton === "function"
          ? renderTableSkeleton(12, 5)
          : '<tr><td colspan="12" class="px-4 py-6 text-center text-xs text-slate-400">Loading repayments...</td></tr>';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          if (!hasCached) {
            loadedRepayments = [];
            filteredRepayments = [];
            if (body) body.innerHTML = '<tr><td colspan="12" class="px-4 py-4 text-center text-xs text-amber-600">Failed to load sub-ledger: ' + (res && res.error ? res.error : "") + '</td></tr>';
            if (typeof renderTablePagination === "function") {
              renderTablePagination("repayments-pagination", {
                currentPage: 1,
                totalPages: 1,
                totalRows: 0,
                rowsPerPage: repaymentsPerPage,
                onPageChangeName: "setRepaymentsPage",
                onRowsPerPageChangeName: "setRepaymentsRowsPerPage",
                entityLabel: "repayments",
              });
            }
          }
          return;
        }
        if (typeof cacheSet === "function") cacheSet(cacheKey, res, 5 * 60 * 1000);
        applyLoanRepaymentsData(res);
      })
      .withFailureHandler(function (err) {
        if (!hasCached && body) {
          body.innerHTML = '<tr><td colspan="12" class="px-4 py-4 text-center text-xs text-rose-600">Error loading sub-ledger: ' + (err && err.message ? err.message : err) + '</td></tr>';
        }
      })
      .getLoanRepaymentsData("", 1, 2000);
  }

  function changeRepPage(direction) {
    setRepaymentsPage(repPage + (Number(direction) || 0));
  }

  function getStatusStyle(status) {
    const s = String(status || "").toLowerCase().trim();
    if (s === "active") return "badge-success";
    if (s === "approved") return "badge-info";
    if (s === "pending") return "badge-warning";
    if (s === "settled" || s === "cleared") return "badge-secondary";
    if (s === "rejected") return "badge-danger";
    return "badge-secondary";
  }

  function renderLoanTable(loans) {
    const body = document.getElementById("loan-table-body");
    if (!body) return;
    if (!loans || !loans.length) {
      body.innerHTML =
        '<tr><td colspan="10" class="px-4 py-8 text-center text-xs text-slate-400">' +
        (loadedLoans.length > 0
          ? "No loans match your search or status filter."
          : "No loan records found.") +
        "</td></tr>";
      return;
    }
    body.innerHTML = loans
      .map(function (loan) {
        const requested = Number(loan.requested) || 0;
        const interest = Number(loan.interest) || 0;
        const trsfee = Number(loan.trsfee) || 0;
        const calculatedRepayment = requested + interest + trsfee;
        const repaymentAmount = Number(loan.repayment) || calculatedRepayment;
        const repaymentTooltip =
          "Repayment = Requested + Interest + Transaction Fee (" +
          formatMoney(requested) +
          " + " +
          formatMoney(interest) +
          " + " +
          formatMoney(trsfee) +
          ")";

        const bal = Number(loan.balance) || 0;
        const loanStatusLower = String(loan.status || "").toLowerCase().trim();
        const isArrears = loanStatusLower.indexOf("arrears") !== -1 || loanStatusLower === "defaulted" || loanStatusLower === "overdue";
        const balClass = bal > 0
          ? (isArrears ? "text-rose-700 dark:text-rose-400 font-semibold" : "text-amber-700 dark:text-amber-400 font-semibold")
          : "text-slate-500 dark:text-slate-400";

        const pPaid = Number(loan.principalPaid) || 0;
        const iPaid = Number(loan.interestPaid) || 0;
        const fPaid = Number(loan.feePaid) || 0;
        const breakdownTooltip = "Principal: " + formatMoney(pPaid) + " | Interest: " + formatMoney(iPaid) + (fPaid > 0 ? " | Fee: " + formatMoney(fPaid) : "");
        const breakdownHtml = '<span class="text-emerald-700 dark:text-emerald-400 font-mono tabular-nums font-medium">' + formatMoney(pPaid) + '</span> <span class="text-slate-400 dark:text-slate-500 text-[10px]">/</span> <span class="text-sky-700 dark:text-sky-400 font-mono tabular-nums font-medium">' + formatMoney(iPaid) + '</span>';
        const loanStatusHtml = typeof renderStatusPill === "function"
          ? renderStatusPill(loan.status)
          : '<span class="' + getStatusStyle(loan.status) + '">' + loan.status + '</span>';

        return (
          '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
          '<td class="col-l-id px-4 py-3 text-xs font-mono text-slate-500 dark:text-slate-400">#' +
          loan.id +
          "</td>" +
          '<td class="col-l-borrower px-4 py-3 font-semibold text-xs text-slate-900 dark:text-white">' +
          loan.borrower +
          "</td>" +
          '<td class="col-l-reqdate px-4 py-3 text-xs text-slate-500 dark:text-slate-400 font-mono tabular-nums">' +
          (loan.date || "—") +
          "</td>" +
          '<td class="col-l-appdate px-4 py-3 text-xs text-slate-500 dark:text-slate-400 font-mono tabular-nums">' +
          (loan.approveddate || "—") +
          "</td>" +
          '<td class="col-l-requested px-4 py-3 text-right font-mono tabular-nums text-xs text-slate-600 dark:text-slate-300">' +
          formatMoney(loan.requested) +
          "</td>" +
          '<td class="col-l-repayment px-4 py-3 text-right font-mono tabular-nums text-xs text-slate-700 dark:text-slate-200" title="' +
          repaymentTooltip +
          '">' +
          formatMoney(repaymentAmount) +
          "</td>" +
          '<td class="col-l-paid px-4 py-3 text-right font-mono tabular-nums text-xs text-slate-900 dark:text-white">' +
          formatMoney(loan.paid) +
          "</td>" +
          '<td class="col-l-breakdown px-4 py-3 text-right text-xs" title="' + breakdownTooltip + '">' +
          breakdownHtml +
          "</td>" +
          '<td class="col-l-balance px-4 py-3 text-right font-mono tabular-nums text-xs ' + balClass + '">' +
          formatMoney(loan.balance) +
          '</td><td class="col-l-status px-4 py-3 text-center">' +
          loanStatusHtml +
          "</td></tr>"
        );
      })
      .join("");

    if (typeof applySavedColumnPreferences === "function") {
      applySavedColumnPreferences("loans-table");
    }
  }

  function filterLoansTable(targetPage) {
    const searchEl = document.getElementById("loan-search-input");
    const statusEl = document.getElementById("loan-status-filter");
    const q = (searchEl ? searchEl.value : "").toLowerCase().trim();
    const statusFilter = (statusEl ? statusEl.value : "all").toLowerCase().trim();

    filteredLoans = (loadedLoans || []).filter(function (loan) {
      if (q) {
        const hay = [loan.id, loan.borrower, loan.memberId, loan.date].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (statusFilter && statusFilter !== "all") {
        const st = String(loan.status || "").toLowerCase().trim();
        if (statusFilter === "settled") {
          if (st !== "settled" && st !== "cleared") return false;
        } else if (st !== statusFilter) {
          return false;
        }
      }
      return true;
    });

    const totalRows = filteredLoans.length;
    loanTotalPages = Math.max(1, Math.ceil(totalRows / loansPerPage));
    const reqPage = Number(targetPage);
    loanPage = reqPage > 0 ? Math.min(loanTotalPages, reqPage) : 1;

    const startIdx = (loanPage - 1) * loansPerPage;
    const pageRows = filteredLoans.slice(startIdx, startIdx + loansPerPage);

    renderLoanTable(pageRows);
    if (typeof renderTablePagination === "function") {
      renderTablePagination("loans-pagination", {
        currentPage: loanPage,
        totalPages: loanTotalPages,
        totalRows: totalRows,
        rowsPerPage: loansPerPage,
        onPageChangeName: "setLoansPage",
        onRowsPerPageChangeName: "setLoansRowsPerPage",
        entityLabel: "loans",
      });
    }
  }
  window.filterLoansTable = filterLoansTable;

  function setLoansPage(page) {
    const p = Number(page) || 1;
    if (p < 1 || p > loanTotalPages) return;
    filterLoansTable(p);
  }
  window.setLoansPage = setLoansPage;

  function setLoansRowsPerPage(limit) {
    const n = Number(limit);
    loansPerPage = n > 0 ? n : 10;
    filterLoansTable(1);
  }
  window.setLoansRowsPerPage = setLoansRowsPerPage;

  function applyLoansData(res) {
    loadedLoans = res.loans || [];
    filterLoansTable(loanPage);
  }

  function loadLoans(page, forceRefresh) {
    loanPage = Number(page) > 0 ? Number(page) : 1;
    const cacheKey = "loans_p" + loanPage + "_l2000";
    const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
    const cached = entry ? entry.data : null;
    const hasCached = Boolean(cached);
    const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

    if (hasCached) {
      applyLoansData(cached);
      loadLoanRepayments(1, false);
      if (isFresh) {
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Cached");
        return;
      }
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Syncing...");
    } else {
      startAppLoader();
      document.getElementById("loan-table-body").innerHTML =
        typeof renderTableSkeleton === "function"
          ? renderTableSkeleton(10, 5)
          : '<tr><td colspan="10" class="px-4 py-6 text-center text-slate-400">Loading loans...</td></tr>';
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Loading...");
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!hasCached) stopAppLoader();
        if (!res || !res.success) {
          if (!hasCached) {
            loadedLoans = [];
            filteredLoans = [];
            renderLoanTable([]);
            if (typeof renderTablePagination === "function") {
              renderTablePagination("loans-pagination", {
                currentPage: 1,
                totalPages: 1,
                totalRows: 0,
                rowsPerPage: loansPerPage,
                onPageChangeName: "setLoansPage",
                onRowsPerPageChangeName: "setLoansRowsPerPage",
                entityLabel: "loans",
              });
            }
            if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Sync error");
            handleErr(res || { message: "Failed to load loans." });
          } else {
            if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Offline cache");
          }
          return;
        }

        if (typeof cacheSet === "function") cacheSet(cacheKey, res, 5 * 60 * 1000);
        applyLoansData(res);
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("synced");
        loadLoanRepayments(1, Boolean(forceRefresh));
      })
      .withFailureHandler((err) => {
        if (!hasCached) {
          stopAppLoader();
          if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Sync error");
          handleErr(err);
        } else {
          if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Offline cache");
        }
      })
      .getLoansData(1, 2000);
  }

  function changeLoanPage(direction) {
    setLoansPage(loanPage + (Number(direction) || 0));
  }

  const applyLoanState = {
    policy: {
      borrowerMultiplier: 3,
      interestRatePct: 10,
      minGuarantors: 2,
      tenorTiers: [
        { maxAmount: 20000, maxMonths: 6 },
        { maxAmount: 100000, maxMonths: 12 },
        { maxAmount: 500000, maxMonths: 24 }
      ]
    },
    borrowerId: "",
    guarantors: []
  };

  function getActiveLoanPolicy_() {
    const entry = typeof cacheGetEntry === "function" ? cacheGetEntry("loan_policy_settings") : null;
    const raw = (entry && entry.data) || null;
    if (raw && typeof raw === "object") {
      const mult = Number(raw.borrowerMultiplier !== undefined ? raw.borrowerMultiplier : raw.savingsMultiplier);
      const rate = Number(raw.interestRatePct);
      const guar = Number(raw.minGuarantors);
      const tiers = Array.isArray(raw.tenorTiers) && raw.tenorTiers.length > 0 ? raw.tenorTiers : applyLoanState.policy.tenorTiers;
      return {
        borrowerMultiplier: Number.isFinite(mult) && mult > 0 ? mult : 3,
        interestRatePct: Number.isFinite(rate) && rate >= 0 ? rate : 10,
        minGuarantors: Number.isFinite(guar) && guar >= 0 ? Math.round(guar) : 2,
        tenorTiers: tiers
      };
    }
    return applyLoanState.policy;
  }

  function getMemberUnencumberedSavings_(m) {
    if (!m) return 0;
    return Math.max(0, (Number(m.savings) || 0) - (Number(m.guaranteed) || 0));
  }

  function syncApplyLoanPolicyBadges_() {
    const p = applyLoanState.policy;
    const multBadge = document.getElementById("al-policy-mult-badge");
    const minGuarBadge = document.getElementById("al-min-guarantors-badge");
    const rateLabel = document.getElementById("al-prev-rate-label");
    if (multBadge) multBadge.textContent = p.borrowerMultiplier + "x Limit";
    if (minGuarBadge) minGuarBadge.textContent = "Min: " + p.minGuarantors;
    if (rateLabel) rateLabel.textContent = p.interestRatePct + "%";
  }

  function setupApplyLoanBorrowerCombobox_() {
    const searchInput = document.getElementById("al-borrower-search");
    const hiddenId = document.getElementById("al-borrower-id");
    const combobox = document.getElementById("al-borrower-combobox");
    if (!searchInput || !hiddenId || !combobox) return;
    if (searchInput.dataset.comboBound === "true") return;
    searchInput.dataset.comboBound = "true";

    function renderList(filterText) {
      const q = (filterText || "").toLowerCase().trim();
      const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
      const matches = list.filter(function (m) {
        if (!q) return true;
        return (m.name || "").toLowerCase().indexOf(q) !== -1 || (m.id || "").toLowerCase().indexOf(q) !== -1;
      });

      if (!matches.length) {
        combobox.innerHTML = '<div class="px-3 py-2 text-xs text-slate-400 text-center">No matching members found</div>';
        combobox.classList.remove("hidden");
        return;
      }

      combobox.innerHTML = matches.slice(0, 40).map(function (m) {
        return (
          '<div class="custom-combobox-item" onclick="selectApplyLoanBorrower_(\'' + escapeHtmlAttr(m.id) + '\')">' +
          '<span>' + escapeHtmlAttr(m.name) + '</span>' +
          '<span class="item-id">' + escapeHtmlAttr(m.id) + ' &bull; ' + formatMoney(m.savings || 0) + '</span>' +
          '</div>'
        );
      }).join("");
      combobox.classList.remove("hidden");
    }

    searchInput.addEventListener("focus", function () { renderList(this.value); });
    searchInput.addEventListener("input", function () {
      hiddenId.value = "";
      applyLoanState.borrowerId = "";
      renderList(this.value);
      onLoanBorrowerSelected();
    });
    document.addEventListener("click", function (e) {
      if (!searchInput.contains(e.target) && !combobox.contains(e.target)) {
        combobox.classList.add("hidden");
      }
    });
  }

  function selectApplyLoanBorrower_(memberId) {
    const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
    const m = list.find(function (item) { return String(item.id) === String(memberId); });
    const searchInput = document.getElementById("al-borrower-search");
    const hiddenId = document.getElementById("al-borrower-id");
    const combobox = document.getElementById("al-borrower-combobox");

    if (searchInput && m) searchInput.value = m.name + " (" + m.id + ")";
    if (hiddenId) hiddenId.value = m ? m.id : "";
    if (combobox) combobox.classList.add("hidden");
    applyLoanState.borrowerId = m ? String(m.id) : "";
    onLoanBorrowerSelected();
  }

  function onLoanBorrowerSelected() {
    const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
    const m = list.find(function (item) { return String(item.id) === String(applyLoanState.borrowerId); });
    const savingsEl = document.getElementById("al-elig-savings");
    const ceilingEl = document.getElementById("al-elig-ceiling");
    const activeLoanEl = document.getElementById("al-elig-active-loan");

    const savings = m ? (Number(m.savings) || 0) : 0;
    const ceiling = savings * (applyLoanState.policy.borrowerMultiplier || 3);
    const activeBal = m ? (Number(m.loanBalance) || 0) : 0;

    if (savingsEl) savingsEl.textContent = formatMoney(savings);
    if (ceilingEl) ceilingEl.textContent = formatMoney(ceiling);
    if (activeLoanEl) {
      if (!m) {
        activeLoanEl.textContent = "Select borrower";
        activeLoanEl.className = "text-sm font-bold text-slate-700 dark:text-slate-200 font-mono tabular-nums mt-0.5";
      } else if (activeBal > 0) {
        activeLoanEl.textContent = "Active: " + formatMoney(activeBal);

      } else {
        activeLoanEl.textContent = "Clear (None)";
        activeLoanEl.className = "text-sm font-bold text-emerald-700 dark:text-emerald-400 font-mono tabular-nums mt-0.5";
      }
    }

    renderApplyLoanGuarantors_();
    onLoanAmountOrTenorChanged();

  function toggleDynamicApplyDropdown_(wrapperId, evt) {
    if (evt && typeof evt.stopPropagation === "function") {
      evt.stopPropagation();
    }
    const wrapper = document.getElementById(wrapperId);
    if (!wrapper) return;
    const trigger = wrapper.querySelector(".shadcn-select-trigger");
    const menu = wrapper.querySelector(".shadcn-dropdown-menu");
    if (!trigger || !menu) return;

    document.querySelectorAll(".shadcn-dropdown-menu").forEach(function (m) {
      if (m !== menu) m.classList.add("hidden");
    });
    document.querySelectorAll(".shadcn-select-trigger").forEach(function (t) {
      if (t !== trigger) t.classList.remove("active");
    });

    const isHidden = menu.classList.contains("hidden");
    menu.classList.toggle("hidden", !isHidden);
    trigger.classList.toggle("active", isHidden);
  }

  if (typeof document !== "undefined" && !window.__applyLoanDropdownListenersBound) {
    window.__applyLoanDropdownListenersBound = true;
    document.addEventListener("click", function (e) {
      if (!e.target.closest("[data-guarantor-combo]")) {
        document.querySelectorAll("[data-guarantor-combo] .custom-combobox-panel").forEach(function (p) {
          p.classList.add("hidden");
        });
      }
      const tenorWrap = document.getElementById("select-al-tenor-wrapper");
      if (tenorWrap && !tenorWrap.contains(e.target)) {
        const tm = document.getElementById("al-tenor-menu");
        const tt = document.getElementById("al-tenor-trigger");
        if (tm) tm.classList.add("hidden");
        if (tt) tt.classList.remove("active");

  function selectDynamicTenor_(months) {
    const tenorInput = document.getElementById("al-tenor");
    const menu = document.getElementById("al-tenor-menu");
    const trigger = document.getElementById("al-tenor-trigger");
    const label = trigger ? trigger.querySelector(".shadcn-select-label") : null;
    if (tenorInput) tenorInput.value = String(months);
    if (label) label.textContent = months + " Months";
    if (menu) {
      menu.querySelectorAll(".shadcn-dropdown-item").forEach(function (it) {
        it.classList.toggle("selected", Number(it.getAttribute("data-value")) === Number(months));
      });
      menu.classList.add("hidden");
    }
    if (trigger) trigger.classList.remove("active");
    updateLoanApplicationCalculator();
  }

  function onLoanAmountOrTenorChanged() {
    const amountEl = document.getElementById("al-amount");
    const tenorEl = document.getElementById("al-tenor");
    const tenorMenu = document.getElementById("al-tenor-menu");
    const tenorTrigger = document.getElementById("al-tenor-trigger");
    const tenorLabel = tenorTrigger ? tenorTrigger.querySelector(".shadcn-select-label") : null;
    const warnEl = document.getElementById("al-ceiling-warning");
    const amount = Number(amountEl && amountEl.value) || 0;

    const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
    const borrower = list.find(function (item) { return String(item.id) === String(applyLoanState.borrowerId); });
    const ceiling = borrower ? ((Number(borrower.savings) || 0) * (applyLoanState.policy.borrowerMultiplier || 3)) : 0;

    if (warnEl) {
      warnEl.classList.toggle("hidden", !(borrower && amount > ceiling));
    }

    if (tenorEl && tenorMenu) {
      const tiers = (applyLoanState.policy.tenorTiers || []).slice().sort(function (a, b) {
        return Number(a.maxAmount) - Number(b.maxAmount);
      });
      let matchedTier = tiers.find(function (t) { return amount <= Number(t.maxAmount); });
      if (!matchedTier && tiers.length > 0) matchedTier = tiers[tiers.length - 1];
      const maxMonths = Math.max(3, Number(matchedTier && matchedTier.maxMonths) || 12);

      const standardSteps = [3, 6, 9, 12, 18, 24, 36, 48, 60].filter(function (m) { return m <= maxMonths; });
      if (standardSteps.indexOf(maxMonths) === -1) standardSteps.push(maxMonths);
      standardSteps.sort(function (a, b) { return a - b; });

      const prevVal = Number(tenorEl.value);
      const selectedMonths = standardSteps.indexOf(prevVal) !== -1
        ? prevVal
        : standardSteps[standardSteps.length - 1];

      tenorEl.value = String(selectedMonths);
      if (tenorLabel) tenorLabel.textContent = selectedMonths + " Months";
      tenorMenu.innerHTML = standardSteps.map(function (m) {
        const isSel = m === selectedMonths;
        return (
          '<div class="shadcn-dropdown-item ' + (isSel ? "selected" : "") + '" data-value="' + m + '" onclick="selectDynamicTenor_(' + m + ')">' +
            '<span class="item-text font-mono tabular-nums">' + m + " Months</span>" +
            '<span class="item-id">' + (m <= 6 ? "Short" : m <= 12 ? "Std" : "Ext") + "</span>" +
          "</div>"
        );
      }).join("");
    }

    updateLoanApplicationCalculator();
  }

  function getEligibleGuarantorsForRow_(idx, filterText) {
    const q = (filterText || "").toLowerCase().trim();
    const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
    return list.filter(function (m) {
      if (String(m.id) === String(applyLoanState.borrowerId)) return false;
      const takenElsewhere = applyLoanState.guarantors.some(function (other, oIdx) {
        return oIdx !== idx && String(other.memberId) === String(m.id);
      });
      if (takenElsewhere) return false;
      if (!q) return true;
      return (m.name || "").toLowerCase().indexOf(q) !== -1 || (m.id || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderGuarantorComboboxPanel_(idx, filterText) {
    const panel = document.getElementById("al-guarantor-combobox-" + idx);
    if (!panel) return;

    document.querySelectorAll("[data-guarantor-combo] .custom-combobox-panel").forEach(function (p) {
      if (p !== panel) p.classList.add("hidden");
    });

    const matches = getEligibleGuarantorsForRow_(idx, filterText);
    if (!matches.length) {
      panel.innerHTML = '<div class="px-3 py-2 text-xs text-slate-400 text-center">No matching members found</div>';
      panel.classList.remove("hidden");
      return;
    }

    panel.innerHTML = matches.slice(0, 40).map(function (m) {
      const free = getMemberUnencumberedSavings_(m);
      return (
        '<div class="custom-combobox-item" onclick="event.stopPropagation(); onGuarantorSelected(' + idx + ', \'' + escapeHtmlAttr(m.id) + '\')">' +
          '<span>' + escapeHtmlAttr(m.name) + "</span>" +
          '<span class="item-id font-mono tabular-nums">' + escapeHtmlAttr(m.id) + " &bull; " + formatMoney(free) + " free</span>" +
        "</div>"
      );
    }).join("");
    panel.classList.remove("hidden");
  }

  function openGuarantorCombobox_(idx) {
    renderGuarantorComboboxPanel_(idx, "");
  }

  function onGuarantorSearchInput_(idx, value) {
    const g = applyLoanState.guarantors[idx];
    if (g && g.memberId) {
      g.memberId = "";
      const freeEl = document.getElementById("al-guarantor-free-" + idx);
      if (freeEl) {
        freeEl.textContent = "Select a guarantor to view available unencumbered savings";
      }
      updateLoanApplicationCalculator();
    }
    renderGuarantorComboboxPanel_(idx, value);
  }

      return String(m.id) !== String(applyLoanState.borrowerId);
    });

      addBtn.disabled = applyLoanState.guarantors.length >= 3;

      container.innerHTML = '<div class="p-3 text-center text-slate-500 dark:text-slate-400 bg-slate-50/70 dark:bg-slate-900/50 rounded-xl border border-slate-200/80 dark:border-slate-800 text-[11px]">No guarantors added yet. Click "Add Guarantor" above.</div>';
      return;

    container.innerHTML = applyLoanState.guarantors.map(function (g, idx) {

      return (

          '<div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center">' +
            '<div class="sm:col-span-7 relative" id="al-guarantor-wrap-' + idx + '" data-guarantor-combo="true">' +
              '<input type="text" id="al-guarantor-search-' + idx + '" autocomplete="off" value="' + escapeHtmlAttr(inputVal) + '" ' +
                'placeholder="Search guarantor name or ID..." ' +
                'onfocus="openGuarantorCombobox_(' + idx + ')" ' +
                'oninput="onGuarantorSearchInput_(' + idx + ', this.value)" ' +
                'aria-label="Search Guarantor ' + (idx + 1) + '" ' +
                'class="min-h-[38px] w-full pl-3 pr-9 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 rounded-lg text-xs font-medium outline-none focus:ring-2 focus:ring-slate-900/15 dark:focus:ring-slate-100/20" />' +
              '<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">' +
                '<i class="fas fa-search text-[11px]"></i>' +
              "</div>" +
              '<div id="al-guarantor-combobox-' + idx + '" class="custom-combobox-panel hidden"></div>' +
            "</div>" +
            '<div class="sm:col-span-4 relative flex items-center">' +
              '<span class="absolute left-3 text-[11px] font-mono font-semibold text-slate-400 dark:text-slate-500 pointer-events-none">KES</span>' +
              '<input type="number" min="0" step="500" value="' + (Number(g.amount) || "") + '" placeholder="0" ' +
                'oninput="onGuarantorAmountChanged(' + idx + ', this.value)" ' +
                'class="min-h-[38px] w-full pl-11 pr-3 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg text-xs font-mono tabular-nums font-semibold outline-none focus:ring-2 focus:ring-slate-900/15 dark:focus:ring-slate-100/20" />' +
            "</div>" +
            '<div class="sm:col-span-1 flex justify-end">' +
              '<button type="button" onclick="removeLoanGuarantorRow(' + idx + ')" aria-label="Remove Guarantor" ' +

                '<i class="fas fa-times text-xs"></i>' +
              "</button>" +

          '<div id="al-guarantor-free-' + idx + '" class="text-[10px] text-slate-500 dark:text-slate-400 font-mono tabular-nums px-0.5">' +
            (selectedMember ? ("Available to pledge: " + formatMoney(freeSavings)) : "Select a guarantor to view available unencumbered savings") +
          "</div>" +
        "</div>"
      );
    }).join("");
  }

  function addLoanGuarantorRow() {
    if (applyLoanState.guarantors.length >= 3) return;
    applyLoanState.guarantors.push({ memberId: "", amount: 0 });
    renderApplyLoanGuarantors_();
    updateLoanApplicationCalculator();
  }

  function removeLoanGuarantorRow(idx) {
    applyLoanState.guarantors.splice(idx, 1);
    renderApplyLoanGuarantors_();
    updateLoanApplicationCalculator();
  }

  function onGuarantorSelected(idx, memberId) {
    if (!applyLoanState.guarantors[idx]) return;
    applyLoanState.guarantors[idx].memberId = memberId || "";
    renderApplyLoanGuarantors_();
    updateLoanApplicationCalculator();
  }

  function onGuarantorAmountChanged(idx, value) {
    if (!applyLoanState.guarantors[idx]) return;
    applyLoanState.guarantors[idx].amount = Math.max(0, Number(value) || 0);
    updateLoanApplicationCalculator();
  }

  function updateLoanApplicationCalculator() {
    const principal = Math.max(0, Number(document.getElementById("al-amount")?.value) || 0);
    const months = Math.max(1, Number(document.getElementById("al-tenor")?.value) || 12);
    const ratePct = Number(applyLoanState.policy.interestRatePct) || 0;
    const interest = principal * (ratePct / 100);
    const totalRepayment = principal + interest;
    const monthly = totalRepayment / months;

    const setTxt = function (id, txt) {
      const el = document.getElementById(id);
      if (el) el.textContent = txt;
    };

    setTxt("al-prev-principal", formatMoney(principal));
    setTxt("al-prev-interest", formatMoney(interest));
    setTxt("al-prev-total", formatMoney(totalRepayment));
    setTxt("al-prev-monthly", formatMoney(monthly));

    const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
    const borrower = list.find(function (item) { return String(item.id) === String(applyLoanState.borrowerId); });
    const borrowerSavings = borrower ? (Number(borrower.savings) || 0) : 0;
    const totalGuaranteed = applyLoanState.guarantors.reduce(function (sum, g) {
      return sum + (g.memberId ? (Number(g.amount) || 0) : 0);
    }, 0);
    const totalCoverage = borrowerSavings + totalGuaranteed;
    const shortfall = Math.max(0, totalRepayment - totalCoverage);
    const pct = totalRepayment > 0 ? Math.min(100, Math.round((totalCoverage / totalRepayment) * 100)) : 0;

    setTxt("al-coverage-amount", formatMoney(totalCoverage));
    setTxt("al-coverage-target", formatMoney(totalRepayment));

    const barEl = document.getElementById("al-coverage-bar");
    const statusEl = document.getElementById("al-coverage-status");
    if (barEl) {
      barEl.style.width = pct + "%";
      barEl.className = "h-2 rounded-full transition-all duration-200 " + (
        totalRepayment <= 0
          ? "bg-slate-400"
          : shortfall <= 0
          ? "bg-emerald-600 dark:bg-emerald-500"
          : "bg-amber-500 dark:bg-amber-400"
      );
    }
    if (statusEl) {
      if (totalRepayment <= 0) {
        statusEl.textContent = "Enter amount";
        statusEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300";
      } else if (shortfall <= 0) {
        statusEl.textContent = "Fully Covered";
        statusEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60";
      } else {
        statusEl.textContent = "Shortfall: " + formatMoney(shortfall);
        statusEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60 font-mono tabular-nums";
      }
    }
  }

  function openRequestLoanModal() {
    if (!window.APP_PERMS || !window.APP_PERMS.loanRequest) {
      showNotification("You do not have permission to submit loan applications.", "warning");
      return;
    }

    applyLoanState.policy = getActiveLoanPolicy_();
    applyLoanState.borrowerId = "";
    const minG = Math.max(1, Math.min(3, Number(applyLoanState.policy.minGuarantors) || 2));
    applyLoanState.guarantors = Array.from({ length: minG }, function () {
      return { memberId: "", amount: 0 };
    });

    const form = document.getElementById("applyLoanForm");
    if (form) form.reset();

    const isMemberOnly = !window.APP_PERMS || window.APP_PERMS.isMemberOnly !== false;
    const searchInput = document.getElementById("al-borrower-search");
    const hiddenId = document.getElementById("al-borrower-id");
    const combobox = document.getElementById("al-borrower-combobox");

    if (searchInput) {
      searchInput.value = "";
      searchInput.readOnly = isMemberOnly;
      searchInput.disabled = isMemberOnly;
      searchInput.classList.toggle("opacity-75", isMemberOnly);
      searchInput.classList.toggle("cursor-not-allowed", isMemberOnly);
    }
    if (hiddenId) hiddenId.value = "";
    if (combobox) combobox.classList.add("hidden");

    if (typeof initShadcnSelects === "function") initShadcnSelects();
    if (typeof setShadcnSelectValue === "function") setShadcnSelectValue("select-al-purpose-wrapper", "Business");

    syncApplyLoanPolicyBadges_();
    if (!isMemberOnly) {
      setupApplyLoanBorrowerCombobox_();
    } else {
      const ownMemberId = (window.currentUser && window.currentUser.memberId) || (window.session && window.session.memberId) || "";
      if (ownMemberId) {
        applyLoanState.borrowerId = String(ownMemberId);
        if (hiddenId) hiddenId.value = String(ownMemberId);
        const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
        const ownRecord = list.find(function (m) { return String(m.id) === String(ownMemberId); });
        const ownName = (ownRecord && ownRecord.name) || (window.currentUser && window.currentUser.name) || String(ownMemberId);
        if (searchInput) searchInput.value = ownName + " (" + ownMemberId + ")";
      }
    }

    onLoanBorrowerSelected();

    if (typeof ensureMembersLoaded === "function") {
      ensureMembersLoaded().then(function () {
        if (isMemberOnly && applyLoanState.borrowerId) {
          selectApplyLoanBorrower_(applyLoanState.borrowerId);
        } else {
          renderApplyLoanGuarantors_();
        }
      }).catch(function () {});
    }

    if (typeof google !== "undefined" && google.script && google.script.run && typeof google.script.run.getLoanPolicySettings === "function") {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok !== false && res.success !== false) {
            const s = res.settings || res.policy || res;
            if (typeof cacheSet === "function") cacheSet("loan_policy_settings", s, 5 * 60 * 1000);
            applyLoanState.policy = getActiveLoanPolicy_();
            syncApplyLoanPolicyBadges_();
            onLoanBorrowerSelected();
          }
        })
        .getLoanPolicySettings();
    }

    const modal = document.getElementById("applyLoanModal");
    if (modal) modal.classList.remove("hidden");
  }

  function closeApplyLoanModal() {
    const modal = document.getElementById("applyLoanModal");
    if (modal) modal.classList.add("hidden");
  }

  function submitLoanApplicationForm() {
    const list = (typeof currentMembers !== "undefined" && Array.isArray(currentMembers)) ? currentMembers : [];
    const borrower = list.find(function (m) { return String(m.id) === String(applyLoanState.borrowerId); });
    if (!borrower) {
      showNotification("Please select a valid borrower.", "warning");
      return;
    }

    const amount = Number(document.getElementById("al-amount")?.value) || 0;
    const tenorMonths = Number(document.getElementById("al-tenor")?.value) || 0;
    const purpose = document.getElementById("al-purpose")?.value || "";

    if (amount <= 0) {
      showNotification("Please enter a valid loan amount greater than 0.", "warning");
      return;
    }
    if (tenorMonths < 1) {
      showNotification("Please select a valid loan tenor.", "warning");
      return;
    }

    const validGuarantors = applyLoanState.guarantors.filter(function (g) {
      return g.memberId && Number(g.amount) > 0;
    });
    const minReq = Number(applyLoanState.policy.minGuarantors) || 0;
    if (validGuarantors.length < minReq) {
      showNotification("At least " + minReq + " guarantor(s) with valid pledged amounts are required.", "warning");
      return;
    }

    for (let i = 0; i < validGuarantors.length; i++) {
      const g = validGuarantors[i];
      const gm = list.find(function (m) { return String(m.id) === String(g.memberId); });
      const free = getMemberUnencumberedSavings_(gm);
      if (Number(g.amount) > free) {
        showNotification("Guarantor " + ((gm && gm.name) || g.memberId) + " exceeds unencumbered savings (" + formatMoney(free) + ").", "warning");
        return;
      }
    }

    const btn = document.getElementById("al-submit-btn");
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs"></i> <span>Submitting...</span>';
    }
    if (typeof startAppLoader === "function") startAppLoader();

    const payload = {
      memberId: borrower.id,
      borrowerId: borrower.id,
      borrowerName: borrower.name,
      requestedAmount: amount,
      amount: amount,
      tenorMonths: tenorMonths,
      purpose: purpose,
      guarantors: validGuarantors.map(function (g) {
        const gm = list.find(function (m) { return String(m.id) === String(g.memberId); });
        return {
          memberId: g.memberId,
          memberName: gm ? gm.name : g.memberId,
          amount: Number(g.amount)
        };
      })
    };

    google.script.run
      .withSuccessHandler(function (res) {
        if (typeof stopAppLoader === "function") stopAppLoader();
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-paper-plane text-xs"></i> <span>Submit Loan Application</span>';
        }
        if (!res || res.ok === false || res.success === false) {
          showNotification("Loan application failed: " + ((res && res.error) || "Unknown error"), "error", 6000);
          return;
        }
        if (typeof cacheClear === "function") {
          cacheClear("loans_");
          cacheClear("members_list");
        }
        closeApplyLoanModal();
        showNotification("Loan application submitted successfully.", "success");
        loadLoans(1, true);
      })
      .withFailureHandler(function (err) {
        if (typeof stopAppLoader === "function") stopAppLoader();
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-paper-plane text-xs"></i> <span>Submit Loan Application</span>';
        }
        handleErr(err);
      })
      .submitLoanApplication(payload);
  }

  function setupLoanBorrowerCombobox() {
    const searchInput = document.getElementById("pl-member-search");
    const hiddenInput = document.getElementById("pl-member");
    const combobox = document.getElementById("pl-member-combobox");
    if (!searchInput || !hiddenInput || !combobox) return;
    if (searchInput.dataset.comboBound === "true") return;
    searchInput.dataset.comboBound = "true";

    function renderList(filterText) {
      const q = (filterText || "").toLowerCase().trim();
      const list = (typeof currentMembers !== "undefined" && currentMembers) ? currentMembers : [];
      const matches = list.filter((m) => {
        if (!q) return true;
        const nameMatch = (m.name || "").toLowerCase().indexOf(q) !== -1;
        const idMatch = (m.id || "").toLowerCase().indexOf(q) !== -1;
        return nameMatch || idMatch;
      });

      if (!matches.length) {
        combobox.innerHTML = '<div class="px-3 py-2 text-xs text-slate-400 text-center">No matching members found</div>';
        combobox.classList.remove("hidden");
        return;
      }

      combobox.innerHTML = matches.map((m) => {
        return (
          '<div class="custom-combobox-item" onclick="selectLoanBorrower(\'' +
          escapeHtmlAttr(m.name) +
          '\', \'' +
          escapeHtmlAttr(m.id) +
          '\')">' +
          '<span>' + m.name + '</span>' +
          '<span class="item-id">' + m.id + '</span>' +
          '</div>'
        );
      }).join("");
      combobox.classList.remove("hidden");
    }

    searchInput.addEventListener("focus", function() {
      renderList(this.value);
    });

    searchInput.addEventListener("input", function() {
      hiddenInput.value = this.value;
      renderList(this.value);
    });

    document.addEventListener("click", function(e) {
      if (!searchInput.contains(e.target) && !combobox.contains(e.target)) {
        combobox.classList.add("hidden");
      }
    });
  }

  let activeBorrowerLoans = [];

  function fetchActiveLoansForBorrower(name, id) {
    const loanWrapper = document.getElementById("pl-loan-select-wrapper");
    const loanSelect = document.getElementById("pl-loan-id");
    const badge = document.getElementById("pl-loan-count-badge");
    const card = document.getElementById("pl-loan-details-card");
    if (!loanWrapper || !loanSelect) return;

    loanSelect.innerHTML = '<option value="">Loading active loans...</option>';
    loanSelect.disabled = true;
    loanWrapper.classList.remove("hidden");
    if (badge) badge.innerText = "fetching...";
    if (card) card.classList.add("hidden");

    google.script.run
      .withSuccessHandler(function (res) {
        loanSelect.disabled = false;
        if (!res || !res.success || !res.loans || !res.loans.length) {
          loanSelect.innerHTML = '<option value="">No active loans found for this member</option>';
          if (badge) badge.innerText = "0 loans";
          activeBorrowerLoans = [];
          return;
        }

        activeBorrowerLoans = res.loans;
        if (badge) badge.innerText = res.loans.length + (res.loans.length === 1 ? " loan" : " loans");

        if (res.loans.length === 1) {
          // Exactly 1 loan: Auto-select by default
          const single = res.loans[0];
          loanSelect.innerHTML = '<option value="' + single.loanId + '" selected>#' + single.loanId + ' (Bal: ' + formatMoney(single.balance) + ')</option>';
          updateLoanDetailsCard(single.loanId);
        } else {
          // More than 1 loan: Let the user select
          loanSelect.innerHTML = '<option value="">-- Select from ' + res.loans.length + ' active loans --</option>' +
            res.loans.map(function(l) {
              return '<option value="' + l.loanId + '">#' + l.loanId + ' — Outstanding: ' + formatMoney(l.balance) + ' (' + l.status + ')</option>';
            }).join("");
          if (card) card.classList.add("hidden");
        }
      })
      .withFailureHandler(function (err) {
        loanSelect.disabled = false;
        loanSelect.innerHTML = '<option value="">Failed to load loans</option>';
        if (badge) badge.innerText = "error";
      })
      .getMemberActiveLoans(id, name);
  }

  function updateLoanDetailsCard(selectedLoanId) {
    const card = document.getElementById("pl-loan-details-card");
    if (!card) return;
    if (!selectedLoanId) {
      card.classList.add("hidden");
      return;
    }
    const loan = activeBorrowerLoans.find(function(l) { return l.loanId === selectedLoanId; });
    if (!loan) {
      card.classList.add("hidden");
      return;
    }

    const cRep = document.getElementById("pl-card-repayment");
    const cPaid = document.getElementById("pl-card-paid");
    const cBal = document.getElementById("pl-card-balance");
    if (cRep) cRep.innerText = formatMoney(loan.repayment);
    if (cPaid) cPaid.innerText = formatMoney(loan.paid);
    if (cBal) cBal.innerText = formatMoney(loan.balance);
    card.classList.remove("hidden");
  }

  function selectLoanBorrower(name, id) {
    const searchInput = document.getElementById("pl-member-search");
    const hiddenInput = document.getElementById("pl-member");
    const hiddenMid = document.getElementById("pl-member-id");
    const combobox = document.getElementById("pl-member-combobox");
    if (searchInput) searchInput.value = name + " (" + id + ")";
    if (hiddenInput) hiddenInput.value = name;
    if (hiddenMid) hiddenMid.value = id;
    if (combobox) combobox.classList.add("hidden");

    // Fetch and display active loans for this borrower
    fetchActiveLoansForBorrower(name, id);
  }

  function escapeHtmlAttr(str) {
    return String(str || "").replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function openPayLoanModal() {
    if (!window.APP_PERMS || !window.APP_PERMS.loanPayment) {
      showNotification("You do not have permission to record loan payments.", "warning");
      return;
    }
    const input = document.getElementById("pl-member-search");
    const hidden = document.getElementById("pl-member");
    const hiddenMid = document.getElementById("pl-member-id");
    const loanWrapper = document.getElementById("pl-loan-select-wrapper");
    const loanSelect = document.getElementById("pl-loan-id");
    const card = document.getElementById("pl-loan-details-card");

    if (input) input.value = "";
    if (hidden) hidden.value = "";
    if (hiddenMid) hiddenMid.value = "";
    if (loanWrapper) loanWrapper.classList.add("hidden");
    if (card) card.classList.add("hidden");
    if (loanSelect) {
      loanSelect.innerHTML = '<option value="">-- Choose Loan --</option>';
      loanSelect.onchange = function() {
        updateLoanDetailsCard(this.value);
      };
    }
    activeBorrowerLoans = [];
    document.getElementById("payLoanForm").reset();

    const plDatePicker = document.getElementById("pl-date") ? document.getElementById("pl-date")._flatpickr : null;
    if (plDatePicker) plDatePicker.setDate(new Date());
    else if (document.getElementById("pl-date")) document.getElementById("pl-date").value = new Date().toISOString().split("T")[0];
    const plTidInput = document.getElementById("pl-tid");
    if (plTidInput) plTidInput.value = "";
    setShadcnSelectValue("select-plmode-wrapper", "Equity Bank");

    if (typeof ensureMembersLoaded === "function") {
      ensureMembersLoaded().catch(function () {});
    }
    setupLoanBorrowerCombobox();
    document.getElementById("payLoanModal").classList.remove("hidden");
  }

  function closePayLoanModal() {
    document.getElementById("payLoanModal").classList.add("hidden");
  }

  document.getElementById("payLoanForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!window.APP_PERMS || !window.APP_PERMS.loanPayment) {
      showNotification("You do not have permission to record loan payments.", "warning");
      return;
    }
    const btn = e.submitter || document.getElementById("pl-submit-btn");
    if (btn) {
      btn.disabled = true;
      btn.textContent = "Submitting...";
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Submit Loan Payment";
        }
        if (!res || !res.success) {
          handleErr(res && res.error ? { message: res.error } : { message: "Payment failed." });
          return;
        }
        if (typeof cacheClear === "function") {
          cacheClear("loans_");
          cacheClear("loan_repayments_");
          cacheClear("contributions_");
          cacheClear("home_analytics");
          cacheClear("personal_financials");
          cacheClear("members_list");
        }
        closePayLoanModal();
        document.getElementById("payLoanForm").reset();
        loadLoans(loanPage, true);
        loadLoanRepayments(1, true);
        if (typeof refreshDashboard === "function") refreshDashboard(true);
      })
      .withFailureHandler(function (err) {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Submit Loan Payment";
        }
        handleErr(err);
      })
      .processLoanPayment({
        borrower: document.getElementById("pl-member") ? document.getElementById("pl-member").value : "",
        memberId: document.getElementById("pl-member-id") ? document.getElementById("pl-member-id").value : "",
        loanId: document.getElementById("pl-loan-id") ? document.getElementById("pl-loan-id").value : "",
        date: document.getElementById("pl-date") ? document.getElementById("pl-date").value : "",
        amount: document.getElementById("pl-amount").value,
        mode: document.getElementById("pl-mode").value,
        tid: document.getElementById("pl-tid") ? document.getElementById("pl-tid").value.trim() : "",
      });
  });
</script>
