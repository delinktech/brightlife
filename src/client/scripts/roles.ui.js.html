<script>
  let currentRoles = [];
  let filteredRoles = [];
  let rolesPage = 1;
  let rolesPerPage = 10;
  let rolesTotalPages = 1;

  function getRoleBadge(roleKey) {
    const r = (roleKey || "").toLowerCase();
    switch (r) {
      case "admin":
        return '<span class="badge-info"><i class="fas fa-shield-alt mr-1"></i> Admin</span>';
      case "treasurer":
        return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-50 text-purple-700 border border-purple-200"><i class="fas fa-wallet mr-1"></i> Treasurer</span>';
      case "secretary":
        return '<span class="badge-success"><i class="fas fa-user-pen mr-1"></i> Secretary</span>';
      default:
        return '<span class="badge-secondary"><i class="fas fa-user mr-1"></i> Member</span>';
    }
  }

  function getActiveStatusBadge(active) {
    if (typeof renderStatusPill === "function") {
      return renderStatusPill(active ? "Active" : "Inactive");
    }
    if (active) {
      return '<span class="badge-success"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Active</span>';
    }
    return '<span class="badge-danger"><span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Inactive</span>';
  }

  function applyRolesData(response) {
    currentRoles = response.roles || [];
    filterRolesTable(rolesPage);
  }

  function loadUserRoles(forceRefresh) {
    const container = document.getElementById("roles-table-body");
    if (!container) return;

    const cacheKey = "roles_list";
    const entry = (!forceRefresh && typeof cacheGetEntry === "function") ? cacheGetEntry(cacheKey) : null;
    const cached = entry ? entry.data : null;
    const hasCached = Boolean(cached);
    const isFresh = Boolean(entry && entry.timestamp && (Date.now() - Number(entry.timestamp) < 60000));

    if (hasCached) {
      applyRolesData(cached);
      if (isFresh) {
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Cached");
        return;
      }
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Syncing...");
    } else {
      startAppLoader();
      container.innerHTML =
        typeof renderTableSkeleton === "function"
          ? renderTableSkeleton(5, 5)
          : '<tr><td colspan="5" class="px-6 py-6 text-center text-slate-400">Loading user roles...</td></tr>';
      if (typeof setHeaderSyncState === "function") setHeaderSyncState("revalidating", "Loading...");
    }

    google.script.run
      .withSuccessHandler((response) => {
        if (!hasCached) stopAppLoader();
        if (!response || !response.success) {
          if (!hasCached) {
            container.innerHTML =
              '<tr><td colspan="5" class="text-center py-6 text-rose-600">' +
              ((response && response.error) || "Failed to load user roles.") +
              "</td></tr>";
            if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Sync error");
          } else {
            if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Offline cache");
          }
          return;
        }

        if (typeof cacheSet === "function") cacheSet(cacheKey, response, 5 * 60 * 1000);
        applyRolesData(response);
        if (typeof setHeaderSyncState === "function") setHeaderSyncState("synced");
      })
      .withFailureHandler((err) => {
        if (!hasCached) {
          stopAppLoader();
          if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Sync error");
          handleErr(err);
        } else {
          if (typeof setHeaderSyncState === "function") setHeaderSyncState("cached", "Offline cache");
        }
      })
      .getRolesData();
  }

  function renderRolesTable(rows) {
    const container = document.getElementById("roles-table-body");
    if (!container) return;

    let html = "";
    (rows || []).forEach((item) => {
      html +=
        '<tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
        '<td class="col-r-identity px-4 py-3"><div class="font-semibold text-xs text-slate-900 dark:text-white">' +
        (item.name || "User") +
        "</div></td>" +
        '<td class="col-r-email px-4 py-3 text-slate-500 dark:text-slate-400 font-mono text-xs">' +
        item.email +
        "</td>" +
        '<td class="col-r-role px-4 py-3 text-center">' +
        getRoleBadge(item.roleKey) +
        "</td>" +
        '<td class="col-r-status px-4 py-3 text-center">' +
        getActiveStatusBadge(item.active) +
        "</td>" +
        '<td class="col-r-action px-4 py-3 text-center" data-require-perm="isAdmin"><button type="button" onclick="openRoleModal(\'' +
        item.email +
        '\')" title="Edit User Role" class="min-w-[38px] min-h-[38px] inline-flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><i class="fas fa-edit"></i></button></td>' +
        "</tr>";
    });

    container.innerHTML =
      html ||
      '<tr><td colspan="5" class="text-center py-6 text-slate-500 dark:text-slate-400">' +
      (currentRoles.length > 0
        ? "No user roles match your search or filter criteria."
        : "No user roles configured.") +
      "</td></tr>";

    if (typeof applySavedColumnPreferences === "function") {
      applySavedColumnPreferences("roles-table");
    }

    if (typeof applyRolePermissions === "function" && window.APP_PERMS) {
      applyRolePermissions(window.APP_PERMS);
    }
  }

  function filterRolesTable(targetPage) {
    const searchEl = document.getElementById("roles-search-input");
    const roleEl = document.getElementById("roles-role-filter");
    const statusEl = document.getElementById("roles-status-filter");
    const q = (searchEl ? searchEl.value : "").toLowerCase().trim();
    const roleFilter = (roleEl ? roleEl.value : "all").toLowerCase().trim();
    const statusFilter = (statusEl ? statusEl.value : "all").toLowerCase().trim();

    filteredRoles = (currentRoles || []).filter(function (item) {
      if (q) {
        const hay = [item.name, item.email, item.memberId, item.member, item.role].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (roleFilter && roleFilter !== "all") {
        const rk = String(item.roleKey || item.role || "").toLowerCase().trim();
        if (rk !== roleFilter) return false;
      }
      if (statusFilter && statusFilter !== "all") {
        const isActive = Boolean(item.active);
        if (statusFilter === "active" && !isActive) return false;
        if (statusFilter === "inactive" && isActive) return false;
      }
      return true;
    });

    const totalRows = filteredRoles.length;
    rolesTotalPages = Math.max(1, Math.ceil(totalRows / rolesPerPage));
    const reqPage = Number(targetPage);
    rolesPage = reqPage > 0 ? Math.min(rolesTotalPages, reqPage) : 1;

    const startIdx = (rolesPage - 1) * rolesPerPage;
    const pageRows = filteredRoles.slice(startIdx, startIdx + rolesPerPage);

    renderRolesTable(pageRows);
    if (typeof renderTablePagination === "function") {
      renderTablePagination("roles-pagination", {
        currentPage: rolesPage,
        totalPages: rolesTotalPages,
        totalRows: totalRows,
        rowsPerPage: rolesPerPage,
        onPageChangeName: "setRolesPage",
        onRowsPerPageChangeName: "setRolesRowsPerPage",
        entityLabel: "users",
      });
    }
  }
  window.filterRolesTable = filterRolesTable;

  function setRolesPage(page) {
    const p = Number(page) || 1;
    if (p < 1 || p > rolesTotalPages) return;
    filterRolesTable(p);
  }
  window.setRolesPage = setRolesPage;

  function setRolesRowsPerPage(limit) {
    const n = Number(limit);
    rolesPerPage = n > 0 ? n : 10;
    filterRolesTable(1);
  }
  window.setRolesRowsPerPage = setRolesRowsPerPage;

  function setupRoleMemberCombobox(selectedMemberValue, currentEditingEmail) {
    const searchInput = document.getElementById("r-member-search");
    const hiddenInput = document.getElementById("r-member");
    const combobox = document.getElementById("r-member-combobox");
    if (!searchInput || !hiddenInput || !combobox) return;

    // Set of member IDs already assigned in the Roles sheet
    const assignedMemberIds = new Set();
    currentRoles.forEach((r) => {
      if (currentEditingEmail && r.email && r.email.toLowerCase() === currentEditingEmail.toLowerCase()) {
        return;
      }
      if (r.memberId) assignedMemberIds.add(String(r.memberId).trim().toUpperCase());
      if (r.member) {
        const parts = String(r.member).split("—");
        if (parts.length > 0 && parts[0].trim()) {
          assignedMemberIds.add(parts[0].trim().toUpperCase());
        }
      }
    });

    function renderList(filterText) {
      const q = (filterText || "").toLowerCase().trim();
      const list = (typeof currentMembers !== "undefined" && currentMembers) ? currentMembers : [];
      const matches = list.filter((m) => {
        const mIdUpper = String(m.id).trim().toUpperCase();
        if (assignedMemberIds.has(mIdUpper)) return false;
        if (!q) return true;
        const nameMatch = (m.name || "").toLowerCase().indexOf(q) !== -1;
        const idMatch = (m.id || "").toLowerCase().indexOf(q) !== -1;
        return nameMatch || idMatch;
      });

      if (!matches.length) {
        combobox.innerHTML = '<div class="px-3 py-2 text-xs text-slate-400 text-center">No available unlinked members</div>';
        combobox.classList.remove("hidden");
        return;
      }

      combobox.innerHTML = matches.map((m) => {
        const val = m.id + " — " + m.name;
        return (
          '<div class="custom-combobox-item" onclick="selectRoleMember(\'' +
          escapeHtmlAttr(val) +
          '\', \'' +
          escapeHtmlAttr(m.name) +
          '\', \'' +
          escapeHtmlAttr(m.id) +
          '\')">' +
          '<span>' + m.name + '</span>' +
          '<span class="item-id">' + m.id + '</span>' +
          '</div>'
        );
      }).join("");
      combobox.classList.remove("hidden");
    }

    searchInput.addEventListener("focus", function() {
      renderList(this.value);
    });

    searchInput.addEventListener("input", function() {
      hiddenInput.value = this.value;
      renderList(this.value);
    });

    document.addEventListener("click", function(e) {
      if (!searchInput.contains(e.target) && !combobox.contains(e.target)) {
        combobox.classList.add("hidden");
      }
    });

    if (selectedMemberValue) {
      searchInput.value = selectedMemberValue;
      hiddenInput.value = selectedMemberValue;
    }
  }

  function selectRoleMember(fullVal, name, id) {
    const searchInput = document.getElementById("r-member-search");
    const hiddenInput = document.getElementById("r-member");
    const combobox = document.getElementById("r-member-combobox");
    if (searchInput) searchInput.value = name + " (" + id + ")";
    if (hiddenInput) hiddenInput.value = fullVal;
    if (combobox) combobox.classList.add("hidden");
  }

  function escapeHtmlAttr(str) {
    return String(str || "").replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function openRoleModal(email) {
    if (!window.APP_PERMS || !window.APP_PERMS.isAdmin) {
      showNotification("Only Administrators can modify user roles.", "warning");
      return;
    }
    const modal = document.getElementById("roleModal");
    const form = document.getElementById("roleForm");
    const title = document.getElementById("roleModalTitle");
    const emailInput = document.getElementById("r-email");
    const memberInput = document.getElementById("r-member-search");
    const memberHidden = document.getElementById("r-member");
    form.reset();

    let selectedMember = "";

    if (email) {
      title.innerText = "Edit User Role";
      emailInput.value = email;
      emailInput.readOnly = true;
      emailInput.classList.add("bg-slate-100", "cursor-not-allowed");

      const item = currentRoles.find((r) => r.email === email);
      if (item) {
        selectedMember = item.member || (item.memberId ? item.memberId + " — " + item.name : "");
        setShadcnSelectValue("select-role-wrapper", item.role || "Member");
        setShadcnSelectValue("select-active-wrapper", item.active ? "true" : "false");
        document.getElementById("r-notes").value = item.notes || "";
      }
    } else {
      title.innerText = "Add User Access Role";
      emailInput.readOnly = false;
      emailInput.classList.remove("bg-slate-100", "cursor-not-allowed");
      setShadcnSelectValue("select-role-wrapper", "Member");
      setShadcnSelectValue("select-active-wrapper", "true");
      document.getElementById("r-notes").value = "";
      if (memberInput) memberInput.value = "";
      if (memberHidden) memberHidden.value = "";
    }

    if (typeof ensureMembersLoaded === "function") {
      ensureMembersLoaded()
        .then(function () {
          setupRoleMemberCombobox(selectedMember, email);
        })
        .catch(function () {
          setupRoleMemberCombobox(selectedMember, email);
        });
    } else if (!currentMembers || !currentMembers.length) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.members) {
            currentMembers = res.members;
            setupRoleMemberCombobox(selectedMember, email);
          }
        })
        .getMembersData();
    } else {
      setupRoleMemberCombobox(selectedMember, email);
    }

    modal.classList.remove("hidden");
  }

  function closeRoleModal() {
    document.getElementById("roleModal").classList.add("hidden");
  }

  document.getElementById("roleForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const btn = e.submitter;
    btn.disabled = true;
    btn.innerText = "Saving...";

    const payload = {
      email: document.getElementById("r-email").value,
      member: document.getElementById("r-member-search") ? document.getElementById("r-member-search").value : "",
      role: document.getElementById("r-role").value,
      active: document.getElementById("r-active").value === "true",
      notes: document.getElementById("r-notes").value,
    };

    google.script.run
      .withSuccessHandler(function (response) {
        btn.disabled = false;
        btn.innerText = "Save Role";
        if (typeof cacheClear === "function") cacheClear("roles_list");
        closeRoleModal();
        loadUserRoles(true);
        refreshSessionInfo();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.innerText = "Try Again";
        handleErr(err);
      })
      .saveUserRole(payload);
  });
</script>
