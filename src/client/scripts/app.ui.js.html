<script>
  let currentHomeRange = "year";
  let appLoaderActiveRequests = 0;
  let appLoaderTimer = null;

  function formatMoney(value) {
    return new Intl.NumberFormat("en-KE", {
      style: "currency",
      currency: "KES",
      maximumFractionDigits: 0,
    }).format(Number(value) || 0);
  }

  /** Values ≥ 10,000 show as KES 39K to save horizontal space in tight cards. */
  function formatMoneyCompactK(value) {
    const n = Number(value) || 0;
    if (n >= 10000) {
      return "KES " + Math.round(n / 1000) + "K";
    }
    return formatMoney(n);
  }

  let currentSessionEmail = "";
  let currentSessionRole = "";
  let sessionAccessDenied = false;
  let currentActivePageId = "session-loading";

  const STAFF_ONLY_PAGES = [
    "members",
    "contributions",
    "investments",
    "dividends",
    "statements",
    "roles",
    "settings",
  ];
  const ADMIN_RESTRICTED_PAGES = STAFF_ONLY_PAGES;

  /* ---------------- Stale-While-Revalidate (SWR) Client Cache ---------------- */
  const BL_CACHE_PREFIX = "bl_swr_v1_";
  const BL_CACHE_OWNER_KEY = BL_CACHE_PREFIX + "owner";
  let lastGlobalSyncAt = 0;
  let currentSyncStatus = "ready";
  let membersLoadPromise = null;

  function getNormalizedSessionOwner() {
    const email = String(currentSessionEmail || "").trim().toLowerCase();
    if (!email) return "";
    const role = String(currentSessionRole || "").trim().toLowerCase();
    return email + "|" + role;
  }

  function cacheSet(key, data, ttlMs) {
    const owner = getNormalizedSessionOwner();
    if (!key || !owner || sessionAccessDenied) return;
    const now = Date.now();
    const ttl = Number(ttlMs) > 0 ? Number(ttlMs) : 5 * 60 * 1000;
    try {
      sessionStorage.setItem(BL_CACHE_OWNER_KEY, owner);
      sessionStorage.setItem(
        BL_CACHE_PREFIX + key,
        JSON.stringify({ owner: owner, data: data, timestamp: now, ttlMs: ttl })
      );
      lastGlobalSyncAt = now;
    } catch (e) {
      // Ignore quota / privacy mode errors cleanly
    }
  }
  window.cacheSet = cacheSet;

  function cacheGetEntry(key) {
    if (!key) return null;
    const owner = getNormalizedSessionOwner();
    if (!owner || sessionAccessDenied) {
      try {
        sessionStorage.removeItem(BL_CACHE_PREFIX + key);
      } catch (e) {}
      return null;
    }
    try {
      const storedOwner = String(sessionStorage.getItem(BL_CACHE_OWNER_KEY) || "").trim().toLowerCase();
      if (storedOwner && storedOwner !== owner) {
        cacheClear();
        return null;
      }
      const raw = sessionStorage.getItem(BL_CACHE_PREFIX + key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (
        !parsed ||
        typeof parsed !== "object" ||
        !parsed.timestamp ||
        String(parsed.owner || "").trim().toLowerCase() !== owner
      ) {
        sessionStorage.removeItem(BL_CACHE_PREFIX + key);
        return null;
      }
      const age = Date.now() - Number(parsed.timestamp);
      const ttl = Number(parsed.ttlMs) || 0;
      if (ttl > 0 && age > ttl) {
        sessionStorage.removeItem(BL_CACHE_PREFIX + key);
        return null;
      }
      return parsed;
    } catch (e) {
      return null;
    }
  }
  window.cacheGetEntry = cacheGetEntry;

  function cacheGet(key) {
    const entry = cacheGetEntry(key);
    return entry ? entry.data : null;
  }
  window.cacheGet = cacheGet;

  function cacheClear(keyOrPrefix) {
    try {
      if (!keyOrPrefix) {
        const toDelete = [];
        for (let i = 0; i < sessionStorage.length; i++) {
          const k = sessionStorage.key(i);
          if (k && k.indexOf(BL_CACHE_PREFIX) === 0) toDelete.push(k);
        }
        toDelete.forEach((k) => sessionStorage.removeItem(k));
        return;
      }
      const exactKey = BL_CACHE_PREFIX + keyOrPrefix;
      sessionStorage.removeItem(exactKey);
      const prefixMatch = [];
      for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        if (k && k.indexOf(exactKey) === 0) prefixMatch.push(k);
      }
      prefixMatch.forEach((k) => sessionStorage.removeItem(k));
    } catch (e) {}
  }
  window.cacheClear = cacheClear;

  function cacheCount() {
    let count = 0;
    try {
      for (let i = 0; i < sessionStorage.length; i++) {
        const k = sessionStorage.key(i);
        if (k && k.indexOf(BL_CACHE_PREFIX) === 0 && k !== BL_CACHE_OWNER_KEY) count++;
      }
    } catch (e) {}
    return count;
  }

  function formatRelativeSyncTime(ts) {
    if (!ts) return "Not synced yet";
    const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    if (diffSec < 15) return "Synced just now";
    if (diffSec < 60) return "Synced " + diffSec + "s ago";
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return "Synced " + diffMin + "m ago";
    const diffHr = Math.floor(diffMin / 60);
    return "Synced " + diffHr + "h ago";
  }

  function setHeaderSyncState(state, customLabel) {
    currentSyncStatus = state || "synced";
    if (state === "synced") {
      lastGlobalSyncAt = Date.now();
    }
    const dot = document.getElementById("header-sync-dot");
    const spinner = document.getElementById("header-sync-spinner");
    const text = document.getElementById("header-sync-text");
    const refreshIcon = document.getElementById("header-refresh-icon");

    if (state === "revalidating") {
      if (dot) dot.classList.add("hidden");
      if (spinner) spinner.classList.remove("hidden");
      if (refreshIcon) refreshIcon.classList.add("fa-spin");
      if (text) text.textContent = customLabel || "Syncing...";
    } else if (state === "cached") {
      if (dot) {
        dot.className = "w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0";
        dot.classList.remove("hidden");
      }
      if (spinner) spinner.classList.add("hidden");
      if (refreshIcon) refreshIcon.classList.remove("fa-spin");
      if (text) text.textContent = customLabel || formatRelativeSyncTime(lastGlobalSyncAt);
    } else {
      if (dot) {
        dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0";
        dot.classList.remove("hidden");
      }
      if (spinner) spinner.classList.add("hidden");
      if (refreshIcon) refreshIcon.classList.remove("fa-spin");
      if (text) text.textContent = customLabel || formatRelativeSyncTime(lastGlobalSyncAt);
    }
  }
  window.setHeaderSyncState = setHeaderSyncState;

  setInterval(function () {
    if (currentSyncStatus === "synced" && lastGlobalSyncAt > 0) {
      const text = document.getElementById("header-sync-text");
      if (text) text.textContent = formatRelativeSyncTime(lastGlobalSyncAt);
    }
  }, 30000);

  function handleErr(err) {
    console.error(err);
    var msg = "Operation failed. Please retry.";
    if (err && err.message) msg = String(err.message);
    else if (typeof err === "string") msg = err;

    if (msg.indexOf("Access denied") !== -1 || msg.indexOf("Access Denied") !== -1) {
      showAccessDenied(currentSessionEmail);
      return;
    }
    showNotification(msg, "error", 6000);
  }
  window.handleErr = handleErr;

  /* ---------------- Shimmer Skeleton Generators & Confirm Dialog ---------------- */
  function renderCardSkeleton(count) {
    const n = Math.max(1, Number(count) || 4);
    let html = "";
    for (let i = 0; i < n; i++) {
      html +=
        '<div class="bg-white p-4 sm:p-5 rounded-xl border border-slate-200/80 shadow-sm space-y-3">' +
          '<div class="flex items-center justify-between">' +
            '<div class="h-3 w-24 rounded skeleton-shimmer"></div>' +
            '<div class="h-7 w-7 rounded-lg skeleton-shimmer"></div>' +
          '</div>' +
          '<div class="h-7 w-32 rounded-md skeleton-shimmer"></div>' +
          '<div class="h-3 w-40 rounded skeleton-shimmer"></div>' +
        '</div>';
    }
    return html;
  }
  window.renderCardSkeleton = renderCardSkeleton;

  function renderTableSkeleton(columns, rows) {
    const cols = Math.max(1, Number(columns) || 6);
    const rowCount = Math.max(1, Number(rows) || 5);
    const widths = ["78%", "55%", "85%", "45%", "68%", "40%", "72%", "60%"];
    let html = "";
    for (let r = 0; r < rowCount; r++) {
      html += "<tr>";
      for (let c = 0; c < cols; c++) {
        const w = widths[(r * 3 + c) % widths.length];
        const alignClass = c === cols - 1 ? "mx-auto" : (c > 1 && c < cols - 1 ? "ml-auto" : "");
        html +=
          '<td class="px-4 py-3">' +
            '<div class="h-4 rounded skeleton-shimmer ' + alignClass + '" style="width: ' + w + '"></div>' +
          "</td>";
      }
      html += "</tr>";
    }
    return html;
  }
  window.renderTableSkeleton = renderTableSkeleton;

  function renderChartSkeleton(type) {
    const kind = String(type || "bar").toLowerCase();
    if (kind === "doughnut" || kind === "pie") {
      return (
        '<div class="h-full w-full flex flex-col items-center justify-center gap-4 p-4">' +
          '<div class="w-36 h-36 rounded-full border-[18px] border-slate-100 relative flex items-center justify-center">' +
            '<div class="w-full h-full rounded-full skeleton-shimmer opacity-50"></div>' +
          '</div>' +
          '<div class="flex items-center gap-3">' +
            '<div class="h-3 w-16 rounded skeleton-shimmer"></div>' +
            '<div class="h-3 w-16 rounded skeleton-shimmer"></div>' +
            '<div class="h-3 w-16 rounded skeleton-shimmer"></div>' +
          '</div>' +
        '</div>'
      );
    }
    const barHeights = kind === "line" ? ["35%", "52%", "48%", "68%", "60%", "82%", "74%"] : ["45%", "72%", "58%", "84%", "64%", "50%", "76%"];
    return (
      '<div class="h-full w-full flex items-end justify-between gap-2.5 px-4 py-6">' +
        barHeights.map(function (h) {
          return '<div class="flex-1 rounded-t-md skeleton-shimmer" style="height: ' + h + '"></div>';
        }).join("") +
      '</div>'
    );
  }
  window.renderChartSkeleton = renderChartSkeleton;

  function escapePaginationHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function safeGlobalCallbackExpr(fnName, argExpr) {
    const clean = String(fnName || "").trim();
    if (!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(clean)) return "";
    return "if(typeof window['" + clean + "']==='function'){window['" + clean + "'](" + argExpr + ");}";
  }

  window.renderTablePagination = function (containerId, options) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const opts = options || {};
    const rowsPerPage = Math.max(1, Number(opts.rowsPerPage) || 10);
    const totalRows = Math.max(0, Number(opts.totalRows) || 0);
    const totalPages = Math.max(1, Number(opts.totalPages) || Math.ceil(totalRows / rowsPerPage) || 1);
    const currentPage = Math.min(totalPages, Math.max(1, Number(opts.currentPage) || 1));
    const entityLabel = escapePaginationHtml(opts.entityLabel || "records");
    const onPageChangeName = String(opts.onPageChangeName || "").trim();
    const onRowsPerPageChangeName = String(opts.onRowsPerPageChangeName || "").trim();

    const start = totalRows === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
    const end = totalRows === 0 ? 0 : Math.min(totalRows, currentPage * rowsPerPage);

    const sizeOptions = [10, 25, 50, 100];
    if (sizeOptions.indexOf(rowsPerPage) === -1) {
      sizeOptions.push(rowsPerPage);
      sizeOptions.sort(function (a, b) {
        return a - b;
      });
    }

    const rppHandler = safeGlobalCallbackExpr(onRowsPerPageChangeName, "Number(this.value)");
    const selectHtml =
      '<div class="flex items-center gap-1.5">' +
        '<label for="' + escapePaginationHtml(containerId) + '-rpp" class="text-[11px] font-medium text-slate-500 dark:text-slate-400 whitespace-nowrap">Rows:</label>' +
        '<select id="' + escapePaginationHtml(containerId) + '-rpp" aria-label="Rows per page" ' +
          (rppHandler ? 'onchange="' + rppHandler + '" ' : "") +
          'class="pl-2.5 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg font-mono tabular-nums min-h-[44px] sm:min-h-[38px] focus:outline-none focus:ring-2 focus:ring-sky-500/25 focus:border-sky-500 cursor-pointer">' +
          sizeOptions
            .map(function (n) {
              return '<option value="' + n + '"' + (n === rowsPerPage ? " selected" : "") + ">" + n + "</option>";
            })
            .join("") +
        "</select>" +
      "</div>";

    const pages = [];
    if (totalPages <= 5) {
      for (let p = 1; p <= totalPages; p++) pages.push(p);
    } else {
      pages.push(1);
      if (currentPage > 3) pages.push("...");
      const winStart = Math.max(2, currentPage - 1);
      const winEnd = Math.min(totalPages - 1, currentPage + 1);
      for (let p = winStart; p <= winEnd; p++) pages.push(p);
      if (currentPage < totalPages - 2) pages.push("...");
      pages.push(totalPages);
    }

    const prevDisabled = currentPage <= 1 || totalRows === 0;
    const nextDisabled = currentPage >= totalPages || totalRows === 0;
    const prevExpr = prevDisabled ? "" : safeGlobalCallbackExpr(onPageChangeName, String(currentPage - 1));
    const nextExpr = nextDisabled ? "" : safeGlobalCallbackExpr(onPageChangeName, String(currentPage + 1));

    const pageButtonsHtml = pages
      .map(function (p) {
        if (p === "...") {
          return '<span class="px-1.5 text-xs text-slate-400 dark:text-slate-500 font-mono select-none">&hellip;</span>';
        }
        const isActive = p === currentPage;
        const clickExpr = isActive ? "" : safeGlobalCallbackExpr(onPageChangeName, String(p));
        return (
          '<button type="button" ' +
            (isActive ? 'aria-current="page" ' : "") +
            (clickExpr ? 'onclick="' + clickExpr + '" ' : "") +
            'class="min-h-[44px] min-w-[44px] sm:min-h-[38px] sm:min-w-[38px] px-2.5 py-1 text-xs font-mono tabular-nums rounded-lg border transition-colors inline-flex items-center justify-center ' +
            (isActive
              ? "bg-slate-900 text-white border-slate-900 dark:bg-sky-500 dark:text-slate-950 dark:border-sky-500 font-bold shadow-xs"
              : "bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 font-medium") +
          '">' +
          p +
          "</button>"
        );
      })
      .join("");

    container.innerHTML =
      '<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 px-4 sm:px-6 py-3 bg-white dark:bg-[#0b1320] border-t border-slate-100 dark:border-slate-800/80">' +
        '<div class="flex flex-wrap items-center justify-between sm:justify-start gap-3">' +
          '<p class="text-xs text-slate-500 dark:text-slate-400">' +
            'Showing <span class="font-bold text-slate-900 dark:text-slate-100 font-mono tabular-nums">' + start + "</span> to " +
            '<span class="font-bold text-slate-900 dark:text-slate-100 font-mono tabular-nums">' + end + "</span> of " +
            '<span class="font-bold text-slate-900 dark:text-slate-100 font-mono tabular-nums">' + totalRows + "</span> " +
            entityLabel +
          "</p>" +
          selectHtml +
        "</div>" +
        '<div class="flex flex-wrap items-center justify-center sm:justify-end gap-1.5">' +
          '<button type="button" ' +
            (prevDisabled ? "disabled " : "") +
            (prevExpr ? 'onclick="' + prevExpr + '" ' : "") +
            'aria-label="Previous page" ' +
            'class="min-h-[44px] sm:min-h-[38px] px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors inline-flex items-center gap-1">' +
            '<i class="fas fa-chevron-left text-[10px]"></i><span>Prev</span>' +
          "</button>" +
          '<div class="flex items-center gap-1">' +
            pageButtonsHtml +
          "</div>" +
          '<button type="button" ' +
            (nextDisabled ? "disabled " : "") +
            (nextExpr ? 'onclick="' + nextExpr + '" ' : "") +
            'aria-label="Next page" ' +
            'class="min-h-[44px] sm:min-h-[38px] px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors inline-flex items-center gap-1">' +
            '<span>Next</span><i class="fas fa-chevron-right text-[10px]"></i>' +
          "</button>" +
        "</div>" +
      "</div>";
  };

  function resolveThemePreference(pref) {
    const mode = String(pref || "light").toLowerCase().trim();
    if (mode === "dark") return true;
    if (mode === "system") {
      return Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
    return false;
  }

  function syncThemeControls(storedPref, isDark) {
    const pref = storedPref || "light";
    const themeBtn = document.getElementById("header-theme-btn");
    const themeIcon = document.getElementById("header-theme-icon");
    if (themeBtn) {
      themeBtn.setAttribute("aria-pressed", isDark ? "true" : "false");
      themeBtn.setAttribute("title", isDark ? "Switch to Light Mode" : "Switch to Dark Mode");
    }
    if (themeIcon) {
      themeIcon.className = isDark
        ? "fas fa-sun text-amber-300 text-xs"
        : "fas fa-moon text-slate-500 text-xs";
    }
    document.querySelectorAll("[data-theme-opt]").forEach(function (btn) {
      const opt = btn.getAttribute("data-theme-opt");
      const active = opt === pref;
      btn.className =
        "px-2.5 py-1.5 min-h-[32px] rounded-md text-[11px] font-semibold transition-colors " +
        (active
          ? "bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs"
          : "text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white");
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });
  }

  function applyThemeState(pref) {
    const clean = pref === "dark" || pref === "system" ? pref : "light";
    const isDark = resolveThemePreference(clean);
    const root = document.documentElement;
    if (root) {
      root.classList.toggle("dark", isDark);
      root.classList.toggle("light", !isDark);
      if (root.style) root.style.colorScheme = isDark ? "dark" : "light";
    }
    syncThemeControls(clean, isDark);
    if (typeof window.syncChartsTheme === "function") {
      window.syncChartsTheme();
    }
    return isDark;
  }

  function setTheme(theme) {
    const clean = theme === "dark" || theme === "system" ? theme : "light";
    try {
      localStorage.setItem("bl_theme", clean);
    } catch (_) {}
    applyThemeState(clean);
  }
  window.setTheme = setTheme;

  function toggleTheme() {
    const currentlyDark = Boolean(document.documentElement && document.documentElement.classList.contains("dark"));
    setTheme(currentlyDark ? "light" : "dark");
  }
  window.toggleTheme = toggleTheme;

  function initTheme() {
    let stored = "light";
    try {
      stored = localStorage.getItem("bl_theme") || "light";
    } catch (_) {}
    applyThemeState(stored);

    if (!window._blThemeMediaBound && window.matchMedia) {
      window._blThemeMediaBound = true;
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const onMediaChange = function () {
        let cur = "light";
        try {
          cur = localStorage.getItem("bl_theme") || "light";
        } catch (_) {}
        if (cur === "system") {
          applyThemeState("system");
        }
      };
      if (typeof mq.addEventListener === "function") {
        mq.addEventListener("change", onMediaChange);
      } else if (typeof mq.addListener === "function") {
        mq.addListener(onMediaChange);
      }
    }
  }
  window.initTheme = initTheme;

  window.renderStatusPill = function (status, labelOverride) {
    const raw = String(labelOverride !== undefined ? labelOverride : (status || "—")).trim() || "—";
    const s = String(status || "").toLowerCase().trim();
    const safeLabel = escapePaginationHtml(raw);

    let cls = "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700";
    if (
      s === "active" ||
      s === "approved" ||
      s === "disbursed" ||
      s === "balanced" ||
      s === "matched" ||
      s === "surplus" ||
      s === "completed" ||
      s === "healthy" ||
      s === "well capitalized" ||
      s === "zero arrears"
    ) {
      cls = "bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60";
    } else if (
      s === "pending" ||
      s === "pending review" ||
      s === "under review" ||
      s === "paused" ||
      s === "tight liquidity" ||
      s === "low risk"
    ) {
      cls = "bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60";
    } else if (
      s === "in arrears" ||
      s === "arrears" ||
      s === "deficit" ||
      s === "rejected" ||
      s === "defaulted" ||
      s === "overdue" ||
      s === "variance" ||
      s === "elevated arrears" ||
      s === "capital constrained"
    ) {
      cls = "bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60";
    } else if (s === "planning" || s === "healthy buffer" || s === "reviewed") {
      cls = "bg-sky-50 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-500/30";
    }

    return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold ' + cls + '">' + safeLabel + "</span>";
  };

  let activeConfirmResolver = null;
  function showConfirmDialog(options) {
    const opts = options && typeof options === "object" ? options : {};
    const modal = document.getElementById("blg-confirm-modal");
    if (!modal) {
      return Promise.resolve(false);
    }

    if (activeConfirmResolver) {
      const prevResolve = activeConfirmResolver;
      activeConfirmResolver = null;
      prevResolve(false);
    }

    const iconBox = document.getElementById("blg-confirm-icon");
    const titleEl = document.getElementById("blg-confirm-title");
    const msgEl = document.getElementById("blg-confirm-msg");
    const detailsEl = document.getElementById("blg-confirm-details");
    const cancelBtn = document.getElementById("blg-confirm-cancel");
    const confirmBtn = document.getElementById("blg-confirm-btn");

    const iconType = String(opts.iconType || "warning").toLowerCase();
    const iconConfigs = {
      danger: {
        cls: "w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-950/70 border border-rose-200 dark:border-rose-500/40 text-rose-700 dark:text-rose-300 flex items-center justify-center text-base shrink-0",
        icon: '<i class="fas fa-circle-exclamation"></i>'
      },
      success: {
        cls: "w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950/70 border border-emerald-200 dark:border-emerald-500/40 text-emerald-700 dark:text-emerald-300 flex items-center justify-center text-base shrink-0",
        icon: '<i class="fas fa-circle-check"></i>'
      },
      info: {

    return new Promise(function (resolve) {

  /**
   * Floating Toast Notification component (Shadcn / Tailwind style)
   * Types: 'success' | 'error' | 'warning' | 'info'
   */
  function showNotification(message, type, durationMs, options) {
    if (!message) return;
    const opts = options && typeof options === "object" ? options : {};
    const toastType = (type || "info").toLowerCase();
    const persistent = opts.persistent === true || durationMs === 0;
    const duration = persistent ? 0 : (durationMs || 3500);

    let container = document.getElementById("toast-notification-container");
    if (!container) {
      container = document.createElement("div");
      container.id = "toast-notification-container";
      container.className = "fixed bottom-20 md:bottom-5 right-4 md:right-5 z-50 flex flex-col space-y-2.5 pointer-events-none max-w-sm w-full px-4 sm:px-0";
      document.body.appendChild(container);
    }

    if (opts.id) {
      const existing = document.getElementById(opts.id);
      if (existing && existing.parentElement) {
        existing.remove();
      }
    }

    let borderClass = "border-slate-200 dark:border-slate-700 bg-white dark:bg-[#0b1320] text-slate-900 dark:text-slate-100";
    let iconClass = "fas fa-circle-info text-sky-600 dark:text-sky-400 text-sm shrink-0 mt-0.5";

    if (toastType === "success") {
      borderClass = "border-emerald-200 dark:border-emerald-800/80 bg-emerald-50/95 dark:bg-emerald-950/95 text-emerald-950 dark:text-emerald-100";
      iconClass = "fas fa-check-circle text-emerald-700 dark:text-emerald-400 text-sm shrink-0 mt-0.5";
    } else if (toastType === "error") {
      borderClass = "border-rose-200 dark:border-rose-800/80 bg-rose-50/95 dark:bg-rose-950/95 text-rose-950 dark:text-rose-100";
      iconClass = "fas fa-circle-exclamation text-rose-700 dark:text-rose-400 text-sm shrink-0 mt-0.5";
    } else if (toastType === "warning") {
      borderClass = "border-amber-200 dark:border-amber-800/80 bg-amber-50/95 dark:bg-amber-950/95 text-amber-950 dark:text-amber-100";
      iconClass = "fas fa-triangle-exclamation text-amber-700 dark:text-amber-400 text-sm shrink-0 mt-0.5";
    }

    const toast = document.createElement("div");
    if (opts.id) toast.id = opts.id;
    toast.className = "pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl border shadow-lg backdrop-blur-sm transition-all duration-300 transform translate-y-2 opacity-0 text-xs font-medium " + borderClass;

    const iconEl = document.createElement("i");
    iconEl.className = iconClass;
    toast.appendChild(iconEl);

    const bodyEl = document.createElement("div");
    bodyEl.className = "flex-1 leading-snug break-words";
    const msgEl = document.createElement("div");
    msgEl.textContent = String(message);
    bodyEl.appendChild(msgEl);

    if (opts.actionLabel && opts.actionUrl) {
      const actionLink = document.createElement("a");
      actionLink.href = String(opts.actionUrl);
      actionLink.target = "_blank";
      actionLink.rel = "noopener noreferrer";
      actionLink.className = "mt-2 min-h-[34px] inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white text-white dark:text-slate-950 text-[11px] font-semibold shadow-xs transition-colors";
      const linkIcon = document.createElement("i");
      linkIcon.className = (opts.actionIcon || "fas fa-arrow-up-right-from-square") + " text-[10px]";
      actionLink.appendChild(linkIcon);
      actionLink.appendChild(document.createTextNode(String(opts.actionLabel)));
      actionLink.addEventListener("click", function () {
        if (toast.parentElement) toast.remove();
      });
      bodyEl.appendChild(actionLink);
    } else if (opts.actionLabel && typeof opts.onAction === "function") {
      const actionBtn = document.createElement("button");
      actionBtn.type = "button";
      actionBtn.className = "mt-2 min-h-[34px] inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white text-white dark:text-slate-950 text-[11px] font-semibold shadow-xs transition-colors";
      const retryIcon = document.createElement("i");
      retryIcon.className = "fas fa-arrows-rotate text-[10px]";
      actionBtn.appendChild(retryIcon);
      actionBtn.appendChild(document.createTextNode(String(opts.actionLabel)));
      actionBtn.addEventListener("click", function () {
        if (toast.parentElement) toast.remove();
        opts.onAction();
      });
      bodyEl.appendChild(actionBtn);
    }
    toast.appendChild(bodyEl);

    const closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "min-w-[32px] min-h-[32px] inline-flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 text-xs ml-1 transition-colors";

    closeBtn.innerHTML = '<i class="fas fa-times"></i>';
    closeBtn.addEventListener("click", function () {
      if (toast.parentElement) toast.remove();
    });
    toast.appendChild(closeBtn);

    container.appendChild(toast);

    // Animate in
    requestAnimationFrame(function () {
      toast.classList.remove("translate-y-2", "opacity-0");
      toast.classList.add("translate-y-0", "opacity-100");
    });

    // Auto dismiss unless persistent
    if (duration > 0) {
      setTimeout(function () {
        toast.classList.remove("translate-y-0", "opacity-100");
        toast.classList.add("translate-y-2", "opacity-0");
        setTimeout(function () {
          if (toast.parentElement) toast.remove();
        }, 300);
      }, duration);
    }
  }

  function applyRolePermissions(perms) {
    const effectivePerms = perms && typeof perms === "object" ? perms : { isMemberOnly: true };
    window.APP_PERMS = effectivePerms;

    const isAuthenticated = Boolean(window.currentUser && window.currentUser.hasAccess !== false && !sessionAccessDenied);
    // Check if user is member-only (fail-closed if isMemberOnly is not explicitly false)
    const isMemberOnly = effectivePerms.isMemberOnly !== false;

    const adminSection = document.getElementById("sidebar-admin-section");
    if (adminSection) {
      adminSection.classList.toggle("hidden", !isAuthenticated || isMemberOnly);
    }

    const memberLinks = document.getElementById("sidebar-member-links");
    if (memberLinks) {
      memberLinks.classList.toggle("hidden", !isAuthenticated || !isMemberOnly);
    }

    document.querySelectorAll("[data-require-staff]").forEach(function (el) {
      const allowed = isAuthenticated && !isMemberOnly;
      el.classList.toggle("hidden", !allowed);
      if (allowed) el.removeAttribute("aria-hidden");
      else el.setAttribute("aria-hidden", "true");
    });

    document.querySelectorAll("[data-require-perm]").forEach(function (el) {
      var key = el.getAttribute("data-require-perm");
      var allowed = isAuthenticated && effectivePerms[key] === true;
      if (allowed) {
        el.classList.remove("hidden");
        el.removeAttribute("aria-hidden");
      } else {
        el.classList.add("hidden");
        el.setAttribute("aria-hidden", "true");
      }
    });

    // Dynamic role-aware #mobile-bottom-bar (5 slots per persona)
    document.querySelectorAll("#mobile-bottom-bar [data-mobile-role]").forEach(function (tab) {
      const roleReq = tab.getAttribute("data-mobile-role");
      let showTab = false;
      if (isAuthenticated) {
        if (roleReq === "authenticated") showTab = true;
        else if (roleReq === "staff") showTab = !isMemberOnly;
        else if (roleReq === "member") showTab = isMemberOnly;
      }
      tab.classList.toggle("hidden", !showTab);
      if (showTab) tab.removeAttribute("aria-hidden");
      else tab.setAttribute("aria-hidden", "true");
    });
  }

  function startAppLoader() {

      bar.style.width = "12%";
      if (appLoaderTimer) clearInterval(appLoaderTimer);

  function stopAppLoader() {
    appLoaderActiveRequests = Math.max(0, appLoaderActiveRequests - 1);
    if (appLoaderActiveRequests > 0) return;

    if (currentSyncStatus === "revalidating") {
      setHeaderSyncState("synced");
    }

    const loader = document.getElementById("app-loader");
    const bar = document.getElementById("app-loader-bar");
    if (!loader || !bar) return;

    if (appLoaderTimer) {
      clearInterval(appLoaderTimer);
      appLoaderTimer = null;
    }
    bar.style.width = "100%";
    setTimeout(() => {
      loader.classList.remove("opacity-100");
      loader.classList.add("opacity-0");
      setTimeout(() => {
        bar.style.width = "0%";

  function getInitialsFromName(name, email) {
    const raw = String(name || "").trim();
    if (raw) {
      const parts = raw.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return raw.slice(0, 2).toUpperCase();
    }
    if (email) {
      return email.slice(0, 2).toUpperCase();
    }
    return "US";
  }

  function applySessionFallback(sNameEl, sEmailEl, fallbackName) {
    const currentName = sNameEl ? sNameEl.textContent.trim() : "";
    if (sNameEl && (!currentName || currentName === "Loading..." || currentName === "Session Delayed")) {
      sNameEl.textContent = fallbackName || "Session Unavailable";
    }
    if (sEmailEl && (!sEmailEl.textContent || sEmailEl.textContent.trim() === "--")) {
      sEmailEl.textContent = "—";

  }

  function refreshSessionInfo(callback) {
    const sNameEl = document.getElementById("sidebar-display-name");
    const sEmailEl = document.getElementById("sidebar-email");
    const sRoleBadge = document.getElementById("sidebar-role-badge");
    const sPhoto = document.getElementById("sidebar-photo");
    const sInitials = document.getElementById("sidebar-initials");
    const verEl = document.getElementById("sidebar-version");

    let callbackSettled = false;
    let loaderSettled = false;
    let sessionTimeoutTimer = null;

    startAppLoader();
    const finishLoader = () => {
      if (loaderSettled) return;
      loaderSettled = true;
      stopAppLoader();
    };

    // In headless mode: If no active Google ID token exists in storage, show Sign In view immediately
    if (window.ApiClient && !window.ApiClient.hasActiveSession() && window.location.hostname !== "script.google.com") {
      finishLoader();
      showPage("sign-in");
      initGoogleIdentityServices();
      return;
    }

    const failClosedSessionFallback = (fallbackLabel, reasonMessage) => {
      currentSessionEmail = "";
      currentSessionRole = "";
      window.currentUser = null;
      window.session = null;
      window.latestPersonalFinancials = null;
      if (typeof currentMembers !== "undefined") {
        currentMembers = [];
      }
      cacheClear();
      if (window.ApiClient) {
        window.ApiClient.clearSession();
      }
      applyRolePermissions({ isMemberOnly: true });
      applySessionFallback(sNameEl, sEmailEl, fallbackLabel);
      if (!callbackSettled) {
        showSessionErrorNotification(reasonMessage);
      }
      invokeCallbackOnce(null);
    };

    const invokeCallbackOnce = (arg) => {
      finishLoader();
      if (callbackSettled) return;
      callbackSettled = true;
      if (sessionTimeoutTimer) {
        clearTimeout(sessionTimeoutTimer);
        sessionTimeoutTimer = null;
      }
      if (typeof callback === "function") {
        callback(arg);
      } else {
        const activePage = document.querySelector(".page-wrapper.active");
        const activeId = activePage ? activePage.id.replace(/-container$/, "") : "";
        const isRestrictedOrBoot =
          !activeId ||
          activeId === "session-loading" ||
          ADMIN_RESTRICTED_PAGES.indexOf(activeId) !== -1 ||
          (!arg && activeId === "home");
        if (!arg && isRestrictedOrBoot) {
          showPage(sessionAccessDenied ? "access-denied" : "sign-in");
        } else if (arg && (!window.APP_PERMS || window.APP_PERMS.isMemberOnly !== false) && ADMIN_RESTRICTED_PAGES.indexOf(activeId) !== -1) {
          showPage("my-financials");
        }
      }
    };

    sessionTimeoutTimer = setTimeout(() => {
      if (callbackSettled) return;
      console.warn("Session info fetch delayed; enforcing fail-closed defaults.");
      failClosedSessionFallback(
        "Session Delayed",
        "Session verification timed out. Access is restricted to personal view."
      );
    }, 8000);

    try {
      if (typeof google === "undefined" || !google.script || !google.script.run) {
        throw new Error("Apps Script RPC unavailable.");
      }

      google.script.run
        .withSuccessHandler((info) => {
          if (sessionTimeoutTimer) {
            clearTimeout(sessionTimeoutTimer);
            sessionTimeoutTimer = null;
          }
          finishLoader();

          if (info && info.success) {
            const nextEmail = String(info.email || "").trim();
            const nextRole = String(info.roleKey || info.role || "").trim().toLowerCase();
            const nextOwner = nextEmail ? (nextEmail.toLowerCase() + "|" + nextRole) : "";
            const prevOwner = getNormalizedSessionOwner();
            let storedOwner = "";
            try {
              storedOwner = String(sessionStorage.getItem(BL_CACHE_OWNER_KEY) || "").trim().toLowerCase();
            } catch (e) {}

            if ((prevOwner && prevOwner !== nextOwner) || (storedOwner && storedOwner !== nextOwner) || !nextOwner) {
              cacheClear();
              if (typeof currentMembers !== "undefined") {
                currentMembers = [];
              }
              window.latestPersonalFinancials = null;
            }
            currentSessionEmail = nextEmail;
            currentSessionRole = nextRole;
            if (nextOwner && info.hasAccess !== false) {
              try {

            sessionAccessDenied = false;

            window.currentUser = info;
            window.currentUser.roleKey = String(info.role || "").toLowerCase();

          } else {
            const errMsg = info && info.error ? String(info.error) : "";
            if (errMsg.indexOf("Access denied") !== -1 || errMsg.indexOf("Access Denied") !== -1) {
              callbackSettled = true;
              showAccessDenied(currentSessionEmail);

            }
            console.warn("Session info returned an unsuccessful response:", info);
            failClosedSessionFallback(
              "Session Unavailable",
              "Unable to verify your session role. Access is restricted to personal view."
            );

        })
        .withFailureHandler((err) => {
          if (sessionTimeoutTimer) {
            clearTimeout(sessionTimeoutTimer);

          finishLoader();
          const msg = err && err.message ? String(err.message) : String(err || "");

            "Session verification failed. Access is restricted to personal view."
          );
        })
        .getSessionInfo();
    } catch (syncErr) {
      if (sessionTimeoutTimer) {
        clearTimeout(sessionTimeoutTimer);
        sessionTimeoutTimer = null;
      }
      console.warn("Session info invocation failed; staying fail-closed:", syncErr);
      failClosedSessionFallback(

  function refreshDashboard(forceRefresh) {

    const cached = !forceRefresh ? cacheGet(cacheKey) : null;
    const hasCached = Boolean(cached);
    const isHomeActive = currentActivePageId === "home";

    if (hasCached) {
      applyDashboardData(cached);
      setHeaderSyncState("revalidating", "Syncing...");
    } else {
      if (isHomeActive) toggleLoading(true);
      startAppLoader();
      setHeaderSyncState("revalidating", "Loading...");
    }

    google.script.run
      .withSuccessHandler((data) => {
        if (data) {
          cacheSet(cacheKey, data, 5 * 60 * 1000);
          applyDashboardData(data);
        }
        setHeaderSyncState("synced");
        if (!hasCached) {
          toggleLoading(false);
          stopAppLoader();
        }
        scheduleSecondaryPrefetch();
      })
      .withFailureHandler((err) => {
        if (!hasCached) {
          toggleLoading(false);
          stopAppLoader();
          setHeaderSyncState("cached", "Sync error");
          handleErr(err);
        } else {
          setHeaderSyncState("cached", "Offline cache");
          showNotification("Background sync failed — displaying cached overview.", "warning", 3000);
        }

      .getHomeAnalytics(currentHomeRange);

  /**
   * Shared Members Registry loader with 10-min SWR cache and request deduplication.
   */
  function ensureMembersLoaded(forceRefresh) {
    if (!forceRefresh && typeof currentMembers !== "undefined" && Array.isArray(currentMembers) && currentMembers.length > 0) {
      return Promise.resolve(currentMembers);
    }

    if (!forceRefresh) {
      const cached = cacheGet("members_list");
      if (Array.isArray(cached) && cached.length > 0) {
        if (typeof currentMembers !== "undefined") {
          currentMembers = cached;
        }
        return Promise.resolve(cached);
      }
    }

    if (membersLoadPromise && !forceRefresh) {
      return membersLoadPromise;
    }

    membersLoadPromise = new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (response) {
          membersLoadPromise = null;
          if (!response || !response.success) {
            reject(new Error((response && response.error) || "Failed to load members."));
            return;
          }
          const list = response.members || [];
          if (typeof currentMembers !== "undefined") {
            currentMembers = list;
          }
          cacheSet("members_list", list, 10 * 60 * 1000);
          resolve(list);
        })
        .withFailureHandler(function (err) {
          membersLoadPromise = null;
          reject(err);
        })
        .getMembersData(1, 1000);
    });

    return membersLoadPromise;
  }

  window.closeSessionPopover = closeSessionPopover;

  let gsiInitialized = false;

  function initGoogleIdentityServices() {
    const clientId = window.GOOGLE_CLIENT_ID || (window.ApiClient && window.ApiClient.CLIENT_ID) || "961631543108-en4e2seqgq8tkk0fs0ehl9hmsqr0itpr.apps.googleusercontent.com";
    const currentOrigin = window.location.origin || (window.location.protocol + "//" + window.location.host);

    const originTextEl = document.getElementById("active-origin-text");
    if (originTextEl) {
      originTextEl.textContent = currentOrigin;
    }

    // Diagnostics: If Google fails to render the button after 3 seconds (e.g. 403 origin rejection), show diagnostic box
    setTimeout(function () {
      const btnContainer = document.getElementById("google-signin-btn");
      const diagBox = document.getElementById("origin-diagnostic-box");
      if (btnContainer && (!btnContainer.hasChildNodes() || btnContainer.innerHTML.trim() === "") && diagBox) {
        diagBox.classList.remove("hidden");
      }
    }, 3000);

    function renderGsi() {
      if (typeof google === "undefined" || !google.accounts || !google.accounts.id) {
        setTimeout(renderGsi, 250);
        return;
      }

      try {
        if (!gsiInitialized) {
          google.accounts.id.initialize({
            client_id: clientId,
            callback: handleGoogleCredentialResponse,
            auto_select: false,
            cancel_on_tap_outside: false
          });
          gsiInitialized = true;
        }

        const btnContainer = document.getElementById("google-signin-btn");
        if (btnContainer) {
          btnContainer.innerHTML = "";
          const isDark = document.documentElement.classList.contains("dark");
          google.accounts.id.renderButton(btnContainer, {
            theme: isDark ? "filled_black" : "outline",
            size: "large",
            type: "standard",
            text: "continue_with",
            shape: "pill",
            logo_alignment: "left",
            width: 280
          });
        }

        google.accounts.id.prompt(function (notification) {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            // One-Tap fallback to standard button
          }
        });
      } catch (err) {
        console.warn("initGoogleIdentityServices error:", err);
      }
    }

    renderGsi();
  }
  window.initGoogleIdentityServices = initGoogleIdentityServices;

  function handleGoogleCredentialResponse(response) {
    if (!response || !response.credential) {
      if (typeof showNotification === "function") {
        showNotification("Sign in cancelled or failed.", "warning");
      }
      return;
    }

    const spinner = document.getElementById("signin-loading-spinner");
    const btnWrapper = document.getElementById("google-signin-btn-wrapper");
    if (spinner) spinner.classList.remove("hidden");
    if (btnWrapper) btnWrapper.classList.add("opacity-50", "pointer-events-none");

    if (window.ApiClient) {
      window.ApiClient.setIdToken(response.credential);
    }

    refreshSessionInfo(function (info) {
      if (spinner) spinner.classList.add("hidden");
      if (btnWrapper) btnWrapper.classList.remove("opacity-50", "pointer-events-none");
      if (info && info.success) {
        sessionAccessDenied = false;
        resolveSessionLandingPage(info);
        if (typeof showNotification === "function") {
          showNotification("Welcome back, " + (info.displayName || "Member") + "!", "success");
        }
      } else {
        const errMsg = (info && info.error) ? String(info.error) : "";
        if (errMsg.indexOf("Access denied") !== -1 || errMsg.indexOf("not have an active role") !== -1) {
          showAccessDenied(info && info.email);
        } else {
          if (window.ApiClient) window.ApiClient.clearSession();
          showSessionErrorNotification("Verification failed: " + (errMsg || "Unable to authenticate."));
          showPage("sign-in");
        }
      }
    });
  }
  window.handleGoogleCredentialResponse = handleGoogleCredentialResponse;

  function handleSignOut() {
    if (window.ApiClient) {
      window.ApiClient.clearSession();
    }
    if (typeof google !== "undefined" && google.accounts && google.accounts.id) {
      try {
        google.accounts.id.disableAutoSelect();
      } catch (eGsi) {}
    }
    window.currentUser = null;
    window.session = null;
    currentSessionEmail = "";
    currentSessionRole = "";
    sessionAccessDenied = false;
    cacheClear();

    closeSessionPopover();
    showPage("sign-in");
    initGoogleIdentityServices();

    if (typeof showNotification === "function") {
      showNotification("You have been signed out.", "info");
    }
  }
  window.handleSignOut = handleSignOut;

  function forceRefreshCurrentView() {
    cacheClear();
    if (typeof currentMembers !== "undefined") {
      currentMembers = [];
    }
    window.latestPersonalFinancials = null;
    setHeaderSyncState("revalidating", "Refreshing...");

    const activeWrapper = document.querySelector(".page-wrapper.active");
    const activeId = activeWrapper ? activeWrapper.id.replace(/-container$/, "") : currentActivePageId;

    refreshSessionInfo(function () {
      if (activeId === "home") refreshDashboard(true);
      else if (activeId === "my-financials") loadPersonalFinancials(true);
      else if (activeId === "members") loadMembers(true);
      else if (activeId === "contributions") {
        ensureMembersLoaded(true).catch(function () {});
        loadContributions(typeof currentPage !== "undefined" ? currentPage : 1, true);
      } else if (activeId === "loans") {
        ensureMembersLoaded(true).catch(function () {});
        loadLoans(typeof loanPage !== "undefined" ? loanPage : 1, true);
      } else if (activeId === "investments") loadInvestments(typeof invPage !== "undefined" ? invPage : 1, true);
      else if (activeId === "accounts") loadAccounts(true);
      else if (activeId === "dividends") loadDividendOverview(true);
      else if (activeId === "statements") loadMonthlyStatementsView(null, true);
      else if (activeId === "roles") {
        ensureMembersLoaded(true).catch(function () {});
        loadUserRoles(true);
      }
    });
  }
  window.forceRefreshCurrentView = forceRefreshCurrentView;

  function clearCacheAndRefresh() {
    closeSessionPopover();
    forceRefreshCurrentView();
    showNotification("Cache cleared — syncing fresh data from Google Sheets.", "info", 2800);
  }
  window.clearCacheAndRefresh = clearCacheAndRefresh;

  /**
   * Initializes custom Shadcn-style dropdowns replacing native OS <select> popups.
   * Scans elements with [data-shadcn-select] and wires them up.
   */
  function initShadcnSelects() {
    document.querySelectorAll("[data-shadcn-select]").forEach(function (container) {
      if (container.dataset.shadcnInitialized) return;
      container.dataset.shadcnInitialized = "true";

      const trigger = container.querySelector(".shadcn-select-trigger");
      const menu = container.querySelector(".shadcn-dropdown-menu");
      const label = container.querySelector(".shadcn-select-label");
      const hiddenInput = container.querySelector("input[type='hidden']");
      const items = container.querySelectorAll(".shadcn-dropdown-item");

      if (!trigger || !menu || !hiddenInput) return;

      trigger.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();

        // Close other open menus
        document.querySelectorAll(".shadcn-dropdown-menu").forEach(function (m) {
          if (m !== menu) m.classList.add("hidden");
        });
        document.querySelectorAll(".shadcn-select-trigger").forEach(function (t) {
          if (t !== trigger) t.classList.remove("active");
        });

        const isHidden = menu.classList.contains("hidden");
        menu.classList.toggle("hidden", !isHidden);
        trigger.classList.toggle("active", isHidden);
      });

      items.forEach(function (item) {
        item.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();

          const val = item.getAttribute("data-value");
          const text = item.querySelector(".item-text") ? item.querySelector(".item-text").innerText : item.innerText;

          hiddenInput.value = val;
          if (label) label.innerText = text;

          items.forEach((it) => it.classList.remove("selected"));
          item.classList.add("selected");

          menu.classList.add("hidden");
          trigger.classList.remove("active");

          // Trigger change event for listeners
          const event = new Event("change", { bubbles: true });
          hiddenInput.dispatchEvent(event);
        });
      });
    });

    // Close on outside click
    document.addEventListener("click", function (e) {
      if (!e.target.closest("[data-shadcn-select], [data-apply-dropdown], #select-al-tenor-wrapper")) {
        document.querySelectorAll(".shadcn-dropdown-menu").forEach(function (m) {
          m.classList.add("hidden");
        });
        document.querySelectorAll(".shadcn-select-trigger").forEach(function (t) {
          t.classList.remove("active");
        });
      }
    });
  }

  function setShadcnSelectValue(containerId, value) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const hiddenInput = container.querySelector("input[type='hidden']");
    const label = container.querySelector(".shadcn-select-label");
    const items = container.querySelectorAll(".shadcn-dropdown-item");
    if (!hiddenInput) return;

    hiddenInput.value = value;
    items.forEach(function (item) {
      if (item.getAttribute("data-value") === String(value)) {
        item.classList.add("selected");
        if (label) {
          const text = item.querySelector(".item-text") ? item.querySelector(".item-text").innerText : item.innerText;
          label.innerText = text;
        }
      } else {
        item.classList.remove("selected");
      }
    });
  }

  /**
   * Column View Popover & Visibility Management
   */
  function toggleColumnMenu(menuId) {
    const menu = document.getElementById(menuId);
    if (!menu) return;

    // Close any other open view menus
    document.querySelectorAll(".column-view-menu").forEach(function (m) {
      if (m !== menu) m.classList.add("hidden");
    });

    menu.classList.toggle("hidden");
  }

  function toggleTableColumn(tableId, colClass, itemEl) {
    const table = document.getElementById(tableId);
    if (!table) return;

    const checkIcon = itemEl ? itemEl.querySelector(".col-check i") : null;
    const isCurrentlyHidden = table.classList.contains("hide-" + colClass);

    if (isCurrentlyHidden) {
      table.classList.remove("hide-" + colClass);
      if (checkIcon) checkIcon.classList.remove("hidden");
    } else {
      table.classList.add("hide-" + colClass);
      if (checkIcon) checkIcon.classList.add("hidden");
    }

    // Save preferences in localStorage
    try {
      const storageKey = "bl_col_pref_" + tableId;
      let hiddenCols = [];
      const stored = localStorage.getItem(storageKey);
      if (stored) hiddenCols = JSON.parse(stored);

      if (isCurrentlyHidden) {
        hiddenCols = hiddenCols.filter((c) => c !== colClass);
      } else {
        if (hiddenCols.indexOf(colClass) === -1) hiddenCols.push(colClass);
      }
      localStorage.setItem(storageKey, JSON.stringify(hiddenCols));
    } catch (e) {
      console.warn("Could not save column preferences:", e);
    }
  }

  function applySavedColumnPreferences(tableId) {
    const table = document.getElementById(tableId);
    if (!table) return;

    try {
      const storageKey = "bl_col_pref_" + tableId;
      const stored = localStorage.getItem(storageKey);
      if (!stored) return;
      const hiddenCols = JSON.parse(stored) || [];

      hiddenCols.forEach(function (colClass) {
        table.classList.add("hide-" + colClass);

        // Update corresponding check icon in the menu if present
        const menu = document.querySelector('[onclick*="' + tableId + '"][onclick*="' + colClass + '"]');
        if (menu) {
          const checkIcon = menu.querySelector(".col-check i");
          if (checkIcon) checkIcon.classList.add("hidden");
        }
      });
    } catch (e) {
      console.warn("Could not load column preferences:", e);
    }
  }

  // Close menus when clicking outside
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".column-view-menu") && !e.target.closest("[onclick*='toggleColumnMenu']")) {
      document.querySelectorAll(".column-view-menu").forEach(function (m) {
        m.classList.add("hidden");
      });
    }
  });

  /**
   * Initializes Flatpickr calendars with Shadcn theme
   */
  function initFlatpickrInputs() {
    if (typeof flatpickr === "undefined") return;

    // Transaction Date (Contributions)
    const cDate = document.getElementById("c-date");
    if (cDate && !cDate._flatpickr) {
      flatpickr(cDate, {
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "d-M-Y",
        defaultDate: new Date(),
        disableMobile: "true"
      });
    }

    // Repayment Date (Loans)
    const plDate = document.getElementById("pl-date");
    if (plDate && !plDate._flatpickr) {
      flatpickr(plDate, {
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "d-M-Y",
        defaultDate: new Date(),
        disableMobile: "true"
      });
    }

    // Joining Date
    const mJoined = document.getElementById("m-joined");
    if (mJoined && !mJoined._flatpickr) {
      flatpickr(mJoined, {
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "d-M-Y",
        defaultDate: new Date(),
        disableMobile: "true"
      });
    }

    // Birth Date (allows selecting past decades)
    const mDob = document.getElementById("m-dob");
    if (mDob && !mDob._flatpickr) {
      flatpickr(mDob, {
        dateFormat: "Y-m-d",
        altInput: true,
        altFormat: "d-M-Y",
        maxDate: new Date(),
        disableMobile: "true"
      });
    }
  }

  window.onload = function () {
    initTheme();
    applyRolePermissions({ isMemberOnly: true });
    initShadcnSelects();
    initFlatpickrInputs();
    bootSession();
  };
</script>
