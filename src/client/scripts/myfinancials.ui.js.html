<script>
  function escapePfHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function loadPersonalFinancials(forceRefresh) {
    const cacheKey = "personal_financials";
    const cached = (!forceRefresh && typeof cacheGet === "function") ? cacheGet(cacheKey) : null;
    const hasCached = Boolean(cached && cached.success);

    if (hasCached) {
      renderPersonalFinancials(cached);
      if (typeof setHeaderSyncState === "function") {
        setHeaderSyncState("revalidating", "Syncing...");
      }
    } else {
      showAppLoader(true);
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!hasCached) showAppLoader(false);
        if (!res || !res.success) {
          console.error("Personal financials error:", res ? res.error : "Unknown error");
          if (hasCached) {
            if (typeof setHeaderSyncState === "function") {
              setHeaderSyncState("cached", "Cached");
            }
          } else {
            const cTbody = document.getElementById("pf-contrib-tbody");
            if (cTbody) {
              cTbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-rose-700 dark:text-rose-400">Unable to load personal records. <button type="button" onclick="loadPersonalFinancials(true)" class="underline font-semibold ml-1">Retry</button></td></tr>';
            }
          }
          return;
        }
        if (typeof cacheSet === "function") {
          cacheSet(cacheKey, res, 5 * 60 * 1000);
        }
        if (typeof setHeaderSyncState === "function") {
          setHeaderSyncState("synced");
        }
        renderPersonalFinancials(res);
      })
      .withFailureHandler(function (err) {
        if (!hasCached) showAppLoader(false);
        console.error("Personal financials failure:", err);
        if (hasCached) {
          if (typeof setHeaderSyncState === "function") {
            setHeaderSyncState("cached", "Offline cache");
          }
          if (typeof showNotification === "function") {
            showNotification("Background refresh failed — showing cached personal data.", "warning", 3000);
          }
        } else {
          const userEl = document.getElementById("pf-user-name");
          if (userEl) userEl.textContent = "Unable to load profile";
          const cTbody = document.getElementById("pf-contrib-tbody");
          if (cTbody) {
            cTbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-rose-700 dark:text-rose-400">Failed to fetch personal financials. <button type="button" onclick="loadPersonalFinancials(true)" class="underline font-semibold ml-1">Retry</button></td></tr>';
          }
        }
      })
      .getPersonalFinancialsData();
  }

  function parsePersonalContribMonth_(dateStr) {
    if (!dateStr) return null;
    const raw = String(dateStr).trim();
    const parsed = new Date(raw);
    if (!isNaN(parsed.getTime())) {
      return { year: parsed.getFullYear(), month: parsed.getMonth() };
    }
    const monthsMap = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
    const m = raw.match(/\b([A-Za-z]{3})\s+(\d{4})\b/);
    if (m) {
      const mIdx = monthsMap[m[1].toLowerCase()];
      if (mIdx !== undefined) return { year: Number(m[2]), month: mIdx };
    }
    return null;
  }

  function renderPersonalVisualizations(data) {
    const summary = (data && data.personalSummary) || {};
    const loans = (data && data.loans) || [];
    const contribs = (data && data.contributions) || [];

    // 1. Borrowing Capacity (3x Personal Savings - Active Loans)
    const savings = Number(summary.savings) || 0;
    const multiplier = Number(summary.borrowingMultiplier) || 3.0;
    const maxLimit = savings * multiplier;
    const activeLoans = Number(summary.activeLoanBalance) || 0;
    const encumbered = Number(summary.encumberedSavings) || 0;
    const isLocked = Boolean(summary.delinquencyLocked);
    const lockReason = summary.delinquencyReason || "Account has facility in arrears. Borrowing privilege locked under statutory rules.";
    const effectiveCapacity = isLocked ? 0 : (summary.effectiveBorrowingCapacity !== undefined ? Number(summary.effectiveBorrowingCapacity) : Math.max(0, maxLimit - activeLoans - encumbered));
    const effectiveCapacityFormatted = summary.effectiveBorrowingCapacityFormatted || formatMoney(effectiveCapacity);

    const capEl = document.getElementById("pf-borrowing-capacity");
    const capLimEl = document.getElementById("pf-borrowing-limit");
    const capUsedEl = document.getElementById("pf-borrowing-used");
    const capBarEl = document.getElementById("pf-borrowing-bar");
    const capBadgeEl = document.getElementById("pf-borrowing-badge");
    const lockBannerEl = document.getElementById("pf-delinquency-lock-banner");
    const lockReasonEl = document.getElementById("pf-delinquency-lock-reason");

    if (capEl) capEl.textContent = isLocked ? "KES 0" : effectiveCapacityFormatted;
    if (capLimEl) capLimEl.textContent = formatMoney(maxLimit);
    if (capUsedEl) capUsedEl.textContent = formatMoney(activeLoans);

    if (lockBannerEl) {
      if (isLocked) {
        lockBannerEl.classList.remove("hidden");
        if (lockReasonEl) lockReasonEl.textContent = lockReason;
      } else {
        lockBannerEl.classList.add("hidden");
      }
    }

    const totalObligations = activeLoans + encumbered;
    const utilizationPct = maxLimit > 0 ? Math.min(100, (totalObligations / maxLimit) * 100) : 0;
    if (capBarEl) {
      capBarEl.style.width = isLocked ? "100%" : utilizationPct.toFixed(1) + "%";
      capBarEl.className = "h-full rounded-full transition-all duration-500 " + (
        isLocked ? "bg-rose-600" :
        utilizationPct >= 85 ? "bg-rose-500" :
        utilizationPct >= 50 ? "bg-amber-500" : "bg-sky-600"
      );
    }
    if (capBadgeEl) {
      if (isLocked) {
        capBadgeEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-50 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60";
        capBadgeEl.textContent = "🔒 Delinquency Locked";
      } else if (savings <= 0) {
        capBadgeEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700";
        capBadgeEl.textContent = "Build Savings First";
      } else if (utilizationPct >= 100) {
        capBadgeEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60";
        capBadgeEl.textContent = "Limit Reached";
      } else {
        capBadgeEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-sky-50 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-500/30";
        capBadgeEl.textContent = multiplier.toFixed(1) + "x Savings Multiplier";
      }
    }

    // 2. Loan Repayment Progress Bar
    const activeSet = loans.filter(function (l) {
      const s = String(l.status || "").toLowerCase();
      return s !== "rejected" && ((Number(l.balance) || 0) > 0 || s === "active");
    });
    const scopeLoans = activeSet.length ? activeSet : loans.filter(function (l) {
      return String(l.status || "").toLowerCase() !== "rejected";
    });

    let totalRepayable = 0;
    let totalRepaid = 0;
    let totalRemaining = 0;
    scopeLoans.forEach(function (l) {
      const p = Number(l.paid) || 0;
      const b = Number(l.balance) || 0;
      const rep = Number(l.repaymentAmount) || (p + b) || (Number(l.requestedAmount) || 0);
      totalRepayable += rep;
      totalRepaid += p;
      totalRemaining += b;
    });

    const pctEl = document.getElementById("pf-loan-progress-pct");
    const lblEl = document.getElementById("pf-loan-progress-label");
    const barEl = document.getElementById("pf-loan-progress-bar");
    const repEl = document.getElementById("pf-loan-repaid-total");
    const remEl = document.getElementById("pf-loan-remaining-total");

    let repPct = 0;
    if (totalRepayable > 0) {
      repPct = Math.min(100, Math.max(0, (totalRepaid / totalRepayable) * 100));
    } else if (scopeLoans.length === 0) {
      repPct = 100;
    }

    if (pctEl) pctEl.textContent = totalRepayable > 0 ? repPct.toFixed(1) + "%" : "100%";
    if (repEl) repEl.textContent = formatMoney(totalRepaid);
    if (remEl) remEl.textContent = formatMoney(totalRemaining);
    if (barEl) {
      barEl.style.width = (scopeLoans.length === 0 ? 100 : repPct).toFixed(1) + "%";
      barEl.className = "h-full rounded-full transition-all duration-500 " + (
        scopeLoans.length === 0 || totalRemaining === 0 ? "bg-emerald-500" : "bg-emerald-500"
      );
    }
    if (lblEl) {
      if (scopeLoans.length === 0) {
        lblEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60";
        lblEl.textContent = "Debt-Free";
      } else if (totalRemaining === 0) {
        lblEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60";
        lblEl.textContent = "All Loans Settled";
      } else {
        lblEl.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60";
        lblEl.textContent = activeSet.length + (activeSet.length === 1 ? " Active Loan" : " Active Loans");
      }
    }

    // 3. Personal Contribution Consistency Tracker (Current Year Month-by-Month)
    const now = new Date();
    const targetYear = now.getFullYear();
    const currentMonthIdx = now.getMonth();
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const monthlySums = new Array(12).fill(0);

    contribs.forEach(function (c) {
      const parsed = parsePersonalContribMonth_(c.date);
      if (parsed && parsed.year === targetYear && parsed.month >= 0 && parsed.month < 12) {
        monthlySums[parsed.month] += Number(c.amount) || 0;
      }
    });

    const maxMonthAmt = Math.max.apply(null, monthlySums.concat([1]));
    let contributedElapsed = 0;
    const elapsedMonths = currentMonthIdx + 1;

    const gridEl = document.getElementById("pf-consistency-grid");
    const subEl = document.getElementById("pf-consistency-subtitle");
    const sumEl = document.getElementById("pf-consistency-summary");

    if (subEl) subEl.textContent = "Monthly contribution consistency for FY " + targetYear;

    if (gridEl) {
      gridEl.innerHTML = monthNames.map(function (mLabel, idx) {
        const amt = monthlySums[idx] || 0;
        const isFuture = idx > currentMonthIdx;
        const hasPaid = amt > 0;
        if (!isFuture && hasPaid) contributedElapsed++;

        const barHeightPct = hasPaid ? Math.max(22, Math.round((amt / maxMonthAmt) * 100)) : (isFuture ? 10 : 12);
        const cardCls = hasPaid
          ? "bg-emerald-50/70 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800/60 text-emerald-900 dark:text-emerald-200"
          : isFuture
          ? "bg-slate-50/40 dark:bg-slate-900/40 border-slate-200/60 dark:border-slate-800 border-dashed text-slate-400 dark:text-slate-500"
          : "bg-slate-50 dark:bg-slate-900/70 border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400";
        const barCls = hasPaid
          ? "bg-emerald-500"
          : isFuture
          ? "bg-slate-200/70 dark:bg-slate-800"
          : "bg-amber-300/70 dark:bg-amber-600/60";
        const statusIcon = hasPaid
          ? '<i class="fas fa-check text-emerald-700 dark:text-emerald-400 text-[9px]"></i>'
          : isFuture
          ? '<span class="text-[9px] text-slate-400 dark:text-slate-500">—</span>'
          : '<span class="text-[9px] text-amber-700 dark:text-amber-400 font-bold">0</span>';
        const titleAttr = mLabel + " " + targetYear + ": " + (hasPaid ? formatMoney(amt) : (isFuture ? "Upcoming" : "No deposit recorded"));

        return (
          '<div title="' + escapePfHtml(titleAttr) + '" class="rounded-lg border p-2 flex flex-col items-center justify-between gap-1.5 ' + cardCls + '">' +
            '<span class="text-[10px] font-bold uppercase tracking-wide">' + mLabel + '</span>' +
            '<div class="w-full h-8 flex items-end justify-center">' +
              '<div class="w-3 rounded-t ' + barCls + '" style="height:' + barHeightPct + '%"></div>' +
            '</div>' +
            '<div class="h-4 flex items-center justify-center">' + statusIcon + '</div>' +
          '</div>'
        );
      }).join("");
    }

    if (sumEl) {
      sumEl.textContent = contributedElapsed + " / " + elapsedMonths + " months in " + targetYear;
    }
  }

  function renderPersonalFinancials(data) {
    if (!data) return;
    window.latestPersonalFinancials = data;

    const summary = data.personalSummary || {};

    // User Profile Header
    if (data.user) {
      document.getElementById("pf-user-name").textContent = data.user.name || "Member";
      document.getElementById("pf-member-id").textContent = data.user.memberId || "Pending ID";
      document.getElementById("pf-member-reg").textContent = data.user.registrationDate || "—";
      document.getElementById("pf-member-status").textContent = data.user.status || "Active";
    }

    // Credit Reputation Tier & Financial Discipline Telemetry Strip
    const creditStanding = summary.creditStanding || {};
    const tier = summary.creditTier || creditStanding.tier || "Tier 1: Flawless";
    const streak = summary.streakMonths !== undefined ? summary.streakMonths : (creditStanding.streakMonths !== undefined ? creditStanding.streakMonths : 0);
    const consistency = summary.consistencyScore !== undefined ? summary.consistencyScore : (creditStanding.consistencyScore !== undefined ? creditStanding.consistencyScore : 100);

    const tierBadgeEl = document.getElementById("pf-credit-tier-badge");
    const tierTextEl = document.getElementById("pf-credit-tier-text");
    if (tierTextEl) tierTextEl.textContent = tier;
    if (tierBadgeEl) {
      if (tier.indexOf("Tier 1") !== -1 || tier.toLowerCase().indexOf("flawless") !== -1) {
        tierBadgeEl.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60";
      } else if (tier.indexOf("Tier 2") !== -1 || tier.toLowerCase().indexOf("good") !== -1) {
        tierBadgeEl.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-sky-50 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800/60";
      } else {
        tierBadgeEl.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-rose-50 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60";
      }
    }
    const streakTextEl = document.getElementById("pf-streak-text");
    if (streakTextEl) streakTextEl.textContent = streak + " Months Streak";
    const consistencyTextEl = document.getElementById("pf-consistency-text");
    if (consistencyTextEl) consistencyTextEl.textContent = consistency + "% Deposit Consistency";

    // Personal Summary KPI Cards
    if (data.personalSummary) {
      const savingsFormatted = summary.savingsFormatted || formatMoney(summary.savings || 0);
      const freeFormatted = summary.freeSavingsFormatted || formatMoney(summary.freeSavings !== undefined ? summary.freeSavings : summary.savings || 0);
      const encumbered = Number(summary.encumberedSavings) || 0;
      const pledgedFormatted = summary.encumberedSavingsFormatted || formatMoney(encumbered);

      const savingsEl = document.getElementById("pf-my-savings");
      if (savingsEl) savingsEl.textContent = savingsFormatted;

      const freeEl = document.getElementById("pf-free-savings-val");
      if (freeEl) freeEl.textContent = freeFormatted;

      const pledgedBadge = document.getElementById("pf-pledged-savings-badge");
      const pledgedVal = document.getElementById("pf-pledged-savings-val");
      if (pledgedVal) pledgedVal.textContent = pledgedFormatted;
      if (pledgedBadge) {
        if (encumbered > 0) {
          pledgedBadge.classList.remove("hidden");
        } else {
          pledgedBadge.classList.add("hidden");
        }
      }

      document.getElementById("pf-my-shares").textContent = summary.sharesPercentage || "0.00%";
      document.getElementById("pf-my-loan-balance").textContent = summary.activeLoanBalanceFormatted || "KES 0";

      // Card 4: Projected Year-End Dividend & Dual-Stream Routing (Rule 5.2)
      const grossDivFormatted = summary.projectedDividendFormatted || summary.estimatedProfitShareFormatted || formatMoney(summary.projectedDividend || summary.estimatedProfitShare || 0);
      const loanOffsetFormatted = summary.dividendLoanOffsetFormatted || formatMoney(summary.dividendLoanOffset || 0);
      const reinvestFormatted = summary.dividendSavingsReinvestFormatted || formatMoney(summary.dividendSavingsReinvest || (Number(summary.projectedDividend) || 0));

      const profitEl = document.getElementById("pf-my-profit-share");
      if (profitEl) profitEl.textContent = grossDivFormatted;

      const offsetEl = document.getElementById("pf-dividend-offset-val");
      if (offsetEl) offsetEl.textContent = loanOffsetFormatted;

      const reinvestEl = document.getElementById("pf-dividend-reinvest-val");
      if (reinvestEl) reinvestEl.textContent = reinvestFormatted;
    }

    // Group Macro Overview
    if (data.groupOverview) {
      document.getElementById("pf-group-pool").textContent = data.groupOverview.totalSavingsPoolFormatted || "KES 0";
      document.getElementById("pf-group-invested").textContent = data.groupOverview.totalInvestmentsFormatted || "KES 0";
      document.getElementById("pf-group-profit").textContent = data.groupOverview.totalProfitFormatted || "KES 0";
      document.getElementById("pf-group-members").textContent = data.groupOverview.activeMembers || "0";
    }

    renderPersonalVisualizations(data);

    // Contributions List
    const cTbody = document.getElementById("pf-contrib-tbody");
    const contribs = data.contributions || [];
    document.getElementById("pf-contrib-count").textContent = contribs.length + " entries";

    if (contribs.length === 0) {
      cTbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-500 dark:text-slate-400">No contribution records found.</td></tr>';
    } else {
      cTbody.innerHTML = contribs
        .map(function (c) {
          return (
            '<tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40 transition-colors">' +
            '<td class="py-2.5 font-mono tabular-nums font-medium text-slate-600 dark:text-slate-400">' + (c.date || "—") + '</td>' +
            '<td class="py-2.5 text-slate-600 dark:text-slate-300">' + (c.type || "Monthly Contribution") + '</td>' +
            '<td class="py-2.5"><span class="px-2 py-0.5 rounded text-[10px] bg-slate-100 dark:bg-slate-800 font-semibold text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">' + (c.mode || "Cash") + '</span></td>' +
            '<td class="py-2.5 text-right font-mono tabular-nums font-bold text-slate-900 dark:text-white">' + (c.amountFormatted || "KES 0") + '</td>' +
            '</tr>'
          );
        })
        .join("");
    }

    // Loans List
    const lTbody = document.getElementById("pf-loans-tbody");
    const loans = data.loans || [];
    document.getElementById("pf-loan-count").textContent = loans.length + " records";

    if (loans.length === 0) {
      lTbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-500 dark:text-slate-400">No active or past loans.</td></tr>';
    } else {
      lTbody.innerHTML = loans
        .map(function (l) {
          const balNum = Number(l.balance) || 0;
          const statusPill = typeof renderStatusPill === "function"
            ? renderStatusPill(l.status || "Pending")
            : '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">' + escapePfHtml(l.status || "Pending") + '</span>';
          const balCls = balNum > 0
            ? (String(l.status || "").toLowerCase().indexOf("arrears") !== -1 ? "text-rose-700 dark:text-rose-400" : "text-amber-700 dark:text-amber-400")
            : "text-slate-500 dark:text-slate-400";

          let maturityHtml = '—';
          if (l.isOverdue) {
            const days = Math.abs(l.daysToMaturity || 0);
            maturityHtml = '<div class="text-[11px] leading-tight"><span class="font-mono text-slate-700 dark:text-slate-300">' + (escapePfHtml(l.dueDateFormatted) || '—') + '</span><br><span class="text-rose-600 dark:text-rose-400 font-bold inline-flex items-center gap-0.5 text-[10px]">⚠️ ' + days + ' ' + (days === 1 ? 'day' : 'days') + ' overdue</span></div>';
          } else if (l.dueDateFormatted) {
            const days = l.daysToMaturity;
            const countdown = (days !== null && days !== undefined)
              ? (days === 0 ? '<span class="text-amber-600 dark:text-amber-400 font-semibold text-[10px]">Due today</span>' : '<span class="text-slate-500 dark:text-slate-400 font-medium text-[10px]">In ' + days + ' ' + (days === 1 ? 'day' : 'days') + '</span>')
              : '';
            maturityHtml = '<div class="text-[11px] leading-tight"><span class="font-mono text-slate-700 dark:text-slate-300">' + escapePfHtml(l.dueDateFormatted) + '</span>' + (countdown ? '<br>' + countdown : '') + '</div>';
          }

          const loanId = l.id || l.loanId || '';
          const printBtnHtml = '<button type="button" onclick="openPrintLoanStatement(\'' + escapePfHtml(loanId) + '\')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold border border-slate-200/80 dark:border-slate-700 transition-colors shadow-2xs" title="Print Loan Statement"><i class="fas fa-print text-[11px] text-slate-500 dark:text-slate-400"></i></button>';

          return (
            '<tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40 transition-colors">' +
            '<td class="py-2.5 font-mono tabular-nums font-bold text-slate-800 dark:text-slate-200">' + escapePfHtml(l.id || "—") + '</td>' +
            '<td class="py-2.5">' + maturityHtml + '</td>' +
            '<td class="py-2.5 text-right font-mono tabular-nums font-medium text-slate-700 dark:text-slate-300">' + (l.requestedAmountFormatted || "KES 0") + '</td>' +
            '<td class="py-2.5 text-right font-mono tabular-nums text-emerald-700 dark:text-emerald-400 font-medium">' + (l.paidFormatted || "KES 0") + '</td>' +
            '<td class="py-2.5 text-right font-mono tabular-nums font-bold ' + balCls + '">' + (l.balanceFormatted || "KES 0") + '</td>' +
            '<td class="py-2.5 text-center">' + statusPill + '</td>' +
            '<td class="py-2.5 text-right">' + printBtnHtml + '</td>' +
            '</tr>'
          );
        })
        .join("");
    }
  }
</script>
