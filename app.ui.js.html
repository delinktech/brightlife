<script>
  let currentHomeRange = "year";
  let appLoaderActiveRequests = 0;
  let appLoaderTimer = null;

  function formatMoney(value) {
    return new Intl.NumberFormat("en-KE", {
      style: "currency",
      currency: "KES",
      maximumFractionDigits: 0,
    }).format(Number(value) || 0);
  }

  /** Values ≥ 10,000 show as KES 39K to save horizontal space in tight cards. */
  function formatMoneyCompactK(value) {
    const n = Number(value) || 0;
    if (n >= 10000) {
      return "KES " + Math.round(n / 1000) + "K";
    }
    return formatMoney(n);
  }

  function handleErr(err) {
    console.error(err);
    var msg = "Operation failed. Please retry.";
    if (err && err.message) msg = String(err.message);
    else if (typeof err === "string") msg = err;
    alert(msg);
  }

  /** Set from getSessionInfo(); used for UI gating (server still enforces). */
  window.APP_PERMS = null;

  function applyRolePermissions(perms) {
    if (!perms) return;
    window.APP_PERMS = perms;
    document.querySelectorAll("[data-require-perm]").forEach(function (el) {
      var key = el.getAttribute("data-require-perm");
      var allowed = perms[key] === true;
      if (allowed) {
        el.classList.remove("hidden");
        el.removeAttribute("aria-hidden");
      } else {
        el.classList.add("hidden");
        el.setAttribute("aria-hidden", "true");
      }
    });
  }

  function formatPercent(value) {
    const number = Number(value) || 0;
    const sign = number > 0 ? "+" : "";
    return sign + number.toFixed(1) + "%";
  }

  /**
   * Caret + % only (no absolute delta). Delta is used only to pick direction / color.
   */
  function renderContributionMomIndicator(container, percent, delta) {
    if (!container) return;
    const d = Number(delta) || 0;
    const p = Number(percent) || 0;
    const unchanged = d === 0;
    let cls;
    let iconHtml;
    if (unchanged) {
      cls = "text-slate-500";
      iconHtml = '<i class="fas fa-minus text-[9px] opacity-70" aria-hidden="true"></i>';
    } else if (d > 0) {
      cls = "text-emerald-600";
      iconHtml = '<i class="fas fa-caret-up text-[10px]" aria-hidden="true"></i>';
    } else {
      cls = "text-amber-600";
      iconHtml = '<i class="fas fa-caret-down text-[10px]" aria-hidden="true"></i>';
    }
    container.innerHTML =
      '<span class="inline-flex items-center gap-0.5 ' +
      cls +
      '">' +
      iconHtml +
      "<span>" +
      formatPercent(p) +
      "</span></span>";
  }

  function rangeLabel(rangeKey) {
    if (rangeKey === "this_month") return "This Month";
    if (rangeKey === "quarter") return "Quarter";
    return "Year";
  }

  function updateRangeButtons(rangeKey) {
    ["this-month", "quarter", "year"].forEach((token) => {
      const button = document.getElementById("range-" + token);
      if (!button) return;
      button.className =
        "home-range-btn px-3 py-2 text-xs font-semibold rounded-lg transition-colors " +
        (rangeKey === token.replace("-", "_")
          ? "bg-slate-900 text-white"
          : "bg-slate-100 text-slate-600 hover:bg-slate-200");
    });
  }

  function setHomeRange(rangeKey) {
    currentHomeRange = rangeKey;
    updateRangeButtons(rangeKey);
    refreshDashboard();
  }

  function startAppLoader() {
    appLoaderActiveRequests++;
    const loader = document.getElementById("app-loader");
    const bar = document.getElementById("app-loader-bar");
    if (!loader || !bar) return;

    loader.classList.remove("opacity-0");
    loader.classList.add("opacity-100");
    if (appLoaderActiveRequests === 1) {
      bar.style.width = "12%";
      if (appLoaderTimer) clearInterval(appLoaderTimer);
      appLoaderTimer = setInterval(() => {
        const currentWidth = parseFloat(bar.style.width || "12");
        const nextWidth = Math.min(currentWidth + 8, 90);
        bar.style.width = nextWidth + "%";
      }, 180);
    }
  }

  function stopAppLoader() {
    appLoaderActiveRequests = Math.max(0, appLoaderActiveRequests - 1);
    const loader = document.getElementById("app-loader");
    const bar = document.getElementById("app-loader-bar");
    if (!loader || !bar) return;
    if (appLoaderActiveRequests > 0) return;

    if (appLoaderTimer) {
      clearInterval(appLoaderTimer);
      appLoaderTimer = null;
    }
    bar.style.width = "100%";
    setTimeout(() => {
      loader.classList.remove("opacity-100");
      loader.classList.add("opacity-0");
      bar.style.width = "0%";
    }, 220);
  }

  function toggleLoading(show) {
    const sidebar = document.getElementById("sidebar");
    sidebar.style.pointerEvents = show ? "none" : "auto";
    sidebar.style.opacity = show ? "0.7" : "1";
  }

  function refreshSessionInfo() {
    const loadingEl = document.getElementById("session-loading");
    const userBlock = document.getElementById("session-user-block");
    const nameEl = document.getElementById("session-display-name");
    const emailEl = document.getElementById("session-email");
    const verEl = document.getElementById("sidebar-version");

    const photoEl = document.getElementById("session-photo");
    const photoFallbackEl = document.getElementById("session-photo-fallback");

    google.script.run
      .withSuccessHandler((info) => {
        if (loadingEl) loadingEl.classList.add("hidden");
        if (info && info.success) {
          if (userBlock) userBlock.classList.remove("hidden");
          if (nameEl) {
            nameEl.textContent = info.displayName || "User";
          }
          if (emailEl) {
            emailEl.textContent =
              info.email ||
              "Sign in with Google (deploy as: user accessing the app)";
          }
          if (verEl) {
            verEl.textContent = "v" + String(info.version || "0.0.0");
          }
          if (photoEl && photoFallbackEl) {
            var url = info.photoUrl && String(info.photoUrl).trim();
            if (url) {
              photoEl.onload = function () {
                photoEl.classList.remove("hidden");
                photoFallbackEl.classList.add("hidden");
              };
              photoEl.onerror = function () {
                photoEl.classList.add("hidden");
                photoFallbackEl.classList.remove("hidden");
                photoEl.removeAttribute("src");
              };
              photoEl.alt = info.displayName || "Profile";
              photoEl.src = url;
            } else {
              photoEl.classList.add("hidden");
              photoFallbackEl.classList.remove("hidden");
              photoEl.removeAttribute("src");
            }
          }
          var roleEl = document.getElementById("session-role");
          if (roleEl) {
            roleEl.textContent = info.roleLabel || "";
            roleEl.classList.toggle("hidden", !info.roleLabel);
          }
          applyRolePermissions(info.permissions || {});
        } else if (loadingEl) {
          loadingEl.textContent = "Session unavailable";
          loadingEl.classList.remove("hidden");
        }
      })
      .withFailureHandler(() => {
        if (loadingEl) {
          loadingEl.textContent = "Could not load session";
          loadingEl.classList.remove("hidden");
        }
      })
      .getSessionInfo();
  }

  const PAGE_TITLE_LABELS = {
    home: "Home",
    members: "Members",
    contributions: "Contributions",
    loans: "Loans",
    investments: "Investments",
    accounts: "Accounts",
  };

  function showPage(pageId) {
    document.querySelectorAll(".page-wrapper").forEach((container) => {
      container.classList.remove("active");
    });

    const target = document.getElementById(pageId + "-container");
    if (target) target.classList.add("active");

    const titleEl = document.getElementById("current-page-title");
    if (titleEl) {
      titleEl.textContent = PAGE_TITLE_LABELS[pageId] || pageId;
    }

    document.querySelectorAll(".nav-link").forEach((link) => {
      link.classList.remove("active");
      link.removeAttribute("aria-current");
    });
    const activeLink = document.querySelector('[data-page="' + pageId + '"]');
    if (activeLink) {
      activeLink.classList.add("active");
      activeLink.setAttribute("aria-current", "page");
    }

    if (pageId === "home") refreshDashboard();
    if (pageId === "members") loadMembers();
    if (pageId === "contributions") {
      if (typeof currentMembers === "undefined" || currentMembers.length === 0) {
        loadMembers();
      }
      loadContributions();
    }
    if (pageId === "loans") loadLoans();
    if (pageId === "investments") loadInvestments();
    if (pageId === "accounts") loadAccounts();
  }

  function refreshDashboard() {
    toggleLoading(true);
    startAppLoader();
    google.script.run
      .withSuccessHandler((data) => {
        updateRangeButtons(data.range || currentHomeRange);
        document.getElementById("home-savings").innerText = formatMoney(data.savings);
        document.getElementById("home-loans").innerText = formatMoney(data.loans);
        document.getElementById("home-yearly-contrib").innerText = formatMoney(
          data.yearToDateContributions !== undefined && data.yearToDateContributions !== null
            ? data.yearToDateContributions
            : data.yearlyContributions
        );
        document.getElementById("home-membercount").innerText = (data.memberCount || 0).toLocaleString();
        document.getElementById("home-cash").innerText = formatMoney(data.cash);
        document.getElementById("home-monthly-contrib").innerText = formatMoneyCompactK(
          data.currentMonthContributions
        );
        const prevMonthEl = document.getElementById("home-previous-month-contrib");
        if (prevMonthEl) {
          prevMonthEl.innerText = formatMoneyCompactK(data.previousMonthContributions);
        }
        const cmp = data.contributionMonthCompare || {};
        const thisCmp = cmp.thisMonth || {};
        const lastCmp = cmp.lastMonth || {};
        renderContributionMomIndicator(
          document.getElementById("home-monthly-contrib-mom"),
          thisCmp.percent,
          thisCmp.delta
        );
        renderContributionMomIndicator(
          document.getElementById("home-previous-month-contrib-mom"),
          lastCmp.percent,
          lastCmp.delta
        );
        const invCountEl = document.getElementById("home-investment-count");
        if (invCountEl) invCountEl.innerText = (data.investmentCount || 0).toLocaleString();
        document.getElementById("home-growth-mom").innerText = formatPercent(data.growth && data.growth.monthOverMonth);
        document.getElementById("home-growth-yoy-month").innerText = formatPercent(data.growth && data.growth.yearOverYearMonth);
        document.getElementById("home-repayment-rate").innerText = formatPercent(data.portfolio && data.portfolio.repaymentRate);
        document.getElementById("home-par-rate").innerText = formatPercent(data.portfolio && data.portfolio.parRate);
        document.getElementById("home-range-label").innerText = rangeLabel(data.range || currentHomeRange);
        renderTopContributors(data.topContributors || []);
        renderMainCharts(data);
        toggleLoading(false);
        stopAppLoader();
      })
      .withFailureHandler((err) => {
        toggleLoading(false);
        stopAppLoader();
        handleErr(err);
      })
      .getHomeAnalytics(currentHomeRange);
  }

  window.onload = function () {
    refreshSessionInfo();
    showPage("home");
  };
</script>
